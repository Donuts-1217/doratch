<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專案詳情 - Creative Blocks Pro</title>
    <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
    <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    <script src="https://unpkg.com/blockly/msg/zh-hant.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4C97FF; --secondary: #FFAB19; --accent: #855CD6;
            --bg: #0F172A; --card-bg: #1E293B; --text: #F8FAFC;
        }
        body { margin: 0; font-family: 'Outfit', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); }

        /* 全域導覽列樣式 */
        .app-container { display: flex; min-height: 100vh; }
        .sidebar-main { width: 260px; background: #0B0E14; color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar-logo { padding: 30px; font-weight: 900; font-size: 1.2rem; color: var(--primary); cursor: pointer; }
        .nav-item { padding: 15px 30px; display: flex; align-items: center; gap: 12px; color: #94A3B8; text-decoration: none; font-weight: bold; transition: 0.3s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { color: var(--primary); border-left: 4px solid var(--primary); }
        .sidebar-footer { margin-top: auto; padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        .user-mini-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.03); }
        .main-content { flex: 1; margin-left: 260px; padding: 40px; }

        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
        
        .preview-pane { background: #000; border-radius: 32px; height: 500px; display: flex; align-items: center; justify-content: center; position: relative; border: 4px solid var(--card-bg); box-shadow: 0 20px 50px rgba(0,0,0,0.5); overflow: hidden; }
        #project-stage { background: white; width: 100%; height: 100%; border: none; display: none; }
        
        .info-pane { background: var(--card-bg); border-radius: 32px; padding: 40px; border: 1px solid rgba(255,255,255,0.05); }
        .project-title { font-size: 2rem; font-weight: 900; margin-bottom: 15px; }
        .author-box { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; padding-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .author-avatar { width: 50px; height: 50px; border-radius: 16px; border: 2px solid var(--primary); }
        
        .stats { display: flex; gap: 20px; margin-bottom: 40px; }
        .stat-item { background: rgba(255,255,255,0.05); padding: 15px 25px; border-radius: 20px; text-align: center; flex: 1; }
        .stat-val { font-size: 1.5rem; font-weight: 900; color: var(--primary); display: block; }
        .stat-label { font-size: 0.8rem; color: #94A3B8; text-transform: uppercase; }

        .actions { display: flex; flex-direction: column; gap: 15px; }
        .btn { padding: 18px; border-radius: 16px; font-weight: 900; border: none; cursor: pointer; transition: 0.3s; font-size: 1.1rem; text-align: center; text-decoration: none; display: block; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 10px 20px rgba(76, 151, 255, 0.2); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(76, 151, 255, 0.3); }
        .btn-accent { background: var(--accent); color: white; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: white; }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }

        .desc-section { margin-top: 40px; }
        .desc-section h3 { font-size: 1.2rem; color: #94A3B8; margin-bottom: 15px; }
        .desc-text { line-height: 1.8; color: #E2E8F0; }

        #run-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(5px); }
    
        
        /* 響應式縮放與排版 */
        html, body { max-width: 100vw; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 100vw; overflow: hidden; }
        .main-content { overflow-x: auto; box-sizing: border-box; }
        
        @media (max-width: 1024px) {
            .app-container { flex-direction: column; }
            
            /* 導覽列改為橫向可滑動 */
            .sidebar-main { width: 100vw; height: auto; position: static; flex-direction: row; overflow-x: auto; white-space: nowrap; flex-wrap: nowrap; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
            .sidebar-logo { display: none; }
            .sidebar-main > div[style*="uppercase"] { display: none; }
            .nav-item { padding: 12px 20px; font-size: 14px; flex-shrink: 0; border-left: none !important; border-bottom: 2px solid transparent; }
            .nav-item.active { border-bottom: 2px solid var(--primary); }
            .sidebar-footer { width: auto; border: none; padding: 5px 15px; display: flex; align-items: center; margin-top: 0; flex-shrink: 0; }
            
            .main-content { margin-left: 0; padding: 15px; width: 100vw; }
            
            /* 卡片與通用排版 */
            #user-stats-card { flex-wrap: wrap; justify-content: center; text-align: center; }
            #user-stats-card > div { width: 100%; }
            .header, .header-title { flex-direction: column; gap: 15px; text-align: center; }
            .project-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            .game-grid { grid-template-columns: 1fr; }
            
            /* 遊戲區域適應 */
            .boss-raid-container, .game-frame { width: 100%; box-sizing: border-box; padding: 20px 10px; min-height: auto; }
            .duel-arena { grid-template-columns: 1fr; }
            .boss-image-container { width: 200px; height: 200px; margin: 0 auto 15px; }
        }
        
        @media (max-width: 740px) {
            /* 精準縮放 700px 的遊戲畫布 (塔防與PvP) */
            [style*="width:700px"] { 
                transform-origin: top left;
                transform: scale(calc((100vw - 30px) / 700));
                margin-bottom: calc(-300px * (1 - ((100vw - 30px) / 700))); 
            }
        }
        
        @media (max-width: 480px) {
            .nav-item { font-size: 13px; padding: 10px 15px; }
            .hero h1 { font-size: 2.5rem; }
        }

    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar-main">
        <div class="sidebar-logo" onclick="location.href='index.html'">🧩 Creative Blocks</div>
        <a href="index.html" class="nav-item">🏠 平台首頁</a>
        <a href="dashboard.html" class="nav-item">🏫 我的班級</a>

        <div style="margin: 20px 30px 10px; font-size: 11px; color: #475569; letter-spacing: 1px; text-transform: uppercase;">創作與探索</div>
        <a href="page.html" class="nav-item">🚀 創作空間</a>
        <a href="main.html?view=mine" class="nav-item">📂 我的作品</a>
        <a href="main.html" class="nav-item active">🌍 探索中心</a>

        <div style="margin: 20px 30px 10px; font-size: 11px; color: #475569; letter-spacing: 1px; text-transform: uppercase;">指令競技</div>
        <a href="lab.html" class="nav-item">🧪 指令實驗室</a>
        <a href="game.html" class="nav-item">🎮 指令塔防</a>
        <a href="shop.html" class="nav-item">🛒 創意商城</a>
        <a href="chat.html" class="nav-item">💬 交流大廳</a>
        <a href="admin.html" id="admin-link-main" class="nav-item" style="display:none; color:var(--accent);">🛠️ 管理面板</a>
        
        <div class="sidebar-footer">
            <div class="user-mini-card">
                <img id="side-avatar" src="" style="width:32px; height:32px; border-radius:50%;">
                <div style="flex:1; overflow:hidden;">
                    <div id="side-username" style="font-size:12px; font-weight:bold; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">載入中...</div>

    <main class="main-content">
        <div style="margin-bottom: 20px;">
            <span style="color:#64748B; cursor:pointer; font-size:14px; font-weight:bold;" onclick="history.back()">⬅️ 返回</span>
        </div>
        <div class="container">
            <div>
                <div class="preview-pane">
                    <div id="run-overlay">
                        <div style="font-size:4rem; margin-bottom:20px;">🚀</div>
                        <button class="btn btn-primary" style="padding:15px 50px; width:auto;" onclick="runProject()">點擊執行專案</button>
                    </div>
                    <iframe id="project-stage" sandbox="allow-scripts allow-same-origin allow-modals"></iframe>
                </div>
                
                <div class="desc-section">
                    <h3>專案說明</h3>
                    <div class="desc-text" id="project-desc">這個作者很懶，什麼都沒留下...</div>
                </div>
            </div>

            <div class="info-pane">
                <div class="project-title" id="project-name">載入中...</div>
                <div class="author-box">
                    <img class="author-avatar" id="author-avatar" src="">
                    <div>
                        <div style="font-weight:900; font-size:1.1rem;" id="author-name">...</div>
                        <div style="font-size:0.8rem; color:#94A3B8;">發布於 <span id="publish-date">---</span></div>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-val" id="view-count">0</span>
                        <span class="stat-label">瀏覽次數</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-val" id="remix-count">0</span>
                        <span class="stat-label">改編次數</span>
                    </div>
                </div>

                <div class="actions">
                    <a id="edit-link" href="#" class="btn btn-primary">⚡ 進入編輯 / Remix</a>
                    <button class="btn btn-accent" onclick="likeProject()">❤️ 給予鼓勵</button>
                    <button class="btn btn-outline" onclick="history.back()">⬅️ 返回探索牆</button>
                </div>
            </div>
        </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDwRdQFgQVn5Un8Od2nP4u5EbMx-dMOYoU", authDomain: "chat-52c0d.firebaseapp.com", projectId: "chat-52c0d", appId: "1:449329325475:web:75f255c4055360dc9e6616" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.handleLogout = () => signOut(auth).then(() => location.href = 'index.html');

    const params = new URLSearchParams(window.location.search);
    const projectId = params.get('id');
    const ownerId = params.get('owner');

    let projectData = null;
    const STAGE_SCRIPT_KEY = 'stage';

    onAuthStateChanged(auth, async u => {
        if (!u) { location.href = 'login.html'; return; }
        // 側邊欄資料
        const snap = await getDoc(doc(db, "users", u.uid));
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('side-coins').innerText = data.coins || 0;
            document.getElementById('side-username').innerText = u.email.split('@')[0];
            document.getElementById('side-avatar').src = `https://ui-avatars.com/api/?name=${u.email}&background=random`;
            let role = data.role || 'student';
            if (u.email === 'chianghansen0302@gmail.com') role = 'admin';
            if (role === 'admin' || role === 'teacher') {
                const al = document.getElementById('admin-link-main');
                if (al) { al.style.display = 'flex'; al.innerText = role === 'admin' ? '🛠️ 管理面板' : '❓ 題庫管理'; }
            }
        }
        loadProject();
    });

    async function loadProject() {
        if (!projectId || !ownerId) return;
        const ref = doc(db, "users", ownerId, "projects", projectId);
        const snap = await getDoc(ref);
        if (snap.exists()) {
            projectData = snap.data();
            document.getElementById('project-name').innerText = projectData.name || '未命名專案';
            const author = projectData.authorEmail?.split('@')[0] || '匿名';
            document.getElementById('author-name').innerText = author;
            document.getElementById('author-avatar').src = `https://ui-avatars.com/api/?name=${author}&background=random`;
            document.getElementById('project-desc').innerText = projectData.description || '這個專案主要是用積木程式開發的創意作品。';
            document.getElementById('edit-link').href = `page.html?load=${projectId}&from=${ownerId}`;
            
            updateDoc(ref, { views: increment(1) });
            document.getElementById('view-count').innerText = (projectData.views || 0) + 1;
            document.getElementById('remix-count').innerText = projectData.remixCount || 0;
            
            if (projectData.createdAt) {
                document.getElementById('publish-date').innerText = projectData.createdAt.toDate().toLocaleDateString();
            }
        } else {
            document.getElementById('project-name').innerText = '找不到此專案';
        }
    }

    window.runProject = () => {
        if (!projectData) {
            alert("專案尚未載入完成。");
            return;
        }
        document.getElementById('run-overlay').style.display = 'none';
        const stage = document.getElementById('project-stage');
        stage.style.display = 'block';

        try {
            registerProjectCustomGeneratorsCompat();
            const compiled = compileProjectScriptsToCode(projectData);
            if (!compiled.code.trim()) {
                alert("這個專案目前沒有可執行的積木內容。");
                return;
            }
            if (compiled.errors.length) {
                console.warn("部分積木轉換失敗：", compiled.errors);
            }
            stage.srcdoc = buildRuntimeHtml(compiled.code);
        } catch (e) {
            console.error(e);
            alert("執行失敗：" + e.message);
        }
    };

    window.likeProject = () => { alert("感謝您的鼓勵！作者已收到您的愛心。"); };

    function registerProjectCustomGeneratorsCompat() {
        const gen = Blockly.JavaScript;
        if (!gen) return;
        if (!gen.forBlock) gen.forBlock = {};

        // 只需 generator，不需完整 block UI 定義
        gen['scratch_ask'] = (block) => {
            const question = gen.valueToCode(block, 'QUESTION', gen.ORDER_ATOMIC) || "''";
            return `window._scratchAnswer = (typeof prompt === 'function' ? prompt(${question}) : '') || '';\n`;
        };
        gen['scratch_answer'] = () => ['window._scratchAnswer || ""', gen.ORDER_ATOMIC];
        gen['canvas_init'] = () => `
            window.canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            document.body.innerHTML = '';
            document.body.appendChild(canvas);
            window.ctx = canvas.getContext('2d');
            window.ctx.fillStyle = '#FFFFFF';
            window.ctx.fillRect(0, 0, canvas.width, canvas.height);
        `;
        gen['canvas_set_color'] = (block) => {
            const color = gen.valueToCode(block, 'COLOR', gen.ORDER_ATOMIC) || "'#000000'";
            return `if(window.ctx){ window.ctx.fillStyle = ${color}; window.ctx.strokeStyle = ${color}; }\n`;
        };
        gen['canvas_draw_circle'] = (block) => {
            const x = gen.valueToCode(block, 'X', gen.ORDER_ATOMIC) || 0;
            const y = gen.valueToCode(block, 'Y', gen.ORDER_ATOMIC) || 0;
            const r = gen.valueToCode(block, 'RADIUS', gen.ORDER_ATOMIC) || 0;
            return `if(window.ctx){ window.ctx.beginPath(); window.ctx.arc(${x}, ${y}, ${r}, 0, 2*Math.PI); window.ctx.fill(); }\n`;
        };
        gen['canvas_draw_rect'] = (block) => {
            const x = gen.valueToCode(block, 'X', gen.ORDER_ATOMIC) || 0;
            const y = gen.valueToCode(block, 'Y', gen.ORDER_ATOMIC) || 0;
            const w = gen.valueToCode(block, 'WIDTH', gen.ORDER_ATOMIC) || 0;
            const h = gen.valueToCode(block, 'HEIGHT', gen.ORDER_ATOMIC) || 0;
            return `if(window.ctx){ window.ctx.fillRect(${x}, ${y}, ${w}, ${h}); }\n`;
        };
        gen['canvas_clear'] = () => `if(window.ctx&&window.canvas){ window.ctx.clearRect(0,0,canvas.width,canvas.height); }\n`;
        gen['event_when_green_flag'] = (block) => {
            const statements = gen.statementToCode(block, 'DO');
            return `window.__scratchRuntime.onGreenFlag(function(){\n${statements}});\n`;
        };
        gen['event_when_key_pressed'] = (block) => {
            const key = block.getFieldValue('KEY') || ' ';
            const statements = gen.statementToCode(block, 'DO');
            return `window.__scratchRuntime.onKeyPress(${JSON.stringify(key)}, function(){\n${statements}});\n`;
        };
        gen['sprite_create'] = (block) => `window.__scratchRuntime.createSprite(${gen.valueToCode(block, 'NAME', gen.ORDER_ATOMIC) || "'主角'"}, ${gen.valueToCode(block, 'COSTUME', gen.ORDER_ATOMIC) || "'🐱'"});\n`;
        gen['sprite_use'] = (block) => `window.__scratchRuntime.useSprite(${gen.valueToCode(block, 'NAME', gen.ORDER_ATOMIC) || "'主角'"});\n`;
        gen['sprite_move'] = (block) => `window.__scratchRuntime.move(${gen.valueToCode(block, 'STEPS', gen.ORDER_ATOMIC) || 10});\n`;
        gen['sprite_turn_right'] = (block) => `window.__scratchRuntime.turnRight(${gen.valueToCode(block, 'DEG', gen.ORDER_ATOMIC) || 15});\n`;
        gen['sprite_turn_left'] = (block) => `window.__scratchRuntime.turnLeft(${gen.valueToCode(block, 'DEG', gen.ORDER_ATOMIC) || 15});\n`;
        gen['sprite_goto_xy'] = (block) => `window.__scratchRuntime.goto(${gen.valueToCode(block, 'X', gen.ORDER_ATOMIC) || 0}, ${gen.valueToCode(block, 'Y', gen.ORDER_ATOMIC) || 0});\n`;
        gen['sprite_set_x'] = (block) => `window.__scratchRuntime.setX(${gen.valueToCode(block, 'X', gen.ORDER_ATOMIC) || 0});\n`;
        gen['sprite_set_y'] = (block) => `window.__scratchRuntime.setY(${gen.valueToCode(block, 'Y', gen.ORDER_ATOMIC) || 0});\n`;
        gen['sprite_change_x'] = (block) => `window.__scratchRuntime.changeX(${gen.valueToCode(block, 'DX', gen.ORDER_ATOMIC) || 0});\n`;
        gen['sprite_change_y'] = (block) => `window.__scratchRuntime.changeY(${gen.valueToCode(block, 'DY', gen.ORDER_ATOMIC) || 0});\n`;
        gen['sprite_show'] = () => `window.__scratchRuntime.show();\n`;
        gen['sprite_hide'] = () => `window.__scratchRuntime.hide();\n`;
        gen['sprite_say'] = (block) => `window.__scratchRuntime.say(${gen.valueToCode(block, 'TEXT', gen.ORDER_ATOMIC) || "''"});\n`;
        gen['sprite_set_costume'] = (block) => `window.__scratchRuntime.setCostume(${gen.valueToCode(block, 'COSTUME', gen.ORDER_ATOMIC) || "'🐱'"});\n`;
        gen['math_mod'] = (block) => {
            const a = gen.valueToCode(block, 'A', gen.ORDER_MULTIPLICATION) || '0';
            const b = gen.valueToCode(block, 'B', gen.ORDER_MULTIPLICATION) || '1';
            return [`(${a} % ${b})`, gen.ORDER_MULTIPLICATION];
        };

        Object.keys(gen).forEach((type) => {
            if (typeof gen[type] === 'function' && !gen.forBlock[type]) {
                gen.forBlock[type] = gen[type];
            }
        });
    }

    function normalizeGeneratedFragment(fragment) {
        if (Array.isArray(fragment)) {
            const expr = String(fragment[0] ?? '').trim();
            return expr ? `${expr};\n` : '';
        }
        if (typeof fragment === 'string') return fragment;
        if (fragment == null) return '';
        return String(fragment);
    }

    function compileWorkspaceToCode(targetWorkspace) {
        const generator = Blockly.JavaScript;
        const topBlocks = targetWorkspace.getTopBlocks(true);
        const errors = [];
        let code = '';
        try {
            generator.init(targetWorkspace);
            topBlocks.forEach((block) => {
                try {
                    code += normalizeGeneratedFragment(generator.blockToCode(block));
                } catch (e) {
                    errors.push(`${block.type}: ${e.message || e}`);
                }
            });
            code = generator.finish(code);
        } catch (e) {
            errors.push(`generator_init: ${e.message || e}`);
        } finally {
            if (generator.nameDB_ && typeof generator.nameDB_.reset === 'function') generator.nameDB_.reset();
        }
        return { code, errors };
    }

    function compileProjectScriptsToCode(project) {
        const scripts = (project.spriteScripts && typeof project.spriteScripts === 'object')
            ? project.spriteScripts
            : { [STAGE_SCRIPT_KEY]: project.data || '' };
        const errors = [];
        let code = '';
        Object.entries(scripts).forEach(([target, xmlText]) => {
            if (typeof xmlText !== 'string' || !xmlText.trim()) return;
            const ws = new Blockly.Workspace();
            try {
                Blockly.Xml.domToWorkspace(Blockly.utils.xml.textToDom(xmlText), ws);
                const compiled = compileWorkspaceToCode(ws);
                if (compiled.errors.length) errors.push(...compiled.errors.map(e => `${target}: ${e}`));
                if (!compiled.code.trim()) return;
                if (target === STAGE_SCRIPT_KEY) code += `\n${compiled.code}\n`;
                else code += `\nwindow.__scratchRuntime.withSprite(${JSON.stringify(target)}, function(){\n${compiled.code}\n});\n`;
            } catch (e) {
                errors.push(`${target}: ${e.message || e}`);
            } finally {
                ws.dispose();
            }
        });
        return { code, errors };
    }

    function buildRuntimeHtml(code) {
        return `
        <!DOCTYPE html><html><head><meta charset="UTF-8"><style>
            body{margin:0;padding:0;overflow:hidden;background:#eef4ff;display:flex;justify-content:center;align-items:center;height:100vh;}
            #scratch-stage{width:480px;height:360px;background:linear-gradient(180deg,#dcecff,#f3f8ff);border:2px solid #9bbcff;border-radius:12px;position:relative;overflow:hidden;}
            .sprite{position:absolute;transform:translate(-50%,-50%);font-size:46px;user-select:none;}
            .sprite-bubble{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;background:#fff;color:#333;border:1px solid #cfd8ea;border-radius:18px;padding:5px 10px;}
        </style><script>
            window.__scratchRuntime=(()=>{const W=480,H=360,s=new Map();let cur='主角';const g=[],k=new Map();
            const st=()=>{let d=document.getElementById('scratch-stage');if(!d){document.body.innerHTML='';d=document.createElement('div');d.id='scratch-stage';document.body.appendChild(d);}return d;};
            const c=(v,min,max)=>Math.max(min,Math.min(max,v)), sx=x=>W/2+x, sy=y=>H/2-y;
            const ap=o=>{o.x=c(o.x,-W/2,W/2);o.y=c(o.y,-H/2,H/2);o.el.style.left=sx(o.x)+'px';o.el.style.top=sy(o.y)+'px';o.el.style.transform='translate(-50%,-50%) rotate('+(o.direction-90)+'deg)';o.el.style.display=o.visible?'block':'none';};
            const get=()=>{if(!s.has(cur)) cr(cur,'🐱'); return s.get(cur);};
            const cr=(n,cost)=>{const d=st(),n2=String(n||'主角'); if(s.has(n2)){const o=s.get(n2);o.costume=String(cost||o.costume||'🐱');o.el.firstChild.textContent=o.costume;cur=n2;ap(o);return;}
              const el=document.createElement('div');el.className='sprite'; const cn=document.createElement('div');cn.textContent=String(cost||'🐱'); el.appendChild(cn); d.appendChild(el);
              const o={name:n2,costume:String(cost||'🐱'),x:0,y:0,direction:90,visible:true,el,bubble:null}; s.set(n2,o); cur=n2; ap(o);};
            const use=n=>{cur=String(n||'主角');get();}, mv=n=>{const o=get(),v=Number(n)||0,r=(90-o.direction)*Math.PI/180; o.x+=Math.cos(r)*v;o.y+=Math.sin(r)*v;ap(o);};
            const rt=d=>{const o=get();o.direction+=Number(d)||0;ap(o);}, lt=d=>{const o=get();o.direction-=Number(d)||0;ap(o);}, go=(x,y)=>{const o=get();o.x=Number(x)||0;o.y=Number(y)||0;ap(o);};
            const sx2=x=>{const o=get();o.x=Number(x)||0;ap(o);}, sy2=y=>{const o=get();o.y=Number(y)||0;ap(o);}, cx=dx=>{const o=get();o.x+=Number(dx)||0;ap(o);}, cy=dy=>{const o=get();o.y+=Number(dy)||0;ap(o);};
            const sh=()=>{const o=get();o.visible=true;ap(o);}, hi=()=>{const o=get();o.visible=false;ap(o);}, sc=v=>{const o=get();o.costume=String(v||'🐱');o.el.firstChild.textContent=o.costume;};

            const withS=(n,fn)=>{const p=cur;cur=String(n||p||'主角');try{get();if(typeof fn==='function') fn();}finally{cur=p;}};
            const onG=fn=>{if(typeof fn==='function'){const b=cur;g.push(()=>withS(b,fn));}}, onK=(key,fn)=>{const kk=String(key||'').toLowerCase();if(!kk||typeof fn!=='function')return;const b=cur;if(!k.has(kk))k.set(kk,[]);k.get(kk).push(()=>withS(b,fn));};

            return {createSprite:cr,useSprite:use,move:mv,turnRight:rt,turnLeft:lt,goto:go,setX:sx2,setY:sy2,changeX:cx,changeY:cy,show:sh,hide:hi,say,setCostume:sc,onGreenFlag:onG,onKeyPress:onK,withSprite:withS,start};})();
        <\/script></head><body><script>try{${code}; if(window.__scratchRuntime&&window.__scratchRuntime.start)window.__scratchRuntime.start();}catch(e){console.error(e.message);}<\/script></body></html>`;
    }
