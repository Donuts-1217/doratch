<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="responsive-global.css">
    <link rel="stylesheet" href="doratch-shell.css">
    <title>創意商城 - Doratch</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --scratch-blue: #4C97FF; --scratch-orange: #FFAB19; 
            --scratch-purple: #855CD6; --scratch-green: #4CB050;
            --bg-light: #F0F2F5; --card-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        body { font-family: "Noto Sans TC", sans-serif; background: var(--bg-light); margin: 0; padding: 0; }
        
        nav { background: white; padding: 0 5%; height: 70px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 1.5rem; color: var(--scratch-blue); cursor: pointer; }
        
        .user-wallet { background: #FFF8E1; border: 2px solid #FFE082; padding: 8px 20px; border-radius: 30px; font-weight: 900; color: #F57C00; display: flex; align-items: center; gap: 10px; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }

        .item-card { background: white; border-radius: 20px; padding: 20px; text-align: center; box-shadow: var(--card-shadow); transition: 0.3s; border: 2px solid transparent; }
        .item-card:hover { transform: translateY(-8px); border-color: var(--scratch-orange); }
        .item-icon { font-size: 50px; margin-bottom: 15px; display: block; }
        .item-name { font-weight: 900; font-size: 1.1rem; margin-bottom: 5px; }
        .item-desc { font-size: 13px; color: #777; margin-bottom: 15px; min-height: 40px; }
        .item-price { font-weight: 900; color: #F57C00; font-size: 1.2rem; margin-bottom: 15px; }
        
        .btn-buy { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-buy.available { background: var(--scratch-orange); color: white; }
        .btn-buy.owned { background: #EEE; color: #999; cursor: default; }
        .btn-buy:active { transform: scale(0.95); }

        .category-title { font-weight: 900; font-size: 1.5rem; margin: 40px 0 20px; display: flex; align-items: center; gap: 10px; }
        .btn-nav { text-decoration:none; background: rgba(0,0,0,0.05); color: #444; border: 1px solid rgba(0,0,0,0.1); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        .btn-nav:hover { background: var(--scratch-blue); color: white; }
        .nav-actions { display: flex; gap: 10px; align-items: center; }

        .main-content { padding: 40px; overflow-x: auto; box-sizing: border-box; }
        .auth-cta {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .auth-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 13px;
        }
        .auth-btn.primary { background: #0f172a; color: #fff; }
        .auth-btn.ghost { background: rgba(15, 23, 42, 0.08); color: #0f172a; }
        .coin-policy {
            margin-bottom: 20px;
            border: 1px solid #fde68a;
            background: #fff7d6;
            border-radius: 14px;
            padding: 14px 16px;
            color: #7c2d12;
            font-weight: 700;
        }
        .review-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: var(--card-shadow);
        }
        .review-card input,
        .review-card textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            margin-top: 8px;
            margin-bottom: 10px;
            font-family: inherit;
        }
        .review-card button {
            border: none;
            border-radius: 10px;
            background: #0f172a;
            color: #fff;
            font-weight: 900;
            cursor: pointer;
            padding: 10px 14px;
        }
        .review-card .btn-light {
            background: #334155;
        }
        .btn-buy.disabled {
            background: #cbd5e1 !important;
            color: #334155 !important;
            cursor: not-allowed;
        }
    
        
        @media (max-width: 1024px) {
            .main-content { padding: 15px; }
            
            /* 卡片與通用排版 */
            #user-stats-card { flex-wrap: wrap; justify-content: center; text-align: center; }
            #user-stats-card > div { width: 100%; }
            .header, .header-title { flex-direction: column; gap: 15px; text-align: center; }
            .project-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            .game-grid { grid-template-columns: 1fr; }
            
            /* 遊戲區域適應 */
            .boss-raid-container, .game-frame { width: 100%; box-sizing: border-box; padding: 20px 10px; min-height: auto; }
            .duel-arena { grid-template-columns: 1fr; }
            .boss-image-container { width: 200px; height: 200px; margin: 0 auto 15px; }
        }
        
        @media (max-width: 740px) {
            /* 精準縮放 700px 的遊戲畫布 (塔防與PvP) */
            [style*="width:700px"] { 
                transform-origin: top left;
                transform: scale(calc((100vw - 30px) / 700));
                margin-bottom: calc(-300px * (1 - ((100vw - 30px) / 700))); 
            }
        }
        
        @media (max-width: 480px) {
            .nav-item { font-size: 13px; padding: 10px 15px; }
            .hero h1 { font-size: 2.5rem; }
        }

    </style>
</head>

        { id: 'title_architect', category: 'style', slot: 'title', name: '稱號：程式建築師', desc: '可在個人資料頁套用專屬稱號。', price: 280, icon: '🏗️' },

        { id: 'title_algo_king', category: 'style', slot: 'title', name: '稱號：演算法王者', desc: '高難度解題者專屬的王者稱號。', price: 560, icon: '♟️' },
        { id: 'title_night_owl', category: 'style', slot: 'title', name: '稱號：夜貓工程師', desc: '夜間開發者限定稱號，聊天室也會顯示。', price: 360, icon: '🦉' },

        { id: 'title_void_walker', category: 'style', slot: 'title', name: '稱號：虛空行者', desc: '神秘系稱號，聊天室辨識度超高。', price: 680, icon: '🌌' },
        { id: 'badge_mentor', category: 'utility', slot: 'badge', name: '徽章：班級導師', desc: '可在個人資料頁套用徽章，顯示在名稱旁。', price: 240, icon: '🧠' },
        { id: 'badge_speedrunner', category: 'utility', slot: 'badge', name: '徽章：速通玩家', desc: '可在個人資料頁套用徽章，顯示在名稱旁。', price: 220, icon: '⚡' },
        { id: 'badge_alpha', category: 'utility', slot: 'badge', name: '徽章：內測先鋒', desc: '顯示你是功能先行體驗者。', price: 260, icon: '🧪' },
        { id: 'badge_guardian', category: 'utility', slot: 'badge', name: '徽章：社群守護者', desc: '顯示你重視社群秩序與互助。', price: 260, icon: '🛡️' },
        { id: 'badge_dragon', category: 'utility', slot: 'badge', name: '徽章：龍焰核心', desc: '超稀有視覺徽章，聊天名稱旁高亮。', price: 740, icon: '🐉' },
        { id: 'badge_cosmos', category: 'utility', slot: 'badge', name: '徽章：星穹航行者', desc: '星際主題徽章，適合宇宙系造型。', price: 700, icon: '🪐' },
        { id: 'namecolor_cyan', category: 'utility', slot: 'nameColor', name: '名稱顏色：霓虹青', desc: '可在個人資料頁套用名稱字色。', price: 180, icon: '🩵' },
        { id: 'namecolor_sunset', category: 'utility', slot: 'nameColor', name: '名稱顏色：夕陽橘', desc: '可在個人資料頁套用名稱字色。', price: 180, icon: '🧡' },
        { id: 'namecolor_violet', category: 'utility', slot: 'nameColor', name: '名稱顏色：星雲紫', desc: '可在個人資料頁與聊天室套用名稱字色。', price: 210, icon: '💜' },
        { id: 'namecolor_lime', category: 'utility', slot: 'nameColor', name: '名稱顏色：螢光萊姆', desc: '可在個人資料頁與聊天室套用名稱字色。', price: 210, icon: '💚' },
        { id: 'namecolor_crimson', category: 'utility', slot: 'nameColor', name: '名稱顏色：赤焰紅', desc: '高飽和名稱字色，突顯戰鬥風格。', price: 260, icon: '❤️' },
        { id: 'namecolor_glacier', category: 'utility', slot: 'nameColor', name: '名稱顏色：冰川藍', desc: '冷色調科技系名稱字色。', price: 260, icon: '🧊' }
    ];

    let currentUserData = null;
    let currentUser = null;

    window.handleLogout = () => {
        if (!auth.currentUser) return location.href = 'login.html';
        return signOut(auth).then(() => location.href='index.html');
    };

    onAuthStateChanged(auth, async (user) => {
        currentUser = user || null;
        if (!user) {
            applyGuestState();
            return;
        }
        fetchSidebarData(user);
        loadMallData(user);
    });

    function applyGuestState() {
        const authCta = document.getElementById('auth-cta');
        const sideUser = document.getElementById('side-username');
        const sideCoins = document.getElementById('side-coins');
        const sideAvatar = document.getElementById('side-avatar');
        if (authCta) {
            authCta.innerHTML = '<a class="auth-btn primary" href="login.html">登入帳號</a><a class="auth-btn ghost" href="create.html">前往寫程式</a>';
        }
        if (sideUser) sideUser.innerText = '訪客';
        if (sideCoins) sideCoins.innerText = '0';
        if (sideAvatar) sideAvatar.src = 'https://ui-avatars.com/api/?name=Guest&background=334155&color=fff';
        const userCoinsEl = document.getElementById('user-coins');
        if (userCoinsEl) userCoinsEl.innerText = '0';
        const reviewStatus = document.getElementById('review-status');
        if (reviewStatus) reviewStatus.innerText = '請先登入後送出審核。';
        currentUserData = { coins: 0, inventory: [] };
        restoreCoinReviewDraft();
        renderItems();
    }

    async function fetchSidebarData(user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('side-coins').innerText = data.coins || 0;
            document.getElementById('side-username').innerText = user.email.split('@')[0];
            document.getElementById('side-avatar').src = `https://ui-avatars.com/api/?name=${user.email}&background=random`;
            
            let role = data.role || 'student';
            if (user.email === 'chianghansen0302@gmail.com') role = 'admin';
            if(role === 'admin' || role === 'teacher') {
                const adminLink = document.getElementById('admin-link-main');
                if(adminLink) {
                    adminLink.style.display = 'flex';
                    adminLink.innerText = role === 'admin' ? '🛠️ 管理面板' : '❓ 題庫管理';
                }
            }
        }
    }

    async function loadMallData(user) {
        const authCta = document.getElementById('auth-cta');
        if (authCta) authCta.innerHTML = '<a class="auth-btn ghost" href="create.html">提交程式送審</a><a class="auth-btn ghost" href="projects.html">我的作品</a>';
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);
        if (!snap.exists()) {
            await setDoc(userRef, {
                email: user.email || "",
                coins: 0,
                inventory: [],
                xp: 0,
                lv: 1,
                role: "student",
                createdAt: serverTimestamp()
            }, { merge: true });
        }
        const fresh = await getDoc(userRef);
        currentUserData = fresh.data() || { coins: 0, inventory: [] };
        const coins = currentUserData.coins || 0;
        // 更新頁首與側邊欄的金幣顯示
        const userCoinsEl = document.getElementById('user-coins');
        if (userCoinsEl) userCoinsEl.innerText = coins;
        const sideCoinsEl = document.getElementById('side-coins');
        if (sideCoinsEl) sideCoinsEl.innerText = coins;
        const reviewStatus = document.getElementById('review-status');
        if (reviewStatus) {
            const lim = Number.isFinite(currentUserData.reviewUploadDailyLimit) ? currentUserData.reviewUploadDailyLimit : 1;
            const bonus = Number.isFinite(currentUserData.reviewUploadBonusToday) ? currentUserData.reviewUploadBonusToday : 0;
            reviewStatus.innerText = `今日審核上傳上限：${Math.max(0, lim + bonus)} 次（含管理員加次）`;
        }
        await loadOnlineProjects(user);
        restoreCoinReviewDraft();

        renderItems();
    };

    async function loadOnlineProjects(user) {
        const select = document.getElementById('review-project-id');
        if (!select) return;
        select.innerHTML = '<option value="">載入線上作品中...</option>';
        try {
            const q = query(collection(db, "users", user.uid, "projects"), orderBy("updatedAt", "desc"));
            const snap = await getDocs(q);
            onlineProjects = snap.docs.map(function (d) {
                const data = d.data() || {};
                return {
                    id: d.id,
                    name: data.name || "未命名作品",
                    projectType: data.projectType || (data.isBot ? "python-bot" : "python"),
                    pythonCode: typeof data.pythonCode === "string" ? data.pythonCode : (typeof data.code === "string" ? data.code : "")
                };
            });
            if (!onlineProjects.length) {
                select.innerHTML = '<option value="">沒有可送審的線上作品（請先儲存作品）</option>';
                return;
            }
            select.innerHTML = '<option value="">請選擇線上作品</option>';
            onlineProjects.forEach(function (p) {
                var tag = p.projectType === "python-bot" ? "Bot" : "Python";
                var opt = document.createElement("option");
                opt.value = p.id;
                opt.textContent = "[" + tag + "] " + p.name;
                select.appendChild(opt);
            });
        } catch (e) {
            console.error(e);
            select.innerHTML = '<option value="">載入作品失敗</option>';
        }
    }

    function todayKey() {
        const d = new Date();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${d.getFullYear()}-${m}-${day}`;
    }

    function restoreCoinReviewDraft() {
        try {
            const raw = localStorage.getItem(REVIEW_DRAFT_KEY);
            if (!raw) return;
            const data = JSON.parse(raw) || {};
            const typeEl = document.getElementById('review-work-type');
            const pidEl = document.getElementById('review-project-id');
            const pathEl = document.getElementById('review-file-path');
            const noteEl = document.getElementById('review-note');
            if (typeEl && data.workType) typeEl.value = data.workType;
            if (pidEl && data.projectId) pidEl.value = data.projectId;
            if (pathEl && data.filePathHint) pathEl.value = data.filePathHint;
            if (noteEl && data.note) noteEl.value = data.note;
        } catch (_) {}
    }

    window.saveCoinReviewDraft = () => {
        const payload = {
            workType: (document.getElementById('review-work-type').value || 'python'),
            projectId: (document.getElementById('review-project-id').value || '').trim(),
            filePathHint: (document.getElementById('review-file-path').value || '').trim(),
            note: (document.getElementById('review-note').value || '').trim()
        };
        localStorage.setItem(REVIEW_DRAFT_KEY, JSON.stringify(payload));
        const reviewStatus = document.getElementById('review-status');
        if (reviewStatus) reviewStatus.innerText = '已暫存送審內容。';
    };

    function renderItems() {
        const styleList = document.getElementById('style-items');
        const utilList = document.getElementById('utility-items');
        styleList.innerHTML = ''; utilList.innerHTML = '';

        itemsBank.forEach(item => {
            const isOwned = (currentUserData.inventory || []).includes(item.id);
            const canBuy = !!currentUser && !isOwned;
            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `
                <span class="item-icon">${item.icon}</span>
                <div class="item-name">${item.name}</div>
                <div class="item-desc">${item.desc}</div>
                <div class="item-price">💰 ${item.price}</div>
                <button class="btn-buy ${isOwned ? 'owned' : (canBuy ? 'available' : 'disabled')}" onclick="buyItem('${item.id}', ${item.price})">
                    ${isOwned ? '已擁有' : (canBuy ? '立即購買' : '請先登入')}
                </button>
            `;
            if(item.category === 'style') styleList.appendChild(div);
            else utilList.appendChild(div);
        });
    }

    window.buyItem = async (id, price) => {
        if (!currentUser) {
            alert("請先登入後再購買。");
            location.href = "login.html";
            return;
        }
        if((currentUserData.inventory || []).includes(id)) return alert("此道具已擁有。");
        if(currentUserData.coins < price) return alert("金幣不足！請先提交程式作品，等待管理員審核核發金幣。");

        if(!confirm(`確定要花費 💰 ${price} 購買此物品嗎？`)) return;

        try {
            const ref = doc(db, "users", currentUser.uid);
            await runTransaction(db, async (tx) => {
                const snap = await tx.get(ref);
                const data = snap.exists() ? (snap.data() || {}) : {};
                const inv = Array.isArray(data.inventory) ? data.inventory.slice() : [];
                const currentCoins = Number.isFinite(data.coins) ? data.coins : 0;
                if (inv.includes(id)) throw new Error("ALREADY_OWNED");
                if (currentCoins < price) throw new Error("INSUFFICIENT_COINS");
                inv.push(id);
                tx.set(ref, {
                    coins: currentCoins - price,
                    inventory: inv,
                    lastPurchaseAt: serverTimestamp()
                }, { merge: true });
            });
            alert("購買成功！已儲存到 Firebase。");
            await loadMallData(currentUser);
        } catch(e) {
            if (String(e && e.message) === "ALREADY_OWNED") return alert("此道具已擁有。");
            if (String(e && e.message) === "INSUFFICIENT_COINS") return alert("金幣不足，請先提交程式作品等待管理員核發。");
            alert("購買失敗：" + (e.message || e));
        }
    };

    window.submitCoinReview = async () => {
        if (!currentUser) {
            alert("請先登入後送出審核。");
            location.href = "login.html";
            return;
        }
        const workType = (document.getElementById('review-work-type').value || 'python').trim();
        const projectSelect = document.getElementById('review-project-id');
        const selectedProjectId = (projectSelect && projectSelect.value ? projectSelect.value : "").trim();
        const selectedProject = onlineProjects.find(function (p) { return p.id === selectedProjectId; }) || null;
        const filePathInput = document.getElementById('review-file-path');
        const manualPath = (filePathInput && filePathInput.value ? filePathInput.value : "").trim();
        const note = (document.getElementById('review-note').value || '').trim();
        if (!selectedProject) {
            alert("請先選擇線上作品。");
            return;
        }
        try {
            var trimmedContent = String(selectedProject.pythonCode || "");
            if (trimmedContent.length > 120000) {
                trimmedContent = trimmedContent.slice(0, 120000);
            }
            const selectedPath = "users/" + currentUser.uid + "/projects/" + selectedProject.id;
            const pathHint = manualPath || selectedPath;
            const userRef = doc(db, "users", currentUser.uid);
            const reqRef = doc(collection(db, "coin_review_requests"));
            const day = todayKey();
            await runTransaction(db, async (tx) => {
                const userSnap = await tx.get(userRef);
                const userData = userSnap.exists() ? (userSnap.data() || {}) : {};
                const limit = Number.isFinite(userData.reviewUploadDailyLimit) ? userData.reviewUploadDailyLimit : 1;
                const bonus = Number.isFinite(userData.reviewUploadBonusToday) ? userData.reviewUploadBonusToday : 0;
                const allowed = Math.max(0, limit + bonus);
                const usedDay = String(userData.reviewUploadUsedDay || "");
                const used = usedDay === day ? (Number.isFinite(userData.reviewUploadUsedCount) ? userData.reviewUploadUsedCount : 0) : 0;
                if (used >= allowed) {
                    throw new Error("DAILY_LIMIT");
                }
                tx.set(reqRef, {
                    userId: currentUser.uid,
                    userEmail: currentUser.email || "",
                    workType: workType,
                    projectId: selectedProject.id,
                    projectName: selectedProject.name || "",
                    projectType: selectedProject.projectType || "",
                    fileName: (selectedProject.name || "project") + ".py",
                    filePathHint: pathHint || "",
                    fileSize: trimmedContent.length,
                    fileMimeType: "text/plain",
                    fileContent: trimmedContent,
                    note: note || "",
                    status: "pending",
                    suggestedCoins: 50,
                    awardedCoins: 0,
                    createdAt: serverTimestamp()
                });
                tx.set(userRef, {
                    reviewUploadUsedDay: day,
                    reviewUploadUsedCount: used + 1,
                    lastCoinReviewAt: serverTimestamp()
                }, { merge: true });
            });
            localStorage.removeItem(REVIEW_DRAFT_KEY);
            document.getElementById('review-work-type').value = 'python';
            if (projectSelect) projectSelect.value = '';
            if (filePathInput) filePathInput.value = '';
            document.getElementById('review-note').value = '';
            const reviewStatus = document.getElementById('review-status');
            if (reviewStatus) reviewStatus.innerText = '已送出審核申請，請等待管理員核發金幣。';
            alert("送審成功，請等待管理員審核。");
        } catch (e) {
            console.error(e);
            if (String(e && e.message) === "DAILY_LIMIT") {
                alert("你今天的審核上傳次數已用完，請聯絡管理員增加今日次數或等待明天。");
                return;
            }
            alert("送審失敗：" + (e.message || e));
        }
    };

    (function bindReviewFilePath() {
        const projectEl = document.getElementById('review-project-id');
        const pathEl = document.getElementById('review-file-path');
        if (!projectEl || !pathEl) return;
        projectEl.addEventListener('change', function () {
            if (!pathEl.value.trim() && projectEl.value) {
                pathEl.value = "users/" + (currentUser ? currentUser.uid : "{uid}") + "/projects/" + projectEl.value;
            }
        });
    })();
</script>
