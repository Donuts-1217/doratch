<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="responsive-global.css">
    <title>聊天室 - Creative Blocks</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4C97FF; --secondary: #FFAB19; --accent: #855CD6;
            --bg: #0F172A; --card-bg: #1E293B; --sidebar-bg: #0B0E14;
            --text: #F8FAFC; --text-muted: #94A3B8;
        }
        body { font-family: "Outfit", "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 導覽列 */
        nav { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); color: white; padding: 0 5%; height: 70px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 1.4rem; cursor: pointer; color: var(--primary); letter-spacing: 1px; }
        .btn-nav { text-decoration:none; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        .btn-nav:hover { background: var(--primary); color: white; }
        .nav-actions { display: flex; gap: 10px; align-items: center; }

        /* --- 下拉選單 Wrapper --- */
        .user-profile-wrapper { position: relative; padding: 10px 0; margin-left: 20px; }
        .user-profile { display: flex; align-items: center; gap: 6px; cursor: pointer; background: rgba(255,255,255,0.05); padding: 6px 15px; border-radius: 50px; color: white; border: 1px solid rgba(255,255,255,0.1); }
        .dropdown-menu { position: absolute; top: 50px; right: 0; width: 140px; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; flex-direction: column; padding: 8px 0; z-index: 1001; }
        .user-profile-wrapper:hover .dropdown-menu { display: flex; }
        .dropdown-item { padding: 10px 20px; color: var(--text-muted); text-decoration: none; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .dropdown-item:hover { background: rgba(255,255,255,0.05); color: white; }

        /* 聊天主容器 - Discord Style */
        .chat-container { display: flex; flex: 1; overflow: hidden; background: var(--bg); color: var(--text); }
        
        /* 左側列表區 */
        .sidebar { width: 300px; background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header { min-height: 70px; padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header h3 { margin: 0; font-size: 16px; color: white; width: 100%; }
        .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-icon { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; padding: 6px 10px; font-size: 11px; font-weight: bold; transition: 0.3s; white-space: nowrap; }
        .btn-icon:hover { background: var(--primary); color: white; border-color: var(--primary); }
        
        .chat-list { flex: 1; overflow-y: auto; padding: 20px 0; }
        .category-title { font-size: 11px; font-weight: 900; color: #475569; padding: 10px 25px; text-transform: uppercase; letter-spacing: 1.5px; }
        .chat-item { padding: 12px 20px; cursor: pointer; display: flex; flex-direction: column; transition: 0.2s; margin: 4px 15px; border-radius: 12px; }
        .chat-item:hover { background: rgba(255,255,255,0.03); }
        .chat-item.active { background: rgba(76, 151, 255, 0.1); border: 1px solid rgba(76, 151, 255, 0.2); }
        .chat-name { font-weight: bold; color: var(--text-muted); font-size: 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .chat-item:hover .chat-name, .chat-item.active .chat-name { color: white; }
        .chat-preview { font-size: 12px; color: #475569; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 25px; }
        
        /* 右側對話區 */
        .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
        .chat-header { height: 70px; padding: 0 30px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 900; font-size: 1.2rem; color: white; flex-shrink: 0; }
        
        .messages-area { flex: 1; padding: 30px 0; overflow-y: auto; display: flex; flex-direction: column; }
        .messages-area::-webkit-scrollbar { width: 6px; }
        .messages-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        .message-row { display: flex; padding: 8px 30px; transition: 0.2s; margin-top: 20px; }
        .message-row:hover { background: rgba(255,255,255,0.02); }
        .message-row.consecutive { margin-top: 2px; }
        .msg-avatar-container { width: 50px; margin-right: 20px; flex-shrink: 0; display: flex; justify-content: center; }
        .msg-avatar { width: 50px; height: 50px; border-radius: 16px; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); }
        .msg-time-hover { font-size: 11px; color: #475569; opacity: 0; text-align: center; width: 50px; }
        .message-row.consecutive:hover .msg-time-hover { opacity: 1; }
        
        .msg-content { display: flex; flex-direction: column; flex: 1; }
        .msg-header { display: flex; align-items: baseline; margin-bottom: 6px; }
        .msg-author { font-weight: 900; font-size: 1.1rem; color: white; margin-right: 12px; }
        .msg-time { font-size: 12px; color: var(--text-muted); }
        .msg-text { font-size: 15px; line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word; }
        .message-row.bot-msg .msg-author { color: #23a559; }
        .message-row.bot-msg .msg-avatar { border-color: rgba(35,165,89,0.4); }
        .bot-badge { background: #23a559; color: white; border-radius: 4px; padding: 2px 6px; font-size: 10px; margin-left: 6px; vertical-align: middle; }
        .msg-embed {
            margin-top: 6px; padding: 10px 12px; border-left: 3px solid #5865f2;
            background: rgba(88,101,242,0.08); border-radius: 6px; font-size: 14px; line-height: 1.5;
            white-space: pre-wrap;
        }
        .msg-components { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .msg-comp-btn {
            border: none; padding: 8px 14px; border-radius: 6px; font-weight: 800; font-size: 13px;
            cursor: pointer; color: #fff; font-family: inherit;
        }
        .msg-comp-btn--primary { background: #5865f2; }
        .msg-comp-btn--secondary { background: #4e5058; }
        .msg-comp-btn--success { background: #23a559; }
        .msg-comp-btn--danger { background: #ed4245; }
        .msg-comp-select {
            min-width: 160px; padding: 8px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15);
            background: #1e293b; color: #e2e8f0; font-size: 13px;
        }
        
        /* 檔案附件卡片 */
        .msg-file-card { background: var(--card-bg); border: 1px solid rgba(76, 151, 255, 0.2); border-radius: 16px; padding: 20px; margin-top: 10px; display: inline-flex; align-items: center; gap: 20px; max-width: 400px; cursor: pointer; transition: 0.3s; }
        .msg-file-card:hover { transform: scale(1.02); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .file-icon { font-size: 35px; }
        .file-info { flex: 1; overflow: hidden; }
        .file-name { font-weight: 900; color: var(--primary); font-size: 15px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; margin-bottom: 4px; }
        .file-sub { font-size: 12px; color: var(--text-muted); }

        /* 輸入區 */
        .input-area { padding: 0 30px 30px 30px; flex-shrink: 0; position: relative; }
        .input-wrapper { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; display: flex; align-items: center; padding: 12px 20px; transition: 0.3s; gap: 12px; }
        .input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 20px rgba(76, 151, 255, 0.1); }
        .btn-attach { background: rgba(255,255,255,0.1); color: white; border: none; width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; font-size: 20px; transition: 0.2s; flex-shrink: 0; }
        .btn-attach:hover { background: var(--primary); }
        .btn-slash-chip {
            background: rgba(88,101,242,0.2); color: #a5b4fc; border: none; width: 32px; height: 32px;
            border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; flex-shrink: 0;
        }
        .btn-slash-chip:hover { background: #5865f2; color: #fff; }
        .input-box { flex: 1; background: transparent; border: none; color: white; font-size: 16px; outline: none; min-width: 0; }

        /* 斜線指令選單 */
        .slash-picker {
            position: absolute; bottom: 100%; left: 30px; right: 30px; margin-bottom: 8px;
            background: #2b2d31; border: 1px solid #1e1f22; border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.45); max-height: 280px; overflow-y: auto; z-index: 50;
        }
        .slash-picker-item {
            display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; width: 100%; text-align: left;
            border: none; background: transparent; color: #dbdee1; padding: 12px 16px; cursor: pointer;
            font-family: inherit; border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .slash-picker-item:hover, .slash-picker-item.active { background: rgba(88,101,242,0.15); }
        .slash-cmd-name { color: #fff; font-weight: 900; font-size: 15px; }
        .slash-cmd-desc { color: #949ba4; font-size: 13px; flex: 1; min-width: 120px; }
        .slash-cmd-bot { color: #23a559; font-size: 11px; font-weight: 800; }
        .slash-picker-empty { padding: 20px; text-align: center; color: #949ba4; font-size: 13px; line-height: 1.6; }
        
        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 40px; border-radius: 24px; width: 400px; color: white; border: 1px solid rgba(255,255,255,0.1); }
        .modal-content input { width: 100%; padding: 15px; margin: 20px 0; background: var(--bg); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; outline: none; }
        .btn-modal { padding: 12px 25px; border: none; border-radius: 12px; cursor: pointer; font-weight: 900; }
        
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); background: var(--bg); }
        .empty-state i { font-size: 60px; margin-bottom: 20px; opacity: 0.2; }

        /* 成員列表側邊欄 */
        .member-sidebar { width: 260px; background: var(--sidebar-bg); border-left: 1px solid rgba(255,255,255,0.05); display: none; flex-direction: column; flex-shrink: 0; }
        .member-sidebar.active { display: flex; }
        .member-sidebar-header { height: 70px; padding: 0 25px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; font-weight: 900; color: white; }
        .member-list { flex: 1; overflow-y: auto; padding: 12px 16px 20px; }
        .member-section-title {
            font-size: 11px; font-weight: 900; color: #64748b; text-transform: uppercase;
            letter-spacing: 0.08em; padding: 12px 8px 6px; margin-top: 4px;
        }
        .member-item { display: flex; align-items: center; padding: 8px 10px; border-radius: 10px; margin-bottom: 2px; transition: 0.2s; gap: 8px; }
        .member-item:hover { background: rgba(255,255,255,0.04); }
        .member-item--bot { border: 1px solid rgba(35,165,89,0.15); background: rgba(35,165,89,0.05); }
        .member-item--bot:hover { background: rgba(35,165,89,0.1); }
        .member-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-left: 4px; }
        .member-status.online { background: #23a559; box-shadow: 0 0 6px rgba(35,165,89,0.6); }
        .member-status.bot { background: #5865f2; }
        .member-avatar { width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; }
        .member-info { flex: 1; min-width: 0; }
        .member-name { font-size: 14px; color: #e2e8f0; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .member-role { font-size: 11px; color: #64748b; margin-top: 2px; }
        .member-cmds { color: #5865f2 !important; line-height: 1.4; word-break: break-word; white-space: normal; }
        .member-tag { font-size: 10px; background: rgba(255,255,255,0.1); padding: 1px 6px; border-radius: 4px; font-weight: 800; }
        .member-tag.bot { background: rgba(35,165,89,0.25); color: #86efac; }
        .member-empty-hint { font-size: 12px; color: #64748b; padding: 8px 12px 16px; line-height: 1.5; text-align: center; }
        .kick-btn { background: #FF4D4D; color: white; border: none; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; opacity: 0; transition: 0.2s; white-space: nowrap; flex-shrink: 0; }
        .member-item:hover .kick-btn { opacity: 1; }
        .kick-btn.bot-disconnect { opacity: 0.7; background: rgba(255,255,255,0.1); color: #fca5a5; }
        .member-item--bot:hover .bot-disconnect { opacity: 1; }

        /* 全域導覽列樣式 */
        .app-container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        .sidebar-main { width: 260px; background: #0B0E14; color: white; display: flex; flex-direction: column; height: 100vh; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar-logo { padding: 30px; font-weight: 900; font-size: 1.2rem; color: var(--primary); cursor: pointer; }
        .nav-item { padding: 15px 30px; display: flex; align-items: center; gap: 12px; color: #94A3B8; text-decoration: none; font-weight: bold; transition: 0.3s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { color: var(--primary); border-left: 4px solid var(--primary); }
        .sidebar-footer { margin-top: auto; padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        .user-mini-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.03); }
        .main-chat-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    
        
        /* 響應式縮放與排版 */
        html, body { max-width: 100vw; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 100vw; overflow: hidden; }
        .main-content { overflow-x: auto; box-sizing: border-box; }
        
        @media (max-width: 1024px) {
            .app-container { flex-direction: column; }
            
            /* 導覽列改為橫向可滑動 */
            .sidebar-main { width: 100vw; height: auto; position: static; flex-direction: row; overflow-x: auto; white-space: nowrap; flex-wrap: nowrap; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
            .sidebar-logo { display: none; }
            .sidebar-main > div[style*="uppercase"] { display: none; }
            .nav-item { padding: 12px 20px; font-size: 14px; flex-shrink: 0; border-left: none !important; border-bottom: 2px solid transparent; }
            .nav-item.active { border-bottom: 2px solid var(--primary); }
            .sidebar-footer { width: auto; border: none; padding: 5px 15px; display: flex; align-items: center; margin-top: 0; flex-shrink: 0; }
            
            .main-content { margin-left: 0; padding: 15px; width: 100vw; }
            
            /* 卡片與通用排版 */
            #user-stats-card { flex-wrap: wrap; justify-content: center; text-align: center; }
            #user-stats-card > div { width: 100%; }
            .header, .header-title { flex-direction: column; gap: 15px; text-align: center; }
            .project-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            .game-grid { grid-template-columns: 1fr; }
            
            /* 遊戲區域適應 */
            .boss-raid-container, .game-frame { width: 100%; box-sizing: border-box; padding: 20px 10px; min-height: auto; }
            .duel-arena { grid-template-columns: 1fr; }
            .boss-image-container { width: 200px; height: 200px; margin: 0 auto 15px; }
        }
        
        @media (max-width: 740px) {
            /* 精準縮放 700px 的遊戲畫布 (塔防與PvP) */
            [style*="width:700px"] { 
                transform-origin: top left;
                transform: scale(calc((100vw - 30px) / 700));
                margin-bottom: calc(-300px * (1 - ((100vw - 30px) / 700))); 
            }
        }
        
        @media (max-width: 480px) {
            .nav-item { font-size: 13px; padding: 10px 15px; }
            .hero h1 { font-size: 2.5rem; }
        }

    </style>
</head>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, where, orderBy, onSnapshot, serverTimestamp, getDocs, updateDoc, arrayUnion, arrayRemove, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDwRdQFgQVn5Un8Od2nP4u5EbMx-dMOYoU",
        authDomain: "chat-52c0d.firebaseapp.com",
        projectId: "chat-52c0d",
        appId: "1:449329325475:web:75f255c4055360dc9e6616"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentChatId = null;
    let currentChatParticipants = [];
    let currentChatAttachedBots = [];
    let currentChatBotsMeta = [];
    let unsubscribeMessages = null;
    let unsubscribeChatDoc = null;
    let modalMode = ''; // 'private' or 'group'

    window.handleLogout = () => signOut(auth).then(() => location.href='index.html');

    onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";
        currentUser = user;

        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('side-coins').innerText = data.coins || 0;
            document.getElementById('side-username').innerText = user.email.split('@')[0];
            document.getElementById('side-avatar').src = `https://ui-avatars.com/api/?name=${user.email}&background=random`;
            
            let role = data.role || 'student';
            if (user.email === 'chianghansen0302@gmail.com') role = 'admin';
            if(role === 'admin' || role === 'teacher') {
                const adminLink = document.getElementById('admin-link-main');
                if(adminLink) {
                    adminLink.style.display = 'flex';
                    adminLink.innerText = role === 'admin' ? '🛠️ 管理面板' : '❓ 題庫管理';
                }
            }
        }

        try {
            await setDoc(userRef, {
                email: user.email || "",
                uid: user.uid,
                lastSeen: serverTimestamp()
            }, { merge: true });
        } catch (e) {}

        loadChats();

        if (window.PythonEngine && window.DiscordBotEngine) {
            window.PythonEngine.init(function () { /* bot engine loading */ }).catch(function () { /* ignore */ });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const openId = urlParams.get('open');
        if (openId) {
            const snap = await getDoc(doc(db, "chats", openId));
            if (snap.exists() && snap.data().participants.includes(user.uid)) {
                const d = snap.data();
                let name = d.name || "未命名";
                let icon = d.type === 'server' ? '🏫' : (d.type === 'private' ? '👤' : '👥');
                if (d.type === 'private') {
                    const otherEmail = (d.participantEmails || []).find(e => e !== user.email) || "未知";
                    name = otherEmail.split('@')[0];
                }
                openChat(openId, name, icon, d.type, d.teacherId);
            }
        }
    });

    // 2. 監聽並渲染聊天室列表
    function loadChats() {
        const q = query(
            collection(db, "chats"),
            where("participants", "array-contains", currentUser.uid)
        );

        onSnapshot(q, (snapshot) => {
            document.getElementById('list-server').innerHTML = '';
            document.getElementById('list-group').innerHTML = '';
            document.getElementById('list-private').innerHTML = '';
            
            if (snapshot.empty) {
                document.getElementById('list-private').innerHTML = '<div style="padding:20px; text-align:center; color:#949ba4; font-size:13px;">目前還沒有對話紀錄</div>';
                return;
            }

            // 在前端進行排序，避免需要 Firebase 建立複合索引 (Composite Index)
            const chats = [];
            snapshot.forEach(docSnap => chats.push({ id: docSnap.id, ...docSnap.data() }));
            chats.sort((a, b) => {
                const t1 = a.updatedAt ? a.updatedAt.toMillis() : 0;
                const t2 = b.updatedAt ? b.updatedAt.toMillis() : 0;
                return t2 - t1;
            });

            chats.forEach(chat => {
                let displayName = chat.name || "未命名";
                let rawName = displayName;
                let icon = '💬';
                if (chat.type === 'private') {
                    icon = '👤';
                    displayName = (chat.participantEmails || []).find(e => e !== currentUser.email) || "未知使用者";
                    displayName = displayName.split('@')[0];
                    rawName = displayName;
                } else if (chat.type === 'server') {
                    icon = '🏫';
                    displayName += ` <span style="font-size:10px; opacity:0.7; font-weight:normal;">(代碼: ${chat.id})</span>`;
                } else {
                    icon = '👥';
                }

                const item = document.createElement('div');
                item.className = `chat-item ${currentChatId === chat.id ? 'active' : ''}`;
                item.onclick = () => openChat(chat.id, rawName, icon, chat.type, chat.teacherId);
                
                const timeStr = chat.updatedAt ? new Date(chat.updatedAt.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';

                item.innerHTML = `
                    <div class="chat-name">${icon} ${displayName} <span style="margin-left:auto; font-size:10px; color:#949ba4; font-weight:normal;">${timeStr}</span></div>
                    <div class="chat-preview">${chat.lastMessage || '開始聊天吧！'}</div>
                `;
                
                if (chat.type === 'server') {
                    document.getElementById('list-server').appendChild(item);
                } else if (chat.type === 'private') {
                    document.getElementById('list-private').appendChild(item);
                } else {
                    document.getElementById('list-group').appendChild(item);
                }
            });
        });

        // 監聽待審批邀請
        const qInvites = query(
            collection(db, "chats"),
            where("pendingInvites", "array-contains", currentUser.uid)
        );

        onSnapshot(qInvites, (snapshot) => {
            const listDiv = document.getElementById('list-invites');
            const categoryDiv = document.getElementById('category-invite');
            listDiv.innerHTML = '';
            
            if (snapshot.empty) {
                categoryDiv.style.display = 'none';
                return;
            }
            categoryDiv.style.display = 'block';

            snapshot.forEach(docSnap => {
                const chat = { id: docSnap.id, ...docSnap.data() };
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.style.borderLeft = '3px solid #f47f24';
                item.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <div style="font-size:13px; font-weight:bold;">💌 邀請：${chat.name}</div>
                        <div style="display:flex; gap:10px;">
                            <button style="flex:1; background:#4CAF50; color:white; border:none; padding:4px; border-radius:4px; cursor:pointer; font-weight:bold;" onclick="handleInvite('${chat.id}', true)">接受</button>
                            <button style="flex:1; background:#FF4D4D; color:white; border:none; padding:4px; border-radius:4px; cursor:pointer; font-weight:bold;" onclick="handleInvite('${chat.id}', false)">拒絕</button>
                        </div>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        });
    }

    // 處理邀請接受/拒絕
    window.handleInvite = async (chatId, isAccept) => {
        try {
            const ref = doc(db, "chats", chatId);
            if (isAccept) {
                const groupCount = await checkGroupLimit();
                if (groupCount >= 20) {
                    alert("接受失敗：您最多只能加入 20 個群組或伺服器！");
                    return;
                }
                await updateDoc(ref, {
                    pendingInvites: arrayRemove(currentUser.uid),
                    participants: arrayUnion(currentUser.uid)
                });
                alert("已成功加入！");
            } else {
                if(!confirm("確定要拒絕此邀請嗎？")) return;
                await updateDoc(ref, {
                    pendingInvites: arrayRemove(currentUser.uid)
                });
            }
        } catch (e) {
            alert("處理失敗：" + e.message);
        }
    };

    let currentChatTeacherId = null;
    let currentChatType = null;

    // 3. 開啟特定聊天室
    window.openChat = (chatId, chatName, icon, chatType, teacherId) => {
        currentChatId = chatId;
        currentChatTeacherId = teacherId;
        currentChatType = chatType;
        
        // 更新樣式
        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
        const activeItem = Array.from(document.querySelectorAll('.chat-item')).find(el => el.onclick.toString().includes(chatId));
        if (activeItem) activeItem.classList.add('active');

        const displayTitle = chatType === 'server' ? `${chatName} <span style="font-size:12px; color:#949ba4;">(代碼: ${chatId})</span>` : chatName;
        const inviteBtnHtml = (chatType === 'group' || chatType === 'server') ? `<button class="btn-icon" style="margin-left:auto; background:#5865F2;" onclick="openModal('invite')">邀請</button>` : '';
        const botBtnHtml = (chatType === 'group' || chatType === 'server') ? `<button class="btn-icon" style="margin-left:8px; background:#23a559;" onclick="openModal('connectBot')" title="連接 Discord Bot">🤖 Bot</button>` : '';
        const memberToggleBtnHtml = (chatType === 'group' || chatType === 'server') ? `<button class="btn-icon" style="margin-left:8px; background:#4e5058;" onclick="toggleMemberSidebar()" title="顯示成員名單">👥</button>` : '';
        
        let manageBtnHtml = '';
        if (chatType === 'server' || chatType === 'group') {
            if (currentUser.uid === teacherId) {
                manageBtnHtml = `<button class="btn-icon" style="background:#FF4D4D; margin-left:10px;" onclick="deleteChat('${chatId}')">🗑️ 解散</button>`;
            } else {
                manageBtnHtml = `<button class="btn-icon" style="background:#f47f24; margin-left:10px;" onclick="leaveChat('${chatId}')">🚪 退出</button>`;
            }
        }

        const mainDiv = document.getElementById('chat-main');
        mainDiv.innerHTML = `
            <div class="chat-header">
                <h3 id="current-chat-name" style="margin: 0; font-size: 1.1rem;">${icon} ${displayTitle}</h3>
                <div style="margin-left:auto; display:flex; align-items:center;">
                    ${inviteBtnHtml}
                    ${botBtnHtml}
                    ${memberToggleBtnHtml}
                    ${manageBtnHtml}
                </div>
            </div>
            <div class="messages-area" id="messages-area"></div>
            <div class="input-area">
                <div class="slash-picker" id="slash-picker" style="display:none;"></div>
                <div class="input-wrapper">
                    <button class="btn-attach" onclick="document.getElementById('file-input').click()" title="上傳 .xml 專案檔">➕</button>
                    <input type="file" id="file-input" accept=".xml" style="display:none" onchange="sendFile(this)">
                    <button type="button" class="btn-slash-chip" id="btn-slash-chip" title="斜線指令">/</button>
                    <input type="text" id="msg-input" class="input-box" placeholder="傳送訊息，或輸入 / 使用斜線指令…">
                </div>
            </div>
        `;

        if (unsubscribeMessages) unsubscribeMessages();
        if (unsubscribeChatDoc) unsubscribeChatDoc();

        // 監聽聊天室文件（用於更新成員名單等）
        unsubscribeChatDoc = onSnapshot(doc(db, "chats", chatId), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                currentChatParticipants = data.participants || [];
                currentChatAttachedBots = data.attachedBots || [];
                refreshChatBotsMeta();
            }
        });

        const q = query(
            collection(db, "chats", chatId, "messages"),
            orderBy("createdAt", "asc")
        );

    window.currentMessages = {}; // 全域暫存，供下載檔案用

    unsubscribeMessages = onSnapshot(q, (snapshot) => {
        const msgArea = document.getElementById('messages-area');
        let html = '';
        let lastSenderId = null;
        let lastTimeStr = null;
        
        window.currentMessages = {};

        snapshot.forEach(docSnap => {
            const msg = docSnap.data();
            window.currentMessages[docSnap.id] = msg;
            
            const senderName = msg.type === 'bot'
                ? (msg.botName || "Bot")
                : (msg.senderEmail || "未知").split('@')[0];
            const timeObj = msg.createdAt ? msg.createdAt.toDate() : new Date();
            const timeStr = timeObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const fullTimeStr = timeObj.toLocaleDateString() + ' ' + timeStr;
            const avatarUrl = msg.type === 'bot'
                ? `https://ui-avatars.com/api/?name=${encodeURIComponent(msg.botName || "Bot")}&background=23a559&color=fff`
                : `https://ui-avatars.com/api/?name=${msg.senderEmail}&background=random`;
            
            const isConsecutive = (lastSenderId === msg.senderId) && (lastTimeStr === fullTimeStr);
            const isTeacher = currentChatTeacherId && msg.senderId === currentChatTeacherId;
            const badgeLabel = currentChatType === 'server' ? '房主' : '管理員';
            const teacherBadge = isTeacher ? `<span style="background: #5865F2; color: white; border-radius: 4px; padding: 2px 6px; font-size: 10px; margin-left: 6px; vertical-align: middle;">👑 ${badgeLabel}</span>` : '';
            const botBadge = msg.type === 'bot' ? `<span class="bot-badge">BOT</span>` : '';
            const rowClass = msg.type === 'bot' ? 'message-row bot-msg' : 'message-row';
            
            let contentHtml = '';
            if (msg.type === 'file') {
                contentHtml = `
                    <div class="msg-file-card" onclick="downloadXml('${docSnap.id}')">
                        <div class="file-icon">📄</div>
                        <div class="file-info">
                            <div class="file-name">${msg.fileName}</div>
                            <div class="file-sub">Blockly XML 專案檔 (點擊下載)</div>
                        </div>
                        <div class="file-download-icon">⬇️</div>
                    </div>
                `;
            } else {
                contentHtml = msg.type === 'bot' ? renderBotMessageBody(msg) : `<div class="msg-text">${escHtml(msg.text || "")}</div>`;
            }

            if (isConsecutive) {
                html += `
                    <div class="${rowClass} consecutive">
                        <div class="msg-avatar-container"><span class="msg-time-hover">${timeStr}</span></div>
                        <div class="msg-content">${contentHtml}</div>
                    </div>
                `;
            } else {
                html += `
                    <div class="${rowClass}">
                        <div class="msg-avatar-container"><img src="${avatarUrl}" class="msg-avatar"></div>
                        <div class="msg-content">
                            <div class="msg-header">
                                <span class="msg-author">${senderName}${teacherBadge}${botBadge}</span>
                                <span class="msg-time">${fullTimeStr}</span>
                            </div>
                            ${contentHtml}
                        </div>
                    </div>
                `;
            }
            
            lastSenderId = msg.senderId;
            lastTimeStr = fullTimeStr;
        });
        msgArea.innerHTML = html;
        msgArea.scrollTop = msgArea.scrollHeight;
    });
        
        setTimeout(() => {
            const input = document.getElementById('msg-input');
            if (input && window.ChatDiscordUI) {
                input._chatSend = () => window.sendMessage();
                window.ChatDiscordUI.mountInput(
                    input,
                    document.getElementById('slash-picker'),
                    document.getElementById('btn-slash-chip')
                );
            }
            refreshChatBotsMeta();
            const memberSidebar = document.getElementById('member-sidebar');
            if (chatType === 'group' || chatType === 'server') {
                memberSidebar.classList.add('active');
            } else {
                memberSidebar.classList.remove('active');
            }
            input && input.focus();
        }, 100);
    };

    // 退出群組邏輯
    window.leaveChat = async (chatId) => {
        if (!confirm("確定要退出這個聊天室嗎？退出後需要重新受邀才能進入。")) return;
        try {
            await updateDoc(doc(db, "chats", chatId), {
                participants: arrayRemove(currentUser.uid)
            });
            document.getElementById('chat-main').innerHTML = '<div style="display:flex; height:100%; align-items:center; justify-content:center; color:#949ba4;">選擇一個聊天室開始對話</div>';
            currentChatId = null;
            currentChatTeacherId = null;
            currentChatType = null;
            alert("已成功退出聊天室");
        } catch (e) { alert("退出失敗：" + e.message); }
    };

    // 解散群組邏輯
    window.deleteChat = async (chatId) => {
        if (!confirm("⚠️ 警告：確定要解散這個聊天室嗎？\n此動作將永久刪除所有對話紀錄與檔案，且無法還原！")) return;
        try {
            await deleteDoc(doc(db, "chats", chatId));
            document.getElementById('chat-main').innerHTML = '<div style="display:flex; height:100%; align-items:center; justify-content:center; color:#949ba4;">選擇一個聊天室開始對話</div>';
            currentChatId = null;
            currentChatTeacherId = null;
            currentChatType = null;
            alert("已成功解散聊天室");
        } catch (e) { alert("解散失敗：" + e.message); }
    };

    async function refreshChatBotsMeta() {
        if (!window.ChatDiscordUI) return;
        try {
            currentChatBotsMeta = await window.ChatDiscordUI.loadBotsMeta(
                currentChatAttachedBots,
                loadBotCode
            );
            if (document.getElementById('member-sidebar')?.classList.contains('active')) {
                loadMembers();
            }
        } catch (e) {
            console.warn("Bot meta 更新失敗", e);
        }
    }

    window.disconnectBot = async (token) => {
        if (!currentChatId || !token) return;
        if (!confirm("確定要中斷此 Bot 的連接嗎？")) return;
        try {
            const chatSnap = await getDoc(doc(db, "chats", currentChatId));
            const bots = (chatSnap.data()?.attachedBots || []).filter(b => b.token !== token);
            await updateDoc(doc(db, "chats", currentChatId), {
                attachedBots: bots,
                updatedAt: serverTimestamp()
            });
        } catch (e) {
            alert("中斷 Bot 失敗：" + e.message);
        }
    };

    // --- 成員管理相關 ---
    window.toggleMemberSidebar = () => {
        const sidebar = document.getElementById('member-sidebar');
        sidebar.classList.toggle('active');
        if (sidebar.classList.contains('active')) {
            loadMembers();
        }
    };

    window.loadMembers = async () => {
        if (!currentChatId) return;
        const listDiv = document.getElementById('member-list');
        listDiv.innerHTML = '<div class="member-empty-hint">載入成員中…</div>';

        try {
            const members = [];
            for (const uid of currentChatParticipants) {
                const userSnap = await getDoc(doc(db, "users", uid));
                if (userSnap.exists()) {
                    members.push(userSnap.data());
                }
            }

            members.sort((a, b) => {
                if (a.uid === currentChatTeacherId) return -1;
                if (b.uid === currentChatTeacherId) return 1;
                return ((a.email || "").split("@")[0]).localeCompare((b.email || "").split("@")[0]);
            });

            if (window.ChatDiscordUI) {
                window.ChatDiscordUI.renderMemberList(listDiv, {
                    members: members,
                    botsMeta: currentChatBotsMeta,
                    teacherId: currentChatTeacherId,
                    currentUid: currentUser.uid,
                    onKick: window.kickMember,
                    onDisconnectBot: window.disconnectBot,
                    onUseSlash: (name) => {
                        window.ChatDiscordUI.pickSlashByName(name);
                        const input = document.getElementById('msg-input');
                        if (input) input.focus();
                    }
                });
            }
        } catch (e) {
            console.error("載入成員失敗:", e);
            listDiv.innerHTML = '<div class="member-empty-hint" style="color:#fca5a5;">載入失敗</div>';
        }
    };

    window.kickMember = async (uid, name) => {
        if (!confirm(`確定要將成員「${name}」踢出聊天室嗎？`)) return;
        try {
            await updateDoc(doc(db, "chats", currentChatId), {
                participants: arrayRemove(uid)
            });
            alert(`已將 ${name} 踢出`);
        } catch (e) {
            alert("踢出失敗：" + e.message);
        }
    };

    // 私訊滿 300 條清理機制
    async function trimPrivateMessages(chatId) {
        if (currentChatType !== 'private') return;
        try {
            const msgsQuery = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
            const msgsSnap = await getDocs(msgsQuery);
            if (msgsSnap.size > 300) {
                const deleteCount = msgsSnap.size - 300;
                for (let i = 0; i < deleteCount; i++) {
                    await deleteDoc(msgsSnap.docs[i].ref);
                }
            }
        } catch (e) {
            console.error("清理舊訊息失敗:", e);
        }
    }

    async function loadBotCode(ownerId, botId) {
        const botSnap = await getDoc(doc(db, "users", ownerId, "discordBots", botId));
        if (!botSnap.exists()) return null;
        return botSnap.data();
    }

    const BTN_STYLE_MAP = { 1: "primary", 2: "secondary", 3: "success", 4: "danger", 5: "link" };

    function escHtml(s) {
        return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function renderBotComponentsHtml(view, botToken) {
        if (!view || !view.items || !view.items.length) return "";
        let html = '<div class="msg-components">';
        view.items.forEach(item => {
            if (item.type === "button") {
                const st = BTN_STYLE_MAP[item.style] || "secondary";
                html += `<button type="button" class="msg-comp-btn msg-comp-btn--${st}" onclick="handleChatBotComponent('${escHtml(botToken)}','${escHtml(view.view_id)}','${escHtml(item.custom_id)}',[])">${escHtml((item.emoji ? item.emoji + " " : "") + (item.label || "Button"))}</button>`;
            } else if (item.type === "select") {
                html += `<select class="msg-comp-select" onchange="if(this.value){handleChatBotComponent('${escHtml(botToken)}','${escHtml(view.view_id)}','${escHtml(item.custom_id)}',[this.value]);this.value='';}"><option value="">${escHtml(item.placeholder || "選擇…")}</option>`;
                (item.options || []).forEach(opt => {
                    html += `<option value="${escHtml(opt.value || opt.label)}">${escHtml(opt.label || opt.value)}</option>`;
                });
                html += "</select>";
            }
        });
        html += "</div>";
        return html;
    }

    function renderBotMessageBody(msg) {
        let html = "";
        if (msg.text) {
            html += `<div class="msg-text">${escHtml(msg.text)}</div>`;
        }
        if (msg.embed && window.DiscordBotRuntime) {
            const embedText = window.DiscordBotRuntime.formatEmbedText(msg.embed);
            if (embedText) html += `<div class="msg-embed">${escHtml(embedText)}</div>`;
        }
        if (msg.view && msg.botToken) {
            html += renderBotComponentsHtml(msg.view, msg.botToken);
        }
        return html || '<div class="msg-text"></div>';
    }

    async function postBotResponses(entry, botData, responses) {
        const botName = entry.name || botData.name || "Bot";
        for (const resp of responses) {
            const hasContent = resp.content || resp.embed || (resp.view && resp.view.items && resp.view.items.length);
            if (!hasContent) continue;
            const previewText = resp.content || (window.DiscordBotRuntime ? window.DiscordBotRuntime.formatEmbedText(resp.embed) : "") || "🎛 互動元件";
            await addDoc(collection(db, "chats", currentChatId, "messages"), {
                senderId: "bot:" + entry.token,
                senderEmail: "bot@" + entry.token.slice(0, 8),
                botName: botName,
                botToken: entry.token,
                botOwnerId: entry.ownerId,
                botId: entry.botId,
                text: resp.content || previewText.slice(0, 200),
                embed: resp.embed || null,
                view: resp.view || null,
                ephemeral: !!resp.ephemeral,
                type: "bot",
                createdAt: serverTimestamp()
            });
        }
        const preview = responses[0]?.content || (window.DiscordBotRuntime && responses[0]?.embed ? window.DiscordBotRuntime.formatEmbedText(responses[0].embed) : "") || "…";
        await updateDoc(doc(db, "chats", currentChatId), {
            lastMessage: "🤖 " + botName + ": " + String(preview).slice(0, 40),
            updatedAt: serverTimestamp()
        });
    }

    window.handleChatBotComponent = async (botToken, viewId, customId, values) => {
        if (!currentChatId) return;
        const entry = currentChatAttachedBots.find(b => b.token === botToken);
        if (!entry) return;
        try {
            const botData = await loadBotCode(entry.ownerId, entry.botId);
            if (!botData || !botData.pythonCode) return;
            const r = await window.DiscordBotRuntime.handleInteraction({
                code: botData.pythonCode,
                type: "component",
                payload: { viewId, customId, values: values || [] }
            });
            if (r.error || !r.responses || !r.responses.length) return;
            await postBotResponses(entry, botData, r.responses);
        } catch (e) {
            console.warn("Bot 元件回覆失敗:", e);
        }
    };

    async function processAttachedBots(userText) {
        if (!currentChatAttachedBots.length || !window.DiscordBotEngine) return;
        if (!userText || (userText.charAt(0) !== "!" && userText.charAt(0) !== "/")) return;

        const isSlash = userText.charAt(0) === "/";
        const slashName = isSlash ? userText.slice(1).split(/\s+/)[0] : null;

        for (const entry of currentChatAttachedBots) {
            try {
                const tokenSnap = await getDoc(doc(db, "botTokens", entry.token));
                if (!tokenSnap.exists() || !tokenSnap.data().active) continue;

                const botData = await loadBotCode(entry.ownerId, entry.botId);
                if (!botData || !botData.pythonCode) continue;

                let responses = [];
                if (isSlash && window.DiscordBotRuntime && window.DiscordBotRuntime.isDiscordPyCode(botData.pythonCode)) {
                    const r = await window.DiscordBotRuntime.handleInteraction({
                        code: botData.pythonCode,
                        type: "slash",
                        payload: slashName
                    });
                    if (r.error) continue;
                    responses = r.responses || [];
                } else if (!isSlash) {
                    const res = await window.DiscordBotEngine.runBotCode(botData.pythonCode, userText);
                    if (res.error) continue;
                    if (res.responses && res.responses.length) {
                        responses = res.responses;
                    } else if (res.reply) {
                        responses = [{ content: res.reply }];
                    }
                }
                if (!responses.length) continue;

                await postBotResponses(entry, botData, responses);
            } catch (e) {
                console.warn("Bot 回覆失敗:", e);
            }
        }
    }

    // 4. 傳送文字訊息
    window.sendMessage = async () => {
        if (!currentChatId) return;
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        input.disabled = true;
        if (window.ChatDiscordUI) window.ChatDiscordUI.hidePicker();

        try {
            await addDoc(collection(db, "chats", currentChatId, "messages"), {
                senderId: currentUser.uid,
                senderEmail: currentUser.email,
                text: text,
                type: "text",
                createdAt: serverTimestamp()
            });

            await updateDoc(doc(db, "chats", currentChatId), {
                lastMessage: text,
                updatedAt: serverTimestamp()
            });
            
            trimPrivateMessages(currentChatId);
            await processAttachedBots(text);
        } catch (e) {
            alert("傳送失敗: " + e.message);
        } finally {
            input.disabled = false;
            input.focus();
        }
    };

    // 傳送檔案
    window.sendFile = (inputElem) => {
        if (!currentChatId || !inputElem.files || inputElem.files.length === 0) return;
        const file = inputElem.files[0];
        if (!file.name.endsWith('.xml')) {
            alert("目前僅支援分享 .xml 積木專案檔喔！");
            inputElem.value = "";
            return;
        }
        
        const reader = new FileReader();
        reader.onload = async (e) => {
            const content = e.target.result;
            try {
                await addDoc(collection(db, "chats", currentChatId, "messages"), {
                    senderId: currentUser.uid,
                    senderEmail: currentUser.email,
                    text: `傳送了檔案：${file.name}`,
                    type: "file",
                    fileName: file.name,
                    fileData: content,
                    createdAt: serverTimestamp()
                });
                await updateDoc(doc(db, "chats", currentChatId), {
                    lastMessage: "📁 傳送了檔案",
                    updatedAt: serverTimestamp()
                });
                
                trimPrivateMessages(currentChatId);
            } catch(err) {
                alert("檔案傳送失敗：" + err.message);
            }
            inputElem.value = ""; // 重置 input
        };
        reader.readAsText(file);
    };

    // 下載檔案
    window.downloadXml = (msgId) => {
        const msg = window.currentMessages[msgId];
        if(!msg || !msg.fileData) return;
        const blob = new Blob([msg.fileData], {type: "text/xml"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = msg.fileName;
        a.click();
        URL.revokeObjectURL(url);
    };

    // 檢查群組數量限制 (最多 20 個)
    async function checkGroupLimit() {
        const q = query(collection(db, "chats"), where("participants", "array-contains", currentUser.uid));
        const snap = await getDocs(q);
        let count = 0;
        snap.forEach(doc => {
            const data = doc.data();
            if (data.type === 'group' || data.type === 'server') count++;
        });
        return count;
    }

    // 5. Modal 控制邏輯
    window.openModal = (mode) => {
        modalMode = mode;
        const modal = document.getElementById('modal');
        const title = document.getElementById('modal-title');
        const input = document.getElementById('modal-input');
        
        if (mode === 'private') {
            title.innerText = '發起私訊';
            input.placeholder = '請輸入對方的註冊 Email';
        } else if (mode === 'group') {
            title.innerText = '建立群聊';
            input.placeholder = '請為群組取個名稱';
        } else if (mode === 'server') {
            title.innerText = '建立伺服器';
            input.placeholder = '請為伺服器取個名稱';
        } else if (mode === 'joinServer') {
            title.innerText = '加入伺服器';
            input.placeholder = '請輸入 6 碼伺服器代碼';
        } else if (mode === 'invite') {
            title.innerText = '邀請成員加入';
            input.placeholder = '請輸入要邀請的 Email';
        } else if (mode === 'connectBot') {
            title.innerText = '連接 Discord Bot';
            input.placeholder = '貼上 Bot Token（doratch-…）';
        }
        
        input.value = '';
        modal.style.display = 'flex';
        input.focus();
    };

    window.closeModal = () => document.getElementById('modal').style.display = 'none';

    window.submitModal = async () => {
        const inputVal = document.getElementById('modal-input').value.trim();
        if (!inputVal) return;
        
        const btn = document.getElementById('modal-submit');
        btn.disabled = true;
        btn.innerText = "請稍候...";

        try {
            if (modalMode === 'group' || modalMode === 'server') {
                const groupCount = await checkGroupLimit();
                if (groupCount >= 20) {
                    alert("您最多只能加入 20 個群組或伺服器！");
                    closeModal();
                    return;
                }
            }

            if (modalMode === 'private') {
                const targetEmail = inputVal.toLowerCase();
                const currentEmail = currentUser.email || "";
                if (targetEmail === currentEmail.toLowerCase() && currentEmail !== "") {
                    alert("不能跟自己發私訊喔！");
                    throw new Error("Self chat");
                }

                // 透過 Email 尋找使用者 UID
                const userQuery = query(collection(db, "users"), where("email", "==", targetEmail));
                const userSnap = await getDocs(userQuery);
                
                if (userSnap.empty) {
                    alert("找不到此 Email 的聯絡人！對方可能尚未登入過聊天室。");
                    throw new Error("User not found");
                }
                const targetUid = userSnap.docs[0].id;

                // 檢查是否已有現存對話
                const chatQuery = query(collection(db, "chats"), 
                    where("participants", "array-contains", currentUser.uid)
                );
                const chatSnap = await getDocs(chatQuery);
                let existingChatId = null;
                chatSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.type === 'private' && data.participants.includes(targetUid)) {
                        existingChatId = docSnap.id;
                    }
                });

                if (existingChatId) {
                    openChat(existingChatId, targetEmail.split('@')[0], '👤', 'private', null);
                } else {
                    const newChat = await addDoc(collection(db, "chats"), {
                        type: 'private',
                        participants: [currentUser.uid, targetUid],
                        participantEmails: [currentUser.email, targetEmail],
                        name: '',
                        lastMessage: '新對話',
                        updatedAt: serverTimestamp()
                    });
                    openChat(newChat.id, targetEmail.split('@')[0], '👤', 'private', null);
                }
                
            } else if (modalMode === 'group' || modalMode === 'server') {
                let chatId;
                if (modalMode === 'server') {
                    chatId = "S" + Math.random().toString(36).substr(2, 5).toUpperCase();
                    await setDoc(doc(db, "chats", chatId), {
                        type: 'server',
                        participants: [currentUser.uid],
                        teacherId: currentUser.uid,
                        name: inputVal,
                        lastMessage: '伺服器已建立',
                        updatedAt: serverTimestamp()
                    });
                } else {
                    const newChat = await addDoc(collection(db, "chats"), {
                        type: 'group',
                        participants: [currentUser.uid],
                        teacherId: currentUser.uid,
                        name: inputVal,
                        lastMessage: '群組已建立',
                        updatedAt: serverTimestamp()
                    });
                    chatId = newChat.id;
                }
                openChat(chatId, inputVal, modalMode === 'server' ? '🏫' : '👥', modalMode, currentUser.uid);
            } else if (modalMode === 'joinServer') {
                const code = inputVal.toUpperCase();
                const chatRef = doc(db, "chats", code);
                const chatSnap = await getDoc(chatRef);
                
                if (chatSnap.exists() && chatSnap.data().type === 'server') {
                    const groupCount = await checkGroupLimit();
                    if (groupCount >= 20) {
                        alert("加入失敗：您最多只能加入 20 個群組或伺服器！");
                        closeModal();
                        return;
                    }
                    await updateDoc(chatRef, {
                        participants: arrayUnion(currentUser.uid)
                    });
                    alert("成功加入伺服器！");
                    openChat(code, chatSnap.data().name, '🏫', 'server', chatSnap.data().teacherId);
                } else {
                    alert("查無此伺服器代碼，或是該代碼非伺服器！");
                }
            } else if (modalMode === 'invite') {
                const targetEmail = inputVal.toLowerCase();
                const userQuery = query(collection(db, "users"), where("email", "==", targetEmail));
                const userSnap = await getDocs(userQuery);
                
                if (userSnap.empty) {
                    alert("找不到此 Email 的聯絡人！");
                    throw new Error("User not found");
                }
                const targetUid = userSnap.docs[0].id;
                
                await updateDoc(doc(db, "chats", currentChatId), {
                    pendingInvites: arrayUnion(targetUid)
                });
                alert("邀請已送出！需等待對方確認後才會加入。");
            } else if (modalMode === 'connectBot') {
                const token = inputVal.trim();
                if (!window.DiscordBotEngine || !window.DiscordBotEngine.isValidTokenFormat(token)) {
                    alert("Token 格式不正確（需以 doratch- 開頭）");
                    throw new Error("Invalid token");
                }
                const tokenSnap = await getDoc(doc(db, "botTokens", token));
                if (!tokenSnap.exists()) {
                    alert("找不到此 Token，請確認 Bot 已在 Python 創作空間部署。");
                    throw new Error("Token not found");
                }
                const meta = tokenSnap.data();
                if (!meta.active) {
                    alert("此 Bot 尚未部署或已停用，請先在創作空間按「部署到交流大廳」。");
                    throw new Error("Bot inactive");
                }
                const exists = currentChatAttachedBots.some(function (b) { return b.token === token; });
                if (exists) {
                    alert("此 Bot 已連接在此聊天室。");
                    throw new Error("Already connected");
                }
                const botEntry = {
                    token: token,
                    ownerId: meta.ownerId,
                    botId: meta.botId,
                    name: meta.name || "Bot"
                };
                await updateDoc(doc(db, "chats", currentChatId), {
                    attachedBots: arrayUnion(botEntry),
                    updatedAt: serverTimestamp()
                });
                alert("🤖 已連接 Bot「" + botEntry.name + "」！成員輸入 ! 或 / 指令即可觸發。");
                await refreshChatBotsMeta();
            }
            closeModal();
        } catch (e) {
            console.error(e);
            if (e && e.message !== "User not found" && e.message !== "Self chat" &&
                e.message !== "Invalid token" && e.message !== "Token not found" &&
                e.message !== "Bot inactive" && e.message !== "Already connected") {
                alert("操作失敗，請檢查資料庫權限或網路連線！\n" + e.message);
            }
        } finally {
            btn.disabled = false;
            btn.innerText = "確認";
        }
    };
</script>

</body>
