    function renderChatSidebarLists(snapshot) {
        const listHost = document.getElementById("chat-list");
        const listServer = document.getElementById("list-server");
        const listGroup = document.getElementById("list-group");
        const listPrivate = document.getElementById("list-private");
        const msgReqList = document.getElementById("list-message-requests");
        const msgReqCategory = document.getElementById("category-message-requests");
        if (!listServer || !listGroup || !listPrivate) return;

        const scrollTop = listHost ? listHost.scrollTop : 0;
        const anchorId = currentChatId;
        let anchorViewportOffset = null;
        if (anchorId && listHost) {
            const anchorEl = listHost.querySelector('.chat-item[data-chat-id="' + anchorId + '"]');
            anchorViewportOffset = getListViewportOffset(listHost, anchorEl);
        }

        if (snapshot.empty) {
            replaceListChildren(listServer, []);
            replaceListChildren(listGroup, []);
            const empty = document.createElement("div");
            empty.style.cssText = "padding:20px;text-align:center;color:#949ba4;font-size:13px;";
            empty.textContent = "目前還沒有對話紀錄";
            replaceListChildren(listPrivate, [empty]);
            if (msgReqList) replaceListChildren(msgReqList, []);
            if (msgReqCategory) msgReqCategory.style.display = "none";
            restoreListScrollAnchor(listHost, anchorId, anchorViewportOffset, scrollTop);
            return;
        }

        const chats = [];
        snapshot.forEach(function (docSnap) {
            const data = docSnap.data();
            cacheChatDoc(docSnap.id, data);
            chats.push({ id: docSnap.id, ...data });
        });
        sortChatsForSidebar(chats);

        const serverNodes = [];
        const groupNodes = [];
        const privateNodes = [];
        const msgReqNodes = [];
        let incomingReqCount = 0;

        chats.forEach(function (chat) {
            const built = buildChatListItem(chat);
            if (built.isIncomingReq) {
                incomingReqCount += 1;
                if (msgReqList) msgReqNodes.push(buildIncomingRequestItem(chat, built.rawName, built.icon, built.unreadHtml));
            }
            if (chat.type === "server") {
                serverNodes.push(built.item);
            } else if (chat.type === "private") {
                if (!built.isIncomingReq) privateNodes.push(built.item);
            } else {
                groupNodes.push(built.item);
            }
        });

        applySidebarListNodes(listServer, serverNodes);
        applySidebarListNodes(listGroup, groupNodes);
        applySidebarListNodes(listPrivate, privateNodes);
        if (msgReqList) applySidebarListNodes(msgReqList, msgReqNodes);
        if (msgReqCategory) msgReqCategory.style.display = incomingReqCount ? "block" : "none";
        sidebarPrivatePeerUids = chats
            .filter(function (c) {
                return c.type === "private" && c.requestStatus !== "pending" && c.requestTo !== currentUser.uid;
            })
            .map(function (c) {
                return (c.participants || []).find(function (uid) { return uid && uid !== currentUser.uid; });
            })
            .filter(Boolean);
        syncPresenceWatchers();
        prefetchSidebarPrivateAvatars();
        if (chatPrefs.notifyMessageRequest && incomingMessageRequestCount >= 0 && incomingReqCount > incomingMessageRequestCount) {
            maybeDesktopNotify("Doratch 訊息請求", "你收到新的訊息請求");
        }
        incomingMessageRequestCount = incomingReqCount;

        restoreListScrollAnchor(listHost, anchorId, anchorViewportOffset, scrollTop);
        markActiveChatItem(currentChatId);
        refreshChatListDraftIndicators();

    function scheduleChatListRender(snapshot) {
        pendingChatListSnapshot = snapshot;
        if (chatListRenderTimer) return;
        chatListRenderTimer = setTimeout(function () {
            chatListRenderTimer = null;
            if (pendingChatListSnapshot) {
                renderChatSidebarLists(pendingChatListSnapshot);
                pendingChatListSnapshot = null;
            }
        }, 60);
    }

    function loadChats() {
        if (unsubscribeChats) unsubscribeChats();
        if (unsubscribeInvites) unsubscribeInvites();

        const q = query(
            collection(db, "chats"),
            where("participants", "array-contains", currentUser.uid)
        );

        unsubscribeChats = onSnapshot(q, function (snapshot) {
            scheduleChatListRender(snapshot);
        });

        // 監聽待審批邀請
        const qInvites = query(
            collection(db, "chats"),
            where("pendingInvites", "array-contains", currentUser.uid)
        );

        unsubscribeInvites = onSnapshot(qInvites, function (snapshot) {
            const listDiv = document.getElementById('list-invites');
            const categoryDiv = document.getElementById('category-invite');
            const listHost = document.getElementById('chat-list');
            const scrollTop = listHost ? listHost.scrollTop : 0;
            if (!listDiv || !categoryDiv) return;

            if (snapshot.empty) {
                replaceListChildren(listDiv, []);
                categoryDiv.style.display = 'none';
                restoreListScrollAnchor(listHost, null, null, scrollTop);
                return;
            }
            categoryDiv.style.display = 'block';

            const nodes = [];
            snapshot.forEach(function (docSnap) {
                const chat = { id: docSnap.id, ...docSnap.data() };
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.style.borderLeft = '3px solid #f47f24';
                item.innerHTML =
                    '<div style="display:flex; flex-direction:column; gap:8px;">' +
                    '<div style="font-size:13px; font-weight:bold;">💌 邀請：' + escHtml(chat.name || "群組") + '</div>' +
                    '<div style="display:flex; gap:10px;">' +
                    '<button style="flex:1; background:#4CAF50; color:white; border:none; padding:4px; border-radius:4px; cursor:pointer; font-weight:bold;" onclick="handleInvite(\'' + chat.id + "', true)\">接受</button>" +
                    '<button style="flex:1; background:#FF4D4D; color:white; border:none; padding:4px; border-radius:4px; cursor:pointer; font-weight:bold;" onclick="handleInvite(\'' + chat.id + "', false)\">拒絕</button>" +
                    "</div></div>";
                nodes.push(item);
            });
            replaceListChildren(listDiv, nodes);
            restoreListScrollAnchor(listHost, null, null, scrollTop);
        });
    }

    // 處理邀請接受/拒絕
    window.handleInvite = async (chatId, isAccept) => {
        try {
            const ref = doc(db, "chats", chatId);
            if (isAccept) {
                const groupCount = await checkGroupLimit();
                if (groupCount >= 20) {
                    alert("接受失敗：您最多只能加入 20 個群組或伺服器！");
                    return;
                }
                await updateDoc(ref, {
                    pendingInvites: arrayRemove(currentUser.uid),
                    participants: arrayUnion(currentUser.uid)
                });
                alert("已成功加入！");
            } else {
                if(!confirm("確定要拒絕此邀請嗎？")) return;
                await updateDoc(ref, {
                    pendingInvites: arrayRemove(currentUser.uid)
                });
            }
        } catch (e) {
            alert("處理失敗：" + e.message);
        }
    };

    let currentChatTeacherId = null;
    let currentChatType = null;
    let currentChatName = "";
    let currentChatIcon = "💬";

    function buildMessagesHtmlFromDocs(docSnaps, pendingMsgStore, chatId) {
        let html = "";
        let ctx = { lastSenderId: null, lastTimeStr: null, unreadDividerShown: false };
        const store = pendingMsgStore || {};
        docSnaps.forEach(function (docSnap) {
            window.currentMessages[docSnap.id] = docSnap.data();
            const built = buildMessageRowHtml(docSnap, ctx);
            html += built.html;
            ctx = built.ctx;
        });
        Object.assign(window.currentMessages, store);
        const merged = appendPendingOptimisticToRender(html, ctx, chatId);
        return merged.html;
    }

    function renderMessagesFullReplace(msgArea, snapshot, chatId, stickToBottom, prevScrollHeight) {
        const pendingMsgStore = {};
        pendingOutboundMessages.forEach(function (p) {
            if (p.chatId === chatId && window.currentMessages[p.optId]) {
                pendingMsgStore[p.optId] = window.currentMessages[p.optId];
            }
        });
        const docs = snapshot.docs.slice();
        window.currentMessages = {};

        if (docs.length <= MSG_FULL_RENDER_CHUNK) {
            msgArea.innerHTML = buildMessagesHtmlFromDocs(docs, pendingMsgStore, chatId);
            msgArea.dataset.messagesReady = "1";
            finishMessagesScroll(msgArea, stickToBottom, prevScrollHeight);
            return;
        }

        let idx = 0;
        let ctx = { lastSenderId: null, lastTimeStr: null };
        let html = "";
        msgArea.innerHTML = '<div class="messages-loading">載入 ' + docs.length + ' 則訊息…</div>';

        function step() {
            if (currentChatId !== chatId) return;
            const end = Math.min(idx + MSG_FULL_RENDER_CHUNK, docs.length);
            for (; idx < end; idx += 1) {
                window.currentMessages[docs[idx].id] = docs[idx].data();
                const built = buildMessageRowHtml(docs[idx], ctx);
                html += built.html;
                ctx = built.ctx;
            }
            if (idx < docs.length) {
                requestAnimationFrame(step);
                return;
            }
            Object.assign(window.currentMessages, pendingMsgStore);
            const merged = appendPendingOptimisticToRender(html, ctx, chatId);
            msgArea.innerHTML = merged.html;
            msgArea.dataset.messagesReady = "1";
            finishMessagesScroll(msgArea, stickToBottom, prevScrollHeight);
        }
        requestAnimationFrame(step);
    }

    function getMessagesRenderContext(msgArea) {
        const rows = msgArea.querySelectorAll(".message-row[data-msg-id]");
        if (!rows.length) return { lastSenderId: null, lastTimeStr: null, unreadDividerShown: !!msgArea.querySelector(".chat-unread-divider") };
        const last = rows[rows.length - 1];
        return {
            lastSenderId: last.getAttribute("data-sender-id") || null,
            lastTimeStr: last.getAttribute("data-time-full") || null,
            unreadDividerShown: !!msgArea.querySelector(".chat-unread-divider")
        };
    }

    function finishMessagesScroll(msgArea, stickToBottom, prevScrollHeight) {
        if (stickToBottom) {
            msgArea.scrollTop = msgArea.scrollHeight;
            hideNewMessagesPill();
        } else if (msgArea.scrollHeight > prevScrollHeight) {
            showNewMessagesPill();
        }
    }

    function createOptimisticMessageId() {
        return "opt_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
    }

    function trackPendingOutbound(optId, chatId, meta) {
        const m = meta || {};
        pendingOutboundMessages.push({
            optId: optId,
            chatId: chatId,
            type: m.type || "text",
            text: String(m.text || "").trim(),
            fileName: String(m.fileName || "").trim(),
            ts: Date.now()
        });
        if (pendingOutboundMessages.length > 16) pendingOutboundMessages.shift();
    }

    function consumeOptimisticForIncoming(msgData, chatId) {
        if (!msgData || msgData.senderId !== currentUser.uid) return null;
        const msgType = String(msgData.type || "text");
        const idx = pendingOutboundMessages.findIndex(function (p) {
            if (p.chatId !== chatId || (Date.now() - p.ts) >= 45000) return false;
            if (msgType === "file" && p.type === "file") {
                return p.fileName && p.fileName === String(msgData.fileName || "").trim();
            }
            if (msgType === "text" && p.type !== "file") {
                return p.text === String(msgData.text || "").trim();
            }
            return false;
        });
        if (idx < 0) return null;
        return pendingOutboundMessages.splice(idx, 1)[0].optId;
    }

    function unpendingOutbound(optId) {
        for (let i = pendingOutboundMessages.length - 1; i >= 0; i -= 1) {
            if (pendingOutboundMessages[i].optId === optId) pendingOutboundMessages.splice(i, 1);
        }
    }

    function confirmOptimisticMessageRow(optId, docSnap) {
        const msgArea = document.getElementById("messages-area");
        if (!msgArea || !optId || !docSnap) return false;
        const row = msgArea.querySelector('.message-row[data-msg-id="' + optId + '"]');
        if (!row) return false;
        const prevRow = row.previousElementSibling;
        let ctx = { lastSenderId: null, lastTimeStr: null };
        if (prevRow && prevRow.classList && prevRow.classList.contains("message-row")) {
            ctx = {
                lastSenderId: prevRow.getAttribute("data-sender-id"),
                lastTimeStr: prevRow.getAttribute("data-time-full")
            };
        }
        unpendingOutbound(optId);
        delete window.currentMessages[optId];
        window.currentMessages[docSnap.id] = docSnap.data();
        const built = buildMessageRowHtml(docSnap, ctx);
        row.outerHTML = built.html;
        return true;
    }

    function patchMessageRowInPlace(docSnap) {
        const msg = docSnap.data();
        const row = document.querySelector('.message-row[data-msg-id="' + docSnap.id + '"]');
        if (!row || !msg) return;
        if (msg.type === "text") {
            const textEl = row.querySelector(".msg-text");
            if (textEl) textEl.innerHTML = formatMentionTextHtml(msg.text, msg.mentions, currentUser ? currentUser.uid : "");
        } else if (msg.type === "gift") {
            const card = row.querySelector(".msg-gift-card");
            if (card) card.outerHTML = renderGiftMessageCard(docSnap.id, msg);
        }
        const fullTimeStr = formatMsgFullTime(msg.createdAt ? msg.createdAt.toDate() : new Date());
        const timeHeader = row.querySelector(".msg-header .msg-time");
        if (timeHeader) {
            timeHeader.innerHTML = fullTimeStr + (msg.editedAt ? '<span class="msg-edited">(edited)</span>' : "");
        }
        const hoverTime = row.querySelector(".msg-time-hover");
        if (hoverTime) {
            hoverTime.textContent = formatMsgTime(msg.createdAt ? msg.createdAt.toDate() : new Date()) + (msg.editedAt ? " (edited)" : "");
        }
        row.setAttribute("data-time-full", fullTimeStr);
    }

    function refreshPrivateChatListAvatars() {
        document.querySelectorAll("#list-private .chat-item[data-peer-uid]").forEach(function (el) {
            const uid = el.dataset.peerUid;
            const u = userCache[uid];
            if (!u) return;
            const img = el.querySelector(".chat-peer-avatar-wrap img.member-avatar");
            if (!img) return;
            const email = String(u.email || "").trim();
            const name = email.split("@")[0] || "User";
            img.src = avatarUrlForUserData(u, email || name, "");
        });
    }

    function prefetchSidebarPrivateAvatars() {
        const missing = sidebarPrivatePeerUids.filter(function (uid) { return uid && !userCache[uid]; });
        if (!missing.length) {
            refreshPrivateChatListAvatars();
            return;
        }
        Promise.all(missing.map(function (uid) { return fetchUserByUid(uid); })).finally(function () {
            refreshPrivateChatListAvatars();
        });
    }

    function prefetchUsersForChat() {
        const uids = new Set();
        if (currentPrivatePeerUid) uids.add(currentPrivatePeerUid);
        (currentChatParticipants || []).forEach(function (uid) {
            if (uid && uid !== currentUser.uid) uids.add(uid);
        });
        const missing = Array.from(uids).filter(function (uid) { return !userCache[uid]; });
        if (!missing.length) return;
        Promise.all(missing.map(function (uid) { return fetchUserByUid(uid); })).catch(function () {});
    }

        if (!optId) return;

        if (!msgArea) return;
        const row = msgArea.querySelector('.message-row[data-msg-id="' + optId + '"]');

        delete window.currentMessages[optId];
        for (let i = pendingOutboundMessages.length - 1; i >= 0; i -= 1) {
            if (pendingOutboundMessages[i].optId === optId) pendingOutboundMessages.splice(i, 1);

    function scheduleTypingIndicator(typingUsersMap) {
        pendingTypingMap = typingUsersMap;

        typingRenderTimer = setTimeout(function () {
            typingRenderTimer = null;
            renderTypingIndicator(pendingTypingMap);
        }, 120);
    }

    async function renderTypingIndicator(typingUsersMap) {
        const el = document.getElementById("typing-indicator");
        if (!el || !currentChatId) return;
        const map = typingUsersMap || {};
        const now = Date.now();
        const activeUids = Object.keys(map).filter((uid) => {
            if (uid === currentUser.uid) return false;
            const ms = toMillis(map[uid]);
            return ms && (now - ms) < 8000;
        });
        if (!activeUids.length) {
            el.textContent = "";
            return;
        }
        const names = [];
        for (const uid of activeUids.slice(0, 2)) {
            const u = userCache[uid];
            if (u) names.push(displayNameFromUser(u));
            else fetchUserByUid(uid).then(function (u2) { if (u2) renderTypingIndicator(map); });
        }
        if (!names.length) {
            el.textContent = "有人正在輸入...";
            return;
        }
        el.textContent = names.join("、") + (activeUids.length > 2 ? " 等人" : "") + " 正在輸入...";
    }

            lastTypingSentAt = now;
            updateDoc(doc(db, "chats", currentChatId), {
                [`typingUsers.${currentUser.uid}`]: serverTimestamp()
            }).catch(function () {});

                msgArea.insertAdjacentHTML("beforeend", built.html);

            finishMessagesScroll(msgArea, stickToBottom, prevScrollHeight);

            setReplyBar();
            return;

    function buildProfilePanelHtmlFromUser(userData, opts) {
        opts = opts || {};

        const isBot = !!opts.isBot;

        const c = cosmeticSnapshotForUser(userData);
        const displayName = isBot ? (opts.botName || "Bot") : displayNameFromUser(userData);
        const email = userData.email || "";
        const handle = isBot ? "bot" : popHandleFromEmail(email);

        const resolvedBanner = resolveCosmeticForDisplay(userData, "banner", c.banner);
        const resolvedProfileFx = resolveCosmeticForDisplay(userData, "profileEffect", c.profileEffect);
        const resolvedNameFx = resolveCosmeticForDisplay(userData, "nameEffect", c.nameEffect);
        if (resolvedBanner) c.banner = resolvedBanner;
        if (resolvedProfileFx) c.profileEffect = resolvedProfileFx;
        if (resolvedNameFx) c.nameEffect = resolvedNameFx;
        if (c.nameColor) c.nameColor = resolveCosmeticForDisplay(userData, "nameColor", c.nameColor) || c.nameColor;

        const profileFxCls = c.profileEffect ? profileEffectClass(c.profileEffect) : "";
        const bannerVisualCls = profileFxCls || bannerClass(c.banner || "");
        const nameFxCls = c.nameEffect ? nameEffectClass(c.nameEffect) : (c.nameEffectClass || "");
        const nameFontCls = c.nameFontClass ? (" " + c.nameFontClass) : "";
        const nameColorAttr = c.nameColor && !GRADIENT_NAME_EFFECTS.has(nameFxCls)
            ? ` style="color:${escHtml(c.nameColor)}"`
            : "";

        const customStatus = String(userData.customStatus || c.customStatus || "").trim();
        const profileBio = String(userData.profileBio || c.profileBio || "").trim();

    async function loadPrivateProfileSidebar() {
        const listDiv = document.getElementById('member-list');
        const headerText = document.getElementById("member-sidebar-header-text");
        if (!listDiv) return;
        syncMemberSidebarProfileMode(true);
        if (headerText) headerText.textContent = "個人檔案";
        if (!currentChatId || !currentUser) {
            listDiv.innerHTML = '<div class="member-empty-hint">尚未開啟私訊</div>';
            return;
        }
        listDiv.innerHTML = '<div class="member-empty-hint">載入對方個人檔案中…</div>';
        try {
            const chatData = currentChatDocData || {};
            const participants = Array.isArray(chatData.participants) ? chatData.participants : currentChatParticipants;
            const otherUid = (participants || []).find((uid) => uid && uid !== currentUser.uid);
            if (!otherUid) {
                currentPrivatePeerUid = "";
                currentPrivatePeerData = null;
                listDiv.innerHTML = '<div class="member-empty-hint">找不到對方帳號資料</div>';
                return;
            }
            const otherUser = await fetchUserByUid(otherUid);
            if (!otherUser) {
                currentPrivatePeerUid = "";
                currentPrivatePeerData = null;
                listDiv.innerHTML = '<div class="member-empty-hint">找不到對方帳號資料</div>';
                return;
            }
            currentPrivatePeerUid = otherUid;
            currentPrivatePeerData = otherUser;
            syncPresenceWatchers();
            const built = buildProfilePanelHtmlFromUser(otherUser, { uid: otherUid, context: "sidebar" });
            listDiv.innerHTML = built.html;
        } catch (e) {
            console.error("載入私訊個人檔案失敗", e);
            listDiv.innerHTML = '<div class="member-empty-hint" style="color:#fca5a5;">載入失敗</div>';
        }
    }

    window.loadMembers = async () => {
        if (!currentChatId) return;
        const listDiv = document.getElementById('member-list');
        if (!listDiv) return;
        listDiv.innerHTML = '<div class="member-empty-hint">載入成員中…</div>';

        if (currentChatType === "private") {
            await loadPrivateProfileSidebar();
            return;
        }

        syncMemberSidebarProfileMode(false);

        const headerText = document.getElementById("member-sidebar-header-text");
        if (headerText) headerText.textContent = "成員";

        try {
            const memberResults = await Promise.all(currentChatParticipants.map(function (uid) {
                return getDoc(doc(db, "users", uid)).then(function (userSnap) {
                    if (!userSnap.exists()) return null;
                    return upsertUserCache(uid, userSnap.data()) || { uid: uid, ...userSnap.data() };
                });
            }));
            const members = memberResults.filter(Boolean);

            members.sort((a, b) => {
                if (a.uid === currentChatTeacherId) return -1;
                if (b.uid === currentChatTeacherId) return 1;
                const aOnline = isOnlineUser(a);
                const bOnline = isOnlineUser(b);
                if (aOnline !== bOnline) return aOnline ? -1 : 1;
                return ((a.email || "").split("@")[0]).localeCompare((b.email || "").split("@")[0]);
            });

            if (window.ChatDiscordUI) {
                window.ChatDiscordUI.renderMemberList(listDiv, {
                    members: members,
                    botsMeta: currentChatBotsMeta,
                    teacherId: currentChatTeacherId,
                    currentUid: currentUser.uid,
                    isOnlineUser: isOnlineUser,
                    onKick: window.kickMember,
                    onDisconnectBot: window.disconnectBot,
                    onUseSlash: (name) => {
                        window.ChatDiscordUI.pickSlashByName(name);
                        const input = document.getElementById('msg-input');
                        if (input) input.focus();
                    }
                });
            }
            syncPresenceWatchers();
            refreshMemberListPresence();
        } catch (e) {
            console.error("載入成員失敗:", e);
            listDiv.innerHTML = '<div class="member-empty-hint" style="color:#fca5a5;">載入失敗</div>';
        }
    };

    window.kickMember = async (uid, name) => {
        if (!confirm(`確定要將成員「${name}」踢出聊天室嗎？`)) return;
        try {
            await updateDoc(doc(db, "chats", currentChatId), {
                participants: arrayRemove(uid)
            });
            alert(`已將 ${name} 踢出`);
        } catch (e) {
            alert("踢出失敗：" + e.message);
        }
    };

    // 聊天室訊息上限清理（預設 300，可在 admin 設定）
    async function trimChatMessages(chatId) {
        if (!chatId) return;
        const limit = effectiveChatMessageLimit(currentChatDocData);
        try {
            const msgsQuery = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
            const msgsSnap = await getDocs(msgsQuery);
            if (msgsSnap.size > limit) {
                const deleteCount = msgsSnap.size - limit;
                const toDelete = msgsSnap.docs.slice(0, deleteCount);
                await Promise.all(toDelete.map(function (d) { return deleteDoc(d.ref); }));
            }
        } catch (e) {
            console.error("清理舊訊息失敗:", e);
        }
    }

    async function loadBotCode(ownerId, botId) {
        const botSnap = await getDoc(doc(db, "users", ownerId, "discordBots", botId));
        if (!botSnap.exists()) return null;
        return botSnap.data();
    }

    function setReplyBar() {

        if (!replyToMessage) {
            bar.style.display = "none";
            text.textContent = "";

        }
        const sender = replyToMessage.senderName || "使用者";

            ? ("📁 " + (replyToMessage.fileName || "檔案"))
            : (replyToMessage.text || "").slice(0, 90);
        text.textContent = `回覆 ${sender}：${body}`;

    window.replyMessageById = (msgId) => {
        const msg = window.currentMessages && window.currentMessages[msgId];
        if (!msg) return;
        const senderName = msg.senderDisplayName || (msg.senderEmail || "未知").split("@")[0];
        replyToMessage = {
            id: msgId,
            senderName: senderName,
            senderId: msg.senderId || "",
            text: msg.text || "",
            type: msg.type || "text",
            fileName: msg.fileName || ""
        };
        setReplyBar();
        if (isMobileChatShell()) {
            expandChatComposer();
        } else {
            const input = document.getElementById("msg-input");
            if (input) input.focus();
        }

    window.editMessageById = async (msgId) => {
        const msg = window.currentMessages && window.currentMessages[msgId];
        if (!msg || msg.senderId !== currentUser.uid || msg.type !== "text") return;
        const next = prompt("編輯訊息：", msg.text || "");
        if (next == null) return;
        const text = String(next).trim();
        if (!text) return alert("訊息不能是空白");
        const mentions = resolveMentionsFromText(text, getChatMentionCandidates());
        try {
            await updateDoc(doc(db, "chats", currentChatId, "messages", msgId), {
                text: text,
                mentions: mentions,
                editedAt: serverTimestamp()
            });
            await updateDoc(doc(db, "chats", currentChatId), {
                lastMessage: text,
                updatedAt: serverTimestamp(),
                lastSenderId: currentUser.uid
            });
        } catch (e) {
            alert("編輯失敗：" + (e.message || e));
        }
    };

    window.deleteMessageById = async (msgId) => {
        const msg = window.currentMessages && window.currentMessages[msgId];
        if (!msg || msg.senderId !== currentUser.uid) return;
        if (msg.type === "gift") return alert("禮物訊息無法刪除，請等對方領取。");
        if (!confirm("確定刪除此訊息？")) return;
        try {
            await deleteDoc(doc(db, "chats", currentChatId, "messages", msgId));
        } catch (e) {
            alert("刪除失敗：" + (e.message || e));
        }
    };

    window.openMessageMenu = (ev, msgId) => {
        ev.preventDefault();
        hideProfilePop();
        const menu = document.getElementById("message-menu");
        if (!menu) return;
        const msg = window.currentMessages && window.currentMessages[msgId];
        if (!msg) return;
        const mine = msg.senderId === currentUser.uid;
        let html = `<button onclick="replyMessageById('${msgId}');hideMessageMenu()">↩ 回覆</button>`;
        if (mine && msg.type === "text") html += `<button onclick="editMessageById('${msgId}');hideMessageMenu()">✏️ 編輯</button>`;
        if (mine && msg.type !== "gift") html += `<button class="danger" onclick="deleteMessageById('${msgId}');hideMessageMenu()">🗑️ 刪除</button>`;
        menu.innerHTML = html;
        menu.style.left = Math.min(ev.clientX, window.innerWidth - 190) + "px";
        menu.style.top = Math.min(ev.clientY, window.innerHeight - 160) + "px";
        menu.style.display = "block";
    };

    function formatPopMemberSince(data) {
        const ts = data && (data.createdAt || data.created_at);
        if (!ts) return "";
        try {
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            if (isNaN(d.getTime())) return "";
            return "加入 Doratch：" + d.toLocaleDateString("zh-TW", { year: "numeric", month: "long", day: "numeric" });
        } catch (_) {
            return "";
        }
    }

    function popHandleFromEmail(email) {
        const em = String(email || "").trim();
        if (!em.includes("@")) return em ? ("@" + em) : "";
        return "@" + em.split("@")[0];
    }

            rolePills.push(`<span class="profile-pop-role-pill${leg ? " legend" : ""}${staffLeg ? " staff-legendary" : ""}${docoinTitle ? " docoin-title-lux" : ""}">🏷️ ${escHtml(c.title)}</span>`);
        }
        if (isBot) rolePills.push('<span class="profile-pop-role-pill">🤖 BOT</span>');
        else if (msg.senderId === currentUser.uid) rolePills.push('<span class="profile-pop-role-pill">你</span>');
        let badgeShelf = [];
        let senderData = null;
        if (!isBot && msg.senderId) {

                    senderData = await fetchUserByUid(msg.senderId);

    function findBotCommandBody(code, commandName, isSlash) {
        const lines = String(code || "").replace(/\r/g, "").split("\n");
        const target = String(commandName || "").trim().toLowerCase();
        if (!target) return { matched: false, body: "" };

        for (let i = 0; i < lines.length; i++) {
            const line = (lines[i] || "").trim();
            const hit = isSlash ? /\.tree\.command\b/.test(line) : (/\.command\b/.test(line) && !/\.tree\.command\b/.test(line));
            if (!hit) continue;

            let deco = line;
            for (let d = i + 1; d < Math.min(i + 4, lines.length) && deco.indexOf(")") === -1; d++) {
                deco += " " + (lines[d] || "").trim();
            }

            let defLine = -1;
            let funcName = "";
            for (let j = i + 1; j < Math.min(i + 14, lines.length); j++) {
                const m = (lines[j] || "").match(/^\s*(?:async\s+)?def\s+(\w+)\s*\(/);
                if (m) {
                    defLine = j;
                    funcName = m[1];
                    break;
                }
            }
            if (defLine === -1) continue;

            const named = (deco.match(/name\s*=\s*['"]([^'"]+)['"]/) || [])[1];
            const cmdName = String(named || funcName || "").toLowerCase();
            if (cmdName !== target) continue;

            const defIndent = (lines[defLine].match(/^\s*/) || [""])[0].length;
            const bodyLines = [];
            for (let k = defLine + 1; k < lines.length; k++) {
                const raw = lines[k] || "";
                const trim = raw.trim();
                if (!trim) {
                    bodyLines.push(raw);
                    continue;
                }
                const indent = (raw.match(/^\s*/) || [""])[0].length;
                if (indent <= defIndent) break;
                bodyLines.push(raw);
            }
            return { matched: true, body: bodyLines.join("\n") };
        }
        return { matched: false, body: "" };
    }

    function extractLiteralReplyFromBody(body) {
        const text = String(body || "");
        const patterns = [
            /await\s+ctx\.(?:send|reply)\s*\(([^)]*)\)/m,
            /await\s+interaction\.response\.send_message\s*\(([^)]*)\)/m,
            /await\s+interaction\.followup\.send\s*\(([^)]*)\)/m
        ];
        for (const re of patterns) {
            const mm = text.match(re);
            if (!mm || !mm[1]) continue;
            const arg = mm[1];
            const qm = arg.match(/['"]([^'"]+)['"]/);
            if (qm && qm[1]) return qm[1];
        }
        return "";
    }

    function buildCodeFallbackResponse(code, commandName, isSlash) {
        const info = findBotCommandBody(code, commandName, isSlash);
        if (!info.matched) return null;
        const literal = extractLiteralReplyFromBody(info.body);
        if (literal) return { content: literal };
        const prefix = isSlash ? "/" : "!";
        return { content: "✅ " + prefix + commandName + " 已執行（此指令未輸出文字）" };
    }

    window.handleChatBotComponent = async (botToken, viewId, customId, values) => {
        if (!currentChatId) return;
        const entry = currentChatAttachedBots.find(b => b.token === botToken);
        if (!entry) return;
        try {
            const botData = await loadBotCode(entry.ownerId, entry.botId);
            if (!botData || !botData.pythonCode) return;
            const sessionKey = botSessionCache[entry.token] || null;
            const r = await window.DiscordBotRuntime.handleInteraction({
                code: botData.pythonCode,
                sessionKey: sessionKey,
                type: "component",
                payload: { viewId, customId, values: values || [] }
            });
            if (r.sessionKey) botSessionCache[entry.token] = r.sessionKey;
            if (r.error || !r.responses || !r.responses.length) return;
            await postBotResponses(entry, botData, r.responses);
        } catch (e) {
            console.warn("Bot 元件回覆失敗:", e);
        }
    };

    async function processAttachedBots(userText) {
        const hasRuntime = !!window.DiscordBotRuntime;
        const hasLegacyEngine = !!window.DiscordBotEngine;
        if (!currentChatAttachedBots.length || (!hasRuntime && !hasLegacyEngine)) return;
        if (!userText || (userText.charAt(0) !== "!" && userText.charAt(0) !== "/")) return;

        const isSlash = userText.charAt(0) === "/";
        const slashParts = isSlash ? userText.slice(1).trim().split(/\s+/).filter(Boolean) : [];
        const slashName = isSlash ? (slashParts[0] || null) : null;
        const slashArgs = isSlash ? slashParts.slice(1) : [];
        const prefixName = !isSlash ? userText.slice(1).split(/\s+/)[0] : null;

        for (const entry of currentChatAttachedBots) {
            try {
                const botData = await loadBotCode(entry.ownerId, entry.botId);
                if (!botData || !botData.pythonCode) continue;

                let responses = [];
                let runtimeError = null;
                const canUseRuntime = hasRuntime && window.DiscordBotRuntime.isDiscordPyCode(botData.pythonCode);
                if (canUseRuntime) {
                    const payload = isSlash ? { name: slashName, args: slashArgs } : userText;
                    const r = await window.DiscordBotRuntime.handleInteraction({
                        code: botData.pythonCode,
                        sessionKey: botSessionCache[entry.token] || null,
                        type: isSlash ? "slash" : "prefix",
                        payload: payload
                    });
                    if (r.sessionKey) botSessionCache[entry.token] = r.sessionKey;
                    if (r.error) {
                        runtimeError = r.error;
                    } else {
                        responses = r.responses || [];
                    }
                }

                // / 指令無回覆時，自動嘗試轉成 ! 指令（很多 Bot 只註冊 prefix）
                if (!responses.length && isSlash && canUseRuntime && slashName) {
                    const altPrefix = "!" + slashName + (slashArgs.length ? (" " + slashArgs.join(" ")) : "");
                    const r2 = await window.DiscordBotRuntime.handleInteraction({
                        code: botData.pythonCode,
                        sessionKey: botSessionCache[entry.token] || null,
                        type: "prefix",
                        payload: altPrefix
                    });
                    if (r2.sessionKey) botSessionCache[entry.token] = r2.sessionKey;
                    if (!r2.error && r2.responses && r2.responses.length) {
                        responses = r2.responses;
                    } else if (r2.error && !runtimeError) {
                        runtimeError = r2.error;
                    }
                }

                // Runtime 沒回覆時，prefix 退回 legacy 模式，避免「無反應」
                if (!responses.length && !isSlash && hasLegacyEngine) {
                    const res = await window.DiscordBotEngine.runBotCode(botData.pythonCode, userText);
                    if (res.error) {
                        if (!runtimeError) runtimeError = res.error;
                    }
                    if (res.responses && res.responses.length) {
                        responses = res.responses;
                    } else if (res.reply) {
                        responses = [{ content: res.reply }];
                    }
                }

                // slash 也允許 legacy fallback（先試原文，再試 !cmd）
                if (!responses.length && isSlash && hasLegacyEngine) {
                    const resSlash = await window.DiscordBotEngine.runBotCode(botData.pythonCode, userText);
                    if (!resSlash.error) {
                        if (resSlash.responses && resSlash.responses.length) {
                            responses = resSlash.responses;
                        } else if (resSlash.reply) {
                            responses = [{ content: resSlash.reply }];
                        }
                    }
                    if (!responses.length && slashName) {
                        const resPrefix = await window.DiscordBotEngine.runBotCode(botData.pythonCode, "!" + slashName);
                        if (!resPrefix.error) {
                            if (resPrefix.responses && resPrefix.responses.length) {
                                responses = resPrefix.responses;
                            } else if (resPrefix.reply) {
                                responses = [{ content: resPrefix.reply }];
                            }
                        }
                    }
                }

                if (!responses.length) {
                    const fallbackCmd = isSlash ? slashName : prefixName;
                    const codeFallback = buildCodeFallbackResponse(botData.pythonCode, fallbackCmd, isSlash);
                    if (codeFallback) {
                        responses = [codeFallback];
                    }
                }

                if (!responses.length) {
                    if (runtimeError) {
                        console.warn("Bot 無回覆:", runtimeError, entry.name || entry.botId || entry.token);
                        await postBotError(entry, "Bot 指令執行失敗：" + runtimeError);
                    } else {
                        await postBotError(entry, "Bot 未匹配指令：" + userText);
                    }
                    continue;
                }

                await postBotResponses(entry, botData, responses);
            } catch (e) {
                console.warn("Bot 回覆失敗:", e);
                await postBotError(entry, "Bot 例外：" + (e && e.message ? e.message : String(e)));
            }
        }
    }

    async function flushOutboundTextMessage(opts) {
        const chatId = opts.chatId;
        const text = opts.text;
        const replyPayload = opts.replyPayload;
        const optId = opts.optId;
        const savedDraft = opts.savedDraft;
        const savedReply = opts.savedReply;
        const input = document.getElementById("msg-input");

        if (currentChatType === "private" && !currentChatDocData) {
            try {
                const chatSnap = await getDoc(doc(db, "chats", chatId));
                currentChatDocData = chatSnap.exists() ? chatSnap.data() : null;
                if (currentChatDocData) cacheChatDoc(chatId, currentChatDocData);
                if (isPrivateSendBlocked()) {
                    if (optId) removeOptimisticMessageRow(optId);
                    if (input) {
                        input.value = savedDraft;
                        autoGrowInput(input);
                    }
                    replyToMessage = savedReply;
                    setReplyBar();
                    patchSidebarPreviewForChat(chatId, "");
                    applyPrivateRequestState(currentChatDocData);
                    alert("此私訊尚未通過訊息請求，暫時無法傳送訊息。");
                    return;
                }
            } catch (e) {
                console.warn("私訊狀態確認失敗", e);
            }
        }

        try {
            const cosmetic = opts.cosmeticSnapshot || currentCosmeticSnapshot();
            const mentionCandidates = getChatMentionCandidates();
            const mentions = resolveMentionsFromText(text, mentionCandidates);
            const messagePayload = {
                senderId: currentUser.uid,
                senderEmail: currentUser.email,
                senderDisplayName: displayNameFromUser(currentUserData),
                senderCosmetics: cosmetic,
                text: text,
                mentions: mentions,
                replyTo: replyPayload,
                type: "text",
                createdAt: serverTimestamp()
            };
            const chatPatch = buildOutboundChatPatch(chatId, text, getChatParticipantsForUnread(chatId));
            await Promise.all([
                addDoc(collection(db, "chats", chatId, "messages"), messagePayload),
                updateDoc(doc(db, "chats", chatId), chatPatch)
            ]);
            cacheChatDoc(chatId, Object.assign({}, chatDocCache[chatId] || {}, {
                lastMessage: text,
                lastSenderId: currentUser.uid
            }));
            void trimChatMessages(chatId);
            processAttachedBots(text).catch(function (e) { console.warn("Bot 處理失敗", e); });
            delete chatDraftStore[chatId];
            scheduleDraftPersist();
            refreshChatListDraftIndicators();
        } catch (e) {
            if (optId) removeOptimisticMessageRow(optId);
            if (input) {
                input.value = savedDraft;
                autoGrowInput(input);
            }
            replyToMessage = savedReply;
            setReplyBar();
            patchSidebarPreviewForChat(chatId, "");
            alert("傳送失敗: " + e.message);
            saveChatDraft(chatId);
        }
    }

    // 4. 傳送文字訊息（樂觀更新：先清空輸入並顯示氣泡，背景寫入 Firestore）
    window.sendMessage = function () {
        if (!currentChatId) return;
        if (isSendingMessage) return;
        const input = document.getElementById('msg-input');
        const rawText = String(input && input.value || "").replace(/\r\n/g, "\n");
        const text = rawText.trim();
        if (!text) return;

        if (isPrivateSendBlocked()) {
            applyPrivateRequestState(currentChatDocData);
            alert("此私訊尚未通過訊息請求，暫時無法傳送訊息。");
            return;
        }

        isSendingMessage = true;
        const replyPayload = replyToMessage ? {
            id: replyToMessage.id,
            senderName: replyToMessage.senderName || "",
            senderId: replyToMessage.senderId || "",
            text: (replyToMessage.text || "").slice(0, 200),
            type: replyToMessage.type || "text",
            fileName: replyToMessage.fileName || ""
        } : null;

        const savedDraft = rawText;
        const savedReply = replyToMessage;
        const chatId = currentChatId;
        if (window.ChatDiscordUI) window.ChatDiscordUI.hidePicker();
        clearMyTypingIndicator();

        if (input) {
            input.value = '';
            autoGrowInput(input);
        }
        delete chatDraftStore[chatId];
        scheduleDraftPersist();
        refreshChatListDraftIndicators();
        replyToMessage = null;
        setReplyBar();

        const cosmeticSnapshot = currentCosmeticSnapshot();
        const optId = appendOptimisticTextMessage(text, replyPayload, cosmeticSnapshot);
        patchSidebarPreviewForChat(chatId, text);
        focusChatInput();

        isSendingMessage = false;

        void flushOutboundTextMessage({
            chatId: chatId,
            text: text,
            replyPayload: replyPayload,
            optId: optId,
            savedDraft: savedDraft,
            savedReply: savedReply,
            cosmeticSnapshot: cosmeticSnapshot
        });
    };

    async function flushOutboundFileMessage(opts) {
        const chatId = opts.chatId;
        const fileName = opts.fileName;
        const content = opts.content;
        const optId = opts.optId;
        const cosmetic = opts.cosmeticSnapshot || currentCosmeticSnapshot();

        try {
            setOptimisticFileProgress(optId, 60, "寫入雲端…");
            await Promise.all([
                addDoc(collection(db, "chats", chatId, "messages"), {
                    senderId: currentUser.uid,
                    senderEmail: currentUser.email,
                    senderDisplayName: displayNameFromUser(currentUserData),
                    senderCosmetics: cosmetic,
                    text: "傳送了檔案：" + fileName,
                    type: "file",
                    fileName: fileName,
                    fileData: content,
                    createdAt: serverTimestamp()
                }),
                updateDoc(doc(db, "chats", chatId), buildOutboundChatPatch(chatId, "📁 傳送了檔案", getChatParticipantsForUnread(chatId)))
            ]);
            setOptimisticFileProgress(optId, 100, "完成");
            patchSidebarPreviewForChat(chatId, "📁 傳送了檔案");
            void trimChatMessages(chatId);
        } catch (err) {
            if (optId) removeOptimisticMessageRow(optId);
            patchSidebarPreviewForChat(chatId, "");
            alert("檔案傳送失敗：" + err.message);
        }
    }

    // 傳送檔案（樂觀更新：先顯示檔案卡，背景上傳）
    window.sendFile = function (inputElem) {
        if (!currentChatId || !inputElem.files || inputElem.files.length === 0) return;
        if (currentChatType === "private") {
            if (isPrivateSendBlocked()) {
                applyPrivateRequestState(currentChatDocData);
                alert("此私訊尚未通過訊息請求，暫時無法傳送檔案。");
                inputElem.value = "";
                return;
            }
        }
        const file = inputElem.files[0];
        inputElem.value = "";
        if (!file.name.endsWith(".xml")) {
            alert("目前僅支援分享 .xml 積木專案檔喔！");
            return;
        }

        const chatId = currentChatId;
        const cosmeticSnapshot = currentCosmeticSnapshot();
        const optId = appendOptimisticFileMessage(file.name, cosmeticSnapshot);
        patchSidebarPreviewForChat(chatId, "📁 傳送了檔案");
        clearMyTypingIndicator();

        const validatePrivateThenUpload = function () {
            const reader = new FileReader();
            reader.onloadstart = function () {
                setOptimisticFileProgress(optId, 8, "讀取檔案…");
            };
            reader.onprogress = function (ev) {
                if (ev.lengthComputable) {
                    const pct = Math.min(50, Math.round((ev.loaded / ev.total) * 50));
                    setOptimisticFileProgress(optId, pct, "讀取檔案… " + pct + "%");
                }
            };
            reader.onload = function (e) {
                setOptimisticFileProgress(optId, 52, "準備上傳…");
                void flushOutboundFileMessage({
                    chatId: chatId,
                    fileName: file.name,
                    content: e.target.result,
                    optId: optId,
                    cosmeticSnapshot: cosmeticSnapshot
                });
            };
            reader.onerror = function () {
                if (optId) removeOptimisticMessageRow(optId);
                patchSidebarPreviewForChat(chatId, "");
                alert("讀取檔案失敗");
            };
            reader.readAsText(file);
        };

        if (currentChatType === "private" && !currentChatDocData) {
            getDoc(doc(db, "chats", chatId)).then(function (chatSnap) {
                const d = chatSnap.exists() ? chatSnap.data() : null;
                if (d) {
                    cacheChatDoc(chatId, d);
                    currentChatDocData = d;
                }
                if (isPrivateSendBlocked()) {
                    if (optId) removeOptimisticMessageRow(optId);
                    patchSidebarPreviewForChat(chatId, "");
                    applyPrivateRequestState(currentChatDocData);
                    alert("此私訊尚未通過訊息請求，暫時無法傳送檔案。");
                    return;
                }
                validatePrivateThenUpload();
            }).catch(function () {
                validatePrivateThenUpload();
            });
            return;
        }

        validatePrivateThenUpload();
    };

    function renderGiftMessageCard(msgId, msg) {
        const gift = (msg && msg.gift && typeof msg.gift === "object") ? msg.gift : {};
        const itemName = String(gift.itemName || "神秘禮物");
        const itemIcon = String(gift.itemIcon || "🎁");
        const currency = String(gift.itemCurrency || "doord") === "docoin" ? "docoin" : "doord";
        const amount = Math.max(0, Math.floor(Number(gift.itemPrice) || 0));
        const priceLabel = currency === "docoin" ? `💎 ${amount} Docoin` : `🪙 ${amount} Doord`;
        const recipientUid = String(gift.recipientUid || "");
        const claimedBy = String(gift.claimedBy || "");
        const isPending = String(gift.status || "pending") !== "claimed";
        const canClaim = !!currentUser && currentUser.uid === recipientUid && isPending;
        const note = String(gift.note || msg.text || "").trim();
        let stateLabel = "";
        if (isPending) {
            if (canClaim) stateLabel = "⏳ 你收到一份禮物，按下領取即可入帳。";
            else if (currentUser && currentUser.uid === String(gift.senderUid || "")) stateLabel = "📦 已送出，等待對方領取。";
            else stateLabel = "📦 待對方領取。";
        } else {
            const claimedAt = gift.claimedAt && typeof gift.claimedAt.toDate === "function"
                ? gift.claimedAt.toDate()
                : null;
            const when = claimedAt ? claimedAt.toLocaleString("zh-TW") : "已領取";
            stateLabel = claimedBy && currentUser && claimedBy === currentUser.uid
                ? `✅ 你已領取（${when}）`
                : `✅ 已領取（${when}）`;
        }
        const claimButton = canClaim
            ? `<button type="button" class="msg-gift-claim-btn" onclick="claimGiftMessage('${msgId}')" ${giftClaimBusy ? "disabled" : ""}>領取禮物</button>`
            : "";
        const noteHtml = note ? `<div class="msg-gift-note">${escHtml(note)}</div>` : "";
        return `
            <div class="msg-gift-card">
                <div class="msg-gift-head">🎁 禮物卡片</div>
                <div class="msg-gift-item">
                    <div class="gift-icon">${escHtml(itemIcon)}</div>
                    <div>
                        <div class="gift-name">${escHtml(itemName)}</div>
                        <div class="gift-price">${priceLabel}</div>
                    </div>
                </div>
                ${noteHtml}
                <div class="msg-gift-state">${escHtml(stateLabel)}</div>
                ${claimButton}
            </div>
        `;
    }

    window.claimGiftMessage = async (msgId) => {
        if (!currentChatId || !msgId || !currentUser || giftClaimBusy) return;
        giftClaimBusy = true;
        let honorUnlocked = [];
        try {
            const msgRef = doc(db, "chats", currentChatId, "messages", msgId);
            const userRef = doc(db, "users", currentUser.uid);
            const chatRef = doc(db, "chats", currentChatId);
            await runTransaction(db, async (tx) => {
                const msgSnap = await tx.get(msgRef);
                if (!msgSnap.exists()) throw new Error("GIFT_NOT_FOUND");
                const msgData = msgSnap.data() || {};
                const gift = (msgData.gift && typeof msgData.gift === "object") ? { ...msgData.gift } : {};
                if (String(gift.status || "pending") === "claimed") throw new Error("GIFT_ALREADY_CLAIMED");
                if (String(gift.recipientUid || "") !== currentUser.uid) throw new Error("GIFT_NOT_FOR_YOU");
                const userSnap = await tx.get(userRef);
                const userData = userSnap.exists() ? (userSnap.data() || {}) : {};
                const inv = Array.isArray(userData.inventory) ? userData.inventory.slice() : [];
                const unlockIds = Array.isArray(gift.unlockIds) ? gift.unlockIds.filter((x) => typeof x === "string" && x) : [];
                let added = 0;
                unlockIds.forEach((id) => {
                    if (!inv.includes(id)) {
                        inv.push(id);
                        added += 1;
                    }
                });
                const honorPatch = DoratchHonor.applyHonorProgress(inv, userData.honorStats, {
                    giftsClaimed: DoratchHonor.normalizeHonorStats(userData.honorStats).giftsClaimed + 1
                });
                honorUnlocked = honorPatch.addedIds.slice();
                gift.status = "claimed";
                gift.claimedBy = currentUser.uid;
                gift.claimedAt = serverTimestamp();
                gift.claimedUnlockCount = added;
                tx.set(userRef, {
                    inventory: honorPatch.inventory,
                    honorStats: honorPatch.honorStats,
                    lastGiftClaimAt: serverTimestamp()
                }, { merge: true });
                tx.update(msgRef, { gift: gift });
                tx.set(chatRef, {
                    lastMessage: "✅ 禮物已被領取",
                    updatedAt: serverTimestamp(),
                    lastSenderId: currentUser.uid,
                    [`lastReadBy.${currentUser.uid}`]: serverTimestamp()
                }, { merge: true });
            });
            if (honorUnlocked.length) {
                alert("禮物領取成功！解鎖榮耀：" + honorUnlocked.map(function (id) {
                    const meta = DoratchHonor.getHonorBadgeMeta(id);
                    return meta ? meta.value : id;
                }).join("、"));
            } else {
                alert("禮物領取成功！");
            }
        } catch (e) {
            const code = String(e && e.message || "");
            if (code === "GIFT_ALREADY_CLAIMED") return alert("這份禮物已經被領取。");
            if (code === "GIFT_NOT_FOR_YOU") return alert("這份禮物不是給你的。");
            if (code === "GIFT_NOT_FOUND") return alert("找不到這份禮物。");
            alert("領取失敗：" + (e.message || e));
        } finally {
            giftClaimBusy = false;
        }
    };

    // 下載檔案
    window.downloadXml = (msgId) => {
        const msg = window.currentMessages[msgId];
        if(!msg || !msg.fileData) return;
        const blob = new Blob([msg.fileData], {type: "text/xml"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = msg.fileName;
        a.click();
        URL.revokeObjectURL(url);
    };

    // 檢查群組數量限制 (最多 20 個)
    async function checkGroupLimit() {
        const q = query(collection(db, "chats"), where("participants", "array-contains", currentUser.uid));
        const snap = await getDocs(q);
        let count = 0;
        snap.forEach(doc => {
            const data = doc.data();
            if (data.type === 'group' || data.type === 'server') count++;
        });
        return count;
    }

    // 5. Modal 控制邏輯
    window.openModal = (mode) => {
        modalMode = mode;
        const modal = document.getElementById('modal');
        const title = document.getElementById('modal-title');
        const input = document.getElementById('modal-input');
        
        if (mode === 'private') {
            title.innerText = '發起私訊';
            input.placeholder = '請輸入對方註冊 Email（可能需要先訊息請求）';
        } else if (mode === 'friendRequest') {
            title.innerText = '送出好友請求';
            input.placeholder = '請輸入對方的註冊 Email';
        } else if (mode === 'group') {
            title.innerText = '建立群聊';
            input.placeholder = '請為群組取個名稱';
        } else if (mode === 'server') {
            title.innerText = '申請建立伺服器';
            input.placeholder = '請輸入想要的伺服器名稱（需管理員審核）';
        } else if (mode === 'joinServer') {
            title.innerText = '加入伺服器';
            input.placeholder = '請輸入 6 碼伺服器代碼';
        } else if (mode === 'invite') {
            title.innerText = '邀請成員加入';
            input.placeholder = '請輸入要邀請的 Email';
        } else if (mode === 'connectBot') {
            title.innerText = '連接 Discord Bot';
            input.placeholder = '貼上 Bot Token（doratch-…）';
        }
        
        input.value = '';
        modal.style.display = 'flex';
        input.focus();
        syncMobileModalOpen();
    };

    window.closeModal = () => {
        document.getElementById('modal').style.display = 'none';
        syncMobileModalOpen();
    };
    (function bindModalClickGuards() {
        ["modal", "cosmetic-modal", "chat-prefs-modal", "server-boost-modal"].forEach((id) => {
            const root = document.getElementById(id);
            if (!root) return;
            const card = root.querySelector(".modal-content");
            if (card) card.addEventListener("click", (ev) => ev.stopPropagation());
        });
    })();
    window.addEventListener("keydown", (e) => {
        if (!currentChatId) return;
        if (isMobileChatShell()) return;
        if (e.defaultPrevented) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const t = e.target;
        const tag = (t && t.tagName) ? t.tagName.toLowerCase() : "";
        if (tag === "input" || tag === "textarea" || tag === "select" || (t && t.isContentEditable)) return;
        if (e.key.length !== 1) return;
        const input = document.getElementById("msg-input");
        if (!input || input.disabled) return;
        focusChatInput();
    });
    window.addEventListener("click", (e) => {
        const t = e.target;
        const tag = (t && t.tagName) ? t.tagName.toLowerCase() : "";
        if (tag === "select" || tag === "option") return;
        if (!t.closest || !t.closest(".chat-header-more-wrap")) closeChatHeaderMenu();
        if (t && t.id === "modal") closeModal();
        if (t && t.id === "cosmetic-modal") closeCosmeticModal();
        if (t && t.id === "chat-prefs-modal") closeChatPrefsModal();
        if (t && t.id === "server-boost-modal") closeServerBoostModal();
        const menu = document.getElementById("message-menu");
        if (menu && t && !menu.contains(t)) hideMessageMenu();
        const pop = document.getElementById("profile-pop");
        if (pop && pop.style.display === "block" && t && !pop.contains(t) && !String(t.className || "").includes("msg-avatar") && t.id !== "chat-panel-backdrop") hideProfilePop();
    });

    window.submitModal = async () => {
        const inputVal = document.getElementById('modal-input').value.trim();
        if (!inputVal) return;
        
        const btn = document.getElementById('modal-submit');
        btn.disabled = true;
        btn.innerText = "請稍候...";

        try {
            if (modalMode === 'group') {
                const groupCount = await checkGroupLimit();
                if (groupCount >= 20) {
                    alert("您最多只能加入 20 個群組或伺服器！");
                    closeModal();
                    return;
                }
            }
            if (modalMode === 'server') {
                const name = inputVal.trim();
                if (name.length < 2 || name.length > 40) {
                    alert("伺服器名稱需為 2～40 字。");
                    closeModal();
                    return;
                }
            }

            if (modalMode === 'private') {
                const targetEmail = normalizeEmailInput(inputVal);
                const currentEmail = currentUser.email || "";
                if (targetEmail === currentEmail.toLowerCase() && currentEmail !== "") {
                    alert("不能跟自己發私訊喔！");
                    throw new Error("Self chat");
                }

                const target = await confirmUserByEmail(targetEmail, "發起私訊給：");
                await openOrCreatePrivateChat(target.uid, target.email || targetEmail);
            } else if (modalMode === 'friendRequest') {
                try {
                    const result = await sendFriendRequestByEmail(inputVal);
                    if (result && result.autoAccepted) alert("✅ 雙方互送請求，已自動成為好友");
                    else alert("好友請求已送出！");
                } catch (e) {
                    if (e.message === "USER_CANCELLED") { /* user backed out */ }
                    else if (e.message === "SELF_REQUEST") alert("不能送好友請求給自己。");
                    else if (e.message === "INVALID_EMAIL") { /* already alerted */ }
                    else if (e.message === "USER_NOT_FOUND") { /* already alerted */ }
                    else if (e.message === "ALREADY_FRIEND") alert("你們已經是好友。");
                    else if (e.message === "REQUEST_ALREADY_SENT") alert("你已送出請求，或對方已向你發出請求。");
                    else alert("送出好友請求失敗：" + (e.message || e));
                    if (e.message !== "USER_CANCELLED") throw e;
                }
                
            } else if (modalMode === 'group') {
                const newChat = await addDoc(collection(db, "chats"), {
                    type: 'group',
                    participants: [currentUser.uid],
                    teacherId: currentUser.uid,
                    name: inputVal,
                    lastMessage: '群組已建立',
                    updatedAt: serverTimestamp()
                });
                openChat(newChat.id, inputVal, '👥', 'group', currentUser.uid, {
                    id: newChat.id,
                    type: 'group',
                    participants: [currentUser.uid],
                    teacherId: currentUser.uid,
                    name: inputVal
                });
            } else if (modalMode === 'server') {
                const pendingQ = query(
                    collection(db, "server_create_requests"),
                    where("userId", "==", currentUser.uid),
                    where("status", "==", "pending")
                );
                const pendingSnap = await getDocs(pendingQ);
                if (!pendingSnap.empty) {
                    alert("你已有待審核的伺服器申請，請等待管理員處理。");
                    closeModal();
                    return;
                }
                await addDoc(collection(db, "server_create_requests"), {
                    userId: currentUser.uid,
                    userEmail: currentUser.email || "",
                    serverName: inputVal,
                    status: "pending",
                    createdAt: serverTimestamp()
                });
                alert("伺服器申請已送出！管理員審核通過後會建立，並可使用代碼加入。");
            } else if (modalMode === 'joinServer') {
                const code = inputVal.toUpperCase();
                const chatRef = doc(db, "chats", code);
                const chatSnap = await getDoc(chatRef);
                
                if (chatSnap.exists() && chatSnap.data().type === 'server') {
                    const serverData = chatSnap.data();
                    const SB = serverBoostApi();
                    const memberBonus = SB ? SB.getServerMemberBonus(serverData) : 0;
                    const maxMembers = 50 + memberBonus;
                    const memberCount = Array.isArray(serverData.participants) ? serverData.participants.length : 0;
                    if (memberCount >= maxMembers) {
                        alert("此伺服器成員已滿（上限 " + maxMembers + " 人，含加成）。");
                        closeModal();
                        return;
                    }
                    const groupCount = await checkGroupLimit();
                    if (groupCount >= 20) {
                        alert("加入失敗：您最多只能加入 20 個群組或伺服器！");
                        closeModal();
                        return;
                    }
                    await updateDoc(chatRef, {
                        participants: arrayUnion(currentUser.uid)
                    });
                    alert("成功加入伺服器！");
                    openChat(code, serverData.name, '🏫', 'server', serverData.teacherId, { id: code, ...serverData });
                } else {
                    alert("查無此伺服器代碼，或是該代碼非伺服器！");
                }
            } else if (modalMode === 'invite') {
                const targetEmail = normalizeEmailInput(inputVal);
                if (!isValidEmailFormat(targetEmail)) {
                    alert("Email 格式不正確，請再檢查一次。");
                    throw new Error("Invalid email");
                }
                const target = await confirmUserByEmail(targetEmail, "邀請加入聊天室：");
                const targetUid = target.uid;
                
                await updateDoc(doc(db, "chats", currentChatId), {
                    pendingInvites: arrayUnion(targetUid)
                });
                alert("邀請已送出！需等待對方確認後才會加入。");
            } else if (modalMode === 'connectBot') {
                const token = inputVal.trim();
                if (!window.DiscordBotEngine || !window.DiscordBotEngine.isValidTokenFormat(token)) {
                    alert("Token 格式不正確（需以 doratch- 開頭）");
                    throw new Error("Invalid token");
                }
                const tokenSnap = await getDoc(doc(db, "botTokens", token));
                if (!tokenSnap.exists()) {
                    alert("找不到此 Token，請確認 Bot 已在 Python 創作空間部署。");
                    throw new Error("Token not found");
                }
                const meta = tokenSnap.data();
                if (!meta.active) {
                    alert("此 Bot 尚未部署或已停用，請先在創作空間按「部署到交流大廳」。");
                    throw new Error("Bot inactive");
                }
                const exists = currentChatAttachedBots.some(function (b) { return b.token === token; });
                if (exists) {
                    alert("此 Bot 已連接在此聊天室。");
                    throw new Error("Already connected");
                }
                const botEntry = {
                    token: token,
                    ownerId: meta.ownerId,
                    botId: meta.botId,
                    name: meta.name || "Bot"
                };
                await updateDoc(doc(db, "chats", currentChatId), {
                    attachedBots: arrayUnion(botEntry),
                    updatedAt: serverTimestamp()
                });
                alert("🤖 已連接 Bot「" + botEntry.name + "」！成員輸入 ! 或 / 指令即可觸發。");
                await refreshChatBotsMeta();
            }
            closeModal();
        } catch (e) {
            console.error(e);
            if (e && e.message !== "User not found" && e.message !== "Self chat" &&
                e.message !== "Invalid token" && e.message !== "Token not found" &&
                e.message !== "Bot inactive" && e.message !== "Already connected" &&
                e.message !== "Not friend" && e.message !== "SELF_REQUEST" &&
                e.message !== "USER_NOT_FOUND" && e.message !== "ALREADY_FRIEND" &&
                e.message !== "REQUEST_ALREADY_SENT" &&
                e.message !== "USER_CANCELLED" && e.message !== "INVALID_EMAIL" && e.message !== "Invalid email") {
                alert("操作失敗，請檢查資料庫權限或網路連線！\n" + e.message);
            }
        } finally {
            btn.disabled = false;
            btn.innerText = "確認";
        }
    };
</script>
