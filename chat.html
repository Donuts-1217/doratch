<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Doratch">
    <link rel="icon" type="image/png" href="Doratch.png">
    <link rel="apple-touch-icon" href="Doratch.png">
    <link rel="stylesheet" href="doratch-mobile-shell.css">
    <link rel="stylesheet" href="responsive-global.css">
    <link rel="stylesheet" href="doratch-shell.css">
    <link rel="stylesheet" href="doratch-profile-fx.css">
    <link rel="stylesheet" href="doratch-staff-fx.css">
    <link rel="stylesheet" href="doratch-subscription.css">

    <title>聊天室 - Creative Blocks</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Nunito:wght@700;900&family=Outfit:wght@700;800&family=Noto+Serif+TC:ital,wght@0,600;1,600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4C97FF; --secondary: #FFAB19; --accent: #855CD6;
            --bg: #0F172A; --card-bg: #1E293B; --sidebar-bg: #0B0E14;
            --text: #F8FAFC; --text-muted: #94A3B8;
        }
        body { font-family: "Outfit", "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        body.doratch-app-mode.chat-app { height: 100dvh; }
        
        /* 導覽列 */
        nav { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); color: white; padding: 0 5%; height: 70px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 1.4rem; cursor: pointer; color: var(--primary); letter-spacing: 1px; }
        .btn-nav { text-decoration:none; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        .btn-nav:hover { background: var(--primary); color: white; }
        .nav-actions { display: flex; gap: 10px; align-items: center; }

        /* --- 下拉選單 Wrapper --- */
        .user-profile-wrapper { position: relative; padding: 10px 0; margin-left: 20px; }
        .user-profile { display: flex; align-items: center; gap: 6px; cursor: pointer; background: rgba(255,255,255,0.05); padding: 6px 15px; border-radius: 50px; color: white; border: 1px solid rgba(255,255,255,0.1); }
        .dropdown-menu { position: absolute; top: 50px; right: 0; width: 140px; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; flex-direction: column; padding: 8px 0; z-index: 1001; }
        .user-profile-wrapper:hover .dropdown-menu { display: flex; }
        .dropdown-item { padding: 10px 20px; color: var(--text-muted); text-decoration: none; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .dropdown-item:hover { background: rgba(255,255,255,0.05); color: white; }

        /* 聊天主容器 - Discord Style */
        .chat-container { display: flex; flex: 1; overflow: hidden; background: var(--bg); color: var(--text); }
        
        /* 左側列表區 */
        .sidebar { width: 300px; background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header { min-height: 70px; padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header h3 { margin: 0; font-size: 16px; color: white; width: 100%; }
        .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-icon { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; padding: 6px 10px; font-size: 11px; font-weight: bold; transition: 0.3s; white-space: nowrap; }
        .btn-icon:hover { background: var(--primary); color: white; border-color: var(--primary); }
        
        .chat-list { flex: 1; overflow-y: auto; padding: 20px 0; }
        .category-title { font-size: 11px; font-weight: 900; color: #475569; padding: 10px 25px; text-transform: uppercase; letter-spacing: 1.5px; }
        .chat-item { padding: 12px 20px; cursor: pointer; display: flex; flex-direction: column; transition: 0.2s; margin: 4px 15px; border-radius: 12px; }
        .chat-item:hover { background: rgba(255,255,255,0.03); }
        .chat-item.active { background: rgba(76, 151, 255, 0.1); border: 1px solid rgba(76, 151, 255, 0.2); }
        .chat-name { font-weight: bold; color: var(--text-muted); font-size: 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .chat-item:hover .chat-name, .chat-item.active .chat-name { color: white; }
        .chat-preview { font-size: 12px; color: #475569; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
        .chat-peer-avatar-wrap {
            position: relative;
            display: inline-flex;
            flex-shrink: 0;
            width: 28px;
            height: 28px;
        }
        .chat-peer-avatar-wrap .member-avatar { width: 28px; height: 28px; border-radius: 50%; }
        .chat-peer-avatar-wrap .user-presence-dot {
            position: absolute;
            right: -1px;
            bottom: -1px;
            width: 9px;
            height: 9px;
            border: 2px solid var(--sidebar-bg, #1e1f22);
        }
        .user-presence-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px rgba(0,0,0,0.3);
        }
        .user-presence-dot.online { background: #23a559; box-shadow: 0 0 8px rgba(35,165,89,0.7); }
        .user-presence-dot.offline { background: #6b7280; }
        .chat-unread-badge {
            margin-left: auto;
            padding: 1px 6px;
            min-width: 18px;
            text-align: center;
            border-radius: 999px;
            font-size: 10px;
            background: #5865f2;
            color: #fff;
            font-weight: 900;
            line-height: 1.35;
        }
        .chat-unread-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 30px 8px;
            color: #f23f43;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.02em;
        }
        .chat-unread-divider::before,
        .chat-unread-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(242,63,67,0.45);
        }
        .msg-mention {
            color: #c9d1ff;
            background: rgba(88,101,242,0.18);
            padding: 0 3px;
            border-radius: 4px;
            font-weight: 800;
            cursor: pointer;
        }
        .msg-mention-me {
            color: #fff;
            background: #5865f2;
        }
        .mention-picker-item { align-items: center; }
        .mention-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .mention-name { color: #fff; font-weight: 800; font-size: 14px; }
        .mention-handle { color: #949ba4; font-size: 12px; margin-left: auto; }
        .chat-item.friend-request {
            border: 1px solid rgba(244,127,36,0.3);
            background: rgba(244,127,36,0.07);
        }
        .chat-item.friend-item {
            border: 1px solid rgba(76,151,255,0.2);
            background: rgba(76,151,255,0.06);
        }
        .chat-item.message-request {
            border: 1px solid rgba(245,158,11,0.3);
            background: rgba(245,158,11,0.08);
        }
        .mini-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .mini-btn {
            flex: 1;
            border: none;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            color: #fff;
        }
        .mini-btn.accept { background: #23a559; }
        .mini-btn.reject { background: #ed4245; }
        .mini-btn.cancel { background: #4e5058; }
        .mini-btn.dm { background: #5865f2; }
        
        /* 右側對話區 */
        .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; min-height: 0; }
        .chat-header { height: 70px; padding: 0 30px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 900; font-size: 1.2rem; color: white; flex-shrink: 0; gap: 10px; }
        .chat-header h3 { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .chat-header-more-wrap { position: relative; }
        .chat-header-menu {
            display: none; position: absolute; right: 0; top: calc(100% + 6px); min-width: 168px;
            background: #1e1f22; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45); padding: 6px; z-index: 50;
        }
        .chat-header-menu.open { display: block; }
        .chat-header-menu button {
            display: block; width: 100%; text-align: left; border: none; background: transparent;
            color: #e2e8f0; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
        .chat-header-menu button:hover { background: rgba(255,255,255,0.06); }
        .chat-header-menu button.danger { color: #f87171; }
        .scroll-bottom-pill {
            position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%);
            z-index: 12; display: none; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(88,101,242,0.45);
            background: rgba(30,33,40,0.96); color: #c7d2fe; font-size: 13px; font-weight: 800;
            cursor: pointer; font-family: inherit; box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            backdrop-filter: blur(8px);
        }
        .scroll-bottom-pill.visible { display: inline-flex; }
        .chat-panel-backdrop {
            display: none; position: fixed; inset: 0; z-index: 10110;
            background: rgba(0,0,0,0.5); border: none; padding: 0; margin: 0; cursor: pointer;
        }
        .chat-panel-backdrop.active { display: block; }
        
        .messages-area { flex: 1; padding: 30px 0; overflow-y: auto; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .messages-area::-webkit-scrollbar { width: 6px; }
        .messages-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .messages-loading { padding: 24px 30px; color: #949ba4; font-size: 13px; display: flex; align-items: center; gap: 10px; }
        .messages-loading::before { content: ""; width: 18px; height: 18px; border: 2px solid rgba(148,155,164,0.35); border-top-color: #5865F2; border-radius: 50%; animation: msgSpin 0.7s linear infinite; flex-shrink: 0; }
        @keyframes msgSpin { to { transform: rotate(360deg); } }
        
        .message-row { display: flex; padding: 8px 30px; transition: 0.2s; margin-top: 20px; position: relative; content-visibility: auto; contain-intrinsic-size: auto 72px; }
        .message-row.msg-pending { opacity: 0.82; animation: msgPendingIn 0.14s ease-out; }
        .message-row.msg-pending .msg-time { color: #949ba4; font-style: italic; }
        .msg-file-card.msg-uploading { opacity: 0.78; pointer-events: none; cursor: default; }
        .msg-upload-progress { height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .msg-upload-progress > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5865F2, #7289da); border-radius: 4px; transition: width 0.12s ease-out; }
        .chat-item.has-draft .chat-preview { color: #a5b4fc; font-style: italic; }
        @keyframes msgPendingIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 0.82; transform: none; } }
        .btn-send:active { transform: scale(0.96); }
        .message-row:hover { background: rgba(255,255,255,0.02); }
        .message-row.consecutive { margin-top: 2px; }
        .msg-avatar-container { width: 50px; margin-right: 20px; flex-shrink: 0; display: flex; justify-content: center; }
        .msg-avatar { width: 50px; height: 50px; border-radius: 16px; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); }
        .avatar-frame-neon {
            border-color: #22d3ee !important;
            box-shadow: 0 0 0 4px rgba(34,211,238,0.2), 0 0 18px rgba(34,211,238,0.45);
        }
        .avatar-frame-gold {
            border-color: #fbbf24 !important;
            box-shadow: 0 0 0 4px rgba(251,191,36,0.2), 0 0 18px rgba(251,191,36,0.45);
        }
        .avatar-frame-sakura {
            border-color: #f9a8d4 !important;
            box-shadow: 0 0 0 4px rgba(249,168,212,0.22), 0 0 18px rgba(244,114,182,0.4);
        }
        .avatar-frame-holo {
            border-color: #a78bfa !important;
            box-shadow: 0 0 0 4px rgba(167,139,250,0.22), 0 0 18px rgba(99,102,241,0.45);
        }
        .avatar-frame-obsidian {
            border-color: #94a3b8 !important;
            box-shadow: 0 0 0 4px rgba(71,85,105,0.28), 0 0 18px rgba(15,23,42,0.72);
        }
        .avatar-frame-cyberfire {
            border-color: #fb7185 !important;
            box-shadow: 0 0 0 4px rgba(251,113,133,0.2), 0 0 18px rgba(249,115,22,0.52);
        }
        .avatar-frame-aurora {
            border-color: #34d399 !important;
            box-shadow: 0 0 0 4px rgba(52,211,153,0.2), 0 0 18px rgba(59,130,246,0.45);
        }
        @keyframes particlePulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(251,113,133,0.2), 0 0 18px rgba(251,113,133,0.42), 0 0 28px rgba(245,158,11,0.32); }
            50% { box-shadow: 0 0 0 6px rgba(251,191,36,0.24), 0 0 24px rgba(251,113,133,0.5), 0 0 36px rgba(99,102,241,0.38); }
        }
        .avatar-frame-phoenix-particle {
            border-color: #fb7185 !important;
            animation: particlePulse 1.9s ease-in-out infinite;
        }
        .avatar-frame-quantum-particle {
            border-color: #60a5fa !important;
            animation: particlePulse 1.7s ease-in-out infinite reverse;
        }
        .avatar-frame-glitch-legend {
            border-color: #22d3ee !important;
            animation: particlePulse 1.5s ease-in-out infinite;
        }
        .avatar-frame-celestial-particle {
            border-color: #fbbf24 !important;
            animation: particlePulse 2s ease-in-out infinite;
        }
        .avatar-frame-eclipse-particle {
            border-color: #7c3aed !important;
            animation: particlePulse 1.8s ease-in-out infinite reverse;
        }
        .avatar-frame-stardust-particle {
            border-color: #a78bfa !important;
            animation: particlePulse 2.1s ease-in-out infinite;
        }
        .avatar-frame-bamboo {
            border-color: #4ade80 !important;
            box-shadow: 0 0 0 4px rgba(74,222,128,0.22), 0 0 18px rgba(21,128,61,0.4);
        }
        .avatar-frame-matrix {
            border-color: #4ade80 !important;
            box-shadow: 0 0 0 4px rgba(74,222,128,0.18), 0 0 18px rgba(22,163,74,0.45);
        }
        .avatar-frame-snowflake {
            border-color: #bae6fd !important;
            box-shadow: 0 0 0 4px rgba(186,230,253,0.25), 0 0 18px rgba(56,189,248,0.4);
        }
        .avatar-frame-amethyst {
            border-color: #c084fc !important;
            box-shadow: 0 0 0 4px rgba(192,132,252,0.22), 0 0 18px rgba(168,85,247,0.45);
        }
        .avatar-frame-thunder {
            border-color: #facc15 !important;
            box-shadow: 0 0 0 4px rgba(250,204,21,0.22), 0 0 18px rgba(59,130,246,0.48);
        }
        .avatar-frame-dragon-jade {
            border-color: #34d399 !important;
            box-shadow: 0 0 0 4px rgba(52,211,153,0.22), 0 0 18px rgba(5,150,105,0.48);
        }
        .avatar-frame-sunset-glow {
            border-color: #fb923c !important;
            box-shadow: 0 0 0 4px rgba(251,146,60,0.22), 0 0 18px rgba(244,63,94,0.4);
        }
        .avatar-frame-ocean-deep {
            border-color: #0891b2 !important;
            box-shadow: 0 0 0 4px rgba(8,145,178,0.22), 0 0 18px rgba(37,99,235,0.42);
        }
        .avatar-frame-stadium-spotlight {
            border-color: #facc15 !important;
            box-shadow: 0 0 0 4px rgba(250,204,21,0.22), 0 0 18px rgba(234,179,8,0.45);
        }
        .avatar-frame-moonlit-legend {
            border-color: #c4b5fd !important;
            animation: particlePulse 2.2s ease-in-out infinite;
        }
        .avatar-frame-rainbow-prism {
            border-color: #f472b6 !important;
            box-shadow: 0 0 0 4px rgba(244,114,182,0.22), 0 0 18px rgba(59,130,246,0.45);
        }
        .avatar-frame-lava-ring {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 4px rgba(239,68,68,0.22), 0 0 18px rgba(249,115,22,0.48);
        }
        .avatar-frame-frost-crystal {
            border-color: #67e8f9 !important;
            box-shadow: 0 0 0 4px rgba(103,232,249,0.25), 0 0 18px rgba(14,165,233,0.42);
        }
        .avatar-frame-circuit-pulse {
            border-color: #06b6d4 !important;
            box-shadow: 0 0 0 4px rgba(6,182,212,0.22), 0 0 18px rgba(59,130,246,0.45);
        }
        .avatar-frame-comet-legend {
            border-color: #fde68a !important;
            animation: particlePulse 2s ease-in-out infinite;
        }
        @keyframes legendGlowPulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(167,139,250,0.2), 0 0 16px rgba(99,102,241,0.42); }
            50% { box-shadow: 0 0 0 6px rgba(244,114,182,0.26), 0 0 28px rgba(251,191,36,0.55); }
        }
        @keyframes textShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes nameWave {
            0%, 100% { text-shadow: 0 0 0 rgba(56,189,248,0.2); }
            50% { text-shadow: 0 0 10px rgba(56,189,248,0.45); }
        }
        @keyframes namePrism {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 2px rgba(250,204,21,0.25)); }
            100% { background-position: 200% 50%; filter: drop-shadow(0 0 6px rgba(244,114,182,0.45)); }
        }
        @keyframes badgeFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1px); }
        }
        .avatar-frame-legendary {
            animation: legendGlowPulse 2.2s ease-in-out infinite;
        }
        .msg-time-hover { font-size: 11px; color: #475569; opacity: 0; text-align: center; width: 50px; }
        .message-row.consecutive:hover .msg-time-hover { opacity: 1; }
        
        .msg-content { display: flex; flex-direction: column; flex: 1; position: relative; padding-right: 120px; }
        .msg-header { display: flex; align-items: baseline; margin-bottom: 6px; }
        .msg-author { font-weight: 900; font-size: 1.1rem; color: white; margin-right: 12px; display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 6px; max-width: 100%; }
        .msg-author > .name-fx-text { display: inline; position: relative; z-index: 1; flex-shrink: 0; }
        .msg-author .user-title-badge,
        .msg-author .user-cosmetic-badge,
        .msg-author .bot-badge { flex-shrink: 0; }
        @keyframes nameFxPrismBurst {
            0%, 34%, 100% {
                color: #f8fafc !important;
                -webkit-text-fill-color: #f8fafc !important;
                background-image: none !important;
                text-shadow: none !important;
                filter: none !important;
            }
            40%, 64% {
                color: transparent !important;
                -webkit-text-fill-color: transparent !important;
                background-image: linear-gradient(90deg, #f59e0b, #22d3ee, #f43f5e, #a78bfa, #f59e0b) !important;
                background-size: 220% 100% !important;
                -webkit-background-clip: text !important;
                background-clip: text !important;
                text-shadow: 0 0 10px rgba(245,158,11,0.45);
            }
        }
        @keyframes nameFxAuroraBurst {
            0%, 34%, 100% {
                color: #f8fafc !important;
                -webkit-text-fill-color: #f8fafc !important;
                background-image: none !important;
                text-shadow: none !important;
            }
            40%, 64% {
                color: transparent !important;
                -webkit-text-fill-color: transparent !important;
                background-image: linear-gradient(90deg, #34d399, #60a5fa, #a78bfa, #34d399) !important;
                background-size: 220% 100% !important;
                -webkit-background-clip: text !important;
                background-clip: text !important;
            }
        }
        @keyframes nameFxRainbowBurst {
            0%, 34%, 100% {
                color: #f8fafc !important;
                -webkit-text-fill-color: #f8fafc !important;
                background-image: none !important;
                text-shadow: none !important;
            }
            40%, 64% {
                color: transparent !important;
                -webkit-text-fill-color: transparent !important;
                background-image: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #a855f7, #ef4444) !important;
                background-size: 300% 100% !important;
                -webkit-background-clip: text !important;
                background-clip: text !important;
            }
        }
        @keyframes nameFxGlowBurst {
            0%, 34%, 100% { text-shadow: none; filter: none; }
            40%, 64% { text-shadow: var(--chat-name-glow, 0 0 10px rgba(56,189,248,0.5)); }
        }
        .name-fx-text.name-effect-wave {

        STAFF_COSMETIC_ITEMS = [];

        ownedItemsBySlotWithStaff = function (data, allItems, slot) {
            const inv = Array.isArray(data && data.inventory) ? data.inventory : [];
            const ids = new Set(inv.map((x) => (typeof x === "string" ? x : (x && x.id) || "")).filter(Boolean));
            return allItems.filter((it) => it.slot === slot && ids.has(it.id));
        };
        pickOwnedWithStaff = function (data, allItems, slot) {
            const eq = (data && data.equippedCosmetics) ? data.equippedCosmetics : {};
            const owned = ownedItemsBySlotWithStaff(data, allItems, slot);
            const raw = String(eq[slot] || "").trim();
            if (!raw) return "";
            if (owned.some((it) => it.value === raw)) return raw;
            const byId = owned.find((it) => it.id === raw);
            return byId ? byId.value : "";
        };
        resolveVisualWithStaff = function (data, allItems, slot, fallbackRaw, helpers) {
            const eq = data ? ((helpers && helpers.getEquipped) ? helpers.getEquipped(data) : (data.equippedCosmetics || {})) : {};
            const raw = String(fallbackRaw !== undefined ? fallbackRaw : eq[slot] || "").trim();
            if (!raw) return "";
            const cosmeticDisplayValue = (helpers && helpers.cosmeticDisplayValue) || function (s, r) {
                const v = String(r || "").trim();
                if (!v) return "";
                const item = allItems.find((it) => it.slot === s && (it.value === v || it.id === v));
                return item ? item.value : "";
            };
            let normalized = cosmeticDisplayValue(slot, raw);
            if (!normalized && allItems.some((it) => it.slot === slot && it.value === raw)) normalized = raw;
            if (!normalized) return "";
            if (!data) return normalized;
            const owned = ownedItemsBySlotWithStaff(data, allItems, slot);
            if (owned.some((it) => it.value === normalized)) return normalized;
            const viaPick = pickOwnedWithStaff({ ...data, equippedCosmetics: { ...eq, [slot]: raw } }, allItems, slot);
            if (viaPick) return viaPick;
            if (String(eq[slot] || "").trim() || (fallbackRaw !== undefined && String(fallbackRaw).trim())) return normalized;
            return "";
        };
    }

    function loadDraftsFromStorage() {
        try {
            const raw = localStorage.getItem(draftStorageKey());
            if (!raw) return;
            const data = JSON.parse(raw);
            if (!data || typeof data !== "object") return;
            Object.keys(data).forEach(function (chatId) {
                const d = data[chatId];
                if (d && (String(d.text || "").trim() || d.reply)) {
                    chatDraftStore[chatId] = d;
                }
            });
        } catch (e) {
            console.warn("讀取聊天草稿失敗", e);
        }
    }

    function persistDraftsToStorage() {
        try {
            const payload = {};

                const d = chatDraftStore[chatId];
                if (d && (String(d.text || "").trim() || d.reply)) payload[chatId] = d;
            });
            localStorage.setItem(draftStorageKey(), JSON.stringify(payload));
        } catch (e) {
            console.warn("保存聊天草稿失敗", e);
        }
    }

            const preview = el.querySelector(".chat-preview");
            if (!id || !preview) return;
            const draftHint = draftPreviewText(id);
            if (draftHint) {
                el.classList.add("has-draft");
                if (!preview.dataset.basePreview) {
                    preview.dataset.basePreview = preview.textContent || "";
                }
                preview.textContent = draftHint;
            } else {
                el.classList.remove("has-draft");
                if (preview.dataset.basePreview) {
                    preview.textContent = preview.dataset.basePreview;

            if (it.label.includes("邀請")) bg = "#5865F2";
            else if (it.label.includes("Bot")) bg = "#23a559";

            btn.textContent = check.reason || "無法加成";
            btn.className = "btn-modal";
        } else {
            btn.disabled = false;
            btn.textContent = "加成此伺服器（+" + check.assign + " 點）";
            btn.className = "btn-modal boost-btn-plus";
        }
        document.getElementById("server-boost-modal").style.display = "flex";
        syncMobileModalOpen();
    };

    window.closeServerBoostModal = () => {
        const el = document.getElementById("server-boost-modal");
        if (el) el.style.display = "none";
        syncMobileModalOpen();
    };

    window.toggleServerBoost = async () => {
        const SB = serverBoostApi();
        if (!SB || !currentUser || !currentChatId || currentChatType !== "server") return;
        const tier = getActiveSubTier();
        const check = SB.canUserBoostServer(currentUserData || {}, currentChatId, tier);
        if (!check.ok) return alert(check.reason || "無法加成");
        const confirmMsg = check.action === "unboost"
            ? "確定取消你在此伺服器的加成？"
            : "確定花費 " + check.assign + " 點加成「" + (currentChatName || currentChatId) + "」？";
        if (!confirm(confirmMsg)) return;
        const userRef = doc(db, "users", currentUser.uid);
        const chatRef = doc(db, "chats", currentChatId);
        try {
            await runTransaction(db, async (tx) => {
                const userSnap = await tx.get(userRef);
                const chatSnap = await tx.get(chatRef);
                if (!chatSnap.exists()) throw new Error("伺服器不存在");
                const u = userSnap.exists() ? userSnap.data() : {};
                const c = chatSnap.data() || {};
                if (c.type !== "server") throw new Error("僅伺服器可加成");
                const alloc = SB.getUserBoostAllocations(u);
                const boosters = SB.normalizeBoosters(c.boosters);
                const newAlloc = Object.assign({}, alloc);
                if (check.action === "unboost") {
                    delete boosters[currentUser.uid];
                    delete newAlloc[currentChatId];
                } else {
                    boosters[currentUser.uid] = { tier: tier, points: check.assign };
                    newAlloc[currentChatId] = check.assign;
                }
                tx.set(userRef, { boostedServers: newAlloc }, { merge: true });
                tx.set(chatRef, { boosters: boosters, updatedAt: serverTimestamp() }, { merge: true });
            });
            const freshUser = await getDoc(userRef);
            if (freshUser.exists()) currentUserData = Object.assign({}, currentUserData || {}, freshUser.data());
            closeServerBoostModal();
            alert(check.action === "unboost" ? "已取消伺服器加成" : "🚀 伺服器加成成功！");
        } catch (e) {
            console.error(e);
            alert("加成失敗：" + (e.message || e));
        }
    };

    async function clearUserBoostOnServer(chatId) {
        const SB = serverBoostApi();
        if (!SB || !currentUser || !chatId) return;
        const alloc = SB.getUserBoostAllocations(currentUserData || {});
        if (!alloc[chatId]) return;
        const userRef = doc(db, "users", currentUser.uid);
        const chatRef = doc(db, "chats", chatId);
        try {
            await runTransaction(db, async (tx) => {
                const chatSnap = await tx.get(chatRef);
                const userSnap = await tx.get(userRef);
                if (!chatSnap.exists()) return;
                const boosters = SB.normalizeBoosters((chatSnap.data() || {}).boosters);
                delete boosters[currentUser.uid];
                const newAlloc = SB.getUserBoostAllocations(userSnap.exists() ? userSnap.data() : {});
                delete newAlloc[chatId];
                tx.set(chatRef, { boosters: boosters }, { merge: true });
                tx.set(userRef, { boostedServers: newAlloc }, { merge: true });
            });
            const freshUser = await getDoc(userRef);
            if (freshUser.exists()) currentUserData = Object.assign({}, currentUserData || {}, freshUser.data());
        } catch (e) {
            console.warn("clear boost failed", e);
        }
    }

    function toMillis(v) {
        if (!v) return 0;
        if (typeof v === "number") return v;
        if (typeof v.toMillis === "function") return v.toMillis();
        if (typeof v.seconds === "number") return v.seconds * 1000;
        return 0;
    }

    function isOnlineUser(userData) {
        const ms = toMillis(userData && userData.lastSeen);
        if (!ms) return false;
        return (Date.now() - ms) <= PRESENCE_ONLINE_MS;
    }

    function upsertUserCache(uid, data) {
        if (!uid) return null;
        const prev = userCache[uid] || {};
        const next = { uid: uid, ...prev, ...(data || {}) };
        const prevOnline = isOnlineUser(prev);
        userCache[uid] = next;
        const nextOnline = isOnlineUser(next);
        if (prevOnline !== nextOnline || toMillis(prev.lastSeen) !== toMillis(next.lastSeen)) {
            onUserPresenceChanged(uid);
        }
        return next;
    }

    function invalidateUserCache(uid) {
        if (uid && userCache[uid]) delete userCache[uid];
    }

    async function fetchUserByUid(uid, forceRefresh) {
        if (!forceRefresh && userCache[uid]) return userCache[uid];
        const s = await getDoc(doc(db, "users", uid));
        if (!s.exists()) return null;
        return upsertUserCache(uid, s.data());
    }

    function touchMyLastSeen() {
        if (!currentUser) return;
        upsertUserCache(currentUser.uid, { lastSeen: Date.now() });
        setDoc(doc(db, "users", currentUser.uid), {
            lastSeen: serverTimestamp(),
            email: currentUser.email || "",
            uid: currentUser.uid
        }, { merge: true }).catch(function () {});
    }

    function stopPresenceSystem() {
        if (presenceHeartbeatTimer) {
            clearInterval(presenceHeartbeatTimer);
            presenceHeartbeatTimer = null;
        }
        if (presenceTickTimer) {
            clearInterval(presenceTickTimer);
            presenceTickTimer = null;
        }
        Object.keys(presenceUnsubs).forEach(function (uid) {
            try { presenceUnsubs[uid](); } catch (_) {}
            delete presenceUnsubs[uid];
        });
        if (memberPresenceRefreshTimer) {
            clearTimeout(memberPresenceRefreshTimer);
            memberPresenceRefreshTimer = null;
        }
        document.removeEventListener("visibilitychange", onPresenceVisibility);
        window.removeEventListener("focus", touchMyLastSeen);
    }

    function onPresenceVisibility() {
        if (document.visibilityState === "visible") touchMyLastSeen();
    }

    function collectPresenceWatchUids() {
        const set = new Set();
        if (!currentUser) return [];
        friendLinks.forEach(function (r) {
            if ((r.status || "pending") !== "accepted") return;
            if (r.fromUid === currentUser.uid && r.toUid) set.add(r.toUid);
            if (r.toUid === currentUser.uid && r.fromUid) set.add(r.fromUid);
        });
        if (currentPrivatePeerUid) set.add(currentPrivatePeerUid);
        sidebarPrivatePeerUids.forEach(function (uid) { if (uid) set.add(uid); });
        (currentChatParticipants || []).forEach(function (uid) {
            if (uid && uid !== currentUser.uid) set.add(uid);
        });
        return Array.from(set);
    }

    function syncPresenceWatchers() {
        const wanted = new Set(collectPresenceWatchUids());
        Object.keys(presenceUnsubs).forEach(function (uid) {
            if (!wanted.has(uid)) {
                try { presenceUnsubs[uid](); } catch (_) {}
                delete presenceUnsubs[uid];
            }
        });
        wanted.forEach(function (uid) {
            if (presenceUnsubs[uid]) return;
            presenceUnsubs[uid] = onSnapshot(doc(db, "users", uid), function (snap) {
                if (snap.exists()) upsertUserCache(uid, snap.data());
            }, function () {});
        });
    }

    function startPresenceSystem() {
        stopPresenceSystem();
        if (!currentUser) return;
        touchMyLastSeen();
        presenceHeartbeatTimer = setInterval(touchMyLastSeen, PRESENCE_HEARTBEAT_MS);
        presenceTickTimer = setInterval(tickPresenceUi, PRESENCE_UI_TICK_MS);
        document.addEventListener("visibilitychange", onPresenceVisibility);
        window.addEventListener("focus", touchMyLastSeen);
        syncPresenceWatchers();
    }

    function tickPresenceUi() {
        collectPresenceWatchUids().forEach(function (uid) {
            patchFriendItemPresence(uid);
            patchPrivateChatItemPresence(uid);
        });
        if (currentPrivatePeerUid) patchPrivateProfilePresence(currentPrivatePeerUid);
        scheduleMemberListPresenceRefresh();
    }

    function patchFriendItemPresence(uid) {
        const item = document.querySelector('#list-friends .chat-item[data-friend-uid="' + uid + '"]');
        if (!item) return;
        const u = userCache[uid];
        const online = isOnlineUser(u);
        const dot = item.querySelector(".user-presence-dot");
        if (dot) {
            dot.classList.toggle("online", online);
            dot.classList.toggle("offline", !online);
        }
        const preview = item.querySelector(".chat-preview");
        if (preview && u) {
            preview.textContent = (u.email || "") + " · " + (online ? "在線" : "離線");
        }
    }

    function patchPrivateChatItemPresence(uid) {
        if (!uid) return;
        const u = userCache[uid];
        const online = isOnlineUser(u);
        document.querySelectorAll('#list-private .chat-item[data-peer-uid="' + uid + '"]').forEach(function (item) {
            const dot = item.querySelector(".user-presence-dot");
            if (dot) {
                dot.classList.toggle("online", online);
                dot.classList.toggle("offline", !online);
            }
            const preview = item.querySelector(".chat-preview");
            if (preview) {
                const base = preview.getAttribute("data-base-preview") || preview.textContent.split(" · ")[0] || "";
                preview.setAttribute("data-base-preview", base);
                preview.textContent = base + " · " + (online ? "在線" : "離線");
            }
        });
    }

    function patchProfilePopPresence(uid) {
        const pop = document.getElementById("profile-pop");
        if (!pop || pop.style.display === "none") return;
        const popUid = pop.dataset.profileUid || "";
        if (!popUid || popUid !== uid) return;
        const dot = pop.querySelector(".profile-pop-status-dot");
        if (!dot || dot.classList.contains("bot")) return;
        const online = isOnlineUser(userCache[uid]);
        dot.classList.toggle("online", online);
        dot.classList.toggle("offline", !online);
        const line = pop.querySelector(".profile-pop-presence-line");
        if (line) line.textContent = online ? "🟢 在線" : "⚪ 離線";
    }

    function patchPrivateProfilePresence(uid) {
        if (!uid || uid !== currentPrivatePeerUid || currentChatType !== "private") return;
        const wrap = document.querySelector(".member-profile-wrap[data-profile-uid]");
        if (!wrap || wrap.getAttribute("data-profile-uid") !== uid) return;
        const online = isOnlineUser(userCache[uid]);
        const dot = wrap.querySelector(".profile-pop-status-dot");
        if (dot && !dot.classList.contains("bot")) {
            dot.classList.toggle("online", online);
            dot.classList.toggle("offline", !online);
        }
        const line = wrap.querySelector(".profile-pop-presence-line");
        if (line) line.textContent = online ? "🟢 在線" : "⚪ 離線";
    }

    function scheduleMemberListPresenceRefresh() {
        if (memberPresenceRefreshTimer) return;
        memberPresenceRefreshTimer = setTimeout(function () {
            memberPresenceRefreshTimer = null;
            refreshMemberListPresence();
        }, 120);
    }

    function refreshMemberListPresence() {
        const sidebar = document.getElementById("member-sidebar");
        if (!sidebar || !sidebar.classList.contains("active") || currentChatType === "private") return;
        const items = document.querySelectorAll(".member-item[data-member-uid]");
        if (!items.length) return;
        let onlineCount = 0;
        items.forEach(function (item) {
            const uid = item.getAttribute("data-member-uid");
            const u = userCache[uid] || { uid: uid };
            const online = isOnlineUser(u);
            if (online) onlineCount += 1;
            const dot = item.querySelector(".member-status");
            if (dot && !dot.classList.contains("bot")) {
                dot.classList.toggle("online", online);
                dot.classList.toggle("offline", !online);
            }
        });
        const sec = document.querySelector(".member-section-title");
        if (sec && sec.textContent.indexOf("線上") === 0) {
            sec.textContent = "線上 — " + onlineCount + " / " + items.length;
        }
    }

    function isValidEmailFormat(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || ""));
    }

    async function confirmUserByEmail(email, actionLabel) {
        const targetEmail = normalizeEmailInput(email);
        if (!targetEmail) throw new Error("EMPTY_EMAIL");
        if (!isValidEmailFormat(targetEmail)) {
            alert("Email 格式不正確，請再檢查一次。");
            throw new Error("INVALID_EMAIL");
        }
        const target = await fetchUserByEmail(targetEmail);
        if (!target || !target.uid) {
            alert("找不到此 Email 的使用者。對方可能尚未註冊，或 Email 打錯了。");
            throw new Error("USER_NOT_FOUND");
        }
        const label = displayNameFromUser(target);
        const ok = confirm(
            `${actionLabel}\n\n對象：${label}\nEmail：${target.email || targetEmail}\n\n請確認是否為正確的人？`
        );
        if (!ok) throw new Error("USER_CANCELLED");
        return { ...target, email: target.email || targetEmail };
    }

            : { colorTheme: "default", accentColor: "" };

            requireMessageRequest: p.requireMessageRequest !== false,
            notifyMessage: p.notifyMessage !== false,
            notifyFriendRequest: p.notifyFriendRequest !== false,

        let existingChatData = null;
        chatSnap.forEach(docSnap => {
            const data = docSnap.data();
            if (data.type === 'private' && data.participants.includes(targetUid)) {
                existingChatId = docSnap.id;
                existingChatData = data;
            }
        });
        return { id: existingChatId, data: existingChatData };
    }

    async function autoAcceptReverseFriendRequest(targetUid, targetEmail) {
        if (!targetUid || !currentUser) return false;
        if (isFriendWithUid(targetUid)) return true;
        const reverseId = friendDocId(targetUid, currentUser.uid);
        const reverseRef = doc(db, "friend_requests", reverseId);
        const reverseSnap = await getDoc(reverseRef);
        if (reverseSnap.exists() && (reverseSnap.data().status || "pending") === "pending") {
            await acceptFriendRequest(reverseId, true);
            return true;
        }
        const reqId = friendDocId(currentUser.uid, targetUid);
        const reqRef = doc(db, "friend_requests", reqId);
        await setDoc(reqRef, {
            fromUid: currentUser.uid,
            toUid: targetUid,
            fromEmail: currentUser.email || "",
            toEmail: String(targetEmail || "").toLowerCase(),
            participants: [currentUser.uid, targetUid],
            status: "accepted",
            acceptedAt: serverTimestamp(),
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
        }, { merge: true });
        return true;
    }

    async function openOrCreatePrivateChat(targetUid, targetEmail) {
        const existing = await findExistingPrivateChat(targetUid);
        const label = String(targetEmail || "").split('@')[0] || "私訊";
        if (existing.id) {
            const d = existing.data || {};
            const isMutualMessageRequest =
                d.type === "private" &&
                d.requestStatus === "pending" &&
                d.requestTo === currentUser.uid &&
                d.requestFrom === targetUid;
            if (isMutualMessageRequest) {
                await updateDoc(doc(db, "chats", existing.id), {
                    requestStatus: "accepted",
                    acceptedAt: serverTimestamp(),
                    lastMessage: "✅ 雙方互發訊息請求，已自動成為好友",
                    updatedAt: serverTimestamp()
                });
                try {
                    await autoAcceptReverseFriendRequest(targetUid, targetEmail);
                } catch (_) {}
                alert("✅ 雙方互發訊息請求，已自動加為好友");
            }
            openChat(existing.id, label, '👤', 'private', null, { id: existing.id, ...d });
            return;
        }
        const targetUser = await fetchUserByUid(targetUid);
        const targetPrefs = sanitizeChatPrefs(targetUser && targetUser.chatPrefs);
        const needRequest = !isFriendWithUid(targetUid) && targetPrefs.requireMessageRequest;
        const newChat = await addDoc(collection(db, "chats"), {
            type: 'private',
            participants: [currentUser.uid, targetUid],
            participantEmails: [currentUser.email, targetEmail],
            name: '',
            requestStatus: needRequest ? "pending" : "accepted",
            requestFrom: needRequest ? currentUser.uid : "",
            requestTo: needRequest ? targetUid : "",
            lastMessage: needRequest ? '📨 訊息請求待回應' : '新對話',
            updatedAt: serverTimestamp()
        });
        if (needRequest) {
            alert("已送出訊息請求，等待對方接受後才能開始傳訊。");
        }
        openChat(newChat.id, label, '👤', 'private', null, {
            id: newChat.id,
            type: 'private',
            participants: [currentUser.uid, targetUid],
            participantEmails: [currentUser.email, targetEmail],
            requestStatus: needRequest ? "pending" : "accepted",
            requestFrom: needRequest ? currentUser.uid : "",
            requestTo: needRequest ? targetUid : ""
        });
    }

    function friendDocId(fromUid, toUid) {
        return String(fromUid) + "__" + String(toUid);
    }

    function isFriendWithUid(uid) {
        return friendLinks.some((r) => {
            if ((r.status || "pending") !== "accepted") return false;
            return (r.fromUid === currentUser.uid && r.toUid === uid) ||
                   (r.toUid === currentUser.uid && r.fromUid === uid);
        });
    }

    function friendRelationWithUid(uid) {
        const out = { state: "none", requestId: "" };
        if (!uid || !currentUser || uid === currentUser.uid) {
            out.state = uid === currentUser.uid ? "self" : "none";
            return out;
        }
        let pendingMatch = null;
        for (const r of friendLinks) {
            const status = r.status || "pending";
            const samePair = (r.fromUid === currentUser.uid && r.toUid === uid) ||
                (r.toUid === currentUser.uid && r.fromUid === uid);
            if (!samePair) continue;
            if (status === "accepted") {
                out.state = "friend";
                out.requestId = r.id || "";
                return out;
            }
            if (status === "pending" && !pendingMatch) {
                pendingMatch = {
                    state: r.fromUid === currentUser.uid ? "outgoing" : "incoming",
                    requestId: r.id || ""
                };
            }
        }
        if (pendingMatch) {
            out.state = pendingMatch.state;
            out.requestId = pendingMatch.requestId;
        }
        return out;
    }

    async function cleanupReversePendingFriendRequest(fromUid, toUid) {
        const reverseId = friendDocId(toUid, fromUid);
        const reverseRef = doc(db, "friend_requests", reverseId);
        const reverseSnap = await getDoc(reverseRef);
        if (reverseSnap.exists() && (reverseSnap.data().status || "pending") === "pending") {
            await deleteDoc(reverseRef);
        }
    }

    async function sendFriendRequestToUid(targetUid) {
        if (!targetUid || !currentUser) throw new Error("INVALID_TARGET");
        if (targetUid === currentUser.uid) throw new Error("SELF_REQUEST");
        const relation = friendRelationWithUid(targetUid);
        if (relation.state === "friend") throw new Error("ALREADY_FRIEND");
        if (relation.state === "outgoing") throw new Error("REQUEST_ALREADY_SENT");
        const target = await fetchUserByUid(targetUid);
        if (!target || !target.email) throw new Error("USER_NOT_FOUND");
        if (relation.state === "incoming" && relation.requestId) {
            await acceptFriendRequest(relation.requestId, true);
            return { autoAccepted: true, target: target };
        }
        const reverseId = friendDocId(targetUid, currentUser.uid);
        const reverseSnap = await getDoc(doc(db, "friend_requests", reverseId));
        if (reverseSnap.exists()) {
            const revStatus = reverseSnap.data().status || "pending";
            if (revStatus === "accepted") throw new Error("ALREADY_FRIEND");
            if (revStatus === "pending") {
                await acceptFriendRequest(reverseId, true);
                return { autoAccepted: true, target: target };
            }
        }
        const reqId = friendDocId(currentUser.uid, targetUid);
        const reqRef = doc(db, "friend_requests", reqId);
        const reqSnap = await getDoc(reqRef);
        if (reqSnap.exists() && (reqSnap.data().status || "pending") === "pending") {
            throw new Error("REQUEST_ALREADY_SENT");
        }
        if (reqSnap.exists() && (reqSnap.data().status || "pending") === "accepted") {
            throw new Error("ALREADY_FRIEND");
        }
        await setDoc(reqRef, {
            fromUid: currentUser.uid,
            toUid: targetUid,
            fromEmail: currentUser.email || "",
            toEmail: String(target.email || "").toLowerCase(),
            participants: [currentUser.uid, targetUid],
            status: "pending",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
        }, { merge: true });
        return { autoAccepted: false, target: target };
    }

    window.sendFriendRequestToUid = async (uid) => {

            const code = String(e && e.message || "");
            if (code === "SELF_REQUEST") alert("不能送好友請求給自己。");
            else if (code === "ALREADY_FRIEND") alert("你們已經是好友。");
            else if (code === "REQUEST_ALREADY_SENT") alert("你已送出好友請求，等待對方回應。");
            else if (code === "USER_NOT_FOUND") alert("找不到該使用者。");

        if (relation.state !== "incoming" || !relation.requestId) {
            alert("目前沒有可接受的好友請求。");
            return;

        await acceptFriendRequest(relation.requestId);
    };

        if (relation.state !== "outgoing" || !relation.requestId) return;

    };

    async function sendFriendRequestByEmail(targetEmailRaw) {
        const targetEmail = normalizeEmailInput(targetEmailRaw);
        const currentEmail = String(currentUser?.email || "").toLowerCase();
        if (!targetEmail) throw new Error("EMPTY_EMAIL");
        if (!isValidEmailFormat(targetEmail)) throw new Error("INVALID_EMAIL");
        if (targetEmail === currentEmail) throw new Error("SELF_REQUEST");

        const target = await confirmUserByEmail(targetEmail, "送出好友請求給：");
        const targetUid = target.uid;
        if (isFriendWithUid(targetUid)) throw new Error("ALREADY_FRIEND");

        const reqId = friendDocId(currentUser.uid, targetUid);
        const reverseId = friendDocId(targetUid, currentUser.uid);
        const reqRef = doc(db, "friend_requests", reqId);
        const revRef = doc(db, "friend_requests", reverseId);
        const [reqSnap, revSnap] = await Promise.all([getDoc(reqRef), getDoc(revRef)]);

        if (revSnap.exists()) {
            const status = revSnap.data().status || "pending";
            if (status === "pending") {
                await acceptFriendRequest(reverseId, true);
                if (reqSnap.exists() && (reqSnap.data().status || "pending") === "pending") {
                    await deleteDoc(reqRef);
                }
                return { autoAccepted: true, target: target };
            }
            if (status === "accepted") throw new Error("ALREADY_FRIEND");
        }

        if (reqSnap.exists() && (reqSnap.data().status || "pending") === "pending") throw new Error("REQUEST_ALREADY_SENT");
        if (reqSnap.exists() && (reqSnap.data().status || "pending") === "accepted") throw new Error("ALREADY_FRIEND");

        await setDoc(reqRef, {
            fromUid: currentUser.uid,
            toUid: targetUid,
            fromEmail: currentUser.email || "",
            toEmail: targetEmail,
            participants: [currentUser.uid, targetUid],
            status: "pending",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
        }, { merge: true });
        return { autoAccepted: false, target: target };
    }

    window.acceptFriendRequest = async (requestId, silent) => {
        try {
            const ref = doc(db, "friend_requests", requestId);
            const snap = await getDoc(ref);
            if (!snap.exists()) return;
            const data = snap.data() || {};
            if (data.toUid !== currentUser.uid) throw new Error("NOT_RECEIVER");
            const status = data.status || "pending";
            if (status === "accepted") {
                if (!silent) alert("你們已經是好友。");
                return;
            }
            if (status !== "pending") throw new Error("INVALID_STATUS");
            await updateDoc(ref, {
                status: "accepted",
                acceptedAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            });
            await cleanupReversePendingFriendRequest(data.fromUid, data.toUid);
            if (!silent) alert("✅ 已成為好友");
        } catch (e) {
            alert("接受好友失敗：" + (e.message || e));
        }
    };

    window.rejectFriendRequest = async (requestId) => {
        try {
            const ref = doc(db, "friend_requests", requestId);
            const snap = await getDoc(ref);
            if (!snap.exists()) return;
            const data = snap.data() || {};
            if (data.toUid !== currentUser.uid) throw new Error("NOT_RECEIVER");
            await deleteDoc(ref);
        } catch (e) {
            alert("拒絕失敗：" + (e.message || e));
        }
    };

    window.cancelFriendRequest = async (requestId) => {

            const data = snap.data() || {};

    function scheduleFriendPanelRender() {
        if (friendRenderTimer) clearTimeout(friendRenderTimer);
        friendRenderTimer = setTimeout(function () {
            friendRenderTimer = null;
            renderFriendPanels();
        }, 80);
    }

    async function renderFriendPanels() {
        const token = ++friendPanelRenderToken;
        const listFriends = document.getElementById("list-friends");
        const listReq = document.getElementById("list-friend-requests");
        const listOut = document.getElementById("list-friend-outgoing");
        const catReq = document.getElementById("category-friend-requests");
        const catOut = document.getElementById("category-friend-outgoing");
        const listHost = document.getElementById("chat-list");
        if (!listFriends || !listReq || !listOut || !catReq || !catOut || !currentUser) return;

        const scrollTop = listHost ? listHost.scrollTop : 0;
        const anchorId = currentChatId;
        let anchorViewportOffset = null;
        if (anchorId && listHost) {
            const anchorEl = listHost.querySelector('.chat-item[data-chat-id="' + anchorId + '"]');
            anchorViewportOffset = getListViewportOffset(listHost, anchorEl);
        }
        const friendNodes = [];
        const reqNodes = [];
        const outNodes = [];

        const friendUidSet = new Set();
        friendLinks.forEach(function (r) {
            if ((r.status || "pending") !== "accepted") return;
            if (r.fromUid === currentUser.uid) friendUidSet.add(r.toUid);
            if (r.toUid === currentUser.uid) friendUidSet.add(r.fromUid);
        });
        const friendUids = Array.from(friendUidSet);

        if (!friendUids.length) {
            const empty = document.createElement("div");
            empty.style.cssText = "padding:10px 20px;color:#64748b;font-size:12px;";
            empty.textContent = "尚無好友，可先送出好友請求";
            friendNodes.push(empty);
        } else {
            const friendUsers = await Promise.all(friendUids.map(function (uid) { return fetchUserByUid(uid); }));
            if (token !== friendPanelRenderToken) return;
            for (let i = 0; i < friendUids.length; i++) {
                const uid = friendUids[i];
                const u = friendUsers[i];
                if (!u) continue;
                const n = escHtml(displayNameFromUser(u));
                const emailText = escHtml(u.email || "");
                const online = isOnlineUser(u);
                const item = document.createElement("div");
                item.className = "chat-item friend-item";
                item.dataset.friendUid = uid;
                item.onclick = function (ev) {
                    if (ev.target && typeof ev.target.closest === "function" && ev.target.closest("button")) return;
                    openProfileByUid(ev, uid);
                };
                item.innerHTML =
                    '<div class="chat-name"><span class="user-presence-dot ' + (online ? "online" : "offline") + '"></span> ❤️ ' + n + "</div>" +
                    '<div class="chat-preview">' + emailText + " · " + (online ? "在線" : "離線") + "</div>" +
                    '<div class="mini-actions">' +
                    '<button class="mini-btn dm" onclick="event.stopPropagation();startPrivateWithFriend(\'' + uid + "')\">私訊</button>" +
                    '<button class="mini-btn cancel" onclick="event.stopPropagation();removeFriend(\'' + uid + "')\">移除</button>" +
                    "</div>";
                friendNodes.push(item);
            }
        }

        const incomingVisible = friendIncoming.filter(function (req) { return !friendUidSet.has(req.fromUid); });
        catReq.style.display = incomingVisible.length ? "block" : "none";
        const incomingUsers = incomingVisible.length
            ? await Promise.all(incomingVisible.map(function (req) { return fetchUserByUid(req.fromUid); }))
            : [];
        if (token !== friendPanelRenderToken) return;
        for (let i = 0; i < incomingVisible.length; i++) {
            const req = incomingVisible[i];
            const fromUid = req.fromUid;
            const u = incomingUsers[i];
            const n = escHtml(u ? displayNameFromUser(u) : (req.fromEmail || "未知"));
            const emailPreview = escHtml((u && u.email) || req.fromEmail || "");
            const item = document.createElement("div");
            item.className = "chat-item friend-request";
            item.dataset.requestId = req.id;
            item.onclick = function (ev) {
                if (ev.target && typeof ev.target.closest === "function" && ev.target.closest("button")) return;
                openProfileByUid(ev, fromUid);
            };
            item.innerHTML =
                '<div class="chat-name">💌 ' + n + "</div>" +
                '<div class="chat-preview">' + emailPreview + "</div>" +
                '<div class="mini-actions">' +
                '<button class="mini-btn accept" onclick="event.stopPropagation();acceptFriendRequest(\'' + req.id + "')\">接受</button>" +
                '<button class="mini-btn reject" onclick="event.stopPropagation();rejectFriendRequest(\'' + req.id + "')\">拒絕</button>" +
                "</div>";
            reqNodes.push(item);
        }

        const outgoingVisible = friendOutgoing.filter(function (req) { return !friendUidSet.has(req.toUid); });
        catOut.style.display = outgoingVisible.length ? "block" : "none";
        const outgoingUsers = outgoingVisible.length
            ? await Promise.all(outgoingVisible.map(function (req) { return fetchUserByUid(req.toUid); }))
            : [];
        if (token !== friendPanelRenderToken) return;
        for (let i = 0; i < outgoingVisible.length; i++) {
            const req = outgoingVisible[i];
            const toUid = req.toUid;
            const u = outgoingUsers[i];
            const n = escHtml(u ? displayNameFromUser(u) : (req.toEmail || "未知"));
            const emailPreview = escHtml((u && u.email) || req.toEmail || "");
            const item = document.createElement("div");
            item.className = "chat-item";
            item.dataset.requestId = req.id;
            item.onclick = function (ev) {
                if (ev.target && typeof ev.target.closest === "function" && ev.target.closest("button")) return;
                openProfileByUid(ev, toUid);
            };
            item.innerHTML =
                '<div class="chat-name">🕒 ' + n + "</div>" +
                '<div class="chat-preview">' + emailPreview + "</div>" +
                '<div class="mini-actions">' +
                '<button class="mini-btn cancel" onclick="event.stopPropagation();cancelFriendRequest(\'' + req.id + "')\">取消請求</button>" +
                "</div>";
            outNodes.push(item);
        }

        applySidebarListNodes(listFriends, friendNodes, "friendUid");
        applySidebarListNodes(listReq, reqNodes, "requestId");
        applySidebarListNodes(listOut, outNodes, "requestId");
        restoreListScrollAnchor(listHost, anchorId, anchorViewportOffset, scrollTop);
        syncPresenceWatchers();
    }

    function subscribeFriendPanels() {
        if (unsubscribeFriendIncoming) unsubscribeFriendIncoming();
        if (unsubscribeFriendOutgoing) unsubscribeFriendOutgoing();
        if (unsubscribeFriendLinks) unsubscribeFriendLinks();

        const qIncoming = query(collection(db, "friend_requests"), where("toUid", "==", currentUser.uid));
        const qOutgoing = query(collection(db, "friend_requests"), where("fromUid", "==", currentUser.uid));
        const qLinks = query(collection(db, "friend_requests"), where("participants", "array-contains", currentUser.uid));

        unsubscribeFriendIncoming = onSnapshot(qIncoming, async (snap) => {
            friendIncoming = [];
            snap.forEach((d) => {
                const data = d.data() || {};
                if ((data.status || "pending") === "pending") friendIncoming.push({ id: d.id, ...data });
            });
            if (chatPrefs.notifyFriendRequest && incomingFriendRequestCount >= 0 && friendIncoming.length > incomingFriendRequestCount) {
                maybeDesktopNotify("Doratch 好友請求", "你收到新的好友請求");
            }
            incomingFriendRequestCount = friendIncoming.length;
            scheduleFriendPanelRender();
        });
        unsubscribeFriendOutgoing = onSnapshot(qOutgoing, async (snap) => {
            friendOutgoing = [];
            snap.forEach((d) => {
                const data = d.data() || {};
                if ((data.status || "pending") === "pending") friendOutgoing.push({ id: d.id, ...data });
            });
            scheduleFriendPanelRender();
        });
        unsubscribeFriendLinks = onSnapshot(qLinks, async (snap) => {
            friendLinks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            scheduleFriendPanelRender();
            syncPresenceWatchers();
        });
    }

    function replaceListChildren(container, nodes) {
        if (!container) return;
        if (typeof container.replaceChildren === "function") {
            container.replaceChildren.apply(container, nodes);
        } else {
            container.innerHTML = "";
            nodes.forEach(function (n) { container.appendChild(n); });
        }
    }

    function getListViewportOffset(listHost, el) {
        if (!listHost || !el) return null;
        return el.getBoundingClientRect().top - listHost.getBoundingClientRect().top;
    }

    function restoreListScrollAnchor(listHost, anchorId, anchorViewportOffset, fallbackScrollTop) {
        if (!listHost) return;
        requestAnimationFrame(function () {
            if (anchorId && anchorViewportOffset !== null) {
                const el = listHost.querySelector('.chat-item[data-chat-id="' + anchorId + '"]');
                if (el) {
                    const drift = getListViewportOffset(listHost, el) - anchorViewportOffset;
                    if (Math.abs(drift) > 0.5) listHost.scrollTop += drift;
                    return;
                }
            }
            listHost.scrollTop = fallbackScrollTop;
        });
    }

    function syncListNodeEvents(existing, fresh) {
        existing.onclick = fresh.onclick || null;
        if (fresh.dataset) {
            Object.keys(fresh.dataset).forEach(function (k) { existing.dataset[k] = fresh.dataset[k]; });
        }
    }

    function applySidebarListNodes(container, nodes, matchAttr) {
        if (!container) return;
        const attr = matchAttr || "chatId";
        const dataKey = "data-" + attr.replace(/([A-Z])/g, "-$1").toLowerCase();
        const existingItems = Array.from(container.children).filter(function (c) {
            return c.classList && c.classList.contains("chat-item");
        });
        const freshItems = nodes.filter(function (n) { return n.classList && n.classList.contains("chat-item"); });
        if (existingItems.length === freshItems.length && existingItems.length > 0) {
            let sameOrder = true;
            for (let i = 0; i < existingItems.length; i++) {
                if (existingItems[i].getAttribute(dataKey) !== freshItems[i].getAttribute(dataKey)) {
                    sameOrder = false;
                    break;
                }
            }
            if (sameOrder) {
                for (let i = 0; i < existingItems.length; i++) {
                    const el = existingItems[i];
                    const fresh = freshItems[i];
                    if (el.className !== fresh.className) el.className = fresh.className;
                    if (el.innerHTML !== fresh.innerHTML) {
                        el.innerHTML = fresh.innerHTML;
                        syncListNodeEvents(el, fresh);
                    } else {
                        syncListNodeEvents(el, fresh);
                    }
                }
                return;
            }
        }
        replaceListChildren(container, nodes);
    }

        currentChatDocData = chatDocCache[chatId] ? Object.assign({}, chatDocCache[chatId]) : null;

    function getChatParticipantsForUnread(chatId) {

    function buildOutboundChatPatch(chatId, lastMessage, participants) {
        const parts = (participants && participants.length) ? participants : getChatParticipantsForUnread(chatId);
        const patch = {
            lastMessage: lastMessage,
            updatedAt: serverTimestamp(),
            lastSenderId: currentUser.uid,
            [`lastReadBy.${currentUser.uid}`]: serverTimestamp(),
            [`unreadCountBy.${currentUser.uid}`]: 0,
            [`typingUsers.${currentUser.uid}`]: deleteField()

            if (uid && uid !== currentUser.uid) {

    function buildBotChatPatch(chatId, lastMessage, botSenderId) {
        const parts = getChatParticipantsForUnread(chatId);
        const patch = {

            updatedAt: serverTimestamp(),
            lastSenderId: botSenderId
        };

    function resolveUnreadCount(chat, myReadAt, updatedAtMs) {
        const map = chat.unreadCountBy || {};
        const n = Number(map[currentUser.uid]);
        if (Number.isFinite(n) && n > 0) return Math.floor(n);
        const legacy = updatedAtMs > 0 && updatedAtMs > myReadAt && chat.lastSenderId && chat.lastSenderId !== currentUser.uid;
        return legacy ? 1 : 0;
    }

    function buildUnreadBadgeHtml(count) {
        if (!count || count <= 0) return "";

    function lastMessageMentionsMe(chat) {
        const text = String((chat && chat.lastMessage) || "");
        if (!text.includes("@") || !currentUser) return false;
        const email = String((currentUserData && currentUserData.email) || currentUser.email || "");
        const handle = email.includes("@") ? email.split("@")[0].toLowerCase() : "";
        const label = currentUserData ? String(displayNameFromUser(currentUserData) || "").toLowerCase() : "";
        if (handle && text.toLowerCase().includes("@" + handle)) return true;
        if (label && text.toLowerCase().includes("@" + label)) return true;
        return false;
    }

    function getChatMentionCandidates() {
        if (!currentUser) return [];
        const uids = (currentChatParticipants && currentChatParticipants.length)
            ? currentChatParticipants.slice()
            : ((currentChatDocData && currentChatDocData.participants) || []).slice();
        const out = [];
        uids.forEach(function (uid) {
            if (!uid || uid === currentUser.uid) return;
            const u = userCache[uid];
            const email = u ? String(u.email || "").trim() : "";
            const label = u ? displayNameFromUser(u) : "使用者";
            let handle = email.includes("@") ? email.split("@")[0] : label;
            handle = String(handle || "user").trim();
            out.push({ uid: uid, label: label, handle: handle, email: email });
        });
        return out;
    }

    function resolveMentionsFromText(text, candidates) {
        const mentions = [];
        const seen = new Set();
        const re = /@([\w\u4e00-\u9fff\u3400-\u4dbf.-]+)/g;
        let m;
        const list = candidates || getChatMentionCandidates();
        while ((m = re.exec(String(text || ""))) !== null) {
            const token = m[1].toLowerCase();
            const hit = list.find(function (c) {
                return c.handle.toLowerCase() === token || c.label.toLowerCase() === token;
            });
            if (hit && !seen.has(hit.uid)) {
                seen.add(hit.uid);
                mentions.push({ uid: hit.uid, handle: hit.handle, label: hit.label });
            }
        }
        return mentions;
    }

    function formatMentionTextHtml(text, mentions, myUid) {
        const mentionMap = {};
        (mentions || []).forEach(function (m) {
            mentionMap[String(m.handle || "").toLowerCase()] = m;
            mentionMap[String(m.label || "").toLowerCase()] = m;
        });
        const re = /@([\w\u4e00-\u9fff\u3400-\u4dbf.-]+)/g;
        let out = "";
        let last = 0;
        let m;
        const raw = String(text || "");
        while ((m = re.exec(raw)) !== null) {
            out += escHtml(raw.slice(last, m.index));
            const token = m[1];
            const hit = mentionMap[token.toLowerCase()];
            if (hit) {
                const isMe = myUid && hit.uid === myUid;
                out += '<span class="msg-mention' + (isMe ? " msg-mention-me" : "") + '" data-uid="' + escHtml(hit.uid) + '" onclick="openProfileByUid(event,\'' + escHtml(hit.uid) + "')\">@" + escHtml(token) + "</span>";
            } else {
                out += '<span class="msg-mention">@' + escHtml(token) + "</span>";
            }
            last = m.index + m[0].length;
        }
        out += escHtml(raw.slice(last));
        return out;
    }

    function renderMessageTextHtml(text, mentions) {
        const body = formatMentionTextHtml(text, mentions, currentUser ? currentUser.uid : "");
        return '<div class="msg-text">' + body + "</div>";
    }

    function maybeUnreadDividerHtml(msg, ctx) {
        if (!unreadDividerBeforeMs || (ctx && ctx.unreadDividerShown)) return "";
        const t = toMillis(msg.createdAt);
        if (!t || t <= unreadDividerBeforeMs) return "";
        if (msg.senderId === (currentUser && currentUser.uid)) return "";
        if (ctx) ctx.unreadDividerShown = true;
        const label = unreadDividerLabel ? (unreadDividerLabel + " 則未讀訊息") : "未讀訊息";
        return '<div class="chat-unread-divider"><span>' + escHtml(label) + "</span></div>";
    }

    function sortChatsForSidebar(chats) {
        const prev = chatListOrderCache;
        function isPinnedSelfSend(chat) {
            return !!(currentChatId && currentUser && chat.id === currentChatId && chat.lastSenderId === currentUser.uid);
        }
        chats.sort(function (a, b) {
            if (isPinnedSelfSend(a) || isPinnedSelfSend(b)) {
                return (prev[a.id] ?? 0) - (prev[b.id] ?? 0);
            }
            const t1 = a.updatedAt ? a.updatedAt.toMillis() : 0;
            const t2 = b.updatedAt ? b.updatedAt.toMillis() : 0;
            if (t2 !== t1) return t2 - t1;
            return (prev[a.id] ?? 0) - (prev[b.id] ?? 0);
        });
        chats.forEach(function (c, i) { chatListOrderCache[c.id] = i; });
    }

    function buildChatListItem(chat) {
        let displayName = chat.name || "未命名";
        let rawName = displayName;
        let icon = "💬";
        let privatePeerUid = "";
        if (chat.type === "private") {
            icon = "👤";
            displayName = (chat.participantEmails || []).find(function (e) { return e !== currentUser.email; }) || "未知使用者";
            displayName = displayName.split("@")[0];
            rawName = displayName;
            privatePeerUid = (chat.participants || []).find(function (uid) { return uid && uid !== currentUser.uid; }) || "";
        } else if (chat.type === "server") {
            icon = "🏫";
            const SB = serverBoostApi();
            const boostLv = SB ? SB.getServerBoostLevel(chat) : 0;
            const boostBadge = SB ? SB.serverBoostBadgeHtml(boostLv) : "";
            displayName += boostBadge + ' <span style="font-size:10px; opacity:0.7; font-weight:normal;">(代碼: ' + chat.id + ")</span>";
        } else {
            icon = "👥";
        }

        const item = document.createElement("div");
        item.className = "chat-item" + (currentChatId === chat.id ? " active" : "");
        item.dataset.chatId = chat.id;
        if (chat.type === "private" && privatePeerUid) item.dataset.peerUid = privatePeerUid;
        if (chat.type === "server") {
            const SB = serverBoostApi();
            if (SB && SB.getServerBoostLevel(chat) > 0) item.classList.add("server-boosted");
        }
        item.onclick = function () { openChat(chat.id, rawName, icon, chat.type, chat.teacherId, chat); };

        const timeStr = chat.updatedAt ? formatMsgTime(chat.updatedAt.toDate()) : "";
        const readMap = chat.lastReadBy || {};
        const myReadAt = toMillis(readMap[currentUser.uid]);
        const updatedAtMs = toMillis(chat.updatedAt);
        const unreadCount = resolveUnreadCount(chat, myReadAt, updatedAtMs);
        const unread = unreadCount > 0;
        const unreadHtml = buildUnreadBadgeHtml(unreadCount);
        const requestPending = chat.type === "private" && chat.requestStatus === "pending";
        const isIncomingReq = requestPending && chat.requestTo === currentUser.uid;
        const isOutgoingReq = requestPending && chat.requestFrom === currentUser.uid;

        const seenBefore = Object.prototype.hasOwnProperty.call(chatUpdatedAtCache, chat.id);
        if (chatPrefs.notifyMessage && seenBefore && unread && updatedAtMs > (chatUpdatedAtCache[chat.id] || 0) && chat.id !== currentChatId) {
            const mentionMe = lastMessageMentionsMe(chat);
            const title = mentionMe ? ("Doratch 有人艾特你：" + rawName) : ("Doratch 新訊息：" + rawName);
            maybeDesktopNotify(title, chat.lastMessage || "你有一則新訊息", chat.id);
        }
        chatUpdatedAtCache[chat.id] = Math.max(chatUpdatedAtCache[chat.id] || 0, updatedAtMs);

        if (isOutgoingReq) item.classList.add("message-request");

        const privateRemoveBtn = (chat.type === "private" && !isIncomingReq)
            ? '<div class="mini-actions"><button type="button" class="mini-btn cancel" onclick="event.stopPropagation();' +
              (isOutgoingReq ? ("cancelMessageRequest('" + chat.id + "')") : ("removePrivateChat('" + chat.id + "')")) +
              '">' + (isOutgoingReq ? "取消請求" : "移除私訊") + "</button></div>"
            : "";
        const privatePeerOnline = privatePeerUid && isOnlineUser(userCache[privatePeerUid]);
        const privatePresenceDot = (chat.type === "private" && privatePeerUid && !isIncomingReq)
            ? '<span class="user-presence-dot ' + (privatePeerOnline ? "online" : "offline") + '"></span>'
            : "";
        const privatePreviewBase = isOutgoingReq ? "你已送出訊息請求，等待對方回應" : String(chat.lastMessage || "開始聊天吧！");
        const privatePreviewText = (chat.type === "private" && privatePeerUid && !isIncomingReq)
            ? (privatePreviewBase + " · " + (privatePeerOnline ? "在線" : "離線"))
            : (isOutgoingReq ? privatePreviewBase : escHtml(privatePreviewBase));
        const privateAvatarHtml = (chat.type === "private" && privatePeerUid)
            ? (function () {
                const peer = userCache[privatePeerUid];
                const peerEmail = peer ? String(peer.email || "").trim() : "";
                const peerName = peerEmail.split("@")[0] || rawName || "User";
                const src = peer
                    ? avatarUrlForUserData(peer, peerEmail || peerName, "")
                    : ("https://ui-avatars.com/api/?name=" + encodeURIComponent(rawName || "User") + "&background=5865F2&color=fff");
                return '<span class="chat-peer-avatar-wrap">' + privatePresenceDot + '<img src="' + src + '" alt="" class="member-avatar" style="cursor:pointer;" onclick="openProfileByUid(event,\'' + privatePeerUid + "')\"></span>";
            })()
            : "";

        item.innerHTML =
            '<div class="chat-name" style="display:flex; align-items:center; gap:8px;">' + privateAvatarHtml + icon + " " + displayName + " " + unreadHtml +
            ' <span style="margin-left:auto; font-size:10px; color:#949ba4; font-weight:normal;">' + timeStr + "</span></div>" +
            '<div class="chat-preview"' + (chat.type === "private" && privatePeerUid && !isIncomingReq ? (' data-base-preview="' + escHtml(privatePreviewBase) + '"') : "") + '>' + privatePreviewText + "</div>" +
            privateRemoveBtn;

        return {
            item: item,
            rawName: rawName,
            icon: icon,
            isIncomingReq: isIncomingReq,
            isOutgoingReq: isOutgoingReq,
            unreadHtml: unreadHtml,
            unread: unread
        };
    }

    function buildIncomingRequestItem(chat, rawName, icon, unreadHtml) {
        const reqPreview = chat.lastMessage
            ? escHtml(String(chat.lastMessage).slice(0, 120))
            : "等待你接受後才能開始聊天";
        const reqItem = document.createElement("div");
        reqItem.className = "chat-item message-request";
        reqItem.dataset.chatId = chat.id;
        reqItem.onclick = function (ev) {

            '<div class="chat-name">📨 ' + escHtml(rawName) + " " + unreadHtml + '</div>' +
            '<div class="chat-preview">' + reqPreview + '</div>' +
            '<div class="mini-actions">' +
            '<button class="mini-btn accept" onclick="event.stopPropagation();acceptMessageRequest(\'' + chat.id + "')\">接受</button>" +
            '<button class="mini-btn reject" onclick="event.stopPropagation();rejectMessageRequest(\'' + chat.id + "')\">拒絕</button>" +
            "</div>";
