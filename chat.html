<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Doratch">
    <link rel="icon" type="image/png" href="Doratch.png">
    <link rel="apple-touch-icon" href="Doratch.png">
    <link rel="stylesheet" href="doratch-mobile-shell.css">
    <link rel="stylesheet" href="responsive-global.css">
    <link rel="stylesheet" href="doratch-shell.css">
    <link rel="stylesheet" href="shared/doratch-profile-fx.css">
    <link rel="stylesheet" href="doratch-staff-fx.css">
    <link rel="stylesheet" href="shared/doratch-docoin-luxury.css">
    <title>聊天室 - Creative Blocks</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4C97FF; --secondary: #FFAB19; --accent: #855CD6;
            --bg: #0F172A; --card-bg: #1E293B; --sidebar-bg: #0B0E14;
            --text: #F8FAFC; --text-muted: #94A3B8;
        }
        body { font-family: "Outfit", "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        body.doratch-app-mode.chat-app { height: 100dvh; }
        
        /* 導覽列 */
        nav { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); color: white; padding: 0 5%; height: 70px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 1.4rem; cursor: pointer; color: var(--primary); letter-spacing: 1px; }
        .btn-nav { text-decoration:none; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        .btn-nav:hover { background: var(--primary); color: white; }
        .nav-actions { display: flex; gap: 10px; align-items: center; }

        /* --- 下拉選單 Wrapper --- */
        .user-profile-wrapper { position: relative; padding: 10px 0; margin-left: 20px; }
        .user-profile { display: flex; align-items: center; gap: 6px; cursor: pointer; background: rgba(255,255,255,0.05); padding: 6px 15px; border-radius: 50px; color: white; border: 1px solid rgba(255,255,255,0.1); }
        .dropdown-menu { position: absolute; top: 50px; right: 0; width: 140px; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; flex-direction: column; padding: 8px 0; z-index: 1001; }
        .user-profile-wrapper:hover .dropdown-menu { display: flex; }
        .dropdown-item { padding: 10px 20px; color: var(--text-muted); text-decoration: none; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .dropdown-item:hover { background: rgba(255,255,255,0.05); color: white; }

        /* 聊天主容器 - Discord Style */
        .chat-container { display: flex; flex: 1; overflow: hidden; background: var(--bg); color: var(--text); }
        
        /* 左側列表區 */
        .sidebar { width: 300px; background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header { min-height: 70px; padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header h3 { margin: 0; font-size: 16px; color: white; width: 100%; }
        .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-icon { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; padding: 6px 10px; font-size: 11px; font-weight: bold; transition: 0.3s; white-space: nowrap; }
        .btn-icon:hover { background: var(--primary); color: white; border-color: var(--primary); }
        
        .chat-list { flex: 1; overflow-y: auto; padding: 20px 0; }
        .category-title { font-size: 11px; font-weight: 900; color: #475569; padding: 10px 25px; text-transform: uppercase; letter-spacing: 1.5px; }
        .chat-item { padding: 12px 20px; cursor: pointer; display: flex; flex-direction: column; transition: 0.2s; margin: 4px 15px; border-radius: 12px; }
        .chat-item:hover { background: rgba(255,255,255,0.03); }
        .chat-item.active { background: rgba(76, 151, 255, 0.1); border: 1px solid rgba(76, 151, 255, 0.2); }
        .chat-name { font-weight: bold; color: var(--text-muted); font-size: 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .chat-item:hover .chat-name, .chat-item.active .chat-name { color: white; }
        .chat-preview { font-size: 12px; color: #475569; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 25px; }
        .user-presence-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px rgba(0,0,0,0.3);
        }
        .user-presence-dot.online { background: #23a559; box-shadow: 0 0 8px rgba(35,165,89,0.7); }
        .user-presence-dot.offline { background: #6b7280; }
        .chat-unread-badge {
            margin-left: auto;
            padding: 1px 6px;
            border-radius: 999px;
            font-size: 10px;
            background: #5865f2;
            color: #fff;
            font-weight: 900;
        }
        .chat-item.friend-request {
            border: 1px solid rgba(244,127,36,0.3);
            background: rgba(244,127,36,0.07);
        }
        .chat-item.friend-item {
            border: 1px solid rgba(76,151,255,0.2);
            background: rgba(76,151,255,0.06);
        }
        .chat-item.message-request {
            border: 1px solid rgba(245,158,11,0.3);
            background: rgba(245,158,11,0.08);
        }
        .mini-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .mini-btn {
            flex: 1;
            border: none;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            color: #fff;
        }
        .mini-btn.accept { background: #23a559; }
        .mini-btn.reject { background: #ed4245; }
        .mini-btn.cancel { background: #4e5058; }
        .mini-btn.dm { background: #5865f2; }
        
        /* 右側對話區 */
        .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; min-height: 0; }
        .chat-header { height: 70px; padding: 0 30px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 900; font-size: 1.2rem; color: white; flex-shrink: 0; gap: 10px; }
        .chat-header h3 { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .chat-header-more-wrap { position: relative; }
        .chat-header-menu {
            display: none; position: absolute; right: 0; top: calc(100% + 6px); min-width: 168px;
            background: #1e1f22; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45); padding: 6px; z-index: 50;
        }
        .chat-header-menu.open { display: block; }
        .chat-header-menu button {
            display: block; width: 100%; text-align: left; border: none; background: transparent;
            color: #e2e8f0; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
        .chat-header-menu button:hover { background: rgba(255,255,255,0.06); }
        .chat-header-menu button.danger { color: #f87171; }
        .scroll-bottom-pill {
            position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%);
            z-index: 12; display: none; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(88,101,242,0.45);
            background: rgba(30,33,40,0.96); color: #c7d2fe; font-size: 13px; font-weight: 800;
            cursor: pointer; font-family: inherit; box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            backdrop-filter: blur(8px);
        }
        .scroll-bottom-pill.visible { display: inline-flex; }
        .chat-panel-backdrop {
            display: none; position: fixed; inset: 0; z-index: 10110;
            background: rgba(0,0,0,0.5); border: none; padding: 0; margin: 0; cursor: pointer;
        }
        .chat-panel-backdrop.active { display: block; }
        
        .messages-area { flex: 1; padding: 30px 0; overflow-y: auto; display: flex; flex-direction: column; }
        .messages-area::-webkit-scrollbar { width: 6px; }
        .messages-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        .message-row { display: flex; padding: 8px 30px; transition: 0.2s; margin-top: 20px; position: relative; }
        .message-row:hover { background: rgba(255,255,255,0.02); }
        .message-row.consecutive { margin-top: 2px; }
        .msg-avatar-container { width: 50px; margin-right: 20px; flex-shrink: 0; display: flex; justify-content: center; }
        .msg-avatar { width: 50px; height: 50px; border-radius: 16px; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); }
        .avatar-frame-neon {
            border-color: #22d3ee !important;
            box-shadow: 0 0 0 4px rgba(34,211,238,0.2), 0 0 18px rgba(34,211,238,0.45);
        }
        .avatar-frame-gold {
            border-color: #fbbf24 !important;
            box-shadow: 0 0 0 4px rgba(251,191,36,0.2), 0 0 18px rgba(251,191,36,0.45);
        }
        .avatar-frame-sakura {
            border-color: #f9a8d4 !important;
            box-shadow: 0 0 0 4px rgba(249,168,212,0.22), 0 0 18px rgba(244,114,182,0.4);
        }
        .avatar-frame-holo {
            border-color: #a78bfa !important;
            box-shadow: 0 0 0 4px rgba(167,139,250,0.22), 0 0 18px rgba(99,102,241,0.45);
        }
        .avatar-frame-obsidian {
            border-color: #94a3b8 !important;
            box-shadow: 0 0 0 4px rgba(71,85,105,0.28), 0 0 18px rgba(15,23,42,0.72);
        }
        .avatar-frame-cyberfire {
            border-color: #fb7185 !important;
            box-shadow: 0 0 0 4px rgba(251,113,133,0.2), 0 0 18px rgba(249,115,22,0.52);
        }
        .avatar-frame-aurora {
            border-color: #34d399 !important;
            box-shadow: 0 0 0 4px rgba(52,211,153,0.2), 0 0 18px rgba(59,130,246,0.45);
        }
        @keyframes particlePulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(251,113,133,0.2), 0 0 18px rgba(251,113,133,0.42), 0 0 28px rgba(245,158,11,0.32); }
            50% { box-shadow: 0 0 0 6px rgba(251,191,36,0.24), 0 0 24px rgba(251,113,133,0.5), 0 0 36px rgba(99,102,241,0.38); }
        }
        .avatar-frame-phoenix-particle {
            border-color: #fb7185 !important;
            animation: particlePulse 1.9s ease-in-out infinite;
        }
        .avatar-frame-quantum-particle {
            border-color: #60a5fa !important;
            animation: particlePulse 1.7s ease-in-out infinite reverse;
        }
        .avatar-frame-glitch-legend {
            border-color: #22d3ee !important;
            animation: particlePulse 1.5s ease-in-out infinite;
        }
        .avatar-frame-celestial-particle {
            border-color: #fbbf24 !important;
            animation: particlePulse 2s ease-in-out infinite;
        }
        .avatar-frame-eclipse-particle {
            border-color: #7c3aed !important;
            animation: particlePulse 1.8s ease-in-out infinite reverse;
        }
        .avatar-frame-stardust-particle {
            border-color: #a78bfa !important;
            animation: particlePulse 2.1s ease-in-out infinite;
        }
        .avatar-frame-bamboo {
            border-color: #4ade80 !important;
            box-shadow: 0 0 0 4px rgba(74,222,128,0.22), 0 0 18px rgba(21,128,61,0.4);
        }
        .avatar-frame-matrix {
            border-color: #4ade80 !important;
            box-shadow: 0 0 0 4px rgba(74,222,128,0.18), 0 0 18px rgba(22,163,74,0.45);
        }
        .avatar-frame-snowflake {
            border-color: #bae6fd !important;
            box-shadow: 0 0 0 4px rgba(186,230,253,0.25), 0 0 18px rgba(56,189,248,0.4);
        }
        .avatar-frame-amethyst {
            border-color: #c084fc !important;
            box-shadow: 0 0 0 4px rgba(192,132,252,0.22), 0 0 18px rgba(168,85,247,0.45);
        }
        .avatar-frame-thunder {
            border-color: #facc15 !important;
            box-shadow: 0 0 0 4px rgba(250,204,21,0.22), 0 0 18px rgba(59,130,246,0.48);
        }
        .avatar-frame-dragon-jade {
            border-color: #34d399 !important;
            box-shadow: 0 0 0 4px rgba(52,211,153,0.22), 0 0 18px rgba(5,150,105,0.48);
        }
        .avatar-frame-sunset-glow {
            border-color: #fb923c !important;
            box-shadow: 0 0 0 4px rgba(251,146,60,0.22), 0 0 18px rgba(244,63,94,0.4);
        }
        .avatar-frame-ocean-deep {
            border-color: #0891b2 !important;
            box-shadow: 0 0 0 4px rgba(8,145,178,0.22), 0 0 18px rgba(37,99,235,0.42);
        }
        .avatar-frame-stadium-spotlight {
            border-color: #facc15 !important;
            box-shadow: 0 0 0 4px rgba(250,204,21,0.22), 0 0 18px rgba(234,179,8,0.45);
        }
        .avatar-frame-moonlit-legend {
            border-color: #c4b5fd !important;
            animation: particlePulse 2.2s ease-in-out infinite;
        }
        .avatar-frame-rainbow-prism {
            border-color: #f472b6 !important;
            box-shadow: 0 0 0 4px rgba(244,114,182,0.22), 0 0 18px rgba(59,130,246,0.45);
        }
        .avatar-frame-lava-ring {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 4px rgba(239,68,68,0.22), 0 0 18px rgba(249,115,22,0.48);
        }
        .avatar-frame-frost-crystal {
            border-color: #67e8f9 !important;
            box-shadow: 0 0 0 4px rgba(103,232,249,0.25), 0 0 18px rgba(14,165,233,0.42);
        }
        .avatar-frame-circuit-pulse {
            border-color: #06b6d4 !important;
            box-shadow: 0 0 0 4px rgba(6,182,212,0.22), 0 0 18px rgba(59,130,246,0.45);
        }
        .avatar-frame-comet-legend {
            border-color: #fde68a !important;
            animation: particlePulse 2s ease-in-out infinite;
        }
        @keyframes legendGlowPulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(167,139,250,0.2), 0 0 16px rgba(99,102,241,0.42); }
            50% { box-shadow: 0 0 0 6px rgba(244,114,182,0.26), 0 0 28px rgba(251,191,36,0.55); }
        }
        @keyframes textShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes nameWave {
            0%, 100% { text-shadow: 0 0 0 rgba(56,189,248,0.2); }
            50% { text-shadow: 0 0 10px rgba(56,189,248,0.45); }
        }
        @keyframes namePrism {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 2px rgba(250,204,21,0.25)); }
            100% { background-position: 200% 50%; filter: drop-shadow(0 0 6px rgba(244,114,182,0.45)); }
        }
        @keyframes badgeFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1px); }
        }
        .avatar-frame-legendary {
            animation: legendGlowPulse 2.2s ease-in-out infinite;
        }
        .msg-time-hover { font-size: 11px; color: #475569; opacity: 0; text-align: center; width: 50px; }
        .message-row.consecutive:hover .msg-time-hover { opacity: 1; }
        
        .msg-content { display: flex; flex-direction: column; flex: 1; position: relative; padding-right: 120px; }
        .msg-header { display: flex; align-items: baseline; margin-bottom: 6px; }
        .msg-author { font-weight: 900; font-size: 1.1rem; color: white; margin-right: 12px; display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 6px; max-width: 100%; }
        .msg-author > .name-fx-text { display: inline; position: relative; z-index: 1; flex-shrink: 0; }
        .msg-author .user-title-badge,
        .msg-author .user-cosmetic-badge,
        .msg-author .bot-badge { flex-shrink: 0; }
        @keyframes nameFxPrismBurst {
            0%, 34%, 100% {
                color: #f8fafc !important;
                -webkit-text-fill-color: #f8fafc !important;
                background-image: none !important;
                text-shadow: none !important;
                filter: none !important;
            }
            40%, 64% {
                color: transparent !important;
                -webkit-text-fill-color: transparent !important;
                background-image: linear-gradient(90deg, #f59e0b, #22d3ee, #f43f5e, #a78bfa, #f59e0b) !important;
                background-size: 220% 100% !important;
                -webkit-background-clip: text !important;
                background-clip: text !important;
                text-shadow: 0 0 10px rgba(245,158,11,0.45);
            }
        }
        @keyframes nameFxAuroraBurst {
            0%, 34%, 100% {
                color: #f8fafc !important;
                -webkit-text-fill-color: #f8fafc !important;
                background-image: none !important;
                text-shadow: none !important;
            }
            40%, 64% {
                color: transparent !important;
                -webkit-text-fill-color: transparent !important;
                background-image: linear-gradient(90deg, #34d399, #60a5fa, #a78bfa, #34d399) !important;
                background-size: 220% 100% !important;
                -webkit-background-clip: text !important;
                background-clip: text !important;
            }
        }
        @keyframes nameFxRainbowBurst {
            0%, 34%, 100% {
                color: #f8fafc !important;
                -webkit-text-fill-color: #f8fafc !important;
                background-image: none !important;
                text-shadow: none !important;
            }
            40%, 64% {
                color: transparent !important;
                -webkit-text-fill-color: transparent !important;
                background-image: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #a855f7, #ef4444) !important;
                background-size: 300% 100% !important;
                -webkit-background-clip: text !important;
                background-clip: text !important;
            }
        }
        @keyframes nameFxGlowBurst {
            0%, 34%, 100% { text-shadow: none; filter: none; }
            40%, 64% { text-shadow: var(--chat-name-glow, 0 0 10px rgba(56,189,248,0.5)); }
        }
        .name-fx-text.name-effect-wave {
            color: #f8fafc !important;
            --chat-name-glow: 0 0 10px rgba(59,130,246,0.5);
            animation: nameFxGlowBurst 2.6s ease-in-out infinite;
        }
        .name-fx-text.name-effect-prism {
            animation: nameFxPrismBurst 2.8s ease-in-out infinite;
            font-weight: 900;
        }
        .name-fx-text.name-effect-stardust {
            color: #f8fafc !important;
            --chat-name-glow: 0 0 10px rgba(251,191,36,0.55), 0 0 16px rgba(167,139,250,0.4);
            animation: nameFxGlowBurst 2.6s ease-in-out infinite;
        }
        .name-fx-text.name-effect-pulse-core {
            color: #f8fafc !important;
            --chat-name-glow: 0 0 12px rgba(244,114,182,0.65);
            animation: nameFxGlowBurst 2.4s ease-in-out infinite;
        }
        .name-fx-text.name-effect-aurora-pulse {
            animation: nameFxAuroraBurst 2.8s ease-in-out infinite;
            font-weight: 900;
        }
        .name-fx-text.name-effect-rainbow {
            animation: nameFxRainbowBurst 3s ease-in-out infinite;
            font-weight: 900;
        }
        .name-fx-text.name-effect-neon-flicker {
            color: #e2e8f0 !important;
            --chat-name-glow: 0 0 10px rgba(34,211,238,0.7), 0 0 18px rgba(244,114,182,0.45);
            animation: nameFxGlowBurst 2.2s ease-in-out infinite;
        }
        .name-fx-text.name-effect-sparkle {
            color: #f8fafc !important;
            --chat-name-glow: 0 0 8px rgba(250,204,21,0.65);
            animation: nameFxGlowBurst 2.2s ease-in-out infinite;
        }
        .name-fx-text.name-effect-glitch {
            color: #f8fafc !important;
            --chat-name-glow: 0 0 8px rgba(34,211,238,0.55);
            animation: nameFxGlowBurst 2.4s ease-in-out infinite;
        }
        .msg-time { font-size: 12px; color: var(--text-muted); }
        .msg-edited { margin-left: 6px; color: #94a3b8; font-size: 11px; font-style: italic; }
        .msg-quick-actions {
            position: absolute;
            top: 4px;
            right: 0;
            display: inline-flex;
            gap: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
            background: rgba(15,23,42,0.92);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 4px;
            z-index: 3;
        }
        .message-row:hover .msg-quick-actions,
        .message-row:focus-within .msg-quick-actions {
            opacity: 1;
            pointer-events: auto;
        }
        .msg-quick-btn {
            border: none;
            background: rgba(255,255,255,0.08);
            color: #e2e8f0;
            border-radius: 8px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 900;
            line-height: 1;
            font-family: inherit;
        }
        .msg-quick-btn:hover { background: rgba(88,101,242,0.25); color: #fff; }
        .msg-quick-btn.danger:hover { background: rgba(237,66,69,0.25); color: #fecaca; }
        .msg-text { font-size: 15px; line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word; }
        .message-row.bot-msg .msg-author { color: #23a559; }
        .message-row.bot-msg .msg-avatar { border-color: rgba(35,165,89,0.4); }

    function bindStaffFallback() {
        STAFF_COSMETIC_ITEMS = [];
        STAFF_AVATAR_URLS = {};
        getStaffRole = () => "";
        staffRoleLabel = () => "";
        staffBadgeHtml = () => "";
        staffRoleForSnapshot = () => "";

        isStaffLegendaryTitle = () => false;
        isStaffLegendaryFrame = () => false;
        staffFrameClass = () => "";
        staffNameEffectClass = () => "";
        staffProfileEffectClass = () => "";
        ownedItemsBySlotWithStaff = function (data, allItems, slot) {
            const inv = Array.isArray(data && data.inventory) ? data.inventory : [];
            const ids = new Set(inv.map((x) => (typeof x === "string" ? x : (x && x.id) || "")).filter(Boolean));
            return allItems.filter((it) => it.slot === slot && ids.has(it.id));
        };
        pickOwnedWithStaff = function (data, allItems, slot) {
            const eq = (data && data.equippedCosmetics) ? data.equippedCosmetics : {};
            const owned = ownedItemsBySlotWithStaff(data, allItems, slot);
            const raw = String(eq[slot] || "").trim();
            if (!raw) return "";
            if (owned.some((it) => it.value === raw)) return raw;
            const byId = owned.find((it) => it.id === raw);
            return byId ? byId.value : "";
        };
        resolveVisualWithStaff = function (data, allItems, slot, fallbackRaw, helpers) {
            const eq = data ? ((helpers && helpers.getEquipped) ? helpers.getEquipped(data) : (data.equippedCosmetics || {})) : {};
            const raw = String(fallbackRaw !== undefined ? fallbackRaw : eq[slot] || "").trim();
            if (!raw) return "";
            const cosmeticDisplayValue = (helpers && helpers.cosmeticDisplayValue) || function (s, r) {
                const v = String(r || "").trim();
                if (!v) return "";
                const item = allItems.find((it) => it.slot === s && (it.value === v || it.id === v));
                return item ? item.value : "";
            };
            let normalized = cosmeticDisplayValue(slot, raw);
            if (!normalized && allItems.some((it) => it.slot === slot && it.value === raw)) normalized = raw;
            if (!normalized) return "";
            if (!data) return normalized;
            const owned = ownedItemsBySlotWithStaff(data, allItems, slot);
            if (owned.some((it) => it.value === normalized)) return normalized;
            const viaPick = pickOwnedWithStaff({ ...data, equippedCosmetics: { ...eq, [slot]: raw } }, allItems, slot);
            if (viaPick) return viaPick;
            if (String(eq[slot] || "").trim() || (fallbackRaw !== undefined && String(fallbackRaw).trim())) return normalized;
            return "";
        };

        const backdrop = document.getElementById("chat-panel-backdrop");
        const showBackdrop = isMobileChatShell() && (profileOpen || sidebarOpen);
        if (backdrop) {
            backdrop.classList.toggle("active", showBackdrop);
            backdrop.setAttribute("aria-hidden", showBackdrop ? "false" : "true");
        }
    }

    function collapseChatComposer() {
        const input = document.getElementById("msg-input");
        if (input) input.blur();
        document.body.classList.add("chat-composer-collapsed");
        syncMobileChatChrome();
    }

    function expandChatComposer() {
        document.body.classList.remove("chat-composer-collapsed");
        syncMobileChatChrome();
        focusChatInput();
        requestAnimationFrame(function () {
            const input = document.getElementById("msg-input");
            if (input && typeof input.scrollIntoView === "function") {
                input.scrollIntoView({ block: "nearest", behavior: "smooth" });
            }
        });
    }

    window.collapseChatComposer = collapseChatComposer;
    window.expandChatComposer = expandChatComposer;

    function syncMobileModalOpen() {
        if (!document.body.classList.contains("doratch-app-mode")) return;
        const open = ["modal", "cosmetic-modal", "chat-prefs-modal"].some((id) => {
            const el = document.getElementById(id);
            return el && el.style.display === "flex";
        });
        document.body.classList.toggle("doratch-modal-open", open);
    }

    function syncMobileChatView(active) {
        if (!isMobileChatShell()) return;
        document.body.classList.toggle("chat-mobile-active", !!active);
    }

        hideProfilePop();

        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || ""));
    }

    async function confirmUserByEmail(email, actionLabel) {
        const targetEmail = normalizeEmailInput(email);
        if (!targetEmail) throw new Error("EMPTY_EMAIL");
        if (!isValidEmailFormat(targetEmail)) {
            alert("Email 格式不正確，請再檢查一次。");
            throw new Error("INVALID_EMAIL");
        }
        const target = await fetchUserByEmail(targetEmail);
        if (!target || !target.uid) {
            alert("找不到此 Email 的使用者。對方可能尚未註冊，或 Email 打錯了。");
            throw new Error("USER_NOT_FOUND");
        }
        const label = displayNameFromUser(target);
        const ok = confirm(
            `${actionLabel}\n\n對象：${label}\nEmail：${target.email || targetEmail}\n\n請確認是否為正確的人？`
        );
        if (!ok) throw new Error("USER_CANCELLED");
        return { ...target, email: target.email || targetEmail };
    }

        if (!chatPrefs.desktopNotification || typeof Notification === "undefined") return;

            const eq = getEquipped(data);

            }
        }
        return cosmeticDisplayValue(slot, raw);
    }

    async function sendFriendRequestByEmail(targetEmailRaw) {
        const targetEmail = normalizeEmailInput(targetEmailRaw);
        const currentEmail = String(currentUser?.email || "").toLowerCase();
        if (!targetEmail) throw new Error("EMPTY_EMAIL");
        if (!isValidEmailFormat(targetEmail)) throw new Error("INVALID_EMAIL");
        if (targetEmail === currentEmail) throw new Error("SELF_REQUEST");

        const target = await confirmUserByEmail(targetEmail, "送出好友請求給：");
        const targetUid = target.uid;
        if (isFriendWithUid(targetUid)) throw new Error("ALREADY_FRIEND");

        const reqId = friendDocId(currentUser.uid, targetUid);
        const reverseId = friendDocId(targetUid, currentUser.uid);
        const reqRef = doc(db, "friend_requests", reqId);
        const revRef = doc(db, "friend_requests", reverseId);
        const [reqSnap, revSnap] = await Promise.all([getDoc(reqRef), getDoc(revRef)]);

        if (reqSnap.exists() && (reqSnap.data().status || "pending") === "pending") throw new Error("REQUEST_ALREADY_SENT");
        if (revSnap.exists()) {
            const status = revSnap.data().status || "pending";
            if (status === "pending") throw new Error("REQUEST_ALREADY_SENT_REVERSE");
            if (status === "accepted") throw new Error("ALREADY_FRIEND");
        }

        await setDoc(reqRef, {
            fromUid: currentUser.uid,
            toUid: targetUid,
            fromEmail: currentUser.email || "",
            toEmail: targetEmail,
            participants: [currentUser.uid, targetUid],
            status: "pending",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
        }, { merge: true });
    }

    function subscribeFriendPanels() {
        if (unsubscribeFriendIncoming) unsubscribeFriendIncoming();
        if (unsubscribeFriendOutgoing) unsubscribeFriendOutgoing();
        if (unsubscribeFriendLinks) unsubscribeFriendLinks();

        const qIncoming = query(collection(db, "friend_requests"), where("toUid", "==", currentUser.uid));
        const qOutgoing = query(collection(db, "friend_requests"), where("fromUid", "==", currentUser.uid));
        const qLinks = query(collection(db, "friend_requests"), where("participants", "array-contains", currentUser.uid));

        unsubscribeFriendIncoming = onSnapshot(qIncoming, async (snap) => {
            friendIncoming = [];
            snap.forEach((d) => {
                const data = d.data() || {};
                if ((data.status || "pending") === "pending") friendIncoming.push({ id: d.id, ...data });
            });
            if (chatPrefs.notifyFriendRequest && incomingFriendRequestCount >= 0 && friendIncoming.length > incomingFriendRequestCount) {
                maybeDesktopNotify("Doratch 好友請求", "你收到新的好友請求");
            }
            incomingFriendRequestCount = friendIncoming.length;
            await renderFriendPanels();
        });
        unsubscribeFriendOutgoing = onSnapshot(qOutgoing, async (snap) => {
            friendOutgoing = [];
            snap.forEach((d) => {
                const data = d.data() || {};
                if ((data.status || "pending") === "pending") friendOutgoing.push({ id: d.id, ...data });
            });
            await renderFriendPanels();
        });
        unsubscribeFriendLinks = onSnapshot(qLinks, async (snap) => {
            friendLinks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            await renderFriendPanels();
        });
    }

                return;
            }

            // 在前端進行排序，避免需要 Firebase 建立複合索引 (Composite Index)
            const chats = [];
            snapshot.forEach(docSnap => chats.push({ id: docSnap.id, ...docSnap.data() }));
            chats.sort((a, b) => {
                const t1 = a.updatedAt ? a.updatedAt.toMillis() : 0;
                const t2 = b.updatedAt ? b.updatedAt.toMillis() : 0;
                return t2 - t1;
            });

            let incomingReqCount = 0;
            chats.forEach(chat => {
                let displayName = chat.name || "未命名";
                let rawName = displayName;
                let icon = '💬';
                if (chat.type === 'private') {
                    icon = '👤';
                    displayName = (chat.participantEmails || []).find(e => e !== currentUser.email) || "未知使用者";
                    displayName = displayName.split('@')[0];
                    rawName = displayName;
                } else if (chat.type === 'server') {
                    icon = '🏫';
                    displayName += ` <span style="font-size:10px; opacity:0.7; font-weight:normal;">(代碼: ${chat.id})</span>`;
                } else {
                    icon = '👥';
                }

                const item = document.createElement('div');
                item.className = `chat-item ${currentChatId === chat.id ? 'active' : ''}`;
                item.onclick = () => openChat(chat.id, rawName, icon, chat.type, chat.teacherId);
                
                const timeStr = chat.updatedAt ? formatMsgTime(chat.updatedAt.toDate()) : '';
                const readMap = chat.lastReadBy || {};
                const myReadAt = toMillis(readMap[currentUser.uid]);
                const updatedAtMs = toMillis(chat.updatedAt);
                const unread = updatedAtMs > 0 && updatedAtMs > myReadAt && chat.lastSenderId && chat.lastSenderId !== currentUser.uid;
                const unreadHtml = unread ? '<span class="chat-unread-badge">NEW</span>' : '';
                const requestPending = chat.type === 'private' && chat.requestStatus === 'pending';
                const isIncomingReq = requestPending && chat.requestTo === currentUser.uid;
                const isOutgoingReq = requestPending && chat.requestFrom === currentUser.uid;

                const seenBefore = Object.prototype.hasOwnProperty.call(chatUpdatedAtCache, chat.id);
                if (chatPrefs.notifyMessage && seenBefore && unread && updatedAtMs > (chatUpdatedAtCache[chat.id] || 0)) {
                    maybeDesktopNotify(`Doratch 新訊息：${rawName}`, chat.lastMessage || "你有一則新訊息");
                }
                chatUpdatedAtCache[chat.id] = Math.max(chatUpdatedAtCache[chat.id] || 0, updatedAtMs);

                if (isIncomingReq) {
                    incomingReqCount += 1;
                    if (msgReqList) {
                        const reqItem = document.createElement("div");
                        reqItem.className = "chat-item message-request";
                        reqItem.innerHTML = `
                            <div class="chat-name">📨 ${rawName}</div>
                            <div class="chat-preview">等待你接受後才能開始聊天</div>
                            <div class="mini-actions">
                                <button class="mini-btn accept" onclick="acceptMessageRequest('${chat.id}')">接受</button>
                                <button class="mini-btn reject" onclick="rejectMessageRequest('${chat.id}')">拒絕</button>
                            </div>
                        `;
                        msgReqList.appendChild(reqItem);
                    }
                }
                if (isOutgoingReq) {
                    item.classList.add("message-request");
                }

                const privateRemoveBtn = (chat.type === "private" && !isIncomingReq)
                    ? `<div class="mini-actions"><button type="button" class="mini-btn cancel" onclick="event.stopPropagation();${isOutgoingReq ? `cancelMessageRequest('${chat.id}')` : `removePrivateChat('${chat.id}')`}">${isOutgoingReq ? "取消請求" : "移除私訊"}</button></div>`
                    : "";

                item.innerHTML = `
                    <div class="chat-name">${icon} ${displayName} ${unreadHtml} <span style="margin-left:auto; font-size:10px; color:#949ba4; font-weight:normal;">${timeStr}</span></div>
                    <div class="chat-preview">${isOutgoingReq ? '你已送出訊息請求，等待對方回應' : (chat.lastMessage || '開始聊天吧！')}</div>
                    ${privateRemoveBtn}
                `;
                
                if (chat.type === 'server') {
                    document.getElementById('list-server').appendChild(item);
                } else if (chat.type === 'private') {
                    document.getElementById('list-private').appendChild(item);
                } else {
                    document.getElementById('list-group').appendChild(item);
                }
            });
            if (msgReqCategory) msgReqCategory.style.display = incomingReqCount ? "block" : "none";
            if (chatPrefs.notifyMessageRequest && incomingMessageRequestCount >= 0 && incomingReqCount > incomingMessageRequestCount) {
                maybeDesktopNotify("Doratch 訊息請求", "你收到新的訊息請求");
            }
            incomingMessageRequestCount = incomingReqCount;
        });

        // 監聽待審批邀請
        const qInvites = query(
            collection(db, "chats"),
            where("pendingInvites", "array-contains", currentUser.uid)
        );

        onSnapshot(qInvites, (snapshot) => {
            const listDiv = document.getElementById('list-invites');
            const categoryDiv = document.getElementById('category-invite');
            listDiv.innerHTML = '';
            
            if (snapshot.empty) {
                categoryDiv.style.display = 'none';
                return;
            }
            categoryDiv.style.display = 'block';

            snapshot.forEach(docSnap => {
                const chat = { id: docSnap.id, ...docSnap.data() };
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.style.borderLeft = '3px solid #f47f24';
                item.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <div style="font-size:13px; font-weight:bold;">💌 邀請：${chat.name}</div>
                        <div style="display:flex; gap:10px;">
                            <button style="flex:1; background:#4CAF50; color:white; border:none; padding:4px; border-radius:4px; cursor:pointer; font-weight:bold;" onclick="handleInvite('${chat.id}', true)">接受</button>
                            <button style="flex:1; background:#FF4D4D; color:white; border:none; padding:4px; border-radius:4px; cursor:pointer; font-weight:bold;" onclick="handleInvite('${chat.id}', false)">拒絕</button>
                        </div>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        });
    }

    // 處理邀請接受/拒絕
    window.handleInvite = async (chatId, isAccept) => {
        try {
            const ref = doc(db, "chats", chatId);
            if (isAccept) {
                const groupCount = await checkGroupLimit();
                if (groupCount >= 20) {
                    alert("接受失敗：您最多只能加入 20 個群組或伺服器！");
                    return;
                }
                await updateDoc(ref, {
                    pendingInvites: arrayRemove(currentUser.uid),
                    participants: arrayUnion(currentUser.uid)
                });
                alert("已成功加入！");
            } else {
                if(!confirm("確定要拒絕此邀請嗎？")) return;
                await updateDoc(ref, {
                    pendingInvites: arrayRemove(currentUser.uid)
                });
            }
        } catch (e) {
            alert("處理失敗：" + e.message);
        }
    };

    let currentChatTeacherId = null;
    let currentChatType = null;
    let currentChatName = "";
    let currentChatIcon = "💬";

    async function renderTypingIndicator(typingUsersMap) {
        const el = document.getElementById("typing-indicator");
        if (!el || !currentChatId) return;
        const map = typingUsersMap || {};
        const now = Date.now();
        const activeUids = Object.keys(map).filter((uid) => {
            if (uid === currentUser.uid) return false;
            const ms = toMillis(map[uid]);
            return ms && (now - ms) < 8000;
        });
        if (!activeUids.length) {
            el.textContent = "";
            return;
        }
        const names = [];
        for (const uid of activeUids.slice(0, 2)) {
            const u = await fetchUserByUid(uid);
            if (u) names.push(displayNameFromUser(u));
        }
        if (!names.length) {
            el.textContent = "有人正在輸入...";
            return;
        }
        el.textContent = names.join("、") + (activeUids.length > 2 ? " 等人" : "") + " 正在輸入...";
    }

    function clearMyTypingIndicator() {
        if (!currentChatId || !currentUser) return;
        updateDoc(doc(db, "chats", currentChatId), {
            [`typingUsers.${currentUser.uid}`]: deleteField()
        }).catch(function () {});
    }

    function scheduleTypingPulse() {
        if (!currentChatId || !currentUser) return;
        const now = Date.now();
        // 節流：避免每敲一個字就觸發一次雲端更新導致畫面抖動
        if (now - lastTypingSentAt > 1200) {
            lastTypingSentAt = now;
            updateDoc(doc(db, "chats", currentChatId), {
                [`typingUsers.${currentUser.uid}`]: serverTimestamp()
            }).catch(function () {});
        }
        if (typingPulseTimer) clearTimeout(typingPulseTimer);
        typingPulseTimer = setTimeout(function () {
            clearMyTypingIndicator();
            typingPulseTimer = null;
        }, 7000);
    }

    function applyPrivateRequestState(chatData) {
        const banner = document.getElementById("private-request-banner");
        const hint = document.getElementById("private-request-text");
        const actions = document.getElementById("private-request-actions");
        const input = document.getElementById("msg-input");
        const sendBtn = document.getElementById("btn-send-msg");
        if (!banner || !hint || !actions || !input || !sendBtn) return;
        if (currentChatType !== "private") {
            banner.style.display = "none";
            input.disabled = false;
            sendBtn.disabled = false;
            return;
        }
        const status = (chatData && chatData.requestStatus) ? chatData.requestStatus : "accepted";
        if (status !== "pending") {
            banner.style.display = "none";
            input.disabled = false;
            sendBtn.disabled = false;
            return;
        }
        banner.style.display = "flex";
        input.disabled = true;
        sendBtn.disabled = true;
        if (chatData.requestTo === currentUser.uid) {
            hint.textContent = "此私訊正在等待你回應。";
            actions.innerHTML = `
                <button class="mini-btn accept" onclick="acceptMessageRequest('${currentChatId}')">接受</button>
                <button class="mini-btn reject" onclick="rejectMessageRequest('${currentChatId}')">拒絕</button>
            `;
        } else {
            hint.textContent = "你已送出訊息請求，請等待對方接受。";
            actions.innerHTML = `<button class="mini-btn cancel" onclick="cancelMessageRequest('${currentChatId}')">取消請求</button>`;
        }
    }

    function handleChatInputKeydown(ev) {
        if (ev.key !== "Enter") return;
        if (ev.shiftKey) {
            ev.stopPropagation();
            return;
        }
        if (chatPrefs.enterToSend) {
            ev.preventDefault();
            ev.stopPropagation();
            window.sendMessage();
            return;
        }
        if (ev.ctrlKey || ev.metaKey) {
            ev.preventDefault();
            ev.stopPropagation();
            window.sendMessage();
            return;
        }
        // enterToSend 關閉：保留純 Enter 換行
        ev.stopPropagation();
    }

    function autoGrowInput(input) {
        if (!input) return;
        input.style.height = "24px";
        const next = Math.min(input.scrollHeight, 160);
        input.style.height = next + "px";
    }

    function focusChatInput() {
        const input = document.getElementById("msg-input");
        if (!input || input.disabled) return;
        input.focus();
        const end = input.value.length;
        if (typeof input.setSelectionRange === "function") input.setSelectionRange(end, end);
    }

    // 3. 開啟特定聊天室
    window.openChat = (chatId, chatName, icon, chatType, teacherId) => {
        const prevChatId = currentChatId;
        if (prevChatId && prevChatId !== chatId && currentUser) {
            updateDoc(doc(db, "chats", prevChatId), {
                [`typingUsers.${currentUser.uid}`]: deleteField()
            }).catch(function () {});
        }
        currentChatId = chatId;
        currentChatTeacherId = teacherId;
        currentChatType = chatType;
        currentChatName = chatName;
        currentChatIcon = icon || "💬";
        if (typingPulseTimer) {
            clearTimeout(typingPulseTimer);
            typingPulseTimer = null;
        }
        Object.keys(botSessionCache).forEach(k => delete botSessionCache[k]);
        
        // 更新樣式
        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
        const activeItem = Array.from(document.querySelectorAll('.chat-item')).find(el => el.onclick.toString().includes(chatId));
        if (activeItem) activeItem.classList.add('active');

        const displayTitle = chatType === 'server' ? `${chatName} <span style="font-size:12px; color:#949ba4;">(代碼: ${chatId})</span>` : chatName;
        const headerActionsHtml = buildChatHeaderActionsHtml(chatId, chatType, teacherId);

        const mobileBackBtn = isMobileChatShell()
            ? `<button type="button" class="chat-mobile-back btn-icon" onclick="closeMobileChatView()" title="返回頻道列表">←</button>`
            : "";

        const mainDiv = document.getElementById('chat-main');
        mainDiv.innerHTML = `
            <div class="chat-header">
                ${mobileBackBtn}
                <h3 id="current-chat-name" style="margin: 0; font-size: 1.1rem;">${icon} ${displayTitle}</h3>
                <div class="chat-header-actions">${headerActionsHtml}</div>
            </div>
            <div class="messages-area" id="messages-area"></div>
            <button type="button" class="scroll-bottom-pill" id="scroll-bottom-pill" onclick="scrollMessagesToBottom()">↓ 新訊息</button>
            <button type="button" class="chat-composer-teaser" onclick="expandChatComposer()"><span class="chat-composer-teaser-icon">💬</span><span class="chat-composer-teaser-text">輸入訊息…</span></button>
            <div class="input-area">
                <div class="request-banner" id="private-request-banner">
                    <span id="private-request-text"></span>
                    <div class="mini-actions" id="private-request-actions"></div>
                </div>
                <div class="reply-bar" id="reply-bar">
                    <span id="reply-bar-text"></span>
                    <button type="button" onclick="clearReplyTarget()">取消</button>
                </div>
                <div class="typing-indicator" id="typing-indicator"></div>
                <div class="slash-picker" id="slash-picker" style="display:none;"></div>
                <div class="input-wrapper">
                    <button class="btn-attach" onclick="document.getElementById('file-input').click()" title="上傳 .xml 專案檔">➕</button>
                    <input type="file" id="file-input" accept=".xml" style="display:none" onchange="sendFile(this)">
                    <button type="button" class="btn-slash-chip" id="btn-slash-chip" title="斜線指令">/</button>
                    <textarea id="msg-input" class="input-box" rows="1" placeholder="傳送訊息，Shift+Enter 換行，或輸入 / 使用斜線指令…"></textarea>
                    <button type="button" class="btn-send" id="btn-send-msg">送出</button>
                </div>
            </div>
        `;

        syncMobileChatView(true);

        if (unsubscribeMessages) unsubscribeMessages();
        if (unsubscribeChatDoc) unsubscribeChatDoc();

        updateDoc(doc(db, "chats", chatId), {
            [`lastReadBy.${currentUser.uid}`]: serverTimestamp()
        }).catch(function () {});

        // 監聽聊天室文件（用於更新成員名單等）
        unsubscribeChatDoc = onSnapshot(doc(db, "chats", chatId), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                currentChatParticipants = data.participants || [];
                currentChatAttachedBots = data.attachedBots || [];
                refreshChatBotsMeta();
                renderTypingIndicator(data.typingUsers || {});
                if (currentChatType === "private") {
                    applyPrivateRequestState(data);
                }
            }
        });

        const q = query(
            collection(db, "chats", chatId, "messages"),
            orderBy("createdAt", "asc")
        );

    window.currentMessages = {}; // 全域暫存，供下載檔案用

    unsubscribeMessages = onSnapshot(q, (snapshot) => {
        const msgArea = document.getElementById('messages-area');
        let html = '';
        let lastSenderId = null;
        let lastTimeStr = null;
        
        window.currentMessages = {};

        snapshot.forEach(docSnap => {
            const msg = docSnap.data();
            window.currentMessages[docSnap.id] = msg;
            
            const isBotMsg = msg.type === 'bot' || msg.senderType === 'bot';
            const senderCosmetics = (!isBotMsg && msg.senderCosmetics && typeof msg.senderCosmetics === "object")
                ? msg.senderCosmetics
                : { avatar: "", frame: "", title: "", badge: "", nameColor: "", nameEffect: "", profileEffect: "", staffRole: "" };
            const senderName = isBotMsg
                ? (msg.botName || "Bot")
                : (msg.senderDisplayName || (msg.senderEmail || "未知").split('@')[0]);
            const timeObj = msg.createdAt ? msg.createdAt.toDate() : new Date();
            const timeStr = formatMsgTime(timeObj);
            const fullTimeStr = formatMsgFullTime(timeObj);
            const avatarUrl = isBotMsg
                ? `https://ui-avatars.com/api/?name=${encodeURIComponent(msg.botName || "Bot")}&background=23a559&color=fff`
                : avatarFromCosmetics(msg.senderEmail || senderName, senderCosmetics.avatar || "");
            const baseFrame = isBotMsg ? "" : frameClass(senderCosmetics.frame || "");
            const avatarFrame = (!isBotMsg && isLegendaryFrame(senderCosmetics.frame || ""))
                ? (baseFrame + " avatar-frame-legendary")
                : baseFrame;
            const editedMark = msg.editedAt ? `<span class="msg-edited">(edited)</span>` : "";
            const mine = msg.senderId === currentUser.uid;
            let quickActionsHtml = `<div class="msg-quick-actions"><button class="msg-quick-btn" title="回覆" onclick="replyMessageById('${docSnap.id}')">↩</button>`;
            if (mine && msg.type === "text") quickActionsHtml += `<button class="msg-quick-btn" title="編輯" onclick="editMessageById('${docSnap.id}')">✏️</button>`;
            if (mine) quickActionsHtml += `<button class="msg-quick-btn danger" title="刪除" onclick="deleteMessageById('${docSnap.id}')">🗑️</button>`;
            quickActionsHtml += `</div>`;
            
            const isConsecutive = (lastSenderId === msg.senderId) && (lastTimeStr === fullTimeStr);
            const isTeacher = currentChatTeacherId && msg.senderId === currentChatTeacherId;
            const badgeLabel = currentChatType === 'server' ? '房主' : '管理員';
            const teacherBadge = isTeacher ? `<span style="background: #5865F2; color: white; border-radius: 4px; padding: 2px 6px; font-size: 10px; margin-left: 6px; vertical-align: middle;">👑 ${badgeLabel}</span>` : '';
            const botBadge = isBotMsg ? `<span class="bot-badge">BOT</span>` : '';
            const titleCls = (!isBotMsg && isLegendaryTitle(senderCosmetics.title || ""))
                ? ("user-title-badge legendary-title" + (isStaffLegendaryTitle(senderCosmetics.title || "") ? " staff-legendary" : "") + (isDocoinLegendaryTitle(senderCosmetics.title || "") ? " docoin-title-lux" : ""))
                : "user-title-badge";
            const badgeCls = (!isBotMsg && isLegendaryBadge(senderCosmetics.badge || ""))
                ? ("user-cosmetic-badge legendary-badge" + (isStaffLegendaryBadge(senderCosmetics.badge || "") ? " staff-legendary" : "") + (isMythicBadge(senderCosmetics.badge || "") ? " legendary-badge-mythic" : ""))
                : "user-cosmetic-badge";
            const titleBadge = (!isBotMsg && senderCosmetics.title)
                ? `<span class="${titleCls}"><span class="chip-icon">🏷️</span><span class="chip-label">${escHtml(senderCosmetics.title)}</span></span>`
                : '';
            const cosmeticBadge = (!isBotMsg && senderCosmetics.badge) ? `<span class="${badgeCls}">✨ ${escHtml(senderCosmetics.badge)}</span>` : '';
            const nameStyle = (!isBotMsg && senderCosmetics.nameColor) ? nameColorStyleAttr(senderCosmetics.nameColor, senderCosmetics.nameEffect) : '';
            const nameEffectCls = (!isBotMsg && senderCosmetics.nameEffect) ? nameEffectClass(senderCosmetics.nameEffect) : "";
            const docoinAvatarLux = !isBotMsg && isDocoinAvatar(senderCosmetics.avatar || "");
            const msgStaffRole = !isBotMsg ? String(senderCosmetics.staffRole || "").trim() : "";
            const rowClass = isBotMsg ? 'message-row bot-msg' : ('message-row' + (msgStaffRole === 'developer' ? ' staff-dev-glow' : msgStaffRole === 'admin' ? ' staff-admin-glow' : ''));
            const staffRoleBadge = (!isBotMsg && msgStaffRole) ? staffBadgeHtml(msgStaffRole) : '';
            const staffAvatarHalo = msgStaffRole === 'developer' ? ' staff-avatar-halo-dev' : (msgStaffRole === 'admin' ? ' staff-avatar-halo-admin' : '');
            const staffBubbleCls = msgStaffRole === 'developer' ? ' staff-msg-bubble-dev' : (msgStaffRole === 'admin' ? ' staff-msg-bubble-admin' : '');
            const staffNameGlow = (!isBotMsg && msgStaffRole === 'developer') ? ' staff-author-dev' : ((!isBotMsg && msgStaffRole === 'admin') ? ' staff-author-admin' : '');
            const replyHtml = msg.replyTo
                ? `<div class="reply-quote">回覆 ${escHtml(msg.replyTo.senderName || "使用者")}：${escHtml((msg.replyTo.type === "file" ? ("📁 " + (msg.replyTo.fileName || "檔案")) : (msg.replyTo.text || "")).slice(0, 90))}</div>`
                : "";
            
            let contentHtml = '';
            if (msg.type === 'file') {
                contentHtml = `
                    <div class="msg-file-card ${(!isBotMsg && (isLegendaryFrame(senderCosmetics.frame || "") || isLegendaryTitle(senderCosmetics.title || "") || isLegendaryBadge(senderCosmetics.badge || ""))) ? "legendary-share" : ""}" onclick="downloadXml('${docSnap.id}')">
                        <div class="file-icon">📄</div>
                        <div class="file-info">
                            <div class="file-name">${msg.fileName}</div>
                            <div class="file-sub">Blockly XML 專案檔 (點擊下載)</div>
                        </div>
                        <div class="file-download-icon">⬇️</div>
                    </div>
                `;
            } else {
                contentHtml = isBotMsg ? renderBotMessageBody(msg) : `<div class="msg-text">${escHtml(msg.text || "")}</div>`;
            }

            if (isConsecutive) {
                html += `
                    <div class="${rowClass} consecutive" data-sender-id="${escHtml(msg.senderId || "")}" data-staff-role="${escHtml(msgStaffRole)}">
                        <div class="msg-avatar-container"><span class="msg-time-hover">${timeStr}${msg.editedAt ? " (edited)" : ""}</span></div>
                        <div class="msg-content${staffBubbleCls}" oncontextmenu="openMessageMenu(event,'${docSnap.id}')">${quickActionsHtml}${replyHtml}${contentHtml}</div>
                    </div>
                `;
            } else {
                html += `
                    <div class="${rowClass}" data-sender-id="${escHtml(msg.senderId || "")}" data-staff-role="${escHtml(msgStaffRole)}" oncontextmenu="openMessageMenu(event,'${docSnap.id}')">
                        <div class="msg-avatar-container${docoinAvatarLux ? " docoin-avatar-lux" : ""}${staffAvatarHalo}"><img src="${avatarUrl}" class="msg-avatar ${avatarFrame}" onclick="openProfileByMessage(event,'${docSnap.id}')"></div>
                        <div class="msg-content${staffBubbleCls}">
                            ${quickActionsHtml}
                            <div class="msg-header">
                                <span class="msg-author${staffNameGlow}"><span class="name-fx-text ${nameEffectCls}"${nameStyle}>${escHtml(senderName)}</span>${staffRoleBadge}${teacherBadge}${botBadge}${titleBadge}${cosmeticBadge}</span>
                                <span class="msg-time">${fullTimeStr}${editedMark}</span>
                            </div>
                            ${replyHtml}${contentHtml}
                        </div>
                    </div>
                `;
            }
            
            lastSenderId = msg.senderId;
            lastTimeStr = fullTimeStr;
        });
        const stickToBottom = isMsgAreaNearBottom(msgArea);
        const prevScrollHeight = msgArea.scrollHeight;
        msgArea.innerHTML = html;
        if (stickToBottom) {
            msgArea.scrollTop = msgArea.scrollHeight;
            hideNewMessagesPill();
        } else if (msgArea.scrollHeight > prevScrollHeight) {
            showNewMessagesPill();
        }
        setReplyBar();
    });
        
        setTimeout(() => {
            const input = document.getElementById('msg-input');
            if (input && window.ChatDiscordUI) {
                input._chatSend = () => window.sendMessage();
                window.ChatDiscordUI.mountInput(
                    input,
                    document.getElementById('slash-picker'),
                    document.getElementById('btn-slash-chip')
                );
            }
            if (input) {
                input.oninput = scheduleTypingPulse;
                input.addEventListener("input", () => autoGrowInput(input));
                input.onblur = clearMyTypingIndicator;
                input.onkeydown = handleChatInputKeydown;
                autoGrowInput(input);
            }

                if (b.uid === currentChatTeacherId) return 1;
                return ((a.email || "").split("@")[0]).localeCompare((b.email || "").split("@")[0]);

    async function trimChatMessages(chatId) {
        if (!chatId) return;
        const limit = Math.max(50, Math.floor(chatMaxMessages) || 300);
        try {
            const msgsQuery = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
            const msgsSnap = await getDocs(msgsQuery);
            if (msgsSnap.size > limit) {
                const deleteCount = msgsSnap.size - limit;
                for (let i = 0; i < deleteCount; i++) {
                    await deleteDoc(msgsSnap.docs[i].ref);
                }
            }
        } catch (e) {
            console.error("清理舊訊息失敗:", e);

    function renderBotComponentsHtml(view, botToken) {
        if (!view || !view.items || !view.items.length) return "";
        let html = '<div class="msg-components">';
        view.items.forEach(item => {
            if (item.type === "button") {
                const st = BTN_STYLE_MAP[item.style] || "secondary";
                html += `<button type="button" class="msg-comp-btn msg-comp-btn--${st}" onclick="handleChatBotComponent('${escHtml(botToken)}','${escHtml(view.view_id)}','${escHtml(item.custom_id)}',[])">${escHtml((item.emoji ? item.emoji + " " : "") + (item.label || "Button"))}</button>`;
            } else if (item.type === "select") {
                html += `<select class="msg-comp-select" onchange="if(this.value){handleChatBotComponent('${escHtml(botToken)}','${escHtml(view.view_id)}','${escHtml(item.custom_id)}',[this.value]);this.value='';}"><option value="">${escHtml(item.placeholder || "選擇…")}</option>`;
                (item.options || []).forEach(opt => {
                    html += `<option value="${escHtml(opt.value || opt.label)}">${escHtml(opt.label || opt.value)}</option>`;
                });
                html += "</select>";
            }
        });
        html += "</div>";
        return html;
    }

    function renderBotMessageBody(msg) {
        let html = "";
        if (msg.text) {
            html += `<div class="msg-text">${escHtml(msg.text)}</div>`;
        }
        if (msg.embed && window.DiscordBotRuntime) {
            const embedText = window.DiscordBotRuntime.formatEmbedText(msg.embed);
            if (embedText) html += `<div class="msg-embed">${escHtml(embedText)}</div>`;
        }
        if (msg.view && msg.botToken) {
            html += renderBotComponentsHtml(msg.view, msg.botToken);
        }
        return html || '<div class="msg-text"></div>';
    }

    async function postBotResponses(entry, botData, responses) {
        const botName = entry.name || botData.name || "Bot";
        const botSenderId = "bot:" + (entry.botId || entry.token);
        for (const resp of responses) {
            const hasContent = resp.content || resp.embed || (resp.view && resp.view.items && resp.view.items.length);
            if (!hasContent) continue;
            const previewText = resp.content || (window.DiscordBotRuntime ? window.DiscordBotRuntime.formatEmbedText(resp.embed) : "") || "🎛 互動元件";

    function findBotCommandBody(code, commandName, isSlash) {
        const lines = String(code || "").replace(/\r/g, "").split("\n");
        const target = String(commandName || "").trim().toLowerCase();
        if (!target) return { matched: false, body: "" };

        for (let i = 0; i < lines.length; i++) {
            const line = (lines[i] || "").trim();
            const hit = isSlash ? /\.tree\.command\b/.test(line) : (/\.command\b/.test(line) && !/\.tree\.command\b/.test(line));
            if (!hit) continue;

            let deco = line;
            for (let d = i + 1; d < Math.min(i + 4, lines.length) && deco.indexOf(")") === -1; d++) {
                deco += " " + (lines[d] || "").trim();
            }

            let defLine = -1;
            let funcName = "";
            for (let j = i + 1; j < Math.min(i + 14, lines.length); j++) {
                const m = (lines[j] || "").match(/^\s*(?:async\s+)?def\s+(\w+)\s*\(/);
                if (m) {
                    defLine = j;
                    funcName = m[1];
                    break;
                }
            }
            if (defLine === -1) continue;

            const named = (deco.match(/name\s*=\s*['"]([^'"]+)['"]/) || [])[1];
            const cmdName = String(named || funcName || "").toLowerCase();
            if (cmdName !== target) continue;

            const defIndent = (lines[defLine].match(/^\s*/) || [""])[0].length;
            const bodyLines = [];
            for (let k = defLine + 1; k < lines.length; k++) {
                const raw = lines[k] || "";
                const trim = raw.trim();
                if (!trim) {
                    bodyLines.push(raw);
                    continue;
                }
                const indent = (raw.match(/^\s*/) || [""])[0].length;
                if (indent <= defIndent) break;
                bodyLines.push(raw);
            }
            return { matched: true, body: bodyLines.join("\n") };
        }
        return { matched: false, body: "" };
    }

    function extractLiteralReplyFromBody(body) {
        const text = String(body || "");
        const patterns = [
            /await\s+ctx\.(?:send|reply)\s*\(([^)]*)\)/m,
            /await\s+interaction\.response\.send_message\s*\(([^)]*)\)/m,
            /await\s+interaction\.followup\.send\s*\(([^)]*)\)/m
        ];
        for (const re of patterns) {
            const mm = text.match(re);
            if (!mm || !mm[1]) continue;
            const arg = mm[1];
            const qm = arg.match(/['"]([^'"]+)['"]/);
            if (qm && qm[1]) return qm[1];
        }
        return "";
    }

    function buildCodeFallbackResponse(code, commandName, isSlash) {
        const info = findBotCommandBody(code, commandName, isSlash);
        if (!info.matched) return null;
        const literal = extractLiteralReplyFromBody(info.body);
        if (literal) return { content: literal };
        const prefix = isSlash ? "/" : "!";
        return { content: "✅ " + prefix + commandName + " 已執行（此指令未輸出文字）" };
    }

    window.handleChatBotComponent = async (botToken, viewId, customId, values) => {
        if (!currentChatId) return;
        const entry = currentChatAttachedBots.find(b => b.token === botToken);
        if (!entry) return;
        try {
            const botData = await loadBotCode(entry.ownerId, entry.botId);
            if (!botData || !botData.pythonCode) return;
            const sessionKey = botSessionCache[entry.token] || null;
            const r = await window.DiscordBotRuntime.handleInteraction({
                code: botData.pythonCode,
                sessionKey: sessionKey,
                type: "component",
                payload: { viewId, customId, values: values || [] }
            });
            if (r.sessionKey) botSessionCache[entry.token] = r.sessionKey;
            if (r.error || !r.responses || !r.responses.length) return;
            await postBotResponses(entry, botData, r.responses);
        } catch (e) {
            console.warn("Bot 元件回覆失敗:", e);
        }
    };

    async function processAttachedBots(userText) {
        const hasRuntime = !!window.DiscordBotRuntime;
        const hasLegacyEngine = !!window.DiscordBotEngine;
        if (!currentChatAttachedBots.length || (!hasRuntime && !hasLegacyEngine)) return;
        if (!userText || (userText.charAt(0) !== "!" && userText.charAt(0) !== "/")) return;

        const isSlash = userText.charAt(0) === "/";
        const slashParts = isSlash ? userText.slice(1).trim().split(/\s+/).filter(Boolean) : [];
        const slashName = isSlash ? (slashParts[0] || null) : null;
        const slashArgs = isSlash ? slashParts.slice(1) : [];
        const prefixName = !isSlash ? userText.slice(1).split(/\s+/)[0] : null;

        for (const entry of currentChatAttachedBots) {
            try {
                const botData = await loadBotCode(entry.ownerId, entry.botId);
                if (!botData || !botData.pythonCode) continue;

                let responses = [];
                let runtimeError = null;
                const canUseRuntime = hasRuntime && window.DiscordBotRuntime.isDiscordPyCode(botData.pythonCode);
                if (canUseRuntime) {
                    const payload = isSlash ? { name: slashName, args: slashArgs } : userText;
                    const r = await window.DiscordBotRuntime.handleInteraction({
                        code: botData.pythonCode,
                        sessionKey: botSessionCache[entry.token] || null,
                        type: isSlash ? "slash" : "prefix",
                        payload: payload
                    });
                    if (r.sessionKey) botSessionCache[entry.token] = r.sessionKey;
                    if (r.error) {
                        runtimeError = r.error;
                    } else {
                        responses = r.responses || [];
                    }
                }

                // / 指令無回覆時，自動嘗試轉成 ! 指令（很多 Bot 只註冊 prefix）
                if (!responses.length && isSlash && canUseRuntime && slashName) {
                    const altPrefix = "!" + slashName + (slashArgs.length ? (" " + slashArgs.join(" ")) : "");
                    const r2 = await window.DiscordBotRuntime.handleInteraction({
                        code: botData.pythonCode,
                        sessionKey: botSessionCache[entry.token] || null,
                        type: "prefix",
                        payload: altPrefix
                    });
                    if (r2.sessionKey) botSessionCache[entry.token] = r2.sessionKey;
                    if (!r2.error && r2.responses && r2.responses.length) {
                        responses = r2.responses;
                    } else if (r2.error && !runtimeError) {
                        runtimeError = r2.error;
                    }
                }

                // Runtime 沒回覆時，prefix 退回 legacy 模式，避免「無反應」
                if (!responses.length && !isSlash && hasLegacyEngine) {
                    const res = await window.DiscordBotEngine.runBotCode(botData.pythonCode, userText);
                    if (res.error) {
                        if (!runtimeError) runtimeError = res.error;
                    }
                    if (res.responses && res.responses.length) {
                        responses = res.responses;
                    } else if (res.reply) {
                        responses = [{ content: res.reply }];
                    }
                }

                // slash 也允許 legacy fallback（先試原文，再試 !cmd）
                if (!responses.length && isSlash && hasLegacyEngine) {
                    const resSlash = await window.DiscordBotEngine.runBotCode(botData.pythonCode, userText);
                    if (!resSlash.error) {
                        if (resSlash.responses && resSlash.responses.length) {
                            responses = resSlash.responses;
                        } else if (resSlash.reply) {
                            responses = [{ content: resSlash.reply }];
                        }
                    }
                    if (!responses.length && slashName) {
                        const resPrefix = await window.DiscordBotEngine.runBotCode(botData.pythonCode, "!" + slashName);
                        if (!resPrefix.error) {
                            if (resPrefix.responses && resPrefix.responses.length) {
                                responses = resPrefix.responses;
                            } else if (resPrefix.reply) {
                                responses = [{ content: resPrefix.reply }];
                            }
                        }
                    }
                }

                if (!responses.length) {
                    const fallbackCmd = isSlash ? slashName : prefixName;
                    const codeFallback = buildCodeFallbackResponse(botData.pythonCode, fallbackCmd, isSlash);
                    if (codeFallback) {
                        responses = [codeFallback];
                    }
                }

                if (!responses.length) {
                    if (runtimeError) {
                        console.warn("Bot 無回覆:", runtimeError, entry.name || entry.botId || entry.token);
                        await postBotError(entry, "Bot 指令執行失敗：" + runtimeError);
                    } else {
                        await postBotError(entry, "Bot 未匹配指令：" + userText);
                    }
                    continue;
                }

                await postBotResponses(entry, botData, responses);
            } catch (e) {
                console.warn("Bot 回覆失敗:", e);
                await postBotError(entry, "Bot 例外：" + (e && e.message ? e.message : String(e)));
            }
        }
    }

            return;

        const reader = new FileReader();

                await addDoc(collection(db, "chats", currentChatId, "messages"), {

                });

            } catch(err) {
                alert("檔案傳送失敗：" + err.message);

        reader.readAsText(file);
    };

    window.downloadXml = (msgId) => {
        const msg = window.currentMessages[msgId];
        if(!msg || !msg.fileData) return;
        const blob = new Blob([msg.fileData], {type: "text/xml"});

        a.href = url;
        a.download = msg.fileName;
        a.click();
        URL.revokeObjectURL(url);
    };

                    throw new Error("Bot inactive");
                }
                const exists = currentChatAttachedBots.some(function (b) { return b.token === token; });
                if (exists) {
                    alert("此 Bot 已連接在此聊天室。");
                    throw new Error("Already connected");
                }
                const botEntry = {
                    token: token,
                    ownerId: meta.ownerId,
                    botId: meta.botId,
                    name: meta.name || "Bot"
                };
                await updateDoc(doc(db, "chats", currentChatId), {
                    attachedBots: arrayUnion(botEntry),
                    updatedAt: serverTimestamp()
                });
                alert("🤖 已連接 Bot「" + botEntry.name + "」！成員輸入 ! 或 / 指令即可觸發。");
                await refreshChatBotsMeta();
            }
            closeModal();
        } catch (e) {
            console.error(e);
            if (e && e.message !== "User not found" && e.message !== "Self chat" &&
                e.message !== "Invalid token" && e.message !== "Token not found" &&
                e.message !== "Bot inactive" && e.message !== "Already connected" &&
                e.message !== "Not friend" && e.message !== "SELF_REQUEST" &&
                e.message !== "USER_NOT_FOUND" && e.message !== "ALREADY_FRIEND" &&
                e.message !== "REQUEST_ALREADY_SENT" && e.message !== "REQUEST_ALREADY_SENT_REVERSE" &&
                e.message !== "USER_CANCELLED" && e.message !== "INVALID_EMAIL" && e.message !== "Invalid email") {
                alert("操作失敗，請檢查資料庫權限或網路連線！\n" + e.message);
            }
        } finally {
            btn.disabled = false;
            btn.innerText = "確認";
        }
    };
</script>
<script src="doratch-shell.js"></script>
<script src="doratch-mobile-shell.js" defer></script>
</body>
