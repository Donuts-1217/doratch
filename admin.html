<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="responsive-global.css">
    <link rel="stylesheet" href="doratch-shell.css">
    <title>開發者中心 - Creative Blocks Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4C97FF; --secondary: #FFAB19; --accent: #855CD6;
            --bg: #0F172A; --card-bg: #1E293B; --text: #F8FAFC;
        }
        body { margin: 0; font-family: 'Outfit', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: #0B0E14; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 30px 0; }
        .nav-item { padding: 15px 30px; color: #94A3B8; cursor: pointer; transition: 0.3s; font-weight: bold; display: flex; align-items: center; gap: 12px; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: rgba(76, 151, 255, 0.1); color: var(--primary); border-left: 4px solid var(--primary); }

        /* 全域導覽列樣式補充 */
        .sidebar-footer { margin-top: auto; padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        .user-mini-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.03); }

        /* Main Content */
        .main { flex: 1; overflow-y: auto; padding: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .card { background: var(--card-bg); border-radius: 24px; padding: 30px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 30px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; color: #64748B; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.02); }

        .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 900; text-transform: uppercase; }
        .badge-admin { background: rgba(133, 92, 214, 0.2); color: var(--accent); }
        .badge-teacher { background: rgba(255, 171, 25, 0.2); color: var(--secondary); }
        .badge-student { background: rgba(76, 151, 255, 0.2); color: var(--primary); }

        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 12px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: #EF4444; color: white; }
        .btn-success { background: #10B981; color: white; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #94A3B8; }
        input, select { width: 100%; padding: 12px; border-radius: 12px; background: #0B0E14; border: 1px solid rgba(255,255,255,0.1); color: white; box-sizing: border-box; }

        .search-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .search-bar input { width: 280px; padding: 10px 14px; }
        .search-hint { font-size: 12px; color: #64748B; margin-top: 8px; }
        .user-row { cursor: pointer; transition: background 0.15s; }
        .user-row:hover { background: rgba(76, 151, 255, 0.06); }
        .user-meta { font-size: 11px; color: #64748B; margin-top: 2px; }
        .uid-chip { font-family: monospace; font-size: 10px; color: #64748B; background: rgba(255,255,255,0.04); padding: 2px 6px; border-radius: 4px; }
        .stat-pill { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; background: rgba(255,255,255,0.05); margin-right: 6px; }
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 20px; border-radius: 12px; font-weight: bold; font-size: 13px; z-index: 200; opacity: 0; transform: translateY(10px); transition: 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: #10B981; color: white; }
        .toast-error { background: #EF4444; color: white; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .settings-grid .form-group.full { grid-column: 1 / -1; }
        .readonly-field { background: #1a2234; color: #94A3B8; cursor: not-allowed; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .empty-state { text-align: center; padding: 40px; color: #64748B; }
        @media (max-width: 1024px) {
            .main { padding: 20px; }
        }

    </style>
</head>
<body>

<div class="sidebar" data-doratch-admin-nav>
    <div style="padding: 0 30px 30px; font-weight: 900; color: var(--primary); font-size: 1.2rem; cursor:pointer;" onclick="location.href='index.html'">🧩 Creative Blocks</div>
    <div id="menu-dashboard" class="nav-item active" onclick="showTab('dashboard')">📊 系統概況</div>
    <div id="menu-users" class="nav-item" onclick="showTab('users')">👥 使用者管理</div>
    <div id="menu-questions" class="nav-item" onclick="showTab('questions')">❓ 題庫管理</div>
    <div id="menu-coin-reviews" class="nav-item" onclick="showTab('coin-reviews')">💰 金幣審核</div>
    <div id="menu-announcements" class="nav-item" onclick="showTab('announcements')">📢 公告管理</div>
    <div id="menu-logs" class="nav-item" onclick="showTab('logs')">📜 管理日誌</div>

    <div class="sidebar-footer">
        <div class="user-mini-card">
            <img id="side-avatar" src="" style="width:32px; height:32px; border-radius:50%;">
            <div style="flex:1; overflow:hidden;">
                <div id="side-username" style="font-size:12px; font-weight:bold; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">載入中...</div>
                <div style="font-size:10px; color:#64748B;">💰 <span id="side-coins">0</span></div>
            </div>
            <button onclick="handleLogout()" style="background:none; border:none; color:#64748B; cursor:pointer;">🚪</button>
        </div>
    </div>
</div>

<div class="main">
    <div id="tab-dashboard" style="display:none;">
        <div class="header"><h1>系統概況</h1></div>
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; margin-bottom:40px;">
            <div class="card" style="text-align:center;"><h3>使用者總數</h3><div id="stat-users" style="font-size:3rem; font-weight:900; color:var(--primary);">0</div></div>
            <div class="card" style="text-align:center;"><h3>題庫總數</h3><div id="stat-questions" style="font-size:3rem; font-weight:900; color:var(--secondary);">0</div></div>
            <div class="card" style="text-align:center;"><h3>運行狀態</h3><div style="font-size:3rem; font-weight:900; color:#10B981;">Online</div></div>
        </div>
    </div>

    <div id="tab-users" style="display:none;">
        <div class="header">
            <h1>使用者管理</h1>
            <div class="search-bar">
                <input type="text" id="user-search" placeholder="搜尋 Email、暱稱或 UID…" autocomplete="off">
                <button class="btn btn-primary" onclick="runUserSearch()">🔍 搜尋</button>
                <button class="btn" style="background:#334155; color:white;" onclick="clearUserSearch()">清除</button>
            </div>
        </div>
        <div class="card">
            <div class="search-hint">支援部分比對：Email、顯示名稱（暱稱）、UID。點擊列可開啟設定面板。</div>
            <div id="user-search-status" style="font-size:12px; color:#64748B; margin: 12px 0 4px;"></div>
            <table>
                <thead>
                    <tr>
                        <th>使用者</th>
                        <th>金幣 / 等級</th>
                        <th>角色</th>
                        <th>狀態</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="user-list">
                    <!-- 動態載入 -->
                </tbody>
            </table>
            <div id="user-empty" class="empty-state" style="display:none;">找不到符合條件的使用者</div>
        </div>
    </div>

    <div id="tab-questions" style="display:none;">
        <div class="header">
            <h1>題庫管理</h1>
            <button class="btn btn-primary" onclick="openQModal()">+ 新增題目</button>
        </div>
        <div class="card">
            <div id="q-list">
                <!-- 動態載入 -->
            </div>
        </div>
    </div>

    <div id="tab-coin-reviews" style="display:none;">
        <div class="header">
            <h1>金幣審核</h1>
        </div>
        <div class="card">
            <p style="margin-top:0; color:#94A3B8; font-size:13px;">學生需先提交程式作品，管理員審核後在此核發金幣。</p>
            <div id="coin-review-list"></div>
        </div>
    </div>

    <div id="tab-announcements" style="display:none;">
        <div class="header">
            <h1>公告管理</h1>
            <button class="btn btn-primary" onclick="openAModal()">+ 發布新公告</button>
        </div>
        <div class="card" id="ann-list" style="padding:0;">
            <!-- 動態載入 -->
        </div>
    </div>

    <div id="tab-logs" style="display:none;">
        <div class="header"><h1>管理日誌</h1></div>
        <div class="card" id="log-list" style="padding:0;">
            <!-- 動態載入 -->
        </div>
    </div>
</div>

<!-- Announcement Modal -->
<div id="a-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); backdrop-filter:blur(5px); z-index:100; align-items:center; justify-content:center;">
    <div class="card" style="width:500px;">
        <h3>發布全站公告</h3>
        <div class="form-group">
            <label>標題</label>
            <input type="text" id="a-title" placeholder="公告標題">
        </div>
        <div class="form-group">
            <label>內容</label>
            <textarea id="a-content" style="width:100%; height:100px; background:#0B0E14; border:1px solid rgba(255,255,255,0.1); color:white; border-radius:12px; padding:10px;"></textarea>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn" style="background:#334155;" onclick="closeAModal()">取消</button>
            <button class="btn btn-primary" onclick="saveAnnouncement()">發布</button>
        </div>
    </div>
</div>

<!-- User Settings Modal -->
<div id="user-modal" class="modal-overlay">
    <div class="card" style="width:560px; max-width:95vw; max-height:90vh; overflow-y:auto;">
        <h3>使用者設定</h3>
        <div class="settings-grid">
            <div class="form-group full">
                <label>UID（唯讀）</label>
                <input type="text" id="u-uid" class="readonly-field" readonly>
            </div>
            <div class="form-group full">
                <label>Email（唯讀）</label>
                <input type="text" id="u-email" class="readonly-field" readonly>
            </div>
            <div class="form-group full">
                <label>顯示名稱 / 暱稱</label>
                <input type="text" id="u-displayName" maxlength="20" placeholder="2～20 字">
            </div>
            <div class="form-group">
                <label>金幣 (coins)</label>
                <input type="number" id="u-coins" min="0" step="1">
            </div>
            <div class="form-group">
                <label>等級 (lv)</label>
                <input type="number" id="u-lv" min="1" step="1">
            </div>
            <div class="form-group">
                <label>經驗值 (xp)</label>
                <input type="number" id="u-xp" min="0" step="1">
            </div>
            <div class="form-group">
                <label>角色 (role)</label>
                <select id="u-role">
                    <option value="student">學生 (Student)</option>
                    <option value="teacher">老師 (Teacher)</option>
                    <option value="admin">開發者 (Admin)</option>
                </select>
            </div>
            <div class="form-group">
                <label>帳號狀態</label>
                <select id="u-banned">
                    <option value="false">正常</option>
                    <option value="true">已封鎖</option>
                </select>
            </div>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
            <button class="btn" style="background:#334155; color:white;" onclick="closeUserModal()">取消</button>
            <button class="btn btn-success" onclick="saveUserSettings()">儲存變更</button>
        </div>
    </div>
</div>

<div id="admin-toast" class="toast"></div>

<!-- Question Modal -->
<div id="q-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); backdrop-filter:blur(5px); z-index:100; align-items:center; justify-content:center;">
    <div class="card" style="width:500px;">
        <h3>新增/編輯題目</h3>
        <div class="form-group">
            <label>題目內容</label>
            <input type="text" id="q-text" placeholder="例如：1+1=?">
        </div>
        <div class="form-group">
            <label>選項 (用逗號隔開)</label>
            <input type="text" id="q-options" placeholder="2, 3, 4, 5">
        </div>
        <div class="form-group">
            <label>正確答案是第幾個？</label>
            <input type="number" id="q-answer" value="1" min="1" placeholder="填寫序號，例如 1 代表第一個選項">
        </div>
        <div class="form-group">
            <label>難度</label>
            <select id="q-diff">
                <option value="1">1 - 簡單</option>
                <option value="2">2 - 中等</option>
                <option value="3">3 - 困難</option>
            </select>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn" style="background:#334155;" onclick="closeQModal()">取消</button>
            <button class="btn btn-primary" onclick="saveQuestion()">儲存題目</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, getDocs, updateDoc, setDoc, addDoc, deleteDoc, increment, serverTimestamp, query, orderBy, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDwRdQFgQVn5Un8Od2nP4u5EbMx-dMOYoU", authDomain: "chat-52c0d.firebaseapp.com", projectId: "chat-52c0d", appId: "1:449329325475:web:75f255c4055360dc9e6616" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const DISPLAY_NAME_MIN = 2;
    function normalizeDisplayName(raw) {
        if (raw == null) return "";
        return String(raw).trim().slice(0, 20);
    }
    function getDisplayLabel(userData, email) {
        const dn = normalizeDisplayName(userData && userData.displayName);
        if (dn.length >= DISPLAY_NAME_MIN) return dn;
        const em = (email || "").trim();
        if (em.includes("@")) return em.split("@")[0];
        return em || "使用者";
    }
    function validateDisplayNameInput(raw) {
        const name = normalizeDisplayName(raw);
        if (name.length < DISPLAY_NAME_MIN) {
            return { ok: false, name, error: `顯示名稱至少 ${DISPLAY_NAME_MIN} 個字元` };
        }
        if (!/^[\p{L}\p{N}\u4e00-\u9fff_\-\s]+$/u.test(name)) {
            return { ok: false, name, error: "僅可使用中文、英文、數字、空格、底線或連字號" };
        }
        return { ok: true, name, error: "" };
    }

    let myRole = 'student';

    onAuthStateChanged(auth, async u => {
        if(!u) return location.href="login.html";
        
        // --- 超級管理員絕對權限 ---
        if (u.email === 'chianghansen0302@gmail.com') {
            const ref = doc(db, "users", u.uid);
            await setDoc(ref, { role: 'admin', email: u.email }, { merge: true });
            myRole = 'admin';
            
            window.handleLogout = () => signOut(auth).then(() => location.href='index.html');
            
            document.getElementById('side-coins').innerText = '∞';
            document.getElementById('side-username').innerText = "ROOT / " + u.email.split('@')[0];
            document.getElementById('side-avatar').src = `https://ui-avatars.com/api/?name=ROOT&background=FF4D4D&color=fff`;

            loadUsers(); loadQuestions(); loadAnnouncements(); loadLogs();
            showTab('dashboard');
            return;
        }

        window.handleLogout = () => signOut(auth).then(() => location.href='index.html');

        const snap = await getDoc(doc(db, "users", u.uid));
        const userData = snap.data();
        myRole = userData?.role || 'student';
        
        document.getElementById('side-coins').innerText = userData?.coins || 0;
        document.getElementById('side-username').innerText = u.email.split('@')[0];
        document.getElementById('side-avatar').src = `https://ui-avatars.com/api/?name=${u.email}&background=random`;
        
        if(myRole !== 'admin' && myRole !== 'teacher') {
            alert("權限不足！請聯繫管理員。");
            location.href = "dashboard.html";
            return;
        }

        if(myRole === 'teacher') {
            document.getElementById('menu-dashboard').style.display = 'none';
            document.getElementById('menu-users').style.display = 'none';
            document.getElementById('menu-announcements').style.display = 'none';
            document.getElementById('menu-coin-reviews').style.display = 'none';
            document.getElementById('menu-logs').style.display = 'none';
            showTab('questions');
            loadQuestions();
        } else {
            loadUsers();
            loadQuestions();
            loadCoinReviews();
            loadAnnouncements();
            loadLogs();
            showTab('dashboard');
        }
    });

    window.setupFirstAdmin = async () => {
        if(confirm("確定要將此帳號設為首位開發者嗎？這將開啟最高管理權限。")) {
            await updateDoc(doc(db, "users", auth.currentUser.uid), { role: 'admin' });
            alert("權限提升成功！即將重新整理。");
            location.reload();
        }
    };

    window.showTab = (tab) => {
        document.getElementById('tab-dashboard').style.display = tab === 'dashboard' ? 'block' : 'none';
        document.getElementById('tab-users').style.display = tab === 'users' ? 'block' : 'none';
        document.getElementById('tab-questions').style.display = tab === 'questions' ? 'block' : 'none';
        document.getElementById('tab-coin-reviews').style.display = tab === 'coin-reviews' ? 'block' : 'none';
        document.getElementById('tab-announcements').style.display = tab === 'announcements' ? 'block' : 'none';
        document.getElementById('tab-logs').style.display = tab === 'logs' ? 'block' : 'none';
        
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        const activeMenu = document.getElementById(`menu-${tab}`);
        if(activeMenu) activeMenu.classList.add('active');
        
        if(tab === 'users') loadUsers();
        if(tab === 'questions') loadQuestions();
        if(tab === 'coin-reviews') loadCoinReviews();
        if(tab === 'announcements') loadAnnouncements();
        if(tab === 'logs') loadLogs();
    };

    let allUsers = [];
    let usersLoaded = false;
    let usersLoading = false;
    let editingUserId = null;
    let searchDebounceTimer = null;

    function showToast(msg, type = 'success') {
        const el = document.getElementById('admin-toast');
        el.textContent = msg;
        el.className = `toast toast-${type} show`;
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove('show'), 3200);
    }

    function escapeHtml(str) {
        return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function matchUserQuery(u, key) {
        if (!key) return true;
        const email = (u.email || '').toLowerCase();
        const display = getDisplayLabel(u, u.email).toLowerCase();
        const uid = (u.id || u.uid || '').toLowerCase();
        return email.includes(key) || display.includes(key) || uid.includes(key);
    }

    function filterUsersList(key) {
        const q = (key || '').trim().toLowerCase();
        return allUsers.filter(u => matchUserQuery(u, q));
    }

    function updateSearchStatus(filtered, key) {
        const status = document.getElementById('user-search-status');
        if (!usersLoaded) {
            status.textContent = '載入中…';
            return;
        }
        if (!key) {
            status.textContent = `共 ${allUsers.length} 位使用者`;
        } else {
            status.textContent = `搜尋「${key}」：找到 ${filtered.length} / ${allUsers.length} 位`;
        }
    }

    async function loadUsers(force = false) {
        if (usersLoading) return;
        if (usersLoaded && !force) {
            runUserSearch();
            return;
        }
        usersLoading = true;
        document.getElementById('user-search-status').textContent = '載入中…';
        try {
            const snap = await getDocs(collection(db, "users"));
            allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            usersLoaded = true;
            document.getElementById('stat-users').innerText = snap.size;
            runUserSearch();
        } catch (e) {
            console.error(e);
            showToast('載入使用者失敗：' + (e.message || e), 'error');
        } finally {
            usersLoading = false;
        }
    }

    function renderUserList(users) {
        const tbody = document.getElementById('user-list');
        const empty = document.getElementById('user-empty');
        tbody.innerHTML = '';
        const key = document.getElementById('user-search').value.trim();
        updateSearchStatus(users, key);

        if (!users.length) {
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        users.forEach(u => {
            const tr = document.createElement('tr');
            tr.className = 'user-row';
            const isBanned = u.isBanned || false;
            const label = escapeHtml(getDisplayLabel(u, u.email));
            const email = escapeHtml(u.email || '—');
            const uidShort = escapeHtml((u.id || '').slice(0, 10) + '…');
            const role = u.role || 'student';
            tr.innerHTML = `
                <td>
                    <div style="font-weight:bold;">${label}</div>
                    <div class="user-meta">${email}</div>
                    <div class="user-meta"><span class="uid-chip">${uidShort}</span></div>
                </td>
                <td>
                    <span class="stat-pill">💰 ${u.coins ?? 0}</span>
                    <span class="stat-pill">LV.${u.lv ?? 1}</span>
                    <span class="stat-pill" style="color:#64748B;">${u.xp ?? 0} XP</span>
                </td>
                <td><span class="badge badge-${role}">${role}</span></td>
                <td>${isBanned ? '<span style="color:#EF4444; font-weight:bold;">已封鎖</span>' : '<span style="color:#10B981;">正常</span>'}</td>
                <td>
                    <button class="btn btn-primary user-settings-btn" style="padding:5px 10px; font-size:11px;">⚙️ 設定</button>
                </td>
            `;
            tr.dataset.uid = u.id;
            tr.querySelector('.user-settings-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                openUserModal(u.id);
            });
            tr.addEventListener('click', () => openUserModal(u.id));
            tbody.appendChild(tr);
        });
    }

    window.runUserSearch = () => {
        const key = document.getElementById('user-search').value.trim();
        renderUserList(filterUsersList(key));
    };

    window.clearUserSearch = () => {
        document.getElementById('user-search').value = '';
        runUserSearch();
    };

    document.getElementById('user-search').addEventListener('input', () => {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(runUserSearch, 350);
    });
    document.getElementById('user-search').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            clearTimeout(searchDebounceTimer);
            runUserSearch();
        }
    });

    window.openUserModal = (uid) => {
        const u = allUsers.find(x => x.id === uid);
        if (!u) return;
        editingUserId = uid;
        document.getElementById('u-uid').value = u.id;
        document.getElementById('u-email').value = u.email || '';
        document.getElementById('u-displayName').value = (u.displayName || '').trim() || getDisplayLabel(u, u.email);
        document.getElementById('u-coins').value = u.coins ?? 0;
        document.getElementById('u-lv').value = u.lv ?? 1;
        document.getElementById('u-xp').value = u.xp ?? 0;
        document.getElementById('u-role').value = u.role || 'student';
        document.getElementById('u-banned').value = u.isBanned ? 'true' : 'false';
        document.getElementById('user-modal').classList.add('open');
    };

    window.closeUserModal = () => {
        editingUserId = null;
        document.getElementById('user-modal').classList.remove('open');
    };

    window.saveUserSettings = async () => {
        if (!editingUserId) return;
        const u = allUsers.find(x => x.id === editingUserId);
        if (!u) return;

        const nameCheck = validateDisplayNameInput(document.getElementById('u-displayName').value);
        if (!nameCheck.ok) {
            showToast(nameCheck.error, 'error');
            return;
        }

        const coins = parseInt(document.getElementById('u-coins').value, 10);
        const lv = parseInt(document.getElementById('u-lv').value, 10);
        const xp = parseInt(document.getElementById('u-xp').value, 10);
        const role = document.getElementById('u-role').value;
        const isBanned = document.getElementById('u-banned').value === 'true';

        if (isNaN(coins) || coins < 0) return showToast('金幣必須為 0 以上的整數', 'error');
        if (isNaN(lv) || lv < 1) return showToast('等級必須為 1 以上的整數', 'error');
        if (isNaN(xp) || xp < 0) return showToast('經驗值必須為 0 以上的整數', 'error');

        const label = getDisplayLabel(u, u.email);
        const changes = [];
        if (nameCheck.name !== (u.displayName || '').trim()) changes.push(`暱稱 → ${nameCheck.name}`);
        if (coins !== (u.coins ?? 0)) changes.push(`金幣 → ${coins}`);
        if (lv !== (u.lv ?? 1)) changes.push(`等級 → ${lv}`);
        if (xp !== (u.xp ?? 0)) changes.push(`XP → ${xp}`);
        if (role !== (u.role || 'student')) changes.push(`角色 → ${role}`);
        if (isBanned !== !!(u.isBanned)) changes.push(isBanned ? '封鎖帳號' : '解除封鎖');

        if (!changes.length) {
            showToast('沒有變更需要儲存', 'error');
            return;
        }

        const summary = `確定要更新 ${label}（${u.email || editingUserId}）？\n\n${changes.join('\n')}`;
        if (!confirm(summary)) return;

        try {
            await updateDoc(doc(db, "users", editingUserId), {
                displayName: nameCheck.name,
                coins,
                lv,
                xp,
                role,
                isBanned
            });
            await logAction("編輯使用者", `${u.email || editingUserId}：${changes.join('、')}`);
            const idx = allUsers.findIndex(x => x.id === editingUserId);
            if (idx >= 0) {
                allUsers[idx] = { ...allUsers[idx], displayName: nameCheck.name, coins, lv, xp, role, isBanned };
            }
            closeUserModal();
            runUserSearch();
            showToast('使用者設定已儲存');
        } catch (e) {
            console.error(e);
            showToast('儲存失敗：' + (e.message || e), 'error');
        }
    };

    document.getElementById('user-modal').addEventListener('click', (e) => {
        if (e.target.id === 'user-modal') closeUserModal();
    });

    async function logAction(action, detail) {
        await addDoc(collection(db, "admin_logs"), {
            admin: auth.currentUser.email,
            action: action,
            detail: detail,
            time: serverTimestamp()
        });
    }

    async function loadLogs() {
        const snap = await getDocs(query(collection(db, "admin_logs"), orderBy("time", "desc")));
        const list = document.getElementById('log-list');
        list.innerHTML = '';
        snap.forEach(d => {
            const l = d.data();
            const div = document.createElement('div');
            div.style = "padding:15px 20px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px;";
            div.innerHTML = `
                <span style="color:var(--primary); font-weight:bold;">[${l.action}]</span> 
                <span style="color:#94A3B8;">${l.admin}</span>: ${l.detail}
            `;
            list.appendChild(div);
        });
    }

    async function loadCoinReviews() {
        const host = document.getElementById('coin-review-list');
        host.innerHTML = '<div style="color:#94A3B8; font-size:13px;">載入中...</div>';
        try {
            const snap = await getDocs(query(collection(db, "coin_review_requests"), orderBy("createdAt", "desc")));
            if (snap.empty) {
                host.innerHTML = '<div class="empty-state">目前沒有待審核的送件</div>';
                return;
            }
            host.innerHTML = '';
            snap.forEach(d => {
                const req = d.data() || {};
                const status = req.status || 'pending';
                const created = req.createdAt && req.createdAt.toDate ? req.createdAt.toDate().toLocaleString('zh-TW') : '剛剛';
                const reviewed = req.reviewedAt && req.reviewedAt.toDate ? req.reviewedAt.toDate().toLocaleString('zh-TW') : '-';
                const typeLabel = req.workType === 'blockly' ? '積木方塊' : (req.workType === 'python' ? 'Python' : '其他');
                const canReview = status === 'pending' && myRole === 'admin';
                const item = document.createElement('div');
                item.style.cssText = 'border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:14px; margin-bottom:12px; background:#111827;';
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:8px;">
                        <div style="font-weight:900;">${escapeHtml(req.userEmail || req.userId || '未知使用者')}</div>
                        <span class="badge badge-${status === 'approved' ? 'teacher' : status === 'rejected' ? 'admin' : 'student'}">${status}</span>
                    </div>
                    <div style="font-size:12px; color:#94A3B8; line-height:1.6;">
                        提交時間：${created}<br>
                        作品類型：${typeLabel}<br>
                        作品連結：${req.projectUrl ? `<a href="${escapeHtml(req.projectUrl)}" target="_blank" style="color:#60a5fa;">${escapeHtml(req.projectUrl)}</a>` : '未填寫'}<br>
                        說明：${escapeHtml(req.note || '（無）')}<br>
                        已核發：${Number.isFinite(req.awardedCoins) ? req.awardedCoins : 0} 金幣<br>
                        審核者：${escapeHtml(req.reviewedBy || '-')}（${reviewed}）
                    </div>
                    ${canReview ? `
                        <div style="display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap;">
                            <input id="award-${d.id}" type="number" min="1" step="1" value="${req.suggestedCoins && req.suggestedCoins > 0 ? req.suggestedCoins : 50}" style="width:120px;">
                            <button class="btn btn-success" onclick="approveCoinRequest('${d.id}', '${req.userId || ''}')">核准發幣</button>
                            <button class="btn btn-danger" onclick="rejectCoinRequest('${d.id}')">駁回</button>
                        </div>
                    ` : ''}
                `;
                host.appendChild(item);
            });
        } catch (e) {
            console.error(e);
            host.innerHTML = `<div class="empty-state">載入失敗：${escapeHtml(e.message || e)}</div>`;
        }
    }

    window.approveCoinRequest = async (requestId, userId) => {
        if (myRole !== 'admin') return showToast('只有管理員可以核准發幣', 'error');
        const input = document.getElementById(`award-${requestId}`);
        const amount = parseInt((input && input.value) || '0', 10);
        if (!Number.isFinite(amount) || amount <= 0) return showToast('請輸入正確的核發金幣', 'error');
        if (!userId) return showToast('此送件缺少 userId', 'error');
        if (!confirm(`確定核發 ${amount} 金幣給此使用者？`)) return;

        try {
            const reqRef = doc(db, "coin_review_requests", requestId);
            const userRef = doc(db, "users", userId);
            await runTransaction(db, async (tx) => {
                const reqSnap = await tx.get(reqRef);
                if (!reqSnap.exists()) throw new Error('送件不存在');
                const reqData = reqSnap.data() || {};
                if ((reqData.status || 'pending') !== 'pending') throw new Error('此送件已審核');

                const userSnap = await tx.get(userRef);
                const userData = userSnap.exists() ? (userSnap.data() || {}) : {};
                const currentCoins = Number.isFinite(userData.coins) ? userData.coins : 0;

                tx.set(userRef, { coins: currentCoins + amount }, { merge: true });
                tx.update(reqRef, {
                    status: 'approved',
                    awardedCoins: amount,
                    reviewedBy: auth.currentUser.email || 'admin',
                    reviewedAt: serverTimestamp()
                });
            });
            await logAction("核發金幣", `request=${requestId} user=${userId} +${amount}`);
            showToast(`已核發 ${amount} 金幣`);
            loadCoinReviews();
            loadUsers(true);
        } catch (e) {
            console.error(e);
            showToast('核准失敗：' + (e.message || e), 'error');
        }
    };

    window.rejectCoinRequest = async (requestId) => {
        if (myRole !== 'admin') return showToast('只有管理員可以駁回', 'error');
        if (!confirm('確定要駁回這筆送件？')) return;
        try {
            await updateDoc(doc(db, "coin_review_requests", requestId), {
                status: 'rejected',
                awardedCoins: 0,
                reviewedBy: auth.currentUser.email || 'admin',
                reviewedAt: serverTimestamp()
            });
            await logAction("駁回送件", `request=${requestId}`);
            showToast('已駁回送件');
            loadCoinReviews();
        } catch (e) {
            console.error(e);
            showToast('駁回失敗：' + (e.message || e), 'error');
        }
    };

    window.openQModal = () => document.getElementById('q-modal').style.display = 'flex';
    window.closeQModal = () => document.getElementById('q-modal').style.display = 'none';

    window.saveQuestion = async () => {
        const text = document.getElementById('q-text').value;
        const optionsStr = document.getElementById('q-options').value;
        const ansIdx = parseInt(document.getElementById('q-answer').value) - 1; // 轉為 0-indexed
        const diff = parseInt(document.getElementById('q-diff').value);

        if(!text || !optionsStr || isNaN(ansIdx)) return alert("請填寫完整題目資訊！");

        const q = {
            text: text,
            options: optionsStr.split(',').map(s => s.trim()).filter(s => s !== ""),
            answer: ansIdx,
            diff: diff,
            author: auth.currentUser.uid
        };
        await addDoc(collection(db, "questions"), q);
        closeQModal();
        loadQuestions();
    };

    async function loadQuestions() {
        const snap = await getDocs(collection(db, "questions"));
        document.getElementById('stat-questions').innerText = snap.size;
        const list = document.getElementById('q-list');
        list.innerHTML = '';
        snap.forEach(d => {
            const q = d.data();
            const canDelete = q.author === auth.currentUser.uid || myRole === 'admin';
            const div = document.createElement('div');
            div.style = "padding:20px; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center;";
            div.innerHTML = `
                <div>
                    <div style="font-weight:bold;">${q.text}</div>
                    <div style="font-size:12px; color:#64748B;">選項：${q.options.join(' / ')} | 正確答案：第 ${q.answer + 1} 個 | 難度：${q.diff}</div>
                </div>
                ${canDelete ? `<button class="btn btn-danger" onclick="deleteQ('${d.id}')">刪除</button>` : `<span style="font-size:12px; color:#444;">無刪除權限</span>`}
            `;
            list.appendChild(div);
        });
    }

    window.deleteQ = async (id) => {
        if(confirm("確定刪除此題目？")) {
            await deleteDoc(doc(db, "questions", id));
            loadQuestions();
        }
    };
    window.openAModal = () => document.getElementById('a-modal').style.display = 'flex';
    window.closeAModal = () => document.getElementById('a-modal').style.display = 'none';

    window.saveAnnouncement = async () => {
        const title = document.getElementById('a-title').value;
        const content = document.getElementById('a-content').value;
        if(!title || !content) return alert("請填寫內容！");
        await addDoc(collection(db, "announcements"), { title, content, date: serverTimestamp() });
        closeAModal();
        loadAnnouncements();
    };

    async function loadAnnouncements() {
        const snap = await getDocs(query(collection(db, "announcements"), orderBy("date", "desc")));
        const list = document.getElementById('ann-list');
        list.innerHTML = '';
        snap.forEach(d => {
            const a = d.data();
            const div = document.createElement('div');
            div.style = "padding:20px; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center;";
            div.innerHTML = `
                <div>
                    <div style="font-weight:bold;">${a.title}</div>
                    <div style="font-size:12px; color:#64748B;">${a.content}</div>
                </div>
                <button class="btn btn-danger" onclick="deleteAnn('${d.id}')">刪除</button>
            `;
            list.appendChild(div);
        });
    }

    window.deleteAnn = async (id) => {
        if(confirm("確定刪除此公告？")) {
            await deleteDoc(doc(db, "announcements", id));
            loadAnnouncements();
        }
    };
</script>
