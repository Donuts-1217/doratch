<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0F172A">
    <link rel="icon" type="image/png" href="Doratch.png">
    <link rel="apple-touch-icon" href="Doratch.png">
    <link rel="stylesheet" href="responsive-global.css">
    <title>會員登入 - Doratch</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4C97FF;
            --accent: #855CD6;
            --bg: #0F172A;
            --card-bg: #1E293B;
            --text: #F8FAFC;
        }
        body {
            font-family: "Outfit", "Noto Sans TC", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex; justify-content: center; align-items: center; margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
            box-sizing: border-box;
            position: relative;
        }

        .bg-glow {
            position: absolute; border-radius: 50%; pointer-events: none; z-index: 0;
            filter: blur(80px); opacity: 0.35;
        }
        .bg-glow-a { width: 320px; height: 320px; top: -80px; left: -80px; background: var(--primary); }
        .bg-glow-b { width: 260px; height: 260px; bottom: -60px; right: -60px; background: var(--accent); }

        .auth-card {
            background: var(--card-bg);
            padding: 44px 36px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 24px 64px rgba(0,0,0,0.45);
            width: 100%; max-width: 360px;
            text-align: center;
            position: relative; z-index: 1;
            max-height: calc(100dvh - 40px);
            overflow-y: auto;
        }

        .logo-wrap {
            display: inline-flex; align-items: center; gap: 12px;
            margin-bottom: 8px; cursor: pointer; text-decoration: none;
            transition: opacity 0.2s;
        }
        .logo-wrap:hover { opacity: 0.85; }
        .logo-icon { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; }
        .logo-text {
            font-size: 1.75rem; font-weight: 900; color: var(--primary);
            letter-spacing: 0.06em; text-transform: lowercase; line-height: 1;
        }
        .subtitle { color: #94A3B8; font-size: 13px; margin-bottom: 28px; letter-spacing: 0.08em; }

        #auth-title { font-size: 22px; font-weight: 900; color: var(--text); margin-bottom: 20px; }

        .input-group { position: relative; margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; color: #94A3B8; margin-bottom: 5px; margin-left: 5px; }

        input {
            width: 100%; padding: 14px 18px;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; box-sizing: border-box;
            outline: none; transition: 0.3s; font-size: 16px;
            background: rgba(15,23,42,0.6); color: var(--text);
        }
        input::placeholder { color: #64748B; }
        input:focus { border-color: var(--primary); background: rgba(15,23,42,0.9); box-shadow: 0 0 0 4px rgba(76, 151, 255, 0.15); }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(76, 151, 255, 0.3);
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #357ABD; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(76, 151, 255, 0.4); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 0 4px;
            color: #64748B;
            font-size: 12px;
            letter-spacing: 0.04em;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.12);
        }
        .btn-google {
            width: 100%;
            margin-top: 10px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.04);
            color: #E2E8F0;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        .btn-google:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.28); }
        .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }
        .google-icon { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }

        .toggle-link { margin-top: 25px; font-size: 14px; color: #94A3B8; }
        .toggle-link span { color: var(--primary); cursor: pointer; font-weight: bold; transition: 0.2s; }
        .toggle-link span:hover { text-decoration: underline; }

        #message-box {
            margin-bottom: 20px; font-size: 13px; padding: 12px 15px; border-radius: 12px;
            display: none; animation: fadeIn 0.3s ease; line-height: 1.5;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .msg-error { background: rgba(229,57,53,0.12); color: #FCA5A5; border: 1px solid rgba(229,57,53,0.35); }
        .msg-success { background: rgba(46,125,50,0.12); color: #86EFAC; border: 1px solid rgba(46,125,50,0.35); }

        .spam-notice { font-size: 11px; color: #FBBF24; font-weight: bold; margin-top: 8px; display: block; }
    
        
        /* 響應式縮放與排版 */
        html, body { max-width: 100vw; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 100vw; overflow: hidden; }
        .main-content { overflow-x: auto; box-sizing: border-box; }
        
        @media (max-width: 1024px) {
            .app-container { flex-direction: column; }
            
            /* 導覽列改為橫向可滑動 */
            .sidebar-main { width: 100vw; height: auto; position: static; flex-direction: row; overflow-x: auto; white-space: nowrap; flex-wrap: nowrap; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
            .sidebar-logo { display: none; }
            .sidebar-main > div[style*="uppercase"] { display: none; }
            .nav-item { padding: 12px 20px; font-size: 14px; flex-shrink: 0; border-left: none !important; border-bottom: 2px solid transparent; }
            .nav-item.active { border-bottom: 2px solid var(--primary); }
            .sidebar-footer { width: auto; border: none; padding: 5px 15px; display: flex; align-items: center; margin-top: 0; flex-shrink: 0; }
            
            .main-content { margin-left: 0; padding: 15px; width: 100vw; }
            
            /* 卡片與通用排版 */
            #user-stats-card { flex-wrap: wrap; justify-content: center; text-align: center; }
            #user-stats-card > div { width: 100%; }
            .header, .header-title { flex-direction: column; gap: 15px; text-align: center; }
            .project-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            .game-grid { grid-template-columns: 1fr; }
            
            /* 遊戲區域適應 */
            .boss-raid-container, .game-frame { width: 100%; box-sizing: border-box; padding: 20px 10px; min-height: auto; }
            .duel-arena { grid-template-columns: 1fr; }
            .boss-image-container { width: 200px; height: 200px; margin: 0 auto 15px; }
        }
        
        @media (max-width: 740px) {
            /* 精準縮放 700px 的遊戲畫布 (塔防與PvP) */
            [style*="width:700px"] { 
                transform-origin: top left;
                transform: scale(calc((100vw - 30px) / 700));
                margin-bottom: calc(-300px * (1 - ((100vw - 30px) / 700))); 
            }
        }
        
        @media (max-width: 480px) {
            .nav-item { font-size: 13px; padding: 10px 15px; }
            .hero h1 { font-size: 2.5rem; }
            .auth-card { padding: 32px 22px; border-radius: 20px; }
            .logo-text { font-size: 1.5rem; }
            #auth-title { font-size: 1.25rem; }
            .subtitle { margin-bottom: 20px; }
        }

    </style>
</head>
<body>

<div class="bg-glow bg-glow-a"></div>
<div class="bg-glow bg-glow-b"></div>

<div class="auth-card">
    <a class="logo-wrap" href="index.html" aria-label="Doratch 首頁">
        <img class="logo-icon" src="Doratch.png" alt="">
        <span class="logo-text">doratch</span>
    </a>
    <div class="subtitle">程式學習與創作平台</div>
    
    <h2 id="auth-title">會員登入</h2>
    
    <div id="message-box"></div>

    <div class="input-group">
        <label>電子郵件</label>
        <input type="email" id="email" placeholder="email@example.com">
    </div>
    
    <div class="input-group">
        <label>登入密碼</label>
        <input type="password" id="password" placeholder="請輸入至少 6 位數密碼">
    </div>

    <div class="input-group" id="display-name-group" style="display:none;">
        <label>顯示名稱</label>
        <input type="text" id="display-name" maxlength="20" placeholder="2～20 字，其他人會看到此名稱" autocomplete="nickname">
    </div>
    
    <button type="button" id="main-btn" class="btn btn-primary">登入</button>
    <div class="auth-divider">或</div>
    <button type="button" id="google-btn" class="btn-google">
        <img class="google-icon" src="GOOGLE.webp" alt="Google" onerror="this.onerror=null;this.src='GOOGLE';">
        使用 Google 登入
    </button>

    <div class="toggle-link" id="toggle-area">
        還沒有帳號嗎？ <span onclick="switchMode('reg')">立即註冊</span>
    </div>
</div>

<script src="doratch-mobile-shell.js"></script>
<script src="shared/doratch-public-config.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        sendEmailVerification,
        GoogleAuthProvider,
        getRedirectResult,
        signInWithPopup,
        signInWithRedirect,
        signOut 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDwRdQFgQVn5Un8Od2nP4u5EbMx-dMOYoU",
        authDomain: "chat-52c0d.firebaseapp.com",
        projectId: "chat-52c0d",
        storageBucket: "chat-52c0d.firebasestorage.app",
        messagingSenderId: "449329325475",
        appId: "1:449329325475:web:75f255c4055360dc9e6616"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let mode = 'login';
    let authBusy = false;

    const DISPLAY_NAME_MIN = 2;
    const DISPLAY_NAME_MAX = 20;
    function normalizeDisplayName(raw) {
        if (raw == null) return "";
        return String(raw).trim().slice(0, DISPLAY_NAME_MAX);
    }
    function needsDisplayName(userData) {
        return normalizeDisplayName(userData && userData.displayName).length < DISPLAY_NAME_MIN;
    }
    function validateDisplayNameInput(raw) {
        const name = normalizeDisplayName(raw);
        if (name.length < DISPLAY_NAME_MIN) {
            return { ok: false, name, error: `顯示名稱至少 ${DISPLAY_NAME_MIN} 個字元` };
        }
        if (!/^[\p{L}\p{N}\u4e00-\u9fff_\-\s]+$/u.test(name)) {
            return { ok: false, name, error: "僅可使用中文、英文、數字、空格、底線或連字號" };
        }
        return { ok: true, name, error: "" };
    }

    async function redirectAfterLogin(user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        const data = snap.exists() ? snap.data() : {};
        const needName = needsDisplayName(data);
        const dest = (window.DoratchDevice && window.DoratchDevice.postLoginDestination)
            ? window.DoratchDevice.postLoginDestination({ needDisplayName: needName })
            : (needName ? "profile.html?needDisplayName=1" : "main.html");
        location.href = dest;
    }

    function fallbackDisplayNameFromEmail(email) {
        const em = String(email || "").trim();
        if (em.includes("@")) return em.split("@")[0];
        return em || "使用者";
    }

    async function ensureUserDocAfterLogin(user) {
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);
        const current = snap.exists() ? snap.data() : {};
        const autoDisplayName = normalizeDisplayName(
            current.displayName ||
            user.displayName ||
            fallbackDisplayNameFromEmail(user.email)
        );
        const userPayload = {
            uid: user.uid,
            email: user.email || "",
            displayName: autoDisplayName,
            xp: Number.isFinite(current.xp) ? current.xp : 0,
            lv: Number.isFinite(current.lv) ? current.lv : 1,
            coins: Number.isFinite(current.coins) ? current.coins : 0,
            lastSeen: serverTimestamp()
        };
        if (!snap.exists()) {
            userPayload.role = "student";
            userPayload.createdAt = serverTimestamp();
        }
        await setDoc(userRef, userPayload, { merge: true });
    }

    async function handleGoogleLoginSuccess(user) {
        await ensureUserDocAfterLogin(user);
        showMsg("🎉 Google 登入成功，正在導向...", "success");
        setTimeout(() => redirectAfterLogin(user), 350);
    }

    function showMsg(text, type) {
        const box = document.getElementById('message-box');
        box.innerHTML = text;
        box.className = type === 'error' ? 'msg-error' : 'msg-success';
        box.style.display = 'block';
    }

    /** 驗證信連結導向 Doratch 驗證頁（GitHub Pages 固定網址） */
    function getEmailVerifyUrl() {
        return window.doratchPublicUrl("verify-email.html");
    }

    function getEmailActionSettings() {
        return {
            url: getEmailVerifyUrl(),
            handleCodeInApp: true
        };
    }

    async function sendVerifyEmail(user) {
        await sendEmailVerification(user, getEmailActionSettings());
    }

    window.resendVerification = async () => {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        if (!email || !password) {
            showMsg("請先輸入 Email 與密碼，再按「重發驗證信」。", "error");
            return;
        }
        try {
            const res = await signInWithEmailAndPassword(auth, email, password);
            if (res.user.emailVerified) {
                showMsg("此 Email 已驗證完成，可以直接登入。", "success");
                await signOut(auth);
                return;
            }
            await sendVerifyEmail(res.user);
            await signOut(auth);
            showMsg(`
                📬 驗證信已重新寄出！<br>
                請至信箱點擊連結，會在 Doratch 驗證頁完成。<br>
                <span class="spam-notice">⚠️ 若沒看到信件，請查看「垃圾郵件」。</span>
            `, "success");
        } catch (err) {
            let msg = "重發失敗，請確認帳密是否正確。";
            if (err.code === "auth/too-many-requests") msg = "寄送次數過多，請稍後再試。";
            showMsg(msg, "error");
        }
    };

    window.switchMode = (target, opts) => {
        opts = opts || {};
        mode = target;
        if (!opts.keepMessage) {
            document.getElementById('message-box').style.display = 'none';
        }
        const title = document.getElementById('auth-title');
        const mainBtn = document.getElementById('main-btn');
        const toggleArea = document.getElementById('toggle-area');

        const nameGroup = document.getElementById('display-name-group');
        if (mode === 'reg') {
            title.innerText = "註冊新帳號";
            mainBtn.innerText = "註冊並發送驗證信";
            toggleArea.innerHTML = `已有帳號？ <span onclick="switchMode('login')">點此登入</span>`;
            nameGroup.style.display = 'block';
            document.getElementById('display-name').focus();
        } else {
            title.innerText = "會員登入";
            mainBtn.innerText = "登入";
            toggleArea.innerHTML = `還沒有帳號嗎？ <span onclick="switchMode('reg')">立即註冊</span>`;
            nameGroup.style.display = 'none';
            document.getElementById('email').focus();
        }
    };

    window.handleAuth = async () => {
        if (authBusy) return;
        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value.trim();
        if (!email || !password) return showMsg("請填寫完整資訊", "error");
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMsg("Email 格式不正確", "error");

        const btn = document.getElementById('main-btn');
        authBusy = true;
        btn.disabled = true;
        btn.innerText = "處理中...";

        try {
            if (mode === 'reg') {
                const nameCheck = validateDisplayNameInput(document.getElementById('display-name').value);
                if (!nameCheck.ok) {
                    showMsg(nameCheck.error, "error");
                    return;
                }
                const res = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "users", res.user.uid), {
                    email,
                    uid: res.user.uid,
                    displayName: nameCheck.name,
                    xp: 0,
                    lv: 1,
                    coins: 0,
                    role: "student",
                    createdAt: serverTimestamp()
                }, { merge: true });
                await sendVerifyEmail(res.user);
                await signOut(auth);
                
                showMsg(`
                    ✅ 註冊成功！驗證信已寄出。<br>
                    請至信箱點擊連結，會在 <strong>Doratch 驗證頁</strong> 完成驗證後再登入。<br>
                    <span class="spam-notice">⚠️ 若沒看到信件，請務必查看「垃圾郵件」資料夾！</span>
                `, "success");
                switchMode('login', { keepMessage: true });
            } else {
                const res = await signInWithEmailAndPassword(auth, email, password);
                const user = res.user;
                // 先強制刷新一次使用者狀態，避免剛驗證完成時 still cached 判斷錯誤
                try { await user.reload(); } catch (_) {}
                const freshUser = auth.currentUser || user;
                const verified = !!freshUser.emailVerified;

                if (!verified) {
                    showMsg(`
                        ⚠️ Email 尚未驗證！<br>
                        請到信箱點擊連結，在 Doratch 驗證頁完成後再登入。<br>
                        <span class="spam-notice">💡 若剛完成驗證，請稍候幾秒再重試。</span><br>
                        <span style="color:var(--primary);cursor:pointer;font-weight:bold;" onclick="resendVerification()">📬 重發驗證信</span>
                    `, "error");
                    await signOut(auth);
                    return;
                }
                await ensureUserDocAfterLogin(freshUser);

                showMsg("🎉 登入成功，正在導向...", "success");
                setTimeout(() => redirectAfterLogin(freshUser), 500);
            }
        } catch (error) {
            let errorMsg = "認證失敗，請檢查帳密";
            if (error.code === 'auth/email-already-in-use') errorMsg = "此 Email 已被註冊";
            if (error.code === 'auth/invalid-credential') errorMsg = "帳號或密碼錯誤";
            if (error.code === 'auth/weak-password') errorMsg = "密碼至少需要 6 位數";
            if (error.code === 'auth/invalid-email') errorMsg = "Email 格式不正確";
            if (error.code === 'auth/user-disabled') errorMsg = "此帳號已停用，請聯絡管理員";
            if (error.code === 'auth/too-many-requests') errorMsg = "嘗試次數過多，請稍後再試";
            if (error.code === 'auth/network-request-failed') errorMsg = "網路連線失敗，請檢查網路後重試";
            showMsg(errorMsg, "error");
        } finally {
            authBusy = false;
            btn.disabled = false;
            btn.innerText = mode === 'reg' ? "註冊並發送驗證信" : "登入";
        }
    };

    document.getElementById("main-btn").addEventListener("click", function (e) {
        e.preventDefault();
        handleAuth();
    });

    document.getElementById("google-btn").addEventListener("click", async function (e) {
        e.preventDefault();
        if (authBusy) return;
        const googleBtn = document.getElementById("google-btn");
        authBusy = true;
        googleBtn.disabled = true;
        try {
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: "select_account" });
            const res = await signInWithPopup(auth, provider);
            const user = res.user;
            // Google 登入視為已驗證，不需走 email 驗證流程
            await handleGoogleLoginSuccess(user);
        } catch (error) {
            const code = (error && error.code) || "";
            if (code === "auth/popup-closed-by-user" || code === "auth/popup-blocked" || code === "auth/cancelled-popup-request") {
                try {
                    const provider = new GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: "select_account" });
                    showMsg("正在切換為 Google 重新導向登入…", "success");
                    await signInWithRedirect(auth, provider);
                    return;
                } catch (_) {
                    // fall through to message below
                }
            }
            let errorMsg = "Google 登入失敗，請稍後再試";
            if (code === "auth/popup-closed-by-user") errorMsg = "你已取消 Google 登入";
            if (code === "auth/popup-blocked") errorMsg = "瀏覽器阻擋彈窗，已嘗試改為重新導向登入";
            if (code === "auth/account-exists-with-different-credential") errorMsg = "此 Email 已使用其他登入方式註冊";
            if (code === "auth/unauthorized-domain") errorMsg = "此網域尚未加入 Firebase 授權網域";
            showMsg(errorMsg, "error");
        } finally {
            authBusy = false;
            googleBtn.disabled = false;
        }
    });

    (async function handleGoogleRedirectResult() {
        try {
            const result = await getRedirectResult(auth);
            if (result && result.user) {
                await handleGoogleLoginSuccess(result.user);
            }
        } catch (error) {
            const code = (error && error.code) || "";
            let errorMsg = "Google 登入失敗，請稍後再試";
            if (code === "auth/unauthorized-domain") errorMsg = "此網域尚未加入 Firebase 授權網域";
            if (code === "auth/account-exists-with-different-credential") errorMsg = "此 Email 已使用其他登入方式註冊";
            showMsg(errorMsg, "error");
        }
    })();

    ["email", "password", "display-name"].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                handleAuth();
            }
        });
    });

    if (new URLSearchParams(window.location.search).get("verified") === "1") {
        showMsg("✅ Email 已驗證成功！現在可以登入了。", "success");
    }
</script>

</body>
</html>
