<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人檔案 - Creative Blocks</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4C97FF; --secondary: #FFAB19; --accent: #855CD6;
            --bg: #0F172A; --card-bg: #1E293B; --text: #F8FAFC;
        }
        body { font-family: 'Outfit', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }

        /* 全域導覽列樣式 */
        .app-container { display: flex; min-height: 100vh; }
        .sidebar-main { width: 260px; background: #0B0E14; color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar-logo { padding: 30px; font-weight: 900; font-size: 1.2rem; color: var(--primary); cursor: pointer; }
        .nav-item { padding: 15px 30px; display: flex; align-items: center; gap: 12px; color: #94A3B8; text-decoration: none; font-weight: bold; transition: 0.3s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { color: var(--primary); border-left: 4px solid var(--primary); }
        .sidebar-footer { margin-top: auto; padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        .user-mini-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.03); }
        .main-content { flex: 1; margin-left: 260px; padding: 40px; }

        /* 個人資料卡 */
        .profile-hero { 
            background: linear-gradient(135deg, var(--primary), var(--accent)); 
            border-radius: 32px; padding: 60px 40px; text-align: center;
            position: relative; overflow: hidden; margin-bottom: 30px;
        }
        .profile-hero::after { content: "👤"; position: absolute; right: -20px; bottom: -30px; font-size: 200px; opacity: 0.07; }
        .avatar-large { width: 120px; height: 120px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.4); margin-bottom: 20px; }
        .profile-name { font-size: 2rem; font-weight: 900; margin-bottom: 5px; }
        .profile-id { font-size: 12px; opacity: 0.7; }

        /* 數據統計區 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-box { background: var(--card-bg); padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); text-align: center; transition: 0.3s; }
        .stat-box:hover { transform: translateY(-5px); border-color: var(--primary); }
        .stat-value { font-size: 2.5rem; font-weight: 900; color: var(--primary); display: block; margin-bottom: 8px; }
        .stat-label { font-size: 13px; color: #64748B; text-transform: uppercase; letter-spacing: 1px; }

        .btn-edit-profile { 
            background: rgba(255,255,255,0.2); color: white; border: none; 
            padding: 12px 30px; border-radius: 20px; font-weight: 900; cursor: pointer; 
            transition: 0.3s; backdrop-filter: blur(5px); margin-top: 15px;
        }
        .btn-edit-profile:hover { background: rgba(255,255,255,0.35); transform: translateY(-2px); }

        .action-card { background: var(--card-bg); border-radius: 24px; padding: 30px; border: 1px solid rgba(255,255,255,0.05); }
        .action-card h3 { margin: 0 0 20px; font-size: 1.1rem; color: #94A3B8; }
        .action-btn { display: block; width: 100%; padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: white; font-weight: bold; text-decoration: none; margin-bottom: 12px; transition: 0.3s; cursor: pointer; text-align: left; font-size: 14px; }
        .action-btn:hover { background: rgba(76,151,255,0.1); border-color: var(--primary); color: var(--primary); }
    
        /* 響應式縮放與排版 */
        @media (max-width: 1024px) {
            .app-container { flex-direction: column; }
            .sidebar-main { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
            .sidebar-logo { width: 100%; text-align: center; padding: 15px; }
            .sidebar-main > div[style*="uppercase"] { display: none; }
            .nav-item { padding: 10px 15px; font-size: 13px; justify-content: center; flex: 1 1 auto; white-space: nowrap; border-left: none !important; border-bottom: 2px solid transparent; }
            .nav-item.active { border-bottom: 2px solid var(--primary); }
            .sidebar-footer { width: 100%; display: flex; justify-content: center; padding: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
            .main-content { margin-left: 0; padding: 20px; width: 100%; box-sizing: border-box; }
            
            /* 針對固定寬度元素的縮放處理 */
            .boss-raid-container, .game-frame, [style*="width:700px"] { 
                zoom: 0.8; 
                -moz-transform: scale(0.8); 
                -moz-transform-origin: top center; 
            }
            .project-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
        }
        @media (max-width: 768px) {
            .nav-item { font-size: 12px; padding: 8px 10px; }
            .header { flex-direction: column; gap: 15px; text-align: center; }
            
            .boss-raid-container, .game-frame, [style*="width:700px"] { 
                zoom: 0.55; 
                -moz-transform: scale(0.55); 
                -moz-transform-origin: top center; 
            }
        }
        @media (max-width: 480px) {
            .boss-raid-container, .game-frame, [style*="width:700px"] { 
                zoom: 0.45; 
                -moz-transform: scale(0.45); 
                -moz-transform-origin: top center; 
            }
            h1 { font-size: 1.5rem; }
        }

    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar-main">
        <div class="sidebar-logo" onclick="location.href='index.html'">🧩 Creative Blocks</div>
        <a href="index.html" class="nav-item">🏠 平台首頁</a>
        <a href="dashboard.html" class="nav-item">🏫 我的班級</a>

        <div style="margin: 20px 30px 10px; font-size: 11px; color: #475569; letter-spacing: 1px; text-transform: uppercase;">創作與探索</div>
        <a href="page.html" class="nav-item">🚀 創作空間</a>
        <a href="main.html?view=mine" class="nav-item">📂 我的作品</a>
        <a href="main.html" class="nav-item">🌍 探索中心</a>

        <div style="margin: 20px 30px 10px; font-size: 11px; color: #475569; letter-spacing: 1px; text-transform: uppercase;">指令競技</div>
        <a href="lab.html" class="nav-item">🧪 指令實驗室</a>
        <a href="game.html" class="nav-item">🎮 指令塔防</a>
        <a href="shop.html" class="nav-item">🛒 創意商城</a>
        <a href="chat.html" class="nav-item">💬 交流大廳</a>
        <a href="admin.html" id="admin-link-main" class="nav-item" style="display:none; color:var(--accent);">🛠️ 管理面板</a>
        
        <div class="sidebar-footer">
            <div class="user-mini-card">
                <img id="side-avatar" src="" style="width:32px; height:32px; border-radius:50%;">
                <div style="flex:1; overflow:hidden;">
                    <div id="side-username" style="font-size:12px; font-weight:bold; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">載入中...</div>
                    <div style="font-size:10px; color:#64748B;">💰 <span id="side-coins">0</span></div>
                </div>
                <button onclick="handleLogout()" style="background:none; border:none; color:#64748B; cursor:pointer;">🚪</button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="profile-hero">
            <img id="profile-avatar" class="avatar-large" src="">
            <div id="display-name" class="profile-name">載入中...</div>
            <div id="display-uid" class="profile-id">UID: ---</div>
            <button class="btn-edit-profile" onclick="alert('個人資料修改功能開發中！')">✏️ 修改個人資料</button>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <span id="count-projects" class="stat-value">0</span>
                <span class="stat-label">我的作品</span>
            </div>
            <div class="stat-box">
                <span id="count-classes" class="stat-value">0</span>
                <span class="stat-label">參與班級</span>
            </div>
            <div class="stat-box">
                <span id="count-coins" class="stat-value">0</span>
                <span class="stat-label">💰 金幣</span>
            </div>
            <div class="stat-box">
                <span id="count-lv" class="stat-value">1</span>
                <span class="stat-label">⭐ 等級</span>
            </div>
        </div>

        <div class="action-card">
            <h3>🚀 快捷操作</h3>
            <a href="page.html" class="action-btn">🎨 前往創作空間</a>
            <a href="main.html?view=mine" class="action-btn">📂 查看所有作品</a>
            <a href="dashboard.html" class="action-btn">🏫 管理我的班級</a>
            <a href="shop.html" class="action-btn">🛒 前往創意商城</a>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDwRdQFgQVn5Un8Od2nP4u5EbMx-dMOYoU", authDomain: "chat-52c0d.firebaseapp.com", projectId: "chat-52c0d", appId: "1:449329325475:web:75f255c4055360dc9e6616" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.handleLogout = () => signOut(auth).then(() => location.href = 'index.html');

    onAuthStateChanged(auth, async (user) => {
        if (!user) { location.href = "login.html"; return; }

        // 基本資訊
        document.getElementById('display-name').innerText = user.email.split('@')[0];
        document.getElementById('display-uid').innerText = `帳號：${user.email}`;
        const avatarUrl = `https://ui-avatars.com/api/?name=${user.email}&size=128&background=random`;
        document.getElementById('profile-avatar').src = avatarUrl;
        document.getElementById('side-avatar').src = avatarUrl;
        document.getElementById('side-username').innerText = user.email.split('@')[0];

        try {
            // 抓 Firestore 使用者資料
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if (userSnap.exists()) {
                const data = userSnap.data();
                document.getElementById('count-coins').innerText = data.coins || 0;
                document.getElementById('count-lv').innerText = data.lv || 1;
                document.getElementById('side-coins').innerText = data.coins || 0;

                let role = data.role || 'student';
                if (user.email === 'chianghansen0302@gmail.com') role = 'admin';
                if (role === 'admin' || role === 'teacher') {
                    const adminLink = document.getElementById('admin-link-main');
                    if (adminLink) { adminLink.style.display = 'flex'; adminLink.innerText = role === 'admin' ? '🛠️ 管理面板' : '❓ 題庫管理'; }
                }
            }

            // 計算作品數量
            const projSnap = await getDocs(collection(db, "users", user.uid, "projects"));
            document.getElementById('count-projects').innerText = projSnap.size;

            // 計算班級數量
            const [tSnap, sSnap] = await Promise.all([
                getDocs(query(collection(db, "classes"), where("teacherId", "==", user.uid))),
                getDocs(query(collection(db, "classes"), where("students", "array-contains", user.uid)))
            ]);
            document.getElementById('count-classes').innerText = tSnap.size + sSnap.size;

        } catch (e) { console.error("資料載入失敗", e); }
    });
</script>

</body>
</html>
