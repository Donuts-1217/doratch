<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Doratch">
    <link rel="icon" type="image/png" href="icons/icon.png">
    <link rel="apple-touch-icon" href="icons/icon.png">
    <link rel="stylesheet" href="doratch-mobile-shell.css">
    <link rel="stylesheet" href="responsive-global.css">
    <link rel="stylesheet" href="doratch-shell.css">
    <link rel="stylesheet" href="shared/doratch-profile-fx.css">
    <link rel="stylesheet" href="shared/doratch-docoin-luxury.css">
    <title>個人檔案 - Doratch</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4C97FF; --secondary: #FFAB19; --accent: #855CD6;
            --bg: #0F172A; --card-bg: #1E293B; --text: #F8FAFC;
        }
        body { font-family: 'Outfit', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; overflow-x: hidden; }

        .main-content { padding: 40px; overflow-x: hidden; box-sizing: border-box; }

        /* 個人資料卡 */
        .profile-hero { 
            background: linear-gradient(135deg, var(--primary), var(--accent)); 
            border-radius: 32px; padding: 60px 40px; text-align: center;
            position: relative; overflow: hidden; margin-bottom: 30px;
        }
        .profile-hero::after { content: "👤"; position: absolute; right: -20px; bottom: -30px; font-size: 200px; opacity: 0.07; }
        .avatar-large { width: 120px; height: 120px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.4); margin-bottom: 20px; transition: 0.2s; }
        .profile-name { font-size: 2rem; font-weight: 900; margin-bottom: 5px; }
        .profile-id { font-size: 12px; opacity: 0.7; }
        .profile-meta-line { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin-bottom: 6px; }
        .profile-chip { padding:4px 10px; border-radius: 999px; font-size:12px; font-weight:900; background: rgba(255,255,255,0.2); color:#fff; }
        .profile-chip.badge { background: rgba(15,23,42,0.35); border:1px solid rgba(255,255,255,0.2); }
        @keyframes profileGlowPulse {
            0%, 100% { box-shadow: 0 0 0 5px rgba(99,102,241,0.18), 0 0 24px rgba(147,51,234,0.35); }
            50% { box-shadow: 0 0 0 7px rgba(244,114,182,0.2), 0 0 32px rgba(245,158,11,0.5); }
        }
        @keyframes profileShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes profileNameWave {
            0%, 100% { text-shadow: 0 0 0 rgba(56,189,248,0.25); }
            50% { text-shadow: 0 0 12px rgba(56,189,248,0.5); }
        }
        @keyframes profileParticlePulse {
            0%, 100% { box-shadow: 0 0 0 5px rgba(251,113,133,0.2), 0 0 28px rgba(249,115,22,0.48); }
            50% { box-shadow: 0 0 0 7px rgba(251,191,36,0.24), 0 0 36px rgba(99,102,241,0.45); }
        }
        @keyframes profileBadgeGlow {
            0%, 100% { box-shadow: 0 0 12px rgba(245,158,11,0.25); }
            50% { box-shadow: 0 0 22px rgba(244,114,182,0.42), 0 0 30px rgba(250,204,21,0.35); }
        }
        .avatar-legendary {
            animation: profileGlowPulse 2.2s ease-in-out infinite;
        }
        .avatar-particle {
            animation: profileParticlePulse 1.85s ease-in-out infinite;
        }
        .profile-name.name-effect-prism > .name-fx-text,
        .profile-name.name-effect-aurora-pulse > .name-fx-text,
        .profile-name.name-effect-rainbow > .name-fx-text {
            color: transparent !important;
            -webkit-text-fill-color: transparent !important;
            background-color: transparent;
            background-repeat: no-repeat;
            -webkit-background-clip: text;
            background-clip: text;
        }
        .profile-name.name-effect-prism {
            background: none;
        }
        .profile-name.name-effect-prism > .name-fx-text {
            background-image: linear-gradient(90deg, #f59e0b, #22d3ee, #f43f5e, #a78bfa, #f59e0b);
            background-size: 220% 100%;
            animation: profileShimmer 2.6s linear infinite;
        }
        .profile-name.name-effect-stardust > .name-fx-text {
            animation: profileNameWave 2.1s ease-in-out infinite;
            text-shadow: 0 0 8px rgba(251,191,36,0.45), 0 0 14px rgba(167,139,250,0.35);
        }
        .profile-name.name-effect-pulse-core > .name-fx-text {
            animation: profileBadgeGlow 1.6s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(244,114,182,0.42);
        }
        .profile-name.name-effect-aurora-pulse {
            background: none;
        }
        .profile-name.name-effect-aurora-pulse > .name-fx-text {
            background-image: linear-gradient(90deg, #34d399, #60a5fa, #a78bfa, #34d399);
            background-size: 220% 100%;
            animation: profileShimmer 2.4s linear infinite;
        }
        .profile-name.name-effect-rainbow {
            background: none;
        }
        .profile-name.name-effect-rainbow > .name-fx-text {
            background-image: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #a855f7, #ef4444);
            background-size: 300% 100%;
            animation: profileShimmer 3s linear infinite;
        }
        .profile-name.name-effect-neon-flicker > .name-fx-text {
            animation: profileNameWave 1.4s ease-in-out infinite;
            text-shadow: 0 0 8px rgba(34,211,238,0.6), 0 0 16px rgba(244,114,182,0.4);
        }
        .profile-name.name-effect-sparkle > .name-fx-text {
            animation: profileBadgeGlow 1.2s ease-in-out infinite;
            text-shadow: 0 0 6px rgba(250,204,21,0.55), 0 0 12px rgba(251,191,36,0.35);
        }
        .profile-name.name-effect-glitch > .name-fx-text {
            animation: dfxGlitch 2.2s infinite;
        }
        .profile-name.name-effect-wave > .name-fx-text {
            animation: profileNameWave 2.3s ease-in-out infinite;
        }
        .profile-name > .name-fx-text { display: inline; position: relative; }
        .dc-banner.banner-midnight { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #312e81 100%); }
        .dc-banner.banner-sunset { background: linear-gradient(135deg, #f97316, #ec4899 50%, #7c3aed); }
        .dc-banner.banner-forest { background: linear-gradient(135deg, #14532d, #22c55e 45%, #065f46); }
        .dc-banner.banner-galaxy { background: linear-gradient(135deg, #0f0a1a, #4338ca 40%, #7c3aed 70%, #06b6d4); background-size: 200% 200%; animation: dfxShift 8s ease infinite; }
        .dc-banner.banner-neon_city { background: linear-gradient(135deg, #0f172a, #be185d 40%, #7c3aed 70%, #22d3ee); background-size: 220% 220%; animation: dfxShift 6s ease infinite; }
        .profile-chip.legendary-title {
            color: transparent;
            background: linear-gradient(90deg, #f59e0b, #f43f5e, #60a5fa, #f59e0b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            animation: profileShimmer 2.6s linear infinite;
        }
        .profile-chip.badge.legendary-badge {
            border-color: rgba(255,255,255,0.45);
            box-shadow: 0 0 12px rgba(245,158,11,0.25);
        }
        .profile-chip.badge.legendary-badge-mythic {
            animation: profileBadgeGlow 1.8s ease-in-out infinite;
            border-color: rgba(250,204,21,0.55);
        }

        /* 數據統計區 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-box { background: var(--card-bg); padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); text-align: center; transition: 0.3s; }
        .stat-box:hover { transform: translateY(-5px); border-color: var(--primary); }
        .stat-value { font-size: 2.5rem; font-weight: 900; color: var(--primary); display: block; margin-bottom: 8px; }
        .stat-label { font-size: 13px; color: #64748B; text-transform: uppercase; letter-spacing: 1px; }

        .btn-edit-profile { 
            background: rgba(255,255,255,0.2); color: white; border: none; 
            padding: 12px 30px; border-radius: 20px; font-weight: 900; cursor: pointer; 
            transition: 0.3s; backdrop-filter: blur(5px); margin-top: 15px;
        }
        .btn-edit-profile:hover { background: rgba(255,255,255,0.35); transform: translateY(-2px); }

        .action-card { background: var(--card-bg); border-radius: 24px; padding: 30px; border: 1px solid rgba(255,255,255,0.05); }
        .action-card h3 { margin: 0 0 20px; font-size: 1.1rem; color: #94A3B8; }
        .action-btn { display: block; width: 100%; padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: white; font-weight: bold; text-decoration: none; margin-bottom: 12px; transition: 0.3s; cursor: pointer; text-align: left; font-size: 14px; }
        .action-btn:hover { background: rgba(76,151,255,0.1); border-color: var(--primary); color: var(--primary); }
        .cosmetic-grid {
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        .cosmetic-grid label { font-size:12px; color:#94A3B8; display:block; margin-bottom:4px; }
        .cosmetic-grid select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.14);
            background: #0F172A;
            color: white;
            box-sizing: border-box;
        }
        .btn-save-cosmetic {
            margin-top: 14px;
            border: none;
            border-radius: 12px;
            padding: 11px 14px;
            font-weight: 900;
            color: white;
            background: linear-gradient(135deg, #4C97FF, #855CD6);
            cursor: pointer;
        }
        #cosmetic-msg { font-size: 12px; margin-top: 8px; color:#93C5FD; min-height: 1.2em; }

        /* Discord 風格個人面板 */
        .dc-profile-wrap { max-width: 680px; margin: 0 auto 24px; overflow: hidden; border-radius: 16px; isolation: isolate; }
        .dc-banner {
            height: 148px; border-radius: 16px 16px 0 0; position: relative;
            background: linear-gradient(135deg, #4C97FF, #855CD6);
            overflow: hidden;
        }
        /* 橫幅／面板特效（置於 base 之後，確保覆蓋預設漸層） */
        .dc-banner.banner-midnight { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #312e81 100%) !important; }
        .dc-banner.banner-sunset { background: linear-gradient(135deg, #f97316, #ec4899 50%, #7c3aed) !important; }
        .dc-banner.banner-forest { background: linear-gradient(135deg, #14532d, #22c55e 45%, #065f46) !important; }
        .dc-banner.banner-galaxy { background: linear-gradient(135deg, #0f0a1a, #4338ca 40%, #7c3aed 70%, #06b6d4) !important; background-size: 200% 200% !important; animation: dfxShift 8s ease infinite !important; }
        .dc-banner.banner-neon_city { background: linear-gradient(135deg, #0f172a, #be185d 40%, #7c3aed 70%, #22d3ee) !important; background-size: 220% 220% !important; animation: dfxShift 6s ease infinite !important; }
        .dc-body {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.06);
            border-top: none; border-radius: 0 0 16px 16px; padding: 0 20px 20px;
            position: relative; z-index: 3;
        }
        .dc-avatar-row { display: flex; gap: 16px; align-items: flex-end; margin-top: -52px; position: relative; z-index: 4; }
        .dc-avatar-wrap { position: relative; flex-shrink: 0; }
        .dc-avatar-wrap .avatar-large {
            width: 96px; height: 96px; margin-bottom: 0;
            border: 5px solid var(--card-bg); border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
        }
        .dc-status-dot {
            position: absolute; bottom: 6px; right: 6px; width: 18px; height: 18px;
            border-radius: 50%; background: #23a559; border: 4px solid var(--card-bg);
        }
        .dc-name-block { flex: 1; min-width: 0; padding-bottom: 6px; position: relative; z-index: 1; }
        .dc-name-block .profile-name {
            font-size: 1.5rem; margin-bottom: 2px; text-align: left;
            position: relative; z-index: 1;
            display: inline-block; width: fit-content; max-width: 100%;
        }
        .dc-custom-status { font-size: 13px; color: #94a3b8; font-weight: 600; margin-top: 2px; }
        .dc-custom-status.empty { color: #64748b; font-style: italic; font-weight: 400; }
        .dc-meta-line { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; justify-content: flex-start; }
        .dc-edit-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .dc-edit-btn {
            border: none; background: rgba(255,255,255,0.08); color: #e2e8f0;
            padding: 8px 14px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer;
        }
        .dc-edit-btn:hover { background: rgba(76,151,255,0.2); color: #fff; }
        .dc-tabs {
            display: flex; gap: 0; border-bottom: 1px solid rgba(255,255,255,0.08);
            margin: 18px 0 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        .dc-tab {
            flex: 0 0 auto; padding: 12px 18px; background: none; border: none;
            color: #94a3b8; font-weight: 800; font-size: 13px; cursor: pointer;
            border-bottom: 2px solid transparent; font-family: inherit; white-space: nowrap;
        }
        .dc-tab.active { color: #fff; border-bottom-color: var(--primary); }
        .dc-panel { display: none; padding-top: 16px; }
        .dc-panel.active { display: block; }
        .dc-field { margin-bottom: 14px; }
        .dc-field label { display: block; font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
        .dc-field input, .dc-field textarea, .dc-field select {
            width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
            background: #0f172a; color: #fff; font-size: 16px; box-sizing: border-box; font-family: inherit;
        }
        .dc-field textarea { min-height: 100px; resize: vertical; line-height: 1.5; }
        .dc-field input:focus, .dc-field textarea:focus { outline: none; border-color: var(--primary); }
        .dc-about-preview {
            background: rgba(0,0,0,0.2); border-radius: 10px; padding: 14px;
            font-size: 14px; line-height: 1.6; color: #cbd5e1; white-space: pre-wrap; word-break: break-word;
        }
        .dc-about-preview.empty { color: #64748b; font-style: italic; }
        .dc-member-info { font-size: 12px; color: #64748b; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
        .btn-save-profile {
            margin-top: 12px; border: none; border-radius: 12px; padding: 12px 18px;
            font-weight: 900; color: white; background: linear-gradient(135deg, #4C97FF, #855CD6); cursor: pointer; width: 100%;
        }
        #profile-msg { font-size: 12px; margin-top: 8px; color: #93c5fd; min-height: 1.2em; }
        .profile-hero { display: none; }

        .setup-banner {
            background: linear-gradient(90deg, #FFAB19, #FF6B6B);
            color: #1E293B;
            padding: 16px 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            font-weight: bold;
            display: none;
        }
        .setup-banner.visible { display: block; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            display: none; align-items: center; justify-content: center;
            z-index: 2000; padding: 20px; box-sizing: border-box;
        }
        .modal-overlay.open { display: flex; }
        .modal-card {
            background: var(--card-bg); border-radius: 20px; padding: 28px;
            width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-card h3 { margin: 0 0 8px; }
        .modal-card p { margin: 0 0 16px; color: #94A3B8; font-size: 14px; }
        .modal-card input {
            width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1);
            background: #0F172A; color: white; font-size: 16px; box-sizing: border-box;
        }
        .modal-card input:focus { outline: none; border-color: var(--primary); }
        .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .modal-actions button {
            flex: 1; padding: 12px; border-radius: 12px; font-weight: 900; cursor: pointer; border: none;
        }
        .btn-modal-save { background: var(--primary); color: white; }
        .btn-modal-cancel { background: rgba(255,255,255,0.08); color: #94A3B8; }
        #name-form-msg { font-size: 13px; color: #F87171; margin-top: 8px; min-height: 1.2em; }
    
        
        @media (max-width: 1024px) {
            .main-content { padding: 15px; }
            
            /* 卡片與通用排版 */
            #user-stats-card { flex-wrap: wrap; justify-content: center; text-align: center; }
            #user-stats-card > div { width: 100%; }
            .header, .header-title { flex-direction: column; gap: 15px; text-align: center; }
            .project-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            .game-grid { grid-template-columns: 1fr; }
            
            /* 遊戲區域適應 */
            .boss-raid-container, .game-frame { width: 100%; box-sizing: border-box; padding: 20px 10px; min-height: auto; }
            .duel-arena { grid-template-columns: 1fr; }
            .boss-image-container { width: 200px; height: 200px; margin: 0 auto 15px; }
        }
        
        @media (max-width: 740px) {
            /* 精準縮放 700px 的遊戲畫布 (塔防與PvP) */
            [style*="width:700px"] { 
                transform-origin: top left;
                transform: scale(calc((100vw - 30px) / 700));
                margin-bottom: calc(-300px * (1 - ((100vw - 30px) / 700))); 
            }
        }
        
        @media (max-width: 480px) {
            .nav-item { font-size: 13px; padding: 10px 15px; }
            .hero h1 { font-size: 2.5rem; }
        }

    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar-main" data-doratch-active="profile">
        <div class="sidebar-footer">
            <div class="user-mini-card">
                <img id="side-avatar" src="" style="width:32px; height:32px; border-radius:50%;">
                <div style="flex:1; overflow:hidden;">
                    <div id="side-username" style="font-size:12px; font-weight:bold; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">載入中...</div>
                    <div style="font-size:10px; color:#64748B;">💳 <span id="side-coins">Doord 0 · Docoin 0</span></div>
                </div>
                <button onclick="handleLogout()" style="background:none; border:none; color:#64748B; cursor:pointer;">🚪</button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div id="setup-banner" class="setup-banner">
            請先設定顯示名稱，讓同學與老師在排行榜、聊天室能認出你。
        </div>

        <div class="dc-profile-wrap">
            <div id="dc-banner" class="dc-banner"></div>
            <div class="dc-body">
                <div class="dc-avatar-row">
                    <div class="dc-avatar-wrap">
                        <img id="profile-avatar" class="avatar-large" src="" alt="">
                        <span class="dc-status-dot" title="線上"></span>
                    </div>
                    <div class="dc-name-block">
                        <div id="profile-display-name" class="profile-name">載入中...</div>
                        <div id="profile-custom-status-view" class="dc-custom-status empty">設定自訂狀態…</div>
                        <div class="dc-meta-line">
                            <span id="profile-title-chip" class="profile-chip" style="display:none;"></span>
                            <span id="profile-badge-chip" class="profile-chip badge" style="display:none;"></span>
                        </div>
                        <div class="dc-edit-row">
                            <button type="button" class="dc-edit-btn" id="btn-edit-display-name">✏️ 編輯名稱</button>
                            <button type="button" class="dc-edit-btn" id="btn-edit-profile-info">💬 編輯狀態與自介</button>
                        </div>
                    </div>
                </div>

                <div class="dc-tabs" role="tablist">
                    <button type="button" class="dc-tab active" data-dc-tab="profile">個人資料</button>
                    <button type="button" class="dc-tab" data-dc-tab="appearance">外觀裝備</button>
                    <button type="button" class="dc-tab" data-dc-tab="account">帳號與統計</button>
                </div>

                <div class="dc-panel active" id="dc-panel-profile">
                    <div class="dc-field">
                        <label>關於我</label>
                        <div id="profile-bio-view" class="dc-about-preview empty">尚未撰寫自我介紹…</div>
                    </div>
                    <div class="dc-member-info">
                        <div id="display-uid">帳號：---</div>
                        <div id="member-since">加入時間：---</div>
                    </div>
                </div>

                <div class="dc-panel" id="dc-panel-appearance">
                    <p style="font-size:13px;color:#94a3b8;margin:0 0 12px;">商城購買的道具可在這裡裝備，聊天室與個人面板會同步顯示。</p>
                    <div class="cosmetic-grid">
                        <div><label for="equip-avatar">頭像樣式</label><select id="equip-avatar"></select></div>
                        <div><label for="equip-frame">頭像框</label><select id="equip-frame"></select></div>
                        <div><label for="equip-banner">個人橫幅</label><select id="equip-banner"></select></div>
                        <div><label for="equip-title">稱號</label><select id="equip-title"></select></div>
                        <div><label for="equip-badge">徽章</label><select id="equip-badge"></select></div>

    function ownedItemsBySlot(data, slot) {
        const inv = Array.isArray(data && data.inventory) ? data.inventory : [];
        const ids = new Set(inv.map((x) => (typeof x === "string" ? x : (x && x.id) || "")).filter(Boolean));
        return COSMETIC_ITEMS.filter(it => it.slot === slot && ids.has(it.id));
    }

    function resolveVisualCosmetic(data, slot, fallbackRaw) {
        const eq = data ? getEquipped(data) : {};
        const raw = String(fallbackRaw !== undefined ? fallbackRaw : eq[slot] || "").trim();
        if (!raw) return "";
        let normalized = cosmeticDisplayValue(slot, raw);
        if (!normalized && COSMETIC_ITEMS.some((it) => it.slot === slot && it.value === raw)) {
            normalized = raw;
        }
        if (!normalized) return "";
        if (!data) return normalized;
        const owned = ownedItemsBySlot(data, slot);
        if (owned.some((it) => it.value === normalized)) return normalized;
        const viaPick = pickOwnedEquipped({ ...data, equippedCosmetics: { ...eq, [slot]: raw } }, slot);
        if (viaPick) return viaPick;
        if (String(eq[slot] || "").trim() || (fallbackRaw !== undefined && String(fallbackRaw).trim())) return normalized;
        return "";
    }

    function pickOwnedEquipped(data, slot) {
        const eq = getEquipped(data);
        const owned = ownedItemsBySlot(data, slot);
        const raw = String(eq[slot] || "").trim();
        if (!raw) return "";
        if (owned.some((it) => it.value === raw)) return raw;
        const byId = owned.find((it) => it.id === raw);
        return byId ? byId.value : "";
    }

    function cosmeticDisplayValue(slot, raw) {
        const v = String(raw || "").trim();
        if (!v) return "";
        const item = COSMETIC_ITEMS.find((it) => it.slot === slot && (it.value === v || it.id === v));
        return item ? item.value : "";
    }

        return (data && data.equippedCosmetics) ? data.equippedCosmetics : {};
    }

            const cls = nameEffectClass(nameEffect);
            if (cls) nameEl.classList.add(cls);
            const gradientFx = ["name-effect-prism", "name-effect-aurora-pulse", "name-effect-rainbow"];
            if (nameSpan) {
                nameSpan.style.color = (cls && gradientFx.includes(cls)) ? "" : (nameColor || "#ffffff");
                nameSpan.style.background = "";
            }
        }
        const sideNameEl = document.getElementById("side-username");
        if (sideNameEl) sideNameEl.style.color = nameColor || "";

        const titleEl = document.getElementById("profile-title-chip");
        const badgeEl = document.getElementById("profile-badge-chip");
        if (titleEl) {
            titleEl.style.display = title ? "inline-flex" : "none";
            titleEl.textContent = title ? ("🏷️ " + title) : "";
            titleEl.classList.toggle("legendary-title", isLegendaryTitle(title));
        }
        if (badgeEl) {
            badgeEl.style.display = badge ? "inline-flex" : "none";
            badgeEl.textContent = badge ? ("✨ " + badge) : "";
            badgeEl.classList.toggle("legendary-badge", isLegendaryBadge(badge));
            badgeEl.classList.toggle("legendary-badge-mythic", isMythicBadge(badge));
        }
        applyDocoinLuxuryUI(data);
    }

    function applyDocoinLuxuryUI(data) {
        try {
            const profileEffect = resolveVisualCosmetic(data, "profileEffect");
            const banner = resolveVisualCosmetic(data, "banner");
            const avatar = pickOwnedEquipped(data, "avatar");
            const title = pickOwnedEquipped(data, "title");

            document.querySelector(".dc-profile-wrap")?.classList.toggle(
                "docoin-panel-lux",
                isDocoinProfileEffect(profileEffect) || isDocoinBanner(banner)
            );
            const bannerEl = document.getElementById("dc-banner");
            if (bannerEl) bannerEl.classList.toggle("docoin-banner-lux", isDocoinBanner(banner));
            document.querySelector(".dc-avatar-wrap")?.classList.toggle("docoin-avatar-lux", isDocoinAvatar(avatar));
            const titleEl = document.getElementById("profile-title-chip");
            if (titleEl) titleEl.classList.toggle("docoin-title-lux", isDocoinLegendaryTitle(title));
        } catch (e) {
            console.warn("applyDocoinLuxuryUI", e);
        }
    }

    function fillSelect(id, items, selectedValue, emptyLabel) {
        const sel = document.getElementById(id);
        if (!sel) return;
        sel.innerHTML = "";
        const base = document.createElement("option");
        base.value = "";
        base.textContent = emptyLabel;
        sel.appendChild(base);
        const seenValues = new Set();
        items.forEach(function (it) {
            const val = String(it.value || "");
            if (!val || seenValues.has(val)) return;
            seenValues.add(val);
            const opt = document.createElement("option");
            opt.value = val;
            opt.textContent = it.label;
            sel.appendChild(opt);
        });
        const target = String(selectedValue || "");
        if (target && seenValues.has(target)) sel.value = target;
        else sel.value = "";
    }

    function renderCosmeticPanel(data) {
        fillSelect("equip-avatar", ownedItemsBySlot(data, "avatar"), pickOwnedEquipped(data, "avatar"), "預設頭像");
        fillSelect("equip-frame", ownedItemsBySlot(data, "frame"), pickOwnedEquipped(data, "frame"), "不使用頭像框");
        fillSelect("equip-banner", ownedItemsBySlot(data, "banner"), pickOwnedEquipped(data, "banner"), "預設橫幅");
        fillSelect("equip-title", ownedItemsBySlot(data, "title"), pickOwnedEquipped(data, "title"), "不使用稱號");
        fillSelect("equip-badge", ownedItemsBySlot(data, "badge"), pickOwnedEquipped(data, "badge"), "不使用徽章");
        fillSelect("equip-name-color", ownedItemsBySlot(data, "nameColor"), pickOwnedEquipped(data, "nameColor"), "預設名稱顏色");
        fillSelect("equip-name-effect", ownedItemsBySlot(data, "nameEffect"), pickOwnedEquipped(data, "nameEffect"), "不使用名稱特效");
        fillSelect("equip-profile-effect", ownedItemsBySlot(data, "profileEffect"), pickOwnedEquipped(data, "profileEffect"), "不使用個人面板特效");
    }

    function previewDcBannerFromForm() {
        if (!userData) return;
        const banner = (document.getElementById("equip-banner") && document.getElementById("equip-banner").value) || "";
        const profileEffect = (document.getElementById("equip-profile-effect") && document.getElementById("equip-profile-effect").value) || "";
        applyDcBannerVisuals(String(banner).trim(), String(profileEffect).trim(), userData);
    }

    function applyProfileTextFields(data) {
        const status = String(data && data.customStatus || "").trim();
        const bio = String(data && data.profileBio || "").trim();
        const statusView = document.getElementById("profile-custom-status-view");
        const bioView = document.getElementById("profile-bio-view");
        if (statusView) {
            statusView.textContent = status || "設定自訂狀態…";
            statusView.classList.toggle("empty", !status);
        }
        if (bioView) {
            bioView.textContent = bio || "尚未撰寫自我介紹…";
            bioView.classList.toggle("empty", !bio);
        }
    }

    function formatMemberSince(data) {
        const ts = data && (data.createdAt || data.created_at);
        if (!ts) return "加入時間：未知";
        try {
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            if (isNaN(d.getTime())) return "加入時間：未知";
            return "加入時間：" + d.toLocaleDateString("zh-TW", { year: "numeric", month: "long", day: "numeric" });
        } catch (_) {
            return "加入時間：未知";
        }
    }

    function applyDisplayUI(user, data) {
        const label = getDisplayLabel(data, user.email);
        const avatar = avatarUrlFor(data, user.email, 128);
        const nameEl = document.getElementById("profile-display-name");
        ensureNameFxSpan(nameEl, label);
        document.getElementById("display-uid").innerText = `帳號：${user.email}`;
        const memberEl = document.getElementById("member-since");
        if (memberEl) memberEl.textContent = formatMemberSince(data);
        document.getElementById("profile-avatar").src = avatar;
        document.getElementById("side-avatar").src = avatarUrlFor(data, user.email, 32);
        document.getElementById("side-username").innerText = label;
        document.getElementById("side-coins").innerText = `Doord ${Math.floor(getDoordValue(data))} · Docoin ${Math.floor(getDocoinValue(data))}`;
        const missing = needsDisplayName(data);
        if (setupBanner) setupBanner.classList.toggle("visible", missing);
        applyProfileTextFields(data);
        applyCosmetics(data);
        renderCosmeticPanel(data);
    }

    document.querySelectorAll(".dc-tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
            const key = tab.getAttribute("data-dc-tab");
            document.querySelectorAll(".dc-tab").forEach(function (t) { t.classList.remove("active"); });
            document.querySelectorAll(".dc-panel").forEach(function (p) { p.classList.remove("active"); });
            tab.classList.add("active");
            const panel = document.getElementById("dc-panel-" + key);
            if (panel) panel.classList.add("active");
        });
    });

    const profileInfoModal = document.getElementById("profile-info-modal");
    const btnEditProfileInfo = document.getElementById("btn-edit-profile-info");
    if (btnEditProfileInfo && profileInfoModal) {
        btnEditProfileInfo.addEventListener("click", function () {
            document.getElementById("input-custom-status").value = String(userData.customStatus || "").trim();
            document.getElementById("input-profile-bio").value = String(userData.profileBio || "").trim();
            document.getElementById("profile-form-msg").textContent = "";
            profileInfoModal.classList.add("open");
            profileInfoModal.setAttribute("aria-hidden", "false");
        });
    }
    const btnProfileInfoCancel = document.getElementById("btn-profile-info-cancel");
    if (btnProfileInfoCancel && profileInfoModal) {
        btnProfileInfoCancel.addEventListener("click", function () {
            profileInfoModal.classList.remove("open");
            profileInfoModal.setAttribute("aria-hidden", "true");
        });
    }
    if (profileInfoModal) {
        profileInfoModal.addEventListener("click", function (e) {
            if (e.target === profileInfoModal) {
                profileInfoModal.classList.remove("open");
                profileInfoModal.setAttribute("aria-hidden", "true");
            }
        });
    }
    const btnProfileInfoSave = document.getElementById("btn-profile-info-save");
    if (btnProfileInfoSave) {
        btnProfileInfoSave.addEventListener("click", async function () {
        if (!userRef) return;
        const status = String(document.getElementById("input-custom-status").value || "").trim().slice(0, 60);
        const bio = String(document.getElementById("input-profile-bio").value || "").trim().slice(0, 300);
        const msg = document.getElementById("profile-form-msg");
        const btn = document.getElementById("btn-profile-info-save");
        btn.disabled = true;
        btn.textContent = "儲存中…";
        try {
            await updateDoc(userRef, { customStatus: status, profileBio: bio });
            userData = { ...userData, customStatus: status, profileBio: bio };
            applyProfileTextFields(userData);
            profileInfoModal.classList.remove("open");
            profileInfoModal.setAttribute("aria-hidden", "true");
            if (msg) msg.textContent = "";
        } catch (e) {
            console.error(e);
            if (msg) msg.textContent = "儲存失敗，請稍後再試";
        } finally {
            btn.disabled = false;
            btn.textContent = "儲存";
        }
        });
    }

    function openNameModal(required) {
        const cur = normalizeDisplayName(userData.displayName);
        inputName.value = cur.length >= 2 ? cur : "";
        msgEl.textContent = "";
        document.getElementById("name-modal-desc").innerText = required
            ? "請輸入顯示名稱後才能繼續使用平台。"
            : "此名稱會顯示在排行榜、聊天室與班級中。";
        document.getElementById("btn-name-cancel").style.display = required ? "none" : "block";
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
        inputName.focus();
    }

    function closeNameModal() {
        if (forceSetup && needsDisplayName(userData)) return;
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
    }

    document.getElementById("btn-edit-display-name").addEventListener("click", () => openNameModal(false));
    document.getElementById("btn-name-cancel").addEventListener("click", closeNameModal);
    modal.addEventListener("click", (e) => {
        if (e.target === modal && !forceSetup) closeNameModal();
    });

    document.getElementById("btn-name-save").addEventListener("click", async () => {
        const check = validateDisplayNameInput(inputName.value);
        if (!check.ok) {
            msgEl.textContent = check.error;
            return;
        }
        msgEl.textContent = "";
        const btn = document.getElementById("btn-name-save");
        btn.disabled = true;
        btn.textContent = "儲存中…";
        try {
            if (!userRef) throw new Error("未登入");
            await updateDoc(userRef, { displayName: check.name });
            userData = { ...userData, displayName: check.name };
            applyDisplayUI(currentUser, userData);
            closeNameModal();
            if (forceSetup && !needsDisplayName(userData)) {
                history.replaceState({}, "", "profile.html");
                setupBanner.classList.remove("visible");
            }
        } catch (e) {
            msgEl.textContent = "儲存失敗，請稍後再試";
            console.error(e);
        } finally {
            btn.disabled = false;
            btn.textContent = "儲存";
        }
    });

    document.getElementById("btn-save-cosmetic").addEventListener("click", async () => {
        if (!userRef || !currentUser) return;
        const equipped = {
            avatar: (document.getElementById("equip-avatar").value || "").trim(),
            frame: (document.getElementById("equip-frame").value || "").trim(),
            banner: (document.getElementById("equip-banner").value || "").trim(),
            title: (document.getElementById("equip-title").value || "").trim(),
            badge: (document.getElementById("equip-badge").value || "").trim(),
            nameColor: (document.getElementById("equip-name-color").value || "").trim(),
            nameEffect: (document.getElementById("equip-name-effect").value || "").trim(),
            profileEffect: (document.getElementById("equip-profile-effect").value || "").trim()
        };
        const msg = document.getElementById("cosmetic-msg");
        const btn = document.getElementById("btn-save-cosmetic");
        btn.disabled = true;
        btn.textContent = "儲存中…";
        try {
            await updateDoc(userRef, { equippedCosmetics: equipped });
            userData = { ...userData, equippedCosmetics: equipped };
            applyDisplayUI(currentUser, userData);
            if (msg) msg.textContent = "外觀設定已儲存並套用。";
        } catch (e) {
            console.error(e);
            if (msg) msg.textContent = "儲存失敗，請稍後再試。";
        } finally {
            btn.disabled = false;
            btn.textContent = "儲存外觀設定";
        }
    });

    ["equip-banner", "equip-profile-effect"].forEach(function (id) {
        const el = document.getElementById(id);
        if (el) el.addEventListener("change", previewDcBannerFromForm);
    });

    window.handleLogout = () => signOut(auth).then(() => location.href = "index.html");

    onAuthStateChanged(auth, async (user) => {
        if (!user) { location.href = "login.html"; return; }
        currentUser = user;
        userRef = doc(db, "users", user.uid);

        try {
            let userSnap = await getDoc(userRef);
            if (!userSnap.exists()) {
                await setDoc(userRef, { email: user.email, uid: user.uid, xp: 0, lv: 1, coins: 0, doord: 0, docoin: 0, role: "student" }, { merge: true });
                userSnap = await getDoc(userRef);
            }
            userData = userSnap.exists() ? userSnap.data() : {};
            applyDisplayUI(user, userData);

            document.getElementById("count-coins").innerText = Math.floor(getDoordValue(userData));
            document.getElementById("count-lv").innerText = userData.lv || 1;
            document.getElementById("side-coins").innerText = `Doord ${Math.floor(getDoordValue(userData))} · Docoin ${Math.floor(getDocoinValue(userData))}`;

            let role = userData.role || "student";
            if (user.email === "chianghansen0302@gmail.com") role = "admin";
            if (role === "admin" || role === "teacher") {
                const adminLink = document.getElementById("admin-link-main");
                if (adminLink) {
                    adminLink.style.display = "flex";
                    adminLink.innerText = role === "admin" ? "🛠️ 管理面板" : "❓ 題庫管理";
                }
            }

            const projSnap = await getDocs(collection(db, "users", user.uid, "projects"));
            document.getElementById("count-projects").innerText = projSnap.size;

            const [tSnap, sSnap] = await Promise.all([
                getDocs(query(collection(db, "classes"), where("teacherId", "==", user.uid))),
                getDocs(query(collection(db, "classes"), where("students", "array-contains", user.uid)))
            ]);
            document.getElementById("count-classes").innerText = tSnap.size + sSnap.size;

            if (needsDisplayName(userData) || forceSetup) {
                openNameModal(true);
            }
        } catch (e) {
            console.error("資料載入失敗", e);
            if (user) {
                const fallbackData = { displayName: "", coins: 0, doord: 0, docoin: 0, lv: 1 };
                applyDisplayUI(user, fallbackData);
                document.getElementById("count-coins").innerText = 0;
                document.getElementById("count-lv").innerText = 1;
                document.getElementById("side-coins").innerText = "Doord 0 · Docoin 0";
            }
        }
    });
</script>
