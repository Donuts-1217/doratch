<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="responsive-global.css">
    <link rel="stylesheet" href="doratch-shell.css">
    <script src="doratch-mobile-shell.js"></script>
    <title>探索中心 - Creative Blocks Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4C97FF; --secondary: #FFAB19; --accent: #855CD6;
            --bg: #0F172A; --card-bg: #1E293B; --text: #F8FAFC;
        }
        body { margin: 0; font-family: 'Outfit', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        
        nav { 
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); 
            height: 80px; display: flex; justify-content: space-between; align-items: center; 
            padding: 0 5%; position: fixed; width: 90%; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--primary); cursor: pointer; }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .nav-link { color: #94A3B8; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .nav-link:hover { color: var(--primary); }

        .hero { padding: 120px 5% 60px; text-align: center; background: radial-gradient(circle at 50% 0%, rgba(76, 151, 255, 0.15), transparent 70%); }
        .hero h1 { font-size: 3rem; margin: 0; font-weight: 900; letter-spacing: -1px; }
        .hero p { color: #94A3B8; margin-top: 10px; font-size: 1.1rem; }

        .search-area { max-width: 800px; margin: -30px auto 40px; padding: 0 20px; position: relative; z-index: 10; }
        .search-bar { width: 100%; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); padding: 20px 30px; border-radius: 20px; color: white; font-size: 1.1rem; box-shadow: 0 20px 40px rgba(0,0,0,0.2); outline: none; transition: 0.3s; }
        .search-bar:focus { border-color: var(--primary); box-shadow: 0 20px 40px rgba(76, 151, 255, 0.2); }

        .container { padding: 0 5% 100px; }
        .filter-tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 40px; overflow-x: auto; padding-bottom: 10px; }
        .tab { padding: 10px 25px; border-radius: 50px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #94A3B8; cursor: pointer; white-space: nowrap; transition: 0.3s; font-weight: bold; }
        .tab:hover { background: rgba(255,255,255,0.1); color: white; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .p-card { background: var(--card-bg); border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; transition: 0.4s; cursor: pointer; }
        .p-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .p-thumb { height: 200px; background: #0b0e14; display: flex; align-items: center; justify-content: center; font-size: 5rem; position: relative; }
        .p-thumb::after { content: 'View Project'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(76, 151, 255, 0.8); color: white; font-weight: 900; display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; }
        .p-card:hover .p-thumb::after { opacity: 1; }

        .p-info { padding: 25px; }
        .p-name { font-size: 1.3rem; font-weight: 900; margin-bottom: 12px; }
        .p-meta { display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; color: #94A3B8; }
        .p-author { display: flex; align-items: center; gap: 10px; }
        .p-author img { width: 24px; height: 24px; border-radius: 50%; }

        .loading-pulse { width: 100%; height: 300px; background: rgba(255,255,255,0.02); border-radius: 24px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .challenge-entry-banner {
            max-width: 900px;
            margin: 0 auto 36px;
            padding: 0 20px;
        }
        .challenge-entry-card {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 22px 26px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.25), rgba(76, 151, 255, 0.2));
            border: 1px solid rgba(52, 211, 153, 0.45);
            cursor: pointer;
            transition: 0.25s;
            text-decoration: none;
            color: inherit;
        }
        .challenge-entry-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 16px 40px rgba(76, 151, 255, 0.2);
        }
        .challenge-entry-card h2 { margin: 0 0 6px; font-size: 1.25rem; font-weight: 900; color: #ecfdf5; }
        .challenge-entry-card p { margin: 0; font-size: 14px; color: #94a3b8; line-height: 1.55; max-width: 520px; }
        .challenge-entry-cta {
            flex-shrink: 0;
            padding: 12px 22px;
            border-radius: 12px;
            background: #059669;
            color: #fff;
            font-weight: 900;
            font-size: 14px;
        }

        .main-content { overflow-x: auto; box-sizing: border-box; }
    
        
        @media (max-width: 1024px) {
            .main-content { padding: 15px; }
            
            /* 卡片與通用排版 */
            #user-stats-card { flex-wrap: wrap; justify-content: center; text-align: center; }
            #user-stats-card > div { width: 100%; }
            .header, .header-title { flex-direction: column; gap: 15px; text-align: center; }
            .project-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            .game-grid { grid-template-columns: 1fr; }
            
            /* 遊戲區域適應 */
            .boss-raid-container, .game-frame { width: 100%; box-sizing: border-box; padding: 20px 10px; min-height: auto; }
            .duel-arena { grid-template-columns: 1fr; }
            .boss-image-container { width: 200px; height: 200px; margin: 0 auto 15px; }
        }
        
        @media (max-width: 740px) {
            /* 精準縮放 700px 的遊戲畫布 (塔防與PvP) */
            [style*="width:700px"] { 
                transform-origin: top left;
                transform: scale(calc((100vw - 30px) / 700));
                margin-bottom: calc(-300px * (1 - ((100vw - 30px) / 700))); 
            }
        }
        
        @media (max-width: 480px) {
            .nav-item { font-size: 13px; padding: 10px 15px; }
            .hero h1 { font-size: 2.5rem; }
        }

    </style>
</head>
<body>


<div class="app-container">
    <aside class="sidebar-main" data-doratch-active="main">
        <div class="sidebar-footer">
            <div class="user-mini-card">
                <img id="side-avatar" src="" style="width:32px; height:32px; border-radius:50%;">
                <div style="flex:1; overflow:hidden;">
                    <div id="side-username" style="font-size:12px; font-weight:bold; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">載入中...</div>
                    <div style="font-size:10px; color:#64748B;">💰 <span id="side-coins">0</span></div>
                </div>
                <button onclick="handleLogout()" style="background:none; border:none; color:#64748B; cursor:pointer;">🚪</button>
            </div>
        </div>
    </aside>

    <main class="main-content">

<div class="hero">
    <h1>探索無限創意</h1>
    <p>匯集全校最優秀的積木程式作品，激發你的邏輯靈感</p>
</div>

<div class="challenge-entry-banner">
    <a class="challenge-entry-card" href="challenge_zone.html">
        <div>
            <h2>🎯 全服地圖挑戰</h2>
            <p>固定二十關（前 10 關可預覽、後 10 關隱藏）。題組首次進入時隨機產生並永久保存，全服共用同一組關卡與排行榜。</p>
        </div>
        <span class="challenge-entry-cta">進入挑戰區 →</span>
    </a>
</div>

<div class="search-area">
    <input type="text" class="search-bar" id="search-input" placeholder="🔍 搜尋專案名稱、作者或關鍵字..." oninput="handleSearch()">
</div>

<div class="container">
    <div class="filter-tabs">
        <div class="tab active" onclick="filterBy('all')">🌈 全部作品</div>
        <div class="tab" onclick="filterBy('apcs')">🛡️ 一般題庫</div>
        <div class="tab" onclick="filterBy('game')">🎮 遊戲製作</div>
        <div class="tab" onclick="filterBy('art')">🎨 藝術創作</div>
        <div class="tab" onclick="filterBy('remix')">♻️ 改編專案</div>
    </div>

    <div id="project-grid" class="project-grid">
        <div class="loading-pulse"></div>
        <div class="loading-pulse"></div>
        <div class="loading-pulse"></div>
    </div>
</div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collectionGroup, collection, query, where, orderBy, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDwRdQFgQVn5Un8Od2nP4u5EbMx-dMOYoU", authDomain: "chat-52c0d.firebaseapp.com", projectId: "chat-52c0d", appId: "1:449329325475:web:75f255c4055360dc9e6616" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const DISPLAY_NAME_MIN = 2;
    function normalizeDisplayName(raw) {
        if (raw == null) return "";
        return String(raw).trim().slice(0, 20);
    }
    function needsDisplayName(userData) {
        return normalizeDisplayName(userData && userData.displayName).length < DISPLAY_NAME_MIN;
    }
    function getDisplayLabel(userData, email) {
        const dn = normalizeDisplayName(userData && userData.displayName);
        if (dn.length >= DISPLAY_NAME_MIN) return dn;
        const em = (email || "").trim();
        if (em.includes("@")) return em.split("@")[0];
        return em || "使用者";
    }
    function avatarUrlFor(userData, email, size) {
        const label = getDisplayLabel(userData, email);
        return "https://ui-avatars.com/api/?name=" + encodeURIComponent(label) + "&size=" + (size || 32) + "&background=random";
    }

    window.handleLogout = () => signOut(auth).then(() => location.href='index.html');

    let projects = [];

    onAuthStateChanged(auth, async u => {
        if (u) {
            fetchUserData(u);
        } else {
            document.querySelector('.sidebar-footer').style.display = 'none';
        }
        fetchProjects();
    });

    async function fetchUserData(user) {
        try {
            const snap = await getDoc(doc(db, "users", user.uid));
            if (snap.exists()) {
                const data = snap.data();
                if (needsDisplayName(data)) {
                    location.href = "profile.html?needDisplayName=1";
                    return;
                }
                document.getElementById('side-coins').innerText = data.coins || 0;
                document.getElementById('side-username').innerText = getDisplayLabel(data, user.email);
                document.getElementById('side-avatar').src = avatarUrlFor(data, user.email, 32);
                
                let role = data.role || 'student';
                window.DoratchShell?.applyRoleAdminEntry?.(role, user.email);
            }
        } catch (_) {
            document.getElementById('side-coins').innerText = 0;
            document.getElementById('side-username').innerText = (user.email || '使用者').split('@')[0];
            document.getElementById('side-avatar').src = avatarUrlFor({}, user.email, 32);
        }
    }

    async function fetchProjects() {
        const params = new URLSearchParams(window.location.search);
        const view = params.get('view');
        const gridTitle = document.getElementById('grid-title');
        
        let q;
        if (view === 'mine' && auth.currentUser) {
            if(gridTitle) gridTitle.innerText = "📂 我的作品集";
            // 查詢自己的所有專案 (不論是否公開)
            q = query(collection(db, "users", auth.currentUser.uid, "projects"), orderBy("updatedAt", "desc"));
        } else {
            if(gridTitle) gridTitle.innerText = "🌍 全球探索中心";
            q = query(collectionGroup(db, "projects"), where("isPublic", "==", true), orderBy("updatedAt", "desc"));
        }

        const snap = await getDocs(q);
        projects = [];
        snap.forEach(doc => {
            const d = doc.data();
            projects.push({
                id: doc.id,
                owner: view === 'mine' ? auth.currentUser.uid : doc.ref.parent.parent.id,
                ...d,
                author: d.authorEmail?.split('@')[0] || '匿名'
            });
        });
        render(projects);
    }

    function render(list) {
        const grid = document.getElementById('project-grid');
        grid.innerHTML = list.length ? '' : '<div style="grid-column:1/-1; text-align:center; color:#64748B;">沒有找到相關作品</div>';
        list.forEach(p => {
            const card = document.createElement('div');
            card.className = 'p-card';
            card.onclick = () => location.href = `project.html?id=${p.id}&owner=${p.owner}`;
            card.innerHTML = `
                <div class="p-thumb">🚀</div>
                <div class="p-info">
                    <div class="p-name">${p.name || '未命名'}</div>
                    <div class="p-meta">
                        <div class="p-author">
                            <img src="https://ui-avatars.com/api/?name=${p.author}&background=random">
                            <span>${p.author}</span>
                        </div>
                        <div>${p.originalPid ? '♻️ Remix' : '✨ Original'}</div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    window.handleSearch = () => {
        const key = document.getElementById('search-input').value.toLowerCase();
        render(projects.filter(p => p.name?.toLowerCase().includes(key) || p.author.toLowerCase().includes(key)));
    };

    window.filterBy = (tag) => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        if(tag === 'all') render(projects);
        else if(tag === 'remix') render(projects.filter(p => p.originalPid));
        else render(projects.filter(p => p.name?.toLowerCase().includes(tag)));
    };
</script>
<script src="doratch-shell.js"></script>
</body>
</html>
