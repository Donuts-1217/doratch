<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Doratch">
    <link rel="icon" type="image/png" href="Doratch.png">
    <link rel="apple-touch-icon" href="Doratch.png">
    <link rel="stylesheet" href="doratch-mobile-shell.css">
    <link rel="stylesheet" href="responsive-global.css">
    <link rel="stylesheet" href="doratch-shell.css">
    <title>客服中心 - Doratch</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4C97FF;
            --accent: #855CD6;
            --bg: #F0F2F5;
            --card: #fff;
            --text: #0f172a;
            --muted: #64748b;
        }
        body { font-family: "Noto Sans TC", sans-serif; background: var(--bg); margin: 0; color: var(--text); min-height: 100vh; }
        .app-container > .main-content {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .support-mobile-top {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 20;
        }
        body.doratch-app-mode .support-mobile-top { display: flex; }
        .support-mobile-top a {
            text-decoration: none;
            color: #4C97FF;
            font-weight: 800;
            font-size: 14px;
        }
        .support-mobile-top span { font-weight: 900; font-size: 15px; }
        .support-wrap { max-width: 920px; margin: 0 auto; padding: 0 20px 48px; }
        .support-hero {
            background: linear-gradient(135deg, #4C97FF, #855CD6);
            color: #fff;
            border-radius: 24px;
            padding: 36px 32px;
            margin-bottom: 28px;
            box-shadow: 0 16px 40px rgba(76, 151, 255, 0.25);
        }
        .support-hero h1 { margin: 0 0 8px; font-size: 2rem; font-weight: 900; }
        .support-hero p { margin: 0; opacity: 0.92; line-height: 1.6; }
        .support-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 800px) { .support-grid { grid-template-columns: 1fr; } }
        .support-card {
            background: var(--card);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid rgba(15,23,42,0.06);
        }
        .support-card h2 { margin: 0 0 14px; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .faq-item { border-bottom: 1px solid #e2e8f0; }
        .faq-item:last-child { border-bottom: none; }
        .faq-q {
            width: 100%; text-align: left; background: none; border: none;
            padding: 14px 0; font-weight: 800; font-size: 14px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            font-family: inherit; color: var(--text);
        }
        .faq-a { display: none; padding: 0 0 14px; font-size: 13px; color: var(--muted); line-height: 1.65; }
        .faq-item.open .faq-a { display: block; }
        .faq-item.open .faq-caret { transform: rotate(90deg); }
        .faq-caret { color: var(--primary); transition: transform 0.15s; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1;
            border-radius: 12px; padding: 11px 14px; font-size: 14px; font-family: inherit;
        }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .btn-primary {
            background: linear-gradient(135deg, #4C97FF, #6366f1);
            color: #fff; border: none; border-radius: 12px;
            padding: 12px 20px; font-weight: 900; font-size: 14px; cursor: pointer;
            font-family: inherit;
        }
        .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-ghost {
            background: #f1f5f9; color: #334155; border: none; border-radius: 12px;
            padding: 10px 16px; font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit;
        }
        .quick-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .quick-links a {
            text-decoration: none; background: #eef2ff; color: #4338ca;
            padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 800;
        }
        .ticket-list { display: flex; flex-direction: column; gap: 12px; max-height: 62vh; overflow-y: auto; padding-right: 2px; }
        .ticket-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }
        .ticket-search {
            flex: 1;
            min-width: 180px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 13px;
            font-family: inherit;
        }
        .ticket-filter-btn {
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #334155;
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
        }
        .ticket-filter-btn.active {
            background: #4C97FF;
            color: #fff;
            border-color: #4C97FF;
        }
        .ticket-group-title {
            margin: 6px 0 2px;
            font-size: 12px;
            font-weight: 900;
            color: #64748b;
            letter-spacing: 0.04em;
        }
        .ticket-item {
            border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px 16px;
            background: #fafafa; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
        }
        .ticket-item:hover { border-color: #93c5fd; box-shadow: 0 4px 14px rgba(76,151,255,0.12); }
        .ticket-item.active { border-color: #4C97FF; background: #f8fbff; }
        .ticket-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
        .ticket-subject { font-weight: 900; font-size: 14px; }
        .ticket-meta { font-size: 12px; color: var(--muted); line-height: 1.5; }
        .status-pill {
            font-size: 11px; font-weight: 900; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
        }
        .status-open { background: #dbeafe; color: #1d4ed8; }
        .status-replied { background: #dcfce7; color: #15803d; }
        .status-closed { background: #e2e8f0; color: #475569; }
        .admin-reply {
            margin-top: 10px; padding: 10px 12px; background: #f0fdf4;
            border-left: 3px solid #22c55e; border-radius: 8px; font-size: 13px; line-height: 1.55;
        }
        .ticket-preview { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .ticket-open-hint { font-size: 12px; color: #4C97FF; font-weight: 800; margin-top: 8px; }
        .ticket-actions-inline { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

        /* 工單對話 */
        .ticket-thread-overlay {
            display: none; position: fixed; inset: 0; z-index: 10050;
            background: rgba(15,23,42,0.45); align-items: center; justify-content: center;
            padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
        }
        .ticket-thread-overlay.open { display: flex; }
        .ticket-thread-panel {
            width: min(560px, 100%); max-height: min(88vh, 720px);
            background: #fff; border-radius: 18px; display: flex; flex-direction: column;
            box-shadow: 0 24px 60px rgba(0,0,0,0.18); overflow: hidden;
        }
        .ticket-thread-head {
            padding: 16px 18px; border-bottom: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; gap: 10px; align-items: flex-start;
        }
        .ticket-thread-head h3 { margin: 0; font-size: 1rem; line-height: 1.4; }
        .ticket-thread-close {
            background: #f1f5f9; border: none; border-radius: 8px; width: 32px; height: 32px;
            cursor: pointer; font-size: 18px; line-height: 1; flex-shrink: 0;
        }
        .ticket-thread-messages {
            flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
            background: #f8fafc; min-height: 200px;
        }
        .thread-msg {
            max-width: 88%; padding: 10px 12px; border-radius: 14px; font-size: 13px; line-height: 1.55;
            white-space: pre-wrap; word-break: break-word;
        }
        .thread-msg.user { align-self: flex-end; background: #dbeafe; color: #1e3a5f; border-bottom-right-radius: 4px; }
        .thread-msg.staff { align-self: flex-start; background: #fff; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
        .thread-msg-meta { font-size: 11px; color: #64748b; margin-bottom: 4px; font-weight: 700; }
        .ticket-thread-compose {
            padding: 12px 16px; border-top: 1px solid #e2e8f0; background: #fff;
        }
        .ticket-thread-compose textarea {
            width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1;
            border-radius: 12px; padding: 10px 12px; font-size: 14px; font-family: inherit;
            min-height: 72px; resize: vertical;
        }
        .ticket-thread-compose .compose-actions {
            display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px;
        }
        .ticket-thread-closed {
            padding: 12px 16px; background: #f1f5f9; color: #64748b; font-size: 13px; text-align: center;
        }
        .empty-hint { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 12px; }
        @media (max-width: 1024px) {
            body:not(.doratch-app-mode) .app-container .sidebar-main {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }
        #form-msg { font-size: 13px; margin-top: 10px; min-height: 1.2em; }
        #form-msg.ok { color: #15803d; }
        #form-msg.err { color: #dc2626; }
        .guest-banner {
            background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
            border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; font-size: 13px;
        }
        .guest-banner a { color: #c2410c; font-weight: 800; }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar-main" data-doratch-active="support">
        <div class="sidebar-footer">
            <div class="user-mini-card">
                <img id="side-avatar" src="" alt="" style="width:32px;height:32px;border-radius:50%;">
                <div style="flex:1;overflow:hidden;">
                    <div id="side-username" style="font-size:12px;font-weight:bold;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;">載入中...</div>
                    <div style="font-size:10px;color:#64748B;">💳 <span id="side-coins">Doord 0 · Docoin 0</span></div>
                </div>
                <button type="button" onclick="handleLogout()" style="background:none;border:none;color:#64748B;cursor:pointer;">🚪</button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="support-mobile-top">
            <a href="profile.html" id="support-back-link">← 返回</a>
            <span>🎧 客服中心</span>
        </div>
        <div class="support-wrap">
            <div class="support-hero">
                <h1>🎧 客服中心</h1>
                <p>帳號、商城、Plus / Pro 訂閱、聊天或程式問題，都可以在這裡找到解答或提交工單。我們會盡快回覆。</p>
            </div>

            <div id="guest-banner" class="guest-banner" style="display:none;">
                請先 <a href="login.html" id="guest-login-link">登入</a> 後才能提交工單與查看回覆紀錄。
            </div>

            <div class="support-grid">
                <div class="support-card">
                    <h2>❓ 常見問題</h2>
                    <div id="faq-list"></div>
                    <div class="quick-links">
                        <a href="shop.html">🛒 創意商城</a>
                        <a href="profile.html">👤 個人檔案</a>
                        <a href="chat.html">💬 交流大廳</a>
                        <a href="projects.html">📂 我的作品</a>
                    </div>
                </div>

                <div class="support-card">
                    <h2>📝 提交工單</h2>
                    <form id="ticket-form">
                        <div class="form-group">
                            <label for="ticket-category">問題類型</label>
                            <select id="ticket-category" required>
                                <option value="account">帳號 / 登入 / 驗證信</option>
                                <option value="subscription">Plus / Pro 訂閱</option>
                                <option value="shop">商城 / Doord / Docoin</option>
                                <option value="chat">聊天 / 私訊 / 伺服器</option>
                                <option value="project">作品 / 雲端空間</option>
                                <option value="bug">程式錯誤 / 畫面異常</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="ticket-subject">主旨（2～80 字）</label>
                            <input type="text" id="ticket-subject" maxlength="80" required placeholder="簡短描述你的問題">
                        </div>
                        <div class="form-group">
                            <label for="ticket-message">詳細說明</label>
                            <textarea id="ticket-message" maxlength="2000" required placeholder="請描述發生時間、操作步驟、錯誤訊息等，方便我們協助"></textarea>
                        </div>
                        <button type="submit" class="btn-primary" id="btn-submit-ticket">送出工單</button>
                        <div id="form-msg"></div>
                    </form>
                </div>
            </div>

            <div class="support-card" style="margin-top:20px;">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
                    <h2 style="margin:0;">📋 我的工單</h2>
                    <button type="button" class="btn-ghost" id="btn-refresh-tickets">重新整理</button>
                </div>
                <div class="ticket-toolbar">
                    <input id="ticket-search" class="ticket-search" type="text" placeholder="搜尋主旨、分類、內容…">
                    <button type="button" class="ticket-filter-btn active" data-ticket-filter="all">全部</button>
                    <button type="button" class="ticket-filter-btn" data-ticket-filter="open">進行中</button>
                    <button type="button" class="ticket-filter-btn" data-ticket-filter="closed">已結案</button>
                </div>
                <div id="ticket-list" class="ticket-list">
                    <div class="empty-hint">載入中…</div>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="ticket-thread-overlay" class="ticket-thread-overlay" aria-hidden="true">
    <div class="ticket-thread-panel" role="dialog">
        <div class="ticket-thread-head">
            <div>
                <h3 id="thread-subject">工單</h3>
                <div id="thread-meta" class="ticket-meta"></div>
            </div>
            <button type="button" class="ticket-thread-close" id="btn-close-thread" aria-label="關閉">×</button>
        </div>
        <div id="thread-messages" class="ticket-thread-messages"></div>
        <div id="thread-compose" class="ticket-thread-compose">
            <textarea id="thread-reply-input" maxlength="2000" placeholder="輸入訊息…"></textarea>
            <div class="compose-actions">
                <button type="button" class="btn-ghost" id="btn-close-thread-2">關閉</button>
                <button type="button" class="btn-ghost" id="btn-close-ticket" style="background:#fee2e2;color:#991b1b;">結案</button>
                <button type="button" class="btn-primary" id="btn-send-thread">送出</button>
            </div>
        </div>
        <div id="thread-closed-bar" class="ticket-thread-closed" style="display:none;">
            此工單已結案，無法繼續對話。
            <button type="button" class="btn-ghost" id="btn-reopen-ticket" style="margin-left:8px;background:#dcfce7;color:#166534;">重新開啟</button>
            <button type="button" class="btn-ghost" id="btn-delete-ticket" style="margin-left:8px;background:#fee2e2;color:#991b1b;">刪除工單</button>
        </div>
    </div>
</div>

<script src="doratch-shell.js"></script>
<script src="doratch-mobile-shell.js" defer></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, doc, getDoc, serverTimestamp, orderBy, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDwRdQFgQVn5Un8Od2nP4u5EbMx-dMOYoU",
        authDomain: "chat-52c0d.firebaseapp.com",
        projectId: "chat-52c0d",
        appId: "1:449329325475:web:75f255c4055360dc9e6616"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let userData = {};
    let activeTicketId = null;
    let activeTicketData = null;
    let threadUnsub = null;
    let ticketDocsCache = [];
    let ticketSearchKeyword = "";
    let ticketStatusFilter = "all";

    const FAQ = [
        { q: "驗證信沒收到怎麼辦？", a: "請先檢查垃圾郵件資料夾。若仍沒有，可在登入頁使用「重發驗證信」。Email 打錯需重新註冊正確信箱，或聯絡客服協助。" },
        { q: "如何開通 Doratch Plus / Pro？", a: "目前訂閱由管理員後台開通。請至創意商城查看方案內容，並在此提交「Plus / Pro 訂閱」工單，附上你的帳號 Email。" },
        { q: "Doord 要怎麼獲得？", a: "在商城頁提交程式作品送審，管理員核准後會核發 Doord。Docoin 僅能由管理員發放，可單向兌換成 Doord。" },
        { q: "聊天私訊或好友請求有問題？", a: "請確認對方 Email 是否正確、是否已完成信箱驗證。若仍異常，請提交工單並附上對方顯示名稱或 Email。" },
        { q: "雲端作品空間不夠？", a: "免費、Plus、Pro 會員有不同的預設容量。Plus / Pro 會自動提升額度，也可透過工單申請額外空間。" }
    ];

    const CATEGORY_LABELS = {
        account: "帳號",
        subscription: "訂閱",
        shop: "商城",
        chat: "聊天",
        project: "作品",
        bug: "錯誤回報",
        other: "其他"
    };

    const STATUS_LABELS = { open: "待處理", replied: "已回覆", closed: "已結案" };

    function appAwareHref(path) {
        const params = new URLSearchParams(location.search);
        return params.get("app") === "1" ? path + (path.includes("?") ? "&" : "?") + "app=1" : path;
    }

    function esc(s) {
        return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function getDoord(data) {
        if (Number.isFinite(data && data.doord)) return Number(data.doord);
        return Number.isFinite(data && data.coins) ? Number(data.coins) : 0;
    }

    function getDocoin(data) {
        return Number.isFinite(data && data.docoin) ? Number(data.docoin) : 0;
    }

    function renderFaq() {
        const host = document.getElementById("faq-list");
        if (!host) return;
        host.innerHTML = FAQ.map(function (item, i) {
            return '<div class="faq-item" data-faq="' + i + '">' +
                '<button type="button" class="faq-q">' + esc(item.q) + '<span class="faq-caret">▸</span></button>' +
                '<div class="faq-a">' + esc(item.a) + "</div></div>";
        }).join("");
        host.querySelectorAll(".faq-q").forEach(function (btn) {
            btn.addEventListener("click", function () {
                const wrap = btn.closest(".faq-item");
                if (!wrap) return;
                const open = wrap.classList.contains("open");
                host.querySelectorAll(".faq-item").forEach(function (el) { el.classList.remove("open"); });
                if (!open) wrap.classList.add("open");
            });
        });
    }

    function applySidebar(user, data) {
        const name = (data && data.displayName) || (user && user.email) || "訪客";
        const av = document.getElementById("side-avatar");
        const un = document.getElementById("side-username");
        const coins = document.getElementById("side-coins");
        if (av) av.src = "https://ui-avatars.com/api/?name=" + encodeURIComponent(name) + "&background=4C97FF&color=fff";
        if (un) un.textContent = name;
        if (coins) coins.textContent = "Doord " + Math.floor(getDoord(data)) + " · Docoin " + Math.floor(getDocoin(data));
    }

    function setGuestUi() {
        document.getElementById("guest-banner").style.display = "";
        const link = document.getElementById("guest-login-link");
        if (link) link.href = appAwareHref("login.html");
        document.getElementById("btn-submit-ticket").disabled = true;
        document.getElementById("ticket-form").querySelectorAll("input,select,textarea").forEach(function (el) { el.disabled = true; });
        document.getElementById("ticket-list").innerHTML = '<div class="empty-hint">登入後可查看工單紀錄</div>';
        applySidebar(null, {});
    }

    function formatTime(ts) {
        if (!ts) return "剛剛";
        try {
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            if (isNaN(d.getTime())) return "剛剛";
            return d.toLocaleString("zh-TW");
        } catch (_) {
            return "剛剛";
        }
    }

    function legacyMessages(ticket) {
        const out = [];
        if (ticket.message) {
            out.push({
                from: "user",
                senderName: ticket.displayName || ticket.userEmail || "使用者",
                text: ticket.message,
                createdAt: ticket.createdAt
            });
        }
        if (ticket.adminReply) {
            out.push({
                from: "staff",
                senderName: "客服",
                text: ticket.adminReply,
                createdAt: ticket.repliedAt || ticket.updatedAt
            });
        }
        return out;
    }

    function renderThreadMessages(messages) {
        const host = document.getElementById("thread-messages");
        if (!host) return;
        if (!messages.length) {
            host.innerHTML = '<div class="empty-hint">尚無訊息</div>';
            return;
        }
        host.innerHTML = messages.map(function (m) {
            const who = m.from === "staff" ? "客服" : (m.senderName || "我");
            const cls = m.from === "staff" ? "staff" : "user";
            return '<div class="thread-msg ' + cls + '">' +
                '<div class="thread-msg-meta">' + esc(who) + " · " + esc(formatTime(m.createdAt)) + "</div>" +
                esc(m.text || "") + "</div>";
        }).join("");
        host.scrollTop = host.scrollHeight;
    }

    async function fetchTicketMessages(ticketId, ticket) {
        try {
            const snap = await getDocs(query(
                collection(db, "support_tickets", ticketId, "messages"),
                orderBy("createdAt", "asc")
            ));
            if (!snap.empty) {
                return snap.docs.map(function (d) { return d.data(); });
            }
        } catch (e) {
            console.warn("messages subcollection", e);
        }
        return legacyMessages(ticket || {});
    }

    function stopThreadListener() {
        if (threadUnsub) {
            threadUnsub();
            threadUnsub = null;
        }
    }

    async function openTicketThread(ticketId) {
        const ticket = ticketDocsCache.find(function (d) { return d.id === ticketId; });
        if (!ticket) return;
        activeTicketId = ticketId;
        activeTicketData = ticket.data;
        const cat = CATEGORY_LABELS[ticket.data.category] || ticket.data.category || "其他";
        const status = ticket.data.status || "open";
        document.getElementById("thread-subject").textContent = "[" + cat + "] " + (ticket.data.subject || "（無主旨）");
        document.getElementById("thread-meta").textContent =
            "狀態：" + (STATUS_LABELS[status] || status) + " · 建立：" + formatTime(ticket.data.createdAt);
        const overlay = document.getElementById("ticket-thread-overlay");
        const compose = document.getElementById("thread-compose");
        const closedBar = document.getElementById("thread-closed-bar");
        const closeTicketBtn = document.getElementById("btn-close-ticket");
        const reopenBtn = document.getElementById("btn-reopen-ticket");
        const deleteBtn = document.getElementById("btn-delete-ticket");
        const closed = status === "closed";
        if (compose) compose.style.display = closed ? "none" : "";
        if (closedBar) closedBar.style.display = closed ? "" : "none";
        if (closeTicketBtn) closeTicketBtn.style.display = closed ? "none" : "";
        if (reopenBtn) reopenBtn.style.display = closed ? "" : "none";
        if (deleteBtn) deleteBtn.style.display = closed ? "" : "none";
        document.getElementById("thread-reply-input").value = "";
        overlay.classList.add("open");
        overlay.setAttribute("aria-hidden", "false");
        document.body.classList.add("doratch-modal-open");
        if (window.DoratchMobile && window.DoratchMobile.syncAppModalOpen) window.DoratchMobile.syncAppModalOpen();

        stopThreadListener();
        const msgCol = collection(db, "support_tickets", ticketId, "messages");
        threadUnsub = onSnapshot(query(msgCol, orderBy("createdAt", "asc")), function (snap) {
            if (!snap.empty) {
                renderThreadMessages(snap.docs.map(function (d) { return d.data(); }));
            } else {
                renderThreadMessages(legacyMessages(ticket.data));
            }
        }, function () {
            fetchTicketMessages(ticketId, ticket.data).then(renderThreadMessages);
        });

        document.querySelectorAll(".ticket-item").forEach(function (el) {
            el.classList.toggle("active", el.getAttribute("data-ticket-id") === ticketId);
        });
    }

    function closeTicketThread() {
        stopThreadListener();
        activeTicketId = null;
        activeTicketData = null;
        const overlay = document.getElementById("ticket-thread-overlay");
        overlay.classList.remove("open");
        overlay.setAttribute("aria-hidden", "true");
        document.body.classList.remove("doratch-modal-open");
        if (window.DoratchMobile && window.DoratchMobile.syncAppModalOpen) window.DoratchMobile.syncAppModalOpen();
        document.querySelectorAll(".ticket-item").forEach(function (el) { el.classList.remove("active"); });
    }

    async function sendThreadReply() {
        if (!currentUser || !activeTicketId || !activeTicketData) return;
        if ((activeTicketData.status || "") === "closed") return;
        const input = document.getElementById("thread-reply-input");
        const text = String((input && input.value) || "").trim();
        if (text.length < 1) return;
        const btn = document.getElementById("btn-send-thread");
        if (btn) btn.disabled = true;
        try {
            await addDoc(collection(db, "support_tickets", activeTicketId, "messages"), {
                from: "user",
                senderId: currentUser.uid,
                senderEmail: currentUser.email || "",
                senderName: (userData.displayName || "").trim() || (currentUser.email || "使用者"),
                text: text,
                createdAt: serverTimestamp()
            });
            await updateDoc(doc(db, "support_tickets", activeTicketId), {
                status: "open",
                updatedAt: serverTimestamp(),
                lastMessageAt: serverTimestamp(),
                lastMessagePreview: text.slice(0, 120)
            });
            if (input) input.value = "";
            await loadTickets();
        } catch (e) {
            console.error(e);
            alert("送出失敗：" + (e.message || e));
        } finally {
            if (btn) btn.disabled = false;
        }
    }

    async function closeActiveTicketByUser() {
        if (!currentUser || !activeTicketId || !activeTicketData) return;
        if ((activeTicketData.status || "") === "closed") return;
        if (!confirm("確定要將這張工單標記為已結案嗎？")) return;
        const btn = document.getElementById("btn-close-ticket");
        if (btn) btn.disabled = true;
        try {
            await updateDoc(doc(db, "support_tickets", activeTicketId), {
                status: "closed",
                updatedAt: serverTimestamp(),
                lastMessagePreview: "（使用者已結案）"
            });
            activeTicketData = { ...activeTicketData, status: "closed", lastMessagePreview: "（使用者已結案）" };
            const compose = document.getElementById("thread-compose");
            const closedBar = document.getElementById("thread-closed-bar");
            if (compose) compose.style.display = "none";
            if (closedBar) closedBar.style.display = "";
            await loadTickets();
        } catch (e) {
            console.error(e);
            alert("結案失敗：" + (e.message || e));
        } finally {
            if (btn) btn.disabled = false;
        }
    }

    async function reopenActiveTicketByUser() {
        if (!currentUser || !activeTicketId || !activeTicketData) return;
        if ((activeTicketData.status || "") !== "closed") return;
        const btn = document.getElementById("btn-reopen-ticket");
        if (btn) btn.disabled = true;
        try {
            await updateDoc(doc(db, "support_tickets", activeTicketId), {
                status: "open",
                updatedAt: serverTimestamp(),
                lastMessagePreview: "（使用者重新開啟工單）"
            });
            activeTicketData = { ...activeTicketData, status: "open", lastMessagePreview: "（使用者重新開啟工單）" };
            const compose = document.getElementById("thread-compose");
            const closedBar = document.getElementById("thread-closed-bar");
            if (compose) compose.style.display = "";
            if (closedBar) closedBar.style.display = "none";
            await loadTickets();
        } catch (e) {
            console.error(e);
            alert("重新開啟失敗：" + (e.message || e));
        } finally {
            if (btn) btn.disabled = false;
        }
    }

    async function deleteTicketCascade(ticketId) {
        const msgSnap = await getDocs(query(
            collection(db, "support_tickets", ticketId, "messages"),
            orderBy("createdAt", "asc")
        ));
        for (const d of msgSnap.docs) {
            await deleteDoc(doc(db, "support_tickets", ticketId, "messages", d.id));
        }
        await deleteDoc(doc(db, "support_tickets", ticketId));
    }

    async function deleteActiveTicketByUser() {
        if (!currentUser || !activeTicketId || !activeTicketData) return;
        if ((activeTicketData.status || "") !== "closed") return alert("僅已結案工單可刪除");
        if (!confirm("確定要刪除此工單？刪除後無法復原。")) return;
        const btn = document.getElementById("btn-delete-ticket");
        if (btn) btn.disabled = true;
        try {
            await deleteTicketCascade(activeTicketId);
            closeTicketThread();
            await loadTickets();
        } catch (e) {
            console.error(e);
            alert("刪除失敗：" + (e.message || e));
        } finally {
            if (btn) btn.disabled = false;
        }
    }

    function matchesTicketFilter(t) {
        const status = String((t && t.status) || "open");
        if (ticketStatusFilter === "open") return status !== "closed";
        if (ticketStatusFilter === "closed") return status === "closed";
        return true;
    }

    function matchesTicketSearch(t) {
        const key = String(ticketSearchKeyword || "").trim().toLowerCase();
        if (!key) return true;
        const cat = (CATEGORY_LABELS[t.category] || t.category || "").toLowerCase();
        const subject = String(t.subject || "").toLowerCase();
        const preview = String(t.lastMessagePreview || t.message || "").toLowerCase();
        return cat.includes(key) || subject.includes(key) || preview.includes(key);
    }

    async function loadTickets() {
        const host = document.getElementById("ticket-list");
        if (!currentUser) return;
        host.innerHTML = '<div class="empty-hint">載入中…</div>';
        try {
            const q = query(
                collection(db, "support_tickets"),
                where("userId", "==", currentUser.uid)
            );
            const snap = await getDocs(q);
            const docs = snap.docs.slice().sort(function (a, b) {
                const am = a.data().updatedAt && a.data().updatedAt.toMillis ? a.data().updatedAt.toMillis()
                    : (a.data().createdAt && a.data().createdAt.toMillis ? a.data().createdAt.toMillis() : 0);
                const bm = b.data().updatedAt && b.data().updatedAt.toMillis ? b.data().updatedAt.toMillis()
                    : (b.data().createdAt && b.data().createdAt.toMillis ? b.data().createdAt.toMillis() : 0);
                return bm - am;
            });
            ticketDocsCache = docs.map(function (d) { return { id: d.id, data: d.data() || {} }; });
            if (!docs.length) {
                host.innerHTML = '<div class="empty-hint">尚無工單。若有問題請在上方提交。</div>';
                return;
            }
            host.innerHTML = "";
            const filtered = docs.filter(function (d) {
                const t = d.data() || {};
                return matchesTicketFilter(t) && matchesTicketSearch(t);
            });
            if (!filtered.length) {
                host.innerHTML = '<div class="empty-hint">沒有符合條件的工單</div>';
                return;
            }
            const grouped = { open: [], replied: [], closed: [] };
            filtered.forEach(function (d) {
                const st = String((d.data() || {}).status || "open");
                if (st === "closed") grouped.closed.push(d);
                else if (st === "replied") grouped.replied.push(d);
                else grouped.open.push(d);
            });
            const order = [
                { key: "open", label: "🟢 進行中" },
                { key: "replied", label: "💬 已回覆" },
                { key: "closed", label: "⚪ 已結案" }
            ];
            order.forEach(function (group) {
                const arr = grouped[group.key];
                if (!arr.length) return;
                const title = document.createElement("div");
                title.className = "ticket-group-title";
                title.textContent = group.label + " (" + arr.length + ")";
                host.appendChild(title);
                arr.forEach(function (d) {
                const t = d.data() || {};
                const status = t.status || "open";
                const created = formatTime(t.createdAt);
                const cat = CATEGORY_LABELS[t.category] || t.category || "其他";
                const preview = t.lastMessagePreview || t.message || "";
                const div = document.createElement("div");
                div.className = "ticket-item";
                div.setAttribute("data-ticket-id", d.id);
                div.innerHTML =
                    '<div class="ticket-head">' +
                    '<div class="ticket-subject">[' + esc(cat) + "] " + esc(t.subject || "（無主旨）") + "</div>" +
                    '<span class="status-pill status-' + esc(status) + '">' + esc(STATUS_LABELS[status] || status) + "</span>" +
                    "</div>" +
                    '<div class="ticket-meta">建立：' + esc(created) + " · 更新：" + esc(formatTime(t.updatedAt || t.createdAt)) + "</div>" +
                    '<div class="ticket-preview">' + esc(preview) + "</div>" +
                    '<div class="ticket-open-hint">點擊查看對話 →</div>' +
                    (status === "closed" ? '<div class="ticket-actions-inline"><button type="button" class="btn-ghost" style="background:#fee2e2;color:#991b1b;" onclick="event.stopPropagation();deleteClosedTicketFromList(\'' + d.id + '\')">刪除</button></div>' : "");
                div.addEventListener("click", function () { openTicketThread(d.id); });
                host.appendChild(div);
                });
            });
            if (activeTicketId) {
                const active = ticketDocsCache.find(function (t) { return t.id === activeTicketId; });
                if (active) activeTicketData = active.data;
            }
        } catch (e) {
            console.error(e);
            host.innerHTML = '<div class="empty-hint">載入失敗：' + esc(e.message || e) + "</div>";
        }
    }

    document.getElementById("ticket-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        if (!currentUser) return;
        const msg = document.getElementById("form-msg");
        const btn = document.getElementById("btn-submit-ticket");
        const category = document.getElementById("ticket-category").value;
        const subject = String(document.getElementById("ticket-subject").value || "").trim();
        const message = String(document.getElementById("ticket-message").value || "").trim();
        if (subject.length < 2) {
            msg.className = "err";
            msg.textContent = "主旨至少 2 個字";
            return;
        }
        if (message.length < 5) {
            msg.className = "err";
            msg.textContent = "請至少輸入 5 個字的說明";
            return;
        }
        btn.disabled = true;
        msg.textContent = "送出中…";
        msg.className = "";
        try {
            const ticketRef = await addDoc(collection(db, "support_tickets"), {
                userId: currentUser.uid,
                userEmail: currentUser.email || "",
                displayName: (userData.displayName || "").trim(),
                category,
                subject,
                message,
                status: "open",
                adminReply: "",
                lastMessagePreview: message.slice(0, 120),
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp(),
                lastMessageAt: serverTimestamp()
            });
            await addDoc(collection(db, "support_tickets", ticketRef.id, "messages"), {
                from: "user",
                senderId: currentUser.uid,
                senderEmail: currentUser.email || "",
                senderName: (userData.displayName || "").trim() || (currentUser.email || "使用者"),
                text: message,
                createdAt: serverTimestamp()
            });
            document.getElementById("ticket-subject").value = "";
            document.getElementById("ticket-message").value = "";
            msg.className = "ok";
            msg.textContent = "✅ 工單已送出，我們會盡快回覆。";
            await loadTickets();
        } catch (err) {
            console.error(err);
            msg.className = "err";
            msg.textContent = "送出失敗：" + (err.message || err);
        } finally {
            btn.disabled = false;
        }
    });

    document.getElementById("btn-refresh-tickets").addEventListener("click", function () {
        if (currentUser) loadTickets();
    });

    document.getElementById("btn-close-thread").addEventListener("click", closeTicketThread);
    document.getElementById("btn-close-thread-2").addEventListener("click", closeTicketThread);
    document.getElementById("btn-close-ticket").addEventListener("click", closeActiveTicketByUser);
    document.getElementById("btn-reopen-ticket").addEventListener("click", reopenActiveTicketByUser);
    document.getElementById("btn-delete-ticket").addEventListener("click", deleteActiveTicketByUser);
    document.getElementById("btn-send-thread").addEventListener("click", sendThreadReply);
    document.getElementById("ticket-thread-overlay").addEventListener("click", function (e) {
        if (e.target === e.currentTarget) closeTicketThread();
    });
    document.getElementById("thread-reply-input").addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendThreadReply();
        }
    });

    window.deleteClosedTicketFromList = async function (ticketId) {
        const rec = ticketDocsCache.find(function (d) { return d.id === ticketId; });
        if (!rec || String(rec.data.status || "") !== "closed") return alert("僅已結案工單可刪除");
        if (!confirm("確定刪除此工單？刪除後無法復原。")) return;
        try {
            await deleteTicketCascade(ticketId);
            if (activeTicketId === ticketId) closeTicketThread();
            await loadTickets();
        } catch (e) {
            console.error(e);
            alert("刪除失敗：" + (e.message || e));
        }
    };

    document.querySelectorAll("[data-ticket-filter]").forEach(function (btn) {
        btn.addEventListener("click", function () {
            ticketStatusFilter = btn.getAttribute("data-ticket-filter") || "all";
            document.querySelectorAll("[data-ticket-filter]").forEach(function (b) {
                b.classList.toggle("active", b === btn);
            });
            if (currentUser) loadTickets();
        });
    });
    document.getElementById("ticket-search").addEventListener("input", function (e) {
        ticketSearchKeyword = String((e.target && e.target.value) || "");
        if (currentUser) loadTickets();
    });

    const backLink = document.getElementById("support-back-link");
    if (backLink) {
        backLink.href = appAwareHref("profile.html");
    }

    window.handleLogout = function () {
        if (!auth.currentUser) {
            location.href = appAwareHref("login.html");
            return;
        }
        signOut(auth).then(function () {
            location.href = (window.DoratchMobile && window.DoratchMobile.isAppMode && window.DoratchMobile.isAppMode())
                ? "app.html?app=1" : "index.html";
        });
    };

    const params = new URLSearchParams(location.search);
    const prefill = params.get("category");
    if (prefill && document.getElementById("ticket-category").querySelector('option[value="' + prefill + '"]')) {
        document.getElementById("ticket-category").value = prefill;
    }

    renderFaq();

    onAuthStateChanged(auth, async function (user) {
        currentUser = user;
        window.__DORATCH_AUTH_EMAIL__ = (user && user.email) || "";
        if (!user) {
            setGuestUi();
            return;
        }
        document.getElementById("guest-banner").style.display = "none";
        document.getElementById("btn-submit-ticket").disabled = false;
        document.getElementById("ticket-form").querySelectorAll("input,select,textarea").forEach(function (el) { el.disabled = false; });
        try {
            const snap = await getDoc(doc(db, "users", user.uid));
            userData = snap.exists() ? snap.data() : {};
            userData.email = user.email || userData.email || "";
        } catch (_) {
            userData = { email: user.email || "" };
        }
        applySidebar(user, userData);
        await loadTickets();
    });
</script>
</body>
</html>
