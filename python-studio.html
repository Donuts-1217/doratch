<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="responsive-global.css">
    <link rel="stylesheet" href="create-space.css">
    <link rel="stylesheet" href="python-terminal.css">
    <link rel="stylesheet" href="discord-bot-sim.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --py-green: #306998; --scratch-blue: #4C97FF; --scratch-orange: #FFAB19; --scratch-green: #4CB050; }
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; font-family: "Noto Sans TC", sans-serif; background: #0f172a; overflow: hidden; }
        nav {
            background: #0b0e14; color: white; padding: 0 16px; display: flex; align-items: center;
            min-height: 65px; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 100;
        }
        .nav-logo { font-weight: 900; font-size: 1rem; cursor: pointer; color: var(--py-green); white-space: nowrap; }
        .project-title-container { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 160px; }
        #project-title-input {
            background: rgba(255,255,255,0.12); border: none; color: white; padding: 7px 12px;
            border-radius: 8px; font-size: 14px; width: min(220px, 40vw); font-weight: 700;
        }
        #project-title-input:focus { outline: 2px solid var(--py-green); }
        .nav-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .btn {
            border: none; padding: 8px 14px; border-radius: 8px; font-weight: 800; cursor: pointer;
            font-size: 13px; font-family: inherit;
        }
        .btn-run { background: var(--scratch-green); color: white; }
        .btn-save { background: var(--scratch-orange); color: white; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.35); color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #editor-status { font-size: 12px; color: #94a3b8; white-space: nowrap; }
        #main-workspace { display: flex; flex: 1; min-height: 0; }
        #editor-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #1e293b; min-height: 0; }
        .pane-header {
            padding: 10px 16px; font-size: 13px; font-weight: 800; color: #cbd5e1;
            background: #0f172a; border-bottom: 1px solid #334155;
        }
        .monaco-shell { flex: 1; min-height: 0; font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
        #monaco-editor { width: 100%; height: 100%; min-height: 200px; }
        .monaco-shell .monaco-editor,
        .monaco-shell .monaco-editor .margin,
        .monaco-shell .monaco-editor .view-lines {
            font-family: "JetBrains Mono", Consolas, "Courier New", monospace !important;
            font-variant-ligatures: none !important;
        }
        #editor-fallback {
            display: none; flex: 1; width: 100%; box-sizing: border-box; min-height: 200px;
            font-family: "JetBrains Mono", monospace; font-size: 14px; padding: 16px;
            background: #1e1e1e; color: #d4d4d4; border: none; resize: none;
        }
        .monaco-editor .suggest-widget { max-height: min(280px, calc(100vh - 120px)) !important; z-index: 10000; }
        #side-pane { width: min(420px, 40vw); min-width: 300px; background: #0f172a; display: flex; flex-direction: column; border-left: 2px solid #334155; min-height: 0; }
        .side-tabs { display: flex; border-bottom: 1px solid #334155; flex-shrink: 0; }
        .side-tab {
            flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8;
            font-weight: 800; font-size: 12px; cursor: pointer; font-family: inherit;
        }
        .side-tab.active { color: #fff; background: #1e293b; border-bottom: 2px solid #5865f2; }
        .side-pane-view { flex: 1; min-height: 0; display: none; flex-direction: column; }
        .side-pane-view.active { display: flex; }
        .bot-settings {
            padding: 12px 14px; background: #1e293b; border-bottom: 1px solid #334155;
            font-size: 12px; color: #cbd5e1; flex-shrink: 0;
        }
        .bot-settings label { display: flex; align-items: center; gap: 8px; font-weight: 800; margin-bottom: 8px; cursor: pointer; }
        .bot-settings input[type="text"] {
            width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px;
            border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 12px; margin-bottom: 8px;
        }
        .bot-settings .btn-sm {
            border: none; padding: 6px 10px; border-radius: 6px; font-weight: 800; font-size: 11px;
            cursor: pointer; margin-right: 6px; font-family: inherit;
        }
        .btn-token { background: #5865f2; color: #fff; }
        .btn-deploy { background: #23a559; color: #fff; }
        #bot-sim-host { flex: 1; min-height: 0; padding: 8px; display: flex; flex-direction: column; }
        #bot-sim-host .dbs-root { flex: 1; min-height: 280px; }
        .terminal-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .terminal-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; background: #1e293b; border-bottom: 1px solid #334155;
            font-size: 13px; font-weight: 800; color: #cbd5e1; flex-shrink: 0;
        }
        .terminal-head button {
            border: none; background: rgba(255,255,255,0.08); color: #94a3b8;
            padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 800;
            cursor: pointer; font-family: inherit;
        }
        .terminal-body--term { padding: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .terminal-body--term .py-terminal-root { flex: 1; min-height: 0; border-radius: 0; }
        .engine-bar {
            font-size: 12px; padding: 6px 14px; background: #252526; color: #94a3b8;
            border-bottom: 1px solid #333;
        }
        .engine-bar.ready { color: #86efac; }
        .engine-bar.error { color: #fca5a5; }
        @media (max-width: 900px) {
            #main-workspace { flex-direction: column; }
            #side-pane { width: 100%; min-width: 0; max-height: 42vh; border-left: none; border-top: 2px solid #334155; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
    <script src="js/skulpt-compat.js"></script>
    <script src="js/python-engine.js"></script>
    <script src="js/discord-py-mock.js"></script>
    <script src="js/discord-bot-runtime.js"></script>
    <script src="js/discord-bot-engine.js"></script>
    <script src="js/discord-bot-simulator.js"></script>
    <script src="js/python-terminal.js"></script>
    <script src="js/python-monaco.js"></script>
</head>
<body>

<nav>
    <div class="nav-logo" onclick="location.href='create.html'">🐍 Python 創作</div>
    <div class="create-space-tabs">
        <a href="create.html" class="hub-tab">🏠 選擇</a>
        <a href="page.html" class="blockly-tab">🧩 積木</a>
        <a href="python-studio.html" class="python-tab active">🐍 Python</a>
    </div>
    <div class="project-title-container">
        <input type="text" id="project-title-input" value="未命名 Python 作品">
        <span id="editor-status">⚪ 編輯中</span>
    </div>
    <div class="nav-actions">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#94a3b8;cursor:pointer;">
            <input type="checkbox" id="is-public-check" style="width:auto;margin:0;"> 公開
        </label>
        <button type="button" class="btn btn-run" id="btn-run" disabled>▶ 執行</button>
        <button type="button" class="btn btn-save" id="btn-save">💾 儲存</button>
        <button type="button" class="btn btn-outline" onclick="document.getElementById('file-input').click()">📤 匯入</button>
        <button type="button" class="btn btn-outline" id="btn-download">📥 下載 .py</button>
        <a href="templates/discord_bot_main.py" download class="btn btn-outline" style="text-decoration:none;" title="VS Code + discord.py 範本">📋 VS Code 範本</a>
        <input type="file" id="file-input" accept=".py,.txt" hidden>
        <a href="projects.html" class="btn btn-outline" style="text-decoration:none;">📂 作品</a>
    </div>
</nav>

<div id="engine-bar" class="engine-bar">Python 引擎載入中…</div>

<div id="main-workspace">
    <div id="editor-pane">
        <div class="pane-header">程式碼 · Ctrl+Enter 執行</div>
        <div class="monaco-shell">
            <div id="monaco-editor"></div>
        </div>
        <textarea id="editor-fallback" spellcheck="false"></textarea>
    </div>
    <div id="side-pane">
        <div class="bot-settings" id="bot-settings" style="display:none;">
            <label><input type="checkbox" id="is-bot-check"> 🤖 Discord Bot 專案</label>
            <div id="bot-fields" style="display:none;">
                <input type="text" id="bot-name-input" placeholder="Bot 名稱（例如：問候小助手）">
                <div class="bot-token-display" id="bot-token-display">載入 Token…</div>
                <button type="button" class="btn-sm btn-token" id="btn-copy-token">📋 複製 Token</button>
                <button type="button" class="btn-sm btn-deploy" id="btn-deploy-bot">🚀 部署到交流大廳</button>
                <p style="margin:8px 0 0;color:#94a3b8;line-height:1.5;">你的 Token <strong>固定不變</strong>，寫在程式 <code>TOKEN = '…'</code> 與 <code>bot.run(TOKEN)</code>，和 VS Code 跑 <code>python main.py</code> 相同。上 Discord 時只需把 TOKEN 換成 Developer Portal 的真 Token。</p>
            </div>
        </div>
        <div class="side-tabs" id="side-tabs" style="display:none;">
            <button type="button" class="side-tab" data-view="terminal">▶ 終端</button>
            <button type="button" class="side-tab active" data-view="botsim">🤖 模擬器</button>
        </div>
        <div class="side-pane-view active" id="view-terminal">
            <div class="terminal-panel">
                <div class="terminal-head">
                    <span>▶ 執行視窗</span>
                    <button type="button" id="btn-clear-terminal">清除</button>
                </div>
                <div class="terminal-body terminal-body--term">
                    <div id="py-terminal"></div>
                </div>
            </div>
        </div>
        <div class="side-pane-view" id="view-botsim">
            <div id="bot-sim-host"><div id="bot-simulator"></div></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
        getFirestore, doc, getDoc, addDoc, updateDoc, setDoc, collection, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const DEFAULT_CODE = `# Python 自由創作
# 在此撰寫任意 Python 程式

print("Hello, Doratch!")
`;

    const DEFAULT_BOT_CODE = (typeof window !== "undefined" && window.DiscordPyMock)
        ? window.DiscordPyMock.DEMO_BOT_CODE
        : "import discord\nfrom discord.ext import commands\n\nbot = commands.Bot(command_prefix='!')\n\n@bot.command()\ndef hello(ctx):\n    ctx.send('Hello!')\n\nbot.run('YOUR_BOT_TOKEN')\n";

    const firebaseConfig = {
        apiKey: "AIzaSyDwRdQFgQVn5Un8Od2nP4u5EbMx-dMOYoU",
        authDomain: "chat-52c0d.firebaseapp.com",
        projectId: "chat-52c0d",
        appId: "1:449329325475:web:75f255c4055360dc9e6616"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const Engine = window.PythonEngine;
    let pyTerm = null;
    let botSim = null;
    let botToken = "";
    let botId = null;
    let botDeployed = false;

    const qs = new URLSearchParams(location.search);
    let currentPid = qs.get("load");
    let authorUid = qs.get("from");
    let isOwner = true;
    let engineReady = false;
    let useMonaco = true;
    let savedSnapshot = "";
    const startAsBot = qs.get("mode") === "bot";

    function getCode() {
        if (useMonaco && window.PythonMonaco?.isReady()) return window.PythonMonaco.getValue();
        return document.getElementById("editor-fallback").value;
    }

    function setCode(code) {
        if (useMonaco && window.PythonMonaco?.isReady()) window.PythonMonaco.setValue(code);
        else document.getElementById("editor-fallback").value = code;
    }

    function showTextEditorFallback(code) {
        useMonaco = false;
        document.querySelector(".monaco-shell").style.display = "none";
        var fb = document.getElementById("editor-fallback");
        fb.style.display = "block";
        if (typeof code === "string") fb.value = code;
    }

    function showMonacoEditor() {
        document.querySelector(".monaco-shell").style.display = "";
        document.getElementById("editor-fallback").style.display = "none";
    }

    showTextEditorFallback(DEFAULT_CODE);
    document.getElementById("editor-fallback").addEventListener("input", markDirty);

    function snapshot() {
        return JSON.stringify({
            title: document.getElementById("project-title-input").value,
            code: getCode(),
            public: document.getElementById("is-public-check").checked,
            isBot: document.getElementById("is-bot-check").checked,
            botName: document.getElementById("bot-name-input").value,
            botToken: botToken
        });
    }

    function updateBotUi() {
        var isBot = document.getElementById("is-bot-check").checked;
        document.getElementById("bot-fields").style.display = isBot ? "block" : "none";
        document.getElementById("side-tabs").style.display = isBot ? "flex" : "none";
        if (isBot) {
            showSideView("botsim");
            if (botSim && botToken) botSim.setToken(botToken);
        } else {
            showSideView("terminal");
        }
    }

    function showSideView(name) {
        document.querySelectorAll(".side-pane-view").forEach(function (el) {
            el.classList.toggle("active", el.id === "view-" + name);
        });
        document.querySelectorAll(".side-tab").forEach(function (btn) {
            btn.classList.toggle("active", btn.dataset.view === name);
        });
    }

    document.querySelectorAll(".side-tab").forEach(function (btn) {
        btn.onclick = function () { showSideView(btn.dataset.view); };
    });

    document.getElementById("is-bot-check").addEventListener("change", async function () {
        if (this.checked && !/\bdef\s+handle\s*\(/.test(getCode()) && !/\bcommands\.Bot\b/.test(getCode())) {
            if (confirm("要載入 discord.py Bot 範本嗎？（與 VS Code main.py 相同結構）")) {
                const user = auth.currentUser;
                if (user) {
                    const token = await ensureUserBotToken(user);
                    setCode(window.DiscordBotEngine.applyTokenToCode(DEFAULT_BOT_CODE, token));
                } else {
                    setCode(DEFAULT_BOT_CODE);
                }
            }
        }
        if (this.checked && auth.currentUser) {
            await ensureUserBotToken(auth.currentUser);
            syncTokenIntoEditor();
        }
        updateBotUi();
        markDirty();
    });

    async function ensureUserBotToken(user) {
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);
        let token = snap.exists() ? snap.data().doratchBotToken : null;
        if (!token) {
            token = window.DiscordBotEngine.generateStableToken(user.uid);
            await setDoc(userRef, { doratchBotToken: token }, { merge: true });
        }
        botToken = token;
        document.getElementById("bot-token-display").textContent = token;
        return token;
    }

    function syncTokenIntoEditor() {
        if (!botToken) return;
        const updated = window.DiscordBotEngine.applyTokenToCode(getCode(), botToken);
        if (updated !== getCode()) setCode(updated);
    }

    document.getElementById("btn-copy-token").onclick = function () {
        if (!botToken) { alert("Token 載入中，請稍候"); return; }
        navigator.clipboard.writeText(botToken).then(function () {
            alert("已複製 Token！可貼到交流大廳 🤖 Bot 連接。");
        }).catch(function () {
            prompt("複製你的 Token：", botToken);
        });
    };

    async function saveBotRecord(user, pythonCode) {
        if (!document.getElementById("is-bot-check").checked || !botToken) return;
        var fromCode = window.DiscordBotEngine.extractTokenFromCode(pythonCode);
        if (fromCode && fromCode !== "YOUR_BOT_TOKEN") botToken = fromCode;
        var botName = document.getElementById("bot-name-input").value.trim() || "我的 Bot";
        if (!botId) botId = currentPid ? ("bot_" + currentPid) : ("bot_" + user.uid);
        var payload = {
            name: botName,
            token: botToken,
            pythonCode: pythonCode,
            projectId: currentPid || null,
            active: botDeployed,
            updatedAt: serverTimestamp()
        };
        await setDoc(doc(db, "users", user.uid, "discordBots", botId), payload, { merge: true });
        await setDoc(doc(db, "botTokens", botToken), {
            ownerId: user.uid,
            botId: botId,
            name: botName,
            active: botDeployed,
            updatedAt: serverTimestamp()
        }, { merge: true });
    }

    document.getElementById("btn-deploy-bot").onclick = async function () {
        var user = auth.currentUser;
        if (!user) { location.href = "login.html"; return; }
        if (!document.getElementById("is-bot-check").checked) {
            alert("請先勾選「Discord Bot 專案」");
            return;
        }
        if (!botToken) {
            alert("Token 尚未載入，請稍候或重新整理");
            return;
        }
        if (!/\basync\s+def\b/.test(getCode()) || !/\bawait\b/.test(getCode())) {
            alert("discord.py Bot 需使用 async def 與 await（與真實 Discord Bot 相同）");
            return;
        }
        botDeployed = true;
        try {
            await saveBotRecord(user, getCode());
            alert("🚀 Bot 已部署！到交流大廳群組／伺服器，按「連接 Bot」貼上 Token 即可。");
            markSaved();
        } catch (e) {
            alert("部署失敗：" + e.message);
        }
    };

    function markSaved() {
        savedSnapshot = snapshot();
        document.getElementById("editor-status").textContent = "✓ 已儲存";
        document.getElementById("editor-status").style.color = "#86efac";
    }

    function markDirty() {
        if (snapshot() !== savedSnapshot) {
            document.getElementById("editor-status").textContent = "⚪ 編輯中";
            document.getElementById("editor-status").style.color = "#94a3b8";
        }
    }

    document.getElementById("btn-clear-terminal").onclick = () => {
        if (pyTerm) pyTerm.clear();
    };

    document.getElementById("btn-run").onclick = async () => {
        if (!engineReady || !pyTerm) return;
        const code = getCode();
        pyTerm.clear();
        pyTerm.setRunning(true);
        document.getElementById("btn-run").disabled = true;
        try {
            const { error } = await Engine.runPythonInteractive(code, {
                onWrite: (text) => pyTerm.write(text),
                onInput: (prompt) => pyTerm.readLine(prompt)
            });
            if (error) pyTerm.writeError(error);
        } catch (e) {
            pyTerm.writeError(String(e.message || e));
        } finally {
            pyTerm.setRunning(false);
            document.getElementById("btn-run").disabled = false;
        }
    };

    async function initMonaco() {
        if (!window.PythonMonaco) {
            showTextEditorFallback(DEFAULT_CODE);
            return;
        }
        try {
            await window.PythonMonaco.init("monaco-editor");
            useMonaco = true;
            showMonacoEditor();
            setCode(document.getElementById("editor-fallback").value || DEFAULT_CODE);
        } catch (e) {
            console.warn(e);
            showTextEditorFallback(
                document.getElementById("editor-fallback").value || DEFAULT_CODE
            );
        }
    }

    async function bootEngine() {
        const bar = document.getElementById("engine-bar");
        if (!Engine) {
            bar.textContent = "引擎未載入，請重新整理或使用 Live Server";
            bar.className = "engine-bar error";
            return;
        }
        try {
            await Engine.init((msg) => { bar.textContent = msg; bar.className = "engine-bar"; });
            engineReady = true;
            bar.textContent = "Python 已就緒 · 自由創作模式";
            bar.className = "engine-bar ready";
            document.getElementById("btn-run").disabled = false;
        } catch (e) {
            bar.textContent = e.message || String(e);
            bar.className = "engine-bar error";
        }
    }

    const engineBootPromise = bootEngine();


    document.getElementById("btn-save").onclick = async () => {
        const user = auth.currentUser;
        if (!user) { location.href = "login.html"; return; }
        if (document.getElementById("is-bot-check").checked) {
            await ensureUserBotToken(user);
            syncTokenIntoEditor();
        }
        const title = document.getElementById("project-title-input").value.trim() || "未命名 Python 作品";
        const pythonCode = getCode();
        const isPublic = document.getElementById("is-public-check").checked;
        try {
            if (isOwner && currentPid) {
                await updateDoc(doc(db, "users", user.uid, "projects", currentPid), {
                    name: title,
                    projectType: "python",
                    pythonCode,
                    isPublic,
                    isBot: document.getElementById("is-bot-check").checked,
                    botName: document.getElementById("bot-name-input").value.trim(),
                    botToken: botToken || null,
                    botId: botId || null,
                    updatedAt: serverTimestamp()
                });
                await saveBotRecord(user, pythonCode);
                alert("儲存成功！");
                markSaved();
            } else {
                const ref = await addDoc(collection(db, "users", user.uid, "projects"), {
                    name: title,
                    projectType: "python",
                    pythonCode,
                    authorEmail: user.email,
                    isPublic: isOwner ? isPublic : false,
                    isBot: document.getElementById("is-bot-check").checked,
                    botName: document.getElementById("bot-name-input").value.trim(),
                    botToken: botToken || null,
                    botId: botId || null,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });
                currentPid = ref.id;
                isOwner = true;
                authorUid = user.uid;
                history.replaceState({}, "", `python-studio.html?load=${currentPid}`);
                await saveBotRecord(user, pythonCode);
                alert("已建立並儲存新作品！");
                markSaved();
            }
        } catch (e) {
            alert("儲存失敗：" + e.message);
        }
    };

    document.getElementById("btn-download").onclick = () => {
        const blob = new Blob([getCode()], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = (document.getElementById("project-title-input").value.trim() || "python") + ".py";
        a.click();
    };

    document.getElementById("file-input").onchange = (ev) => {
        const file = ev.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            setCode(String(e.target.result || ""));
            markDirty();
        };
        reader.readAsText(file);
        ev.target.value = "";
    };

    document.getElementById("project-title-input").addEventListener("input", markDirty);
    document.getElementById("is-public-check").addEventListener("change", markDirty);

    window.addEventListener("beforeunload", (ev) => {
        if (snapshot() !== savedSnapshot) {
            ev.preventDefault();
            ev.returnValue = "";
        }
    });

    window.addEventListener("resize", () => {
        if (window.PythonMonaco?.isReady()) window.PythonMonaco.layout();
    });

    async function loadProject(user) {
        if (!currentPid) {
            markSaved();
            return;
        }
        const uid = authorUid || user.uid;
        const snap = await getDoc(doc(db, "users", uid, "projects", currentPid));
        if (!snap.exists()) {
            alert("找不到作品");
            markSaved();
            return;
        }
        const d = snap.data();
        if (d.projectType !== "python") {
            location.href = `page.html?load=${currentPid}${authorUid ? "&from=" + authorUid : ""}`;
            return;
        }
        document.getElementById("project-title-input").value = d.name || "未命名 Python 作品";
        document.getElementById("is-public-check").checked = !!d.isPublic;
        setCode(typeof d.pythonCode === "string" ? d.pythonCode : DEFAULT_CODE);
        document.getElementById("is-bot-check").checked = !!d.isBot;
        document.getElementById("bot-name-input").value = d.botName || "";
        botToken = d.botToken || "";
        botId = d.botId || (currentPid ? "bot_" + currentPid : null);
        if (d.isBot && isOwner && user.uid === uid) {
            await ensureUserBotToken(user);
            syncTokenIntoEditor();
        }
        document.getElementById("bot-token-display").textContent = botToken || "（載入中）";
        if (d.isBot) {
            var tokenSnap = botToken ? await getDoc(doc(db, "botTokens", botToken)) : null;
            botDeployed = tokenSnap && tokenSnap.exists() ? !!tokenSnap.data().active : false;
        }
        updateBotUi();
        isOwner = uid === user.uid;
        if (!isOwner) {
            document.getElementById("btn-save").textContent = "⭐ 另存為我的作品";
        }
        markSaved();
    }

    onAuthStateChanged(auth, async (user) => {
        if (!user) { location.href = "login.html"; return; }
        document.getElementById("bot-settings").style.display = "block";
        pyTerm = window.PythonTerminal.mount(document.getElementById("py-terminal"));
        botSim = window.DiscordBotSimulator.mount(document.getElementById("bot-simulator"), {
            getCode: getCode,
            onConnect: async function (token) {
                if (token === window.DiscordBotEngine.DEMO_TOKEN) {
                    throw new Error("創作模式請使用程式內 TOKEN 或側邊欄的固定 Token");
                }
                var codeTok = window.DiscordBotEngine.extractTokenFromCode(getCode());
                if (codeTok && codeTok !== "YOUR_BOT_TOKEN" && token !== codeTok && token !== botToken) {
                    throw new Error("Token 需與程式 TOKEN = '…' 一致");
                }
                if (token !== botToken) {
                    var snap = await getDoc(doc(db, "botTokens", token));
                    if (!snap.exists() || snap.data().ownerId !== user.uid) {
                        throw new Error("Token 無效或不屬於你");
                    }
                }
                return { name: document.getElementById("bot-name-input").value.trim() || "我的 Bot" };
            }
        });
        await Promise.all([initMonaco(), engineBootPromise]);
        await loadProject(user);
        if (startAsBot && !currentPid) {
            document.getElementById("is-bot-check").checked = true;
            const token = await ensureUserBotToken(user);
            setCode(window.DiscordBotEngine.applyTokenToCode(DEFAULT_BOT_CODE, token));
            document.getElementById("project-title-input").value = "我的 Discord Bot";
            updateBotUi();
        } else if (document.getElementById("is-bot-check").checked) {
            await ensureUserBotToken(user);
            syncTokenIntoEditor();
            updateBotUi();
        } else {
            updateBotUi();
        }
        if (useMonaco && window.PythonMonaco?.isReady()) {
            window.PythonMonaco.getValue(); // ensure editor ready
            const model = document.getElementById("editor-fallback");
            if (model.style.display === "block") model.addEventListener("input", markDirty);
            else {
                setInterval(markDirty, 800);
            }
        }
    });
</script>
</body>
</html>
