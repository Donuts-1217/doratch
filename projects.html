<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="responsive-global.css">
    <link rel="stylesheet" href="doratch-shell.css">
    <title>我的作品集 - Creative Blocks</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4C97FF; --secondary: #FFAB19; --accent: #855CD6;
            --bg: #0F172A; --card-bg: #1E293B; --text: #F8FAFC;
            --scratch-blue: #4C97FF; --scratch-green: #4CB050; --danger: #FF4D4D;
        }
        body { font-family: 'Outfit', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }

        .main-content { padding: 40px; overflow-x: auto; box-sizing: border-box; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: white; margin: 0; font-size: 2rem; font-weight: 900; }
        .storage-badge {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            color: #cbd5e1;
            min-width: 220px;
            text-align: right;
        }

        /* 作品網格 */
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        
        .project-card { 
            background: var(--card-bg); border-radius: 20px; overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.05); transition: 0.4s;
            display: flex; flex-direction: column; position: relative;
            cursor: pointer;
        }
        .project-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

        .thumbnail { height: 160px; background: linear-gradient(135deg, #0F172A, #1E293B); display: flex; align-items: center; justify-content: center; font-size: 60px; }
        
        .card-body { padding: 20px; flex: 1; }
        .card-title { font-size: 1.1rem; font-weight: 900; margin-bottom: 8px; color: white; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 12px; color: #64748B; }
        .card-size { margin-top: 6px; font-size: 12px; color: #93c5fd; font-weight: 700; }

        /* 標籤 */
        .status-tag { 
            position: absolute; top: 12px; left: 12px; padding: 4px 10px; 
            border-radius: 20px; font-size: 11px; font-weight: 900; color: white;
        }
        .tag-public { background: var(--scratch-green); }
        .tag-private { background: #475569; }

        /* 按鈕組 */
        .actions { display: flex; gap: 10px; padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        .btn-act { flex: 1; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; text-align: center; text-decoration: none; }
        .btn-edit { background: var(--primary); color: white; }
        .btn-edit:hover { background: #357ABD; }
        .btn-delete { background: transparent; color: #EF4444; border: 1px solid #EF4444; }
        .btn-delete:hover { background: #EF4444; color: white; }

        .empty-msg { text-align: center; padding: 100px 0; color: #64748B; grid-column: 1/-1; }
        .empty-msg a { color: var(--primary); }

        .new-btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 14px; text-decoration: none; transition: 0.2s; }
        .new-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(76,151,255,0.3); }
    
        
        @media (max-width: 1024px) {
            .main-content { padding: 15px; }
            
            /* 卡片與通用排版 */
            #user-stats-card { flex-wrap: wrap; justify-content: center; text-align: center; }
            #user-stats-card > div { width: 100%; }
            .header, .header-title { flex-direction: column; gap: 15px; text-align: center; }
            .project-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            .game-grid { grid-template-columns: 1fr; }
            
            /* 遊戲區域適應 */
            .boss-raid-container, .game-frame { width: 100%; box-sizing: border-box; padding: 20px 10px; min-height: auto; }
            .duel-arena { grid-template-columns: 1fr; }
            .boss-image-container { width: 200px; height: 200px; margin: 0 auto 15px; }
        }
        
        @media (max-width: 740px) {
            /* 精準縮放 700px 的遊戲畫布 (塔防與PvP) */
            [style*="width:700px"] { 
                transform-origin: top left;
                transform: scale(calc((100vw - 30px) / 700));
                margin-bottom: calc(-300px * (1 - ((100vw - 30px) / 700))); 
            }
        }
        
        @media (max-width: 480px) {
            .nav-item { font-size: 13px; padding: 10px 15px; }
            .hero h1 { font-size: 2.5rem; }
        }

    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar-main" data-doratch-active="projects">
        <div class="sidebar-footer">
            <div class="user-mini-card">
                <img id="side-avatar" src="" style="width:32px; height:32px; border-radius:50%;">
                <div style="flex:1; overflow:hidden;">
                    <div id="side-username" style="font-size:12px; font-weight:bold; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">載入中...</div>
                    <div style="font-size:10px; color:#64748B;">💰 <span id="side-coins">0</span></div>
                </div>
                <button onclick="handleLogout()" style="background:none; border:none; color:#64748B; cursor:pointer;">🚪</button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>📂 我的作品集</h1>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <div id="storage-badge" class="storage-badge">容量計算中...</div>
                <a href="create.html" class="new-btn">+ 創作新作品</a>
            </div>
        </div>
        <div id="project-list" class="project-grid">
            <div class="empty-msg">正在尋找你的驚人創作...</div>
        </div>
    </main>
</div>

<script src="doratch-subscription.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, getDocs, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { projectBytesFromData } from "./doratch-cloud-storage.js";

    const firebaseConfig = { apiKey: "AIzaSyDwRdQFgQVn5Un8Od2nP4u5EbMx-dMOYoU", authDomain: "chat-52c0d.firebaseapp.com", projectId: "chat-52c0d", appId: "1:449329325475:web:75f255c4055360dc9e6616" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.handleLogout = () => signOut(auth).then(() => location.href = 'index.html');

    function formatBytes(bytes) {
        const b = Number(bytes) || 0;
        if (b < 1024) return b + " B";
        if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
        return (b / (1024 * 1024)).toFixed(2) + " MB";
    }

    async function fetchSidebarData(user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('side-coins').innerText = data.coins || 0;
            document.getElementById('side-username').innerText = user.email.split('@')[0];
            document.getElementById('side-avatar').src = `https://ui-avatars.com/api/?name=${user.email}&background=random`;
            let role = data.role || 'student';
            if (user.email === 'chianghansen0302@gmail.com') role = 'admin';
            if (role === 'admin' || role === 'teacher' || role === 'support') {
                const adminLink = document.getElementById('admin-link-main');
                if (adminLink) {
                    adminLink.style.display = 'flex';
                    adminLink.innerText = role === 'admin'
                        ? '🛠️ 管理面板'
                        : (role === 'support' ? '🎧 客服後台' : '❓ 題庫管理');
                }
            }
        }
    }

    async function loadUserProjects(user) {
        const listDiv = document.getElementById('project-list');
        const storageBadge = document.getElementById('storage-badge');
        try {
            const userSnap = await getDoc(doc(db, "users", user.uid));
            const userData = userSnap.exists() ? (userSnap.data() || {}) : {};
            let defaultLimitMB = 1;
            let defaultMaxFiles = 10;
            try {
                const cfg = await getDoc(doc(db, "system_config", "storage"));
                const c = cfg.exists() ? (cfg.data() || {}) : {};
                const v = Number(c.defaultCloudStorageLimitMB);
                const mf = Number(c.defaultCloudStorageMaxFiles);
                if (Number.isFinite(v) && v >= 1) defaultLimitMB = v;
                if (Number.isFinite(mf) && mf >= 1) defaultMaxFiles = Math.floor(mf);
            } catch (_) {}
            const sub = window.DoratchSubscription;
            if (sub && !Number.isFinite(userData.cloudStorageLimitMB)) {
                defaultLimitMB = sub.getDefaultCloudStorageMB(userData);
            }
            if (sub && !(Number.isFinite(userData.cloudStorageMaxFiles) && userData.cloudStorageMaxFiles >= 1)) {
                defaultMaxFiles = sub.getDefaultCloudMaxFiles(userData);
            }
            const limitMB = Number.isFinite(userData.cloudStorageLimitMB) ? userData.cloudStorageLimitMB : defaultLimitMB;
            const maxFiles = Number.isFinite(userData.cloudStorageMaxFiles) && userData.cloudStorageMaxFiles >= 1
                ? Math.floor(userData.cloudStorageMaxFiles)
                : defaultMaxFiles;
            const limitBytes = Math.max(1, limitMB) * 1024 * 1024;
            const q = query(collection(db, "users", user.uid, "projects"), orderBy("updatedAt", "desc"));
            const snapshot = await getDocs(q);
            listDiv.innerHTML = "";
            let usedBytes = 0;
            if (snapshot.empty) {
                if (storageBadge) {
                    const remaining = Math.max(0, limitBytes);
                    storageBadge.textContent = `作品 0/${maxFiles} · 已用 0 B / 上限 ${limitMB} MB · 剩餘 ${formatBytes(remaining)}`;
                }
                listDiv.innerHTML = `<div class="empty-msg"><p>你目前還沒有任何作品喔！</p><a href="create.html">立刻去創作空間開始吧！</a></div>`;
                return;
            }
            snapshot.forEach((projectDoc) => {
                const project = projectDoc.data();
                const pid = projectDoc.id;
                const sizeBytes = projectBytesFromData(project);
                usedBytes += sizeBytes;
                const date = project.updatedAt?.toDate().toLocaleDateString() || "未知時間";
                const remixBadge = project.originalPid ? `<span style="background:var(--accent); color:white; font-size:10px; padding:2px 6px; border-radius:10px;">♻️ Remix</span>` : "";
                const isPython = project.projectType === "python";
                const thumb = isPython ? "🐍" : "🧩";
                const typeLabel = isPython ? "Python" : "積木";
                const editHref = isPython ? `python-studio.html?load=${pid}` : `page.html?load=${pid}`;
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <span class="status-tag ${project.isPublic ? 'tag-public' : 'tag-private'}">
                        ${project.isPublic ? '● 已發布' : '○ 草稿'}
                    </span>
                    <div class="thumbnail">${thumb}</div>
                    <div class="card-body">
                        <div class="card-title">
                            <span style="overflow:hidden; text-overflow:ellipsis;">${project.name || "未命名作品"}</span>
                            ${remixBadge}
                        </div>
                        <div class="card-meta">${typeLabel} · 最後更新：${date}</div>
                        <div class="card-size">容量：${formatBytes(sizeBytes)}</div>
                    </div>
                    <div class="actions">
                        <a href="${editHref}" class="btn-act btn-edit">開啟編輯</a>
                        <button class="btn-act btn-delete" onclick="handleDelete('${pid}')">刪除</button>
                    </div>
                `;
                listDiv.appendChild(card);
            });
            if (storageBadge) {
                const remaining = Math.max(0, limitBytes - usedBytes);
                const fileCount = snapshot.size;
                storageBadge.textContent = `作品 ${fileCount}/${maxFiles} · 已用 ${formatBytes(usedBytes)} / 上限 ${limitMB} MB · 剩餘 ${formatBytes(remaining)}`;
            }
        } catch (e) {
            console.error(e);
            if (storageBadge) storageBadge.textContent = "容量資訊讀取失敗";
            listDiv.innerHTML = `<div class="empty-msg" style="color:#EF4444;">讀取失敗：${e.message}</div>`;
        }
    }

    window.handleDelete = async (pid) => {
        if (!confirm("確定要刪除這個作品嗎？此動作無法復原！")) return;
        try {
            await deleteDoc(doc(db, "users", auth.currentUser.uid, "projects", pid));
            alert("作品已刪除");
            location.reload();
        } catch (e) { alert("刪除失敗：" + e.message); }
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            fetchSidebarData(user);
            loadUserProjects(user);
        } else {
            location.href = "login.html";
        }
    });
</script>
<script src="doratch-shell.js"></script>
</body>
</html>
